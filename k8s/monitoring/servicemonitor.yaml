apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: omni-post-api
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: omni-post
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "go_.*"
          action: drop
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

