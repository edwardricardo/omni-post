apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: postgres
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Storage class optimizations
    volume.beta.kubernetes.io/storage-class: "fast-ssd"
    # Backup annotations
    backup.kubernetes.io/enable: "true"
    backup.kubernetes.io/schedule: "0 2 * * *"
    backup.kubernetes.io/retention: "30d"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 50Gi
  # Volume expansion support
  volumeMode: Filesystem
  # Data source for restoration (if needed)
  # dataSource:
  #   name: postgres-snapshot
  #   kind: VolumeSnapshot
  #   apiGroup: snapshot.storage.k8s.io
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: kubernetes.io/gce-pd # Adjust for your cloud provider
parameters:
  type: pd-ssd
  replication-type: regional-pd
  zones: us-central1-a,us-central1-b,us-central1-c
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
mountOptions:
  - debug
  - noatime
