apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: redis
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: cache
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Storage class optimizations for cache workloads
    volume.beta.kubernetes.io/storage-class: "fast-ssd"
    # Backup annotations (optional for cache, but useful for persistent data)
    backup.kubernetes.io/enable: "true"
    backup.kubernetes.io/schedule: "0 4 * * *"
    backup.kubernetes.io/retention: "7d"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 10Gi
  # Volume expansion support
  volumeMode: Filesystem
