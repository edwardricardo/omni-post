apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # External secret management integration
    external-secrets.io/backend: "vault"
    external-secrets.io/key: "omni-post/production"
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql://postgres:POSTGRES_PASSWORD_PLACEHOLDER@postgres-service.omni-post.svc.cluster.local:5432/omnipostdb?sslmode=require"
  POSTGRES_PASSWORD: "POSTGRES_PASSWORD_PLACEHOLDER"

  # Redis credentials
  REDIS_URL: "redis://:REDIS_PASSWORD_PLACEHOLDER@redis-service.omni-post.svc.cluster.local:6379"
  REDIS_PASSWORD: "REDIS_PASSWORD_PLACEHOLDER"

  # JWT and Authentication
  JWT_SECRET: "JWT_SECRET_PLACEHOLDER"
  JWT_REFRESH_SECRET: "JWT_REFRESH_SECRET_PLACEHOLDER"
  SESSION_SECRET: "SESSION_SECRET_PLACEHOLDER"

  # OAuth Provider Secrets (for social media integrations)
  TWITTER_CLIENT_ID: "TWITTER_CLIENT_ID_PLACEHOLDER"
  TWITTER_CLIENT_SECRET: "TWITTER_CLIENT_SECRET_PLACEHOLDER"
  INSTAGRAM_CLIENT_ID: "INSTAGRAM_CLIENT_ID_PLACEHOLDER"
  INSTAGRAM_CLIENT_SECRET: "INSTAGRAM_CLIENT_SECRET_PLACEHOLDER"
  FACEBOOK_CLIENT_ID: "FACEBOOK_CLIENT_ID_PLACEHOLDER"
  FACEBOOK_CLIENT_SECRET: "FACEBOOK_CLIENT_SECRET_PLACEHOLDER"
  LINKEDIN_CLIENT_ID: "LINKEDIN_CLIENT_ID_PLACEHOLDER"
  LINKEDIN_CLIENT_SECRET: "LINKEDIN_CLIENT_SECRET_PLACEHOLDER"

  # Encryption keys
  ENCRYPTION_KEY: "ENCRYPTION_KEY_PLACEHOLDER"
  WEBHOOK_SECRET: "WEBHOOK_SECRET_PLACEHOLDER"

  # External service API keys
  S3_ACCESS_KEY_ID: "S3_ACCESS_KEY_ID_PLACEHOLDER"
  S3_SECRET_ACCESS_KEY: "S3_SECRET_ACCESS_KEY_PLACEHOLDER"
  SENDGRID_API_KEY: "SENDGRID_API_KEY_PLACEHOLDER"

  # Monitoring and observability
  PROMETHEUS_PASSWORD: "PROMETHEUS_PASSWORD_PLACEHOLDER"
  GRAFANA_PASSWORD: "GRAFANA_PASSWORD_PLACEHOLDER"
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-secret
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.example.com": {
          "username": "REGISTRY_USERNAME_PLACEHOLDER",
          "password": "REGISTRY_PASSWORD_PLACEHOLDER",
          "auth": "REGISTRY_AUTH_PLACEHOLDER"
        }
      }
    }
---
# TLS Certificate Secret (for HTTPS/ingress)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: tls
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
type: kubernetes.io/tls
stringData:
  tls.crt: |
    TLS_CERTIFICATE_PLACEHOLDER
  tls.key: |
    TLS_PRIVATE_KEY_PLACEHOLDER
