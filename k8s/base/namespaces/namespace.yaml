apiVersion: v1
kind: Namespace
metadata:
  name: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: namespace
    app.kubernetes.io/managed-by: kustomize
    environment: production
    tier: platform
    # Security labels
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # GitOps annotations
    argocd.argoproj.io/sync-wave: "-1"
    # Resource quotas and limits
    scheduler.alpha.kubernetes.io/node-selector: "kubernetes.io/os=linux"
    # Monitoring
    prometheus.io/scrape: "true"
    # Service mesh
    istio-injection: enabled
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: omni-post-quota
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: quota
spec:
  hard:
    # Compute resources
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    # Storage
    requests.storage: 100Gi
    persistentvolumeclaims: "10"
    # Object counts
    pods: "50"
    replicationcontrollers: "20"
    resourcequotas: "1"
    secrets: "20"
    configmaps: "20"
    services: "15"
    services.loadbalancers: "2"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: omni-post-limits
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: limits
spec:
  limits:
    # Default container limits
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
    # Pod limits
    - max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
      type: Pod
    # PVC limits
    - max:
        storage: 50Gi
      min:
        storage: 1Gi
      type: PersistentVolumeClaim
