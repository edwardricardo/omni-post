# Base Deployment Template
# This template contains all common configuration shared across service deployments
# Use Kustomize overlays to customize per-service values
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: "1.2.0"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omni-post
        app.kubernetes.io/version: "1.2.0"
        version: "1.2.0"
        sidecar.istio.io/inject: "true"
      annotations:
        prometheus.io/scrape: "true"
        container.apparmor.security.beta.kubernetes.io/app: runtime/default
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      serviceAccountName: omni-post-serviceaccount
      automountServiceAccountToken: false

      # Common security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups: [65532]

      # Pod anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: omni-post

      # Common container configuration
      containers:
        - name: app
          imagePullPolicy: IfNotPresent

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL

          # Resource limits (will be overridden per service)
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Liveness and readiness probes (service-specific paths in overlays)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
