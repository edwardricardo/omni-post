apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: admin
  template:
    metadata:
      annotations:
        prometheus.io/port: "3100"
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: PORT
              value: "3100"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
