apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omni-post

resources:
  - ../../base/templates/deployment.yaml
  - ../../base/templates/service.yaml
  - ../../base/templates/hpa.yaml

namePrefix: admin-

commonLabels:
  app.kubernetes.io/component: admin
  app.kubernetes.io/part-of: frontend

patchesStrategicMerge:
  - deployment-patch.yaml
  - service-patch.yaml

images:
  - name: app
    newName: ghcr.io/omni-post/admin
    newTag: latest
