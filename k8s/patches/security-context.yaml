# Security context patches for enhanced security posture

# API service security hardening
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: omni-post
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.core.somaxconn
            value: "32768"
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE # For binding to port 3000
            seccompProfile:
              type: RuntimeDefault

