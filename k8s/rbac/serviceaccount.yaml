apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-post-serviceaccount
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Workload Identity for cloud providers
    iam.gke.io/gcp-service-account: "omni-post@PROJECT_ID.iam.gserviceaccount.com"
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/omni-post-role"
    azure.workload.identity/client-id: "CLIENT_ID_PLACEHOLDER"
imagePullSecrets:
  - name: registry-secret
automountServiceAccountToken: false
secrets:
  - name: omni-post-token
---
apiVersion: v1
kind: Secret
metadata:
  name: omni-post-token
  namespace: omni-post
  labels:
    app.kubernetes.io/name: omni-post
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: kustomize
  annotations:
    kubernetes.io/service-account.name: omni-post-serviceaccount
    argocd.argoproj.io/sync-wave: "1"
type: kubernetes.io/service-account-token
