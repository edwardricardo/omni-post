services:
  postgres:
    image: postgres:16
    container_name: omnipost-postgres
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: omnipostdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: omnipost-redis
    restart: always
    env_file:
      - path: .env
        required: false
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  grafana:
    image: grafana/grafana:11.2.2
    container_name: omnipost-grafana
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: omnipost-prometheus
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: omnipost-jaeger
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  minio:
    image: minio/minio:latest
    container_name: omnipost-minio
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: omnipost-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin123) do sleep 2; done;
      mc mb --ignore-existing local/omni-post-media;
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  grafana-data:
  prometheus-data:
  minio-data:
