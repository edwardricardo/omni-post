<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quality Dashboard - OmniPost</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
        line-height: 1.6;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        color: #2d3748;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.1rem;
        color: #4a5568;
      }

      .refresh-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
      }

      .last-updated {
        font-size: 0.9rem;
        color: #718096;
      }

      .refresh-btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.2s;
      }

      .refresh-btn:hover {
        background: #5a67d8;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .metric-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .metric-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      }

      .metric-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .metric-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: #2d3748;
      }

      .metric-icon {
        font-size: 1.5rem;
      }

      .metric-value {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .metric-value.excellent {
        color: #38a169;
      }
      .metric-value.good {
        color: #3182ce;
      }
      .metric-value.warning {
        color: #d69e2e;
      }
      .metric-value.critical {
        color: #e53e3e;
      }

      .metric-trend {
        display: flex;
        align-items: center;
        font-size: 0.9rem;
        color: #4a5568;
      }

      .trend-icon {
        margin-right: 5px;
      }

      .charts-section {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .chart-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .chart-title {
        font-size: 1.3rem;
        font-weight: 600;
        color: #2d3748;
        margin-bottom: 20px;
        text-align: center;
      }

      .chart-container {
        position: relative;
        height: 300px;
      }

      .details-section {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .section-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #2d3748;
        margin-bottom: 25px;
      }

      .details-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .detail-item {
        padding: 20px;
        background: #f7fafc;
        border-radius: 12px;
        border-left: 4px solid #667eea;
      }

      .detail-label {
        font-size: 0.9rem;
        color: #4a5568;
        margin-bottom: 5px;
      }

      .detail-value {
        font-size: 1.1rem;
        font-weight: 600;
        color: #2d3748;
      }

      .status-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
      }

      .status-passing {
        background: #38a169;
      }
      .status-warning {
        background: #d69e2e;
      }
      .status-failing {
        background: #e53e3e;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        font-size: 1.1rem;
        color: #4a5568;
      }

      .error {
        background: #fed7d7;
        border: 1px solid #fc8181;
        color: #c53030;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
      }

      @media (max-width: 768px) {
        .container {
          padding: 10px;
        }

        .header h1 {
          font-size: 2rem;
        }

        .metrics-grid {
          grid-template-columns: 1fr;
        }

        .charts-section {
          grid-template-columns: 1fr;
        }

        .chart-container {
          height: 250px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🛡️ Quality Dashboard</h1>
        <p>Real-time quality metrics and trends for OmniPost</p>
        <div class="refresh-info">
          <span class="last-updated" id="lastUpdated">Loading...</span>
          <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
        </div>
      </div>

      <div class="metrics-grid" id="metricsGrid">
        <div class="loading">Loading quality metrics...</div>
      </div>

      <div class="charts-section" id="chartsSection">
        <div class="chart-card">
          <h3 class="chart-title">Quality Trends (Last 30 Days)</h3>
          <div class="chart-container">
            <canvas id="trendsChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <h3 class="chart-title">Test Coverage Breakdown</h3>
          <div class="chart-container">
            <canvas id="coverageChart"></canvas>
          </div>
        </div>
      </div>

      <div class="details-section">
        <h2 class="section-title">📊 Detailed Metrics</h2>
        <div class="details-grid" id="detailsGrid">
          <div class="loading">Loading detailed metrics...</div>
        </div>
      </div>
    </div>

    <script>
      let trendsChart = null;
      let coverageChart = null;

      // Sample data - in a real implementation, this would come from API
      const mockData = {
        timestamp: new Date().toISOString(),
        overall_status: "PASSED",
        overall_score: 87,
        metrics: {
          security: {
            score: 92,
            vulnerabilities: { critical: 0, high: 1, medium: 3, low: 5 },
            trend: "improving",
          },
          coverage: {
            overall: 87,
            unit_tests: 92,
            integration_tests: 85,
            e2e_tests: 78,
            trend: "stable",
          },
          performance: {
            api_p95: 145,
            ui_load_time: 2100,
            lighthouse: { performance: 88, accessibility: 95 },
            trend: "improving",
          },
          code_quality: {
            typescript_errors: 0,
            eslint_errors: 0,
            eslint_warnings: 12,
            complexity_score: 82,
            trend: "stable",
          },
          reliability: {
            error_rate: 0.002,
            availability: 99.94,
            mttr: 12,
            trend: "improving",
          },
        },
        trends: {
          dates: ["2024-01-01", "2024-01-08", "2024-01-15", "2024-01-22", "2024-01-29"],
          security: [85, 88, 90, 91, 92],
          coverage: [82, 84, 85, 86, 87],
          performance: [83, 85, 86, 87, 88],
          quality: [78, 80, 81, 82, 82],
        },
      };

      function getScoreClass(score) {
        if (score >= 90) return "excellent";
        if (score >= 80) return "good";
        if (score >= 70) return "warning";
        return "critical";
      }

      function getTrendIcon(trend) {
        switch (trend) {
          case "improving":
            return "📈";
          case "declining":
            return "📉";
          case "stable":
            return "➡️";
          default:
            return "❓";
        }
      }

      function formatNumber(num, decimals = 0) {
        return num.toLocaleString("en-US", {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals,
        });
      }

      function renderMetrics(data) {
        const metricsGrid = document.getElementById("metricsGrid");

        const metrics = [
          {
            title: "Overall Score",
            icon: "🎯",
            value: data.overall_score,
            suffix: "/100",
            trend: "improving",
          },
          {
            title: "Security Score",
            icon: "🔒",
            value: data.metrics.security.score,
            suffix: "/100",
            trend: data.metrics.security.trend,
          },
          {
            title: "Test Coverage",
            icon: "🧪",
            value: data.metrics.coverage.overall,
            suffix: "%",
            trend: data.metrics.coverage.trend,
          },
          {
            title: "Performance",
            icon: "⚡",
            value: data.metrics.performance.lighthouse.performance,
            suffix: "/100",
            trend: data.metrics.performance.trend,
          },
          {
            title: "Code Quality",
            icon: "📝",
            value: data.metrics.code_quality.complexity_score,
            suffix: "/100",
            trend: data.metrics.code_quality.trend,
          },
          {
            title: "Availability",
            icon: "🔧",
            value: data.metrics.reliability.availability,
            suffix: "%",
            trend: data.metrics.reliability.trend,
            decimals: 2,
          },
        ];

        metricsGrid.innerHTML = metrics
          .map(
            (metric) => `
                <div class="metric-card">
                    <div class="metric-header">
                        <h3 class="metric-title">${metric.title}</h3>
                        <span class="metric-icon">${metric.icon}</span>
                    </div>
                    <div class="metric-value ${getScoreClass(metric.value)}">
                        ${formatNumber(metric.value, metric.decimals || 0)}${metric.suffix}
                    </div>
                    <div class="metric-trend">
                        <span class="trend-icon">${getTrendIcon(metric.trend)}</span>
                        ${metric.trend.charAt(0).toUpperCase() + metric.trend.slice(1)}
                    </div>
                </div>
            `
          )
          .join("");
      }

      function renderCharts(data) {
        // Destroy existing charts
        if (trendsChart) trendsChart.destroy();
        if (coverageChart) coverageChart.destroy();

        // Trends Chart
        const trendsCtx = document.getElementById("trendsChart").getContext("2d");
        trendsChart = new Chart(trendsCtx, {
          type: "line",
          data: {
            labels: data.trends.dates.map((date) =>
              new Date(date).toLocaleDateString("en-US", { month: "short", day: "numeric" })
            ),
            datasets: [
              {
                label: "Security",
                data: data.trends.security,
                borderColor: "#e53e3e",
                backgroundColor: "rgba(229, 62, 62, 0.1)",
                tension: 0.4,
              },
              {
                label: "Coverage",
                data: data.trends.coverage,
                borderColor: "#38a169",
                backgroundColor: "rgba(56, 161, 105, 0.1)",
                tension: 0.4,
              },
              {
                label: "Performance",
                data: data.trends.performance,
                borderColor: "#3182ce",
                backgroundColor: "rgba(49, 130, 206, 0.1)",
                tension: 0.4,
              },
              {
                label: "Quality",
                data: data.trends.quality,
                borderColor: "#d69e2e",
                backgroundColor: "rgba(214, 158, 46, 0.1)",
                tension: 0.4,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "top",
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                max: 100,
              },
            },
          },
        });

        // Coverage Chart
        const coverageCtx = document.getElementById("coverageChart").getContext("2d");
        coverageChart = new Chart(coverageCtx, {
          type: "doughnut",
          data: {
            labels: ["Unit Tests", "Integration Tests", "E2E Tests", "Uncovered"],
            datasets: [
              {
                data: [
                  data.metrics.coverage.unit_tests,
                  data.metrics.coverage.integration_tests,
                  data.metrics.coverage.e2e_tests,
                  100 - data.metrics.coverage.overall,
                ],
                backgroundColor: ["#38a169", "#3182ce", "#d69e2e", "#e2e8f0"],
                borderWidth: 2,
                borderColor: "#ffffff",
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
              },
            },
          },
        });
      }

      function renderDetails(data) {
        const detailsGrid = document.getElementById("detailsGrid");

        const details = [
          {
            label: "TypeScript Errors",
            value: data.metrics.code_quality.typescript_errors,
            status: data.metrics.code_quality.typescript_errors === 0 ? "passing" : "failing",
          },
          {
            label: "ESLint Warnings",
            value: data.metrics.code_quality.eslint_warnings,
            status: data.metrics.code_quality.eslint_warnings < 20 ? "passing" : "warning",
          },
          {
            label: "Critical Vulnerabilities",
            value: data.metrics.security.vulnerabilities.critical,
            status: data.metrics.security.vulnerabilities.critical === 0 ? "passing" : "failing",
          },
          {
            label: "API P95 Response Time",
            value: `${data.metrics.performance.api_p95}ms`,
            status: data.metrics.performance.api_p95 < 200 ? "passing" : "warning",
          },
          {
            label: "Error Rate",
            value: `${(data.metrics.reliability.error_rate * 100).toFixed(3)}%`,
            status: data.metrics.reliability.error_rate < 0.01 ? "passing" : "warning",
          },
          {
            label: "MTTR",
            value: `${data.metrics.reliability.mttr} min`,
            status: data.metrics.reliability.mttr < 30 ? "passing" : "warning",
          },
        ];

        detailsGrid.innerHTML = details
          .map(
            (detail) => `
                <div class="detail-item">
                    <div class="detail-label">
                        <span class="status-indicator status-${detail.status}"></span>
                        ${detail.label}
                    </div>
                    <div class="detail-value">${detail.value}</div>
                </div>
            `
          )
          .join("");
      }

      function updateLastUpdated() {
        const now = new Date();
        document.getElementById("lastUpdated").textContent =
          `Last updated: ${now.toLocaleTimeString()}`;
      }

      function refreshData() {
        // In a real implementation, this would fetch from API
        setTimeout(() => {
          renderMetrics(mockData);
          renderCharts(mockData);
          renderDetails(mockData);
          updateLastUpdated();
        }, 500);
      }

      // Initialize dashboard
      document.addEventListener("DOMContentLoaded", function () {
        refreshData();

        // Auto-refresh every 30 seconds
        setInterval(refreshData, 30000);
      });

      // Handle responsive charts
      window.addEventListener("resize", function () {
        if (trendsChart) trendsChart.resize();
        if (coverageChart) coverageChart.resize();
      });
    </script>
  </body>
</html>
