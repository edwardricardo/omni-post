# ==============================================================================
# Docker Compose Configuration for omni-post Monorepo
# ==============================================================================
# Uses optimized Dockerfiles with shared base stages
# Run with: docker compose -f docker/docker-compose.optimized.yml up
# ==============================================================================

version: "3.8"

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: omnipost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnipostdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnipost-network

  # ============================================================================
  # Redis Cache & Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: omnipost-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnipost-network

  # ============================================================================
  # API Service (Fastify)
  # ============================================================================
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.production.new
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache-new,mode=max
    container_name: omnipost-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/omnipostdb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - omnipost-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http=require(''http'');const req=http.request({host:''localhost'',port:3000,path:''/health'',timeout:5000},res=>{process.exit(res.statusCode===200?0:1)});req.on(''error'',()=>process.exit(1));req.end();"',
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  # ============================================================================
  # Workers Service (BullMQ)
  # ============================================================================
  workers:
    build:
      context: ..
      dockerfile: apps/workers/Dockerfile.new
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache-new,mode=max
    container_name: omnipost-workers
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/omnipostdb
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - omnipost-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const Redis=require(''ioredis'');const redis=new Redis(process.env.REDIS_URL||''redis://localhost:6379'');redis.ping().then(()=>{redis.disconnect();process.exit(0)}).catch(()=>process.exit(1));"',
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # ============================================================================
  # Client Application (Next.js)
  # ============================================================================
  client:
    build:
      context: ..
      dockerfile: apps/client/Dockerfile.new
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache-new,mode=max
    container_name: omnipost-client
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3200
      - NEXT_PUBLIC_API_URL=http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - omnipost-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http=require(''http'');const req=http.request({host:''localhost'',port:3200,path:''/api/health'',timeout:5000},res=>{process.exit(res.statusCode===200?0:1)});req.on(''error'',()=>process.exit(1));req.end();"',
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  # ============================================================================
  # Admin Dashboard (Next.js)
  # ============================================================================
  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile.new
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache-new,mode=max
    container_name: omnipost-admin
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3100
      - NEXT_PUBLIC_API_URL=http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - omnipost-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http=require(''http'');const req=http.request({host:''localhost'',port:3100,path:''/api/health'',timeout:5000},res=>{process.exit(res.statusCode===200?0:1)});req.on(''error'',()=>process.exit(1));req.end();"',
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  omnipost-network:
    driver: bridge
