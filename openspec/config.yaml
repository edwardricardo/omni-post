# OpenSpec SDD config — omni-post
# Generated by sdd-init. See openspec/project.md for full context.
schema: spec-driven

project: omni-post
artifact_store: openspec

context: |
  Tech stack: TypeScript strict (exactOptionalPropertyTypes) pnpm monorepo (~93 workspace package.json).
    Backend = Fastify API (apps/api) + BullMQ workers (apps/workers), tsx in dev / NodeNext per-package
    tsc emit to dist in prod (transpile-only, ADR-0017). Frontend = Next 16 (apps/admin, apps/client),
    Turbopack, moduleResolution: bundler (extensionless). Workspace aliases: @core/*, @adapters/*,
    @providers/*, @ports/*, @shared/types, @infra/prisma, @observability/*, @packages/*.
  Architecture: Hexagonal (Ports & Adapters), DDD, CQRS, Unit of Work (every mutating use case),
    Saga (defineSaga factory), Dependency Injection (130+ tokens, composition root only).
    Result<T,E> — never throw across layers. JSDoc @file + @layer (domain/application/infrastructure only).
  Testing: backend unit = vitest (apps/api/tests/unit/); backend integration = node:test
    (apps/api/tests/integration/, node --import tsx --test); frontend = vitest + @testing-library;
    E2E = Playwright; mutation = Stryker. Test env auto-loads .env.test. Strict TDD ENABLED.
  Style: conventional commits (NO AI attribution); deps exact-pinned; canon-exception markers required;
    pre-edit tripwire hooks active. Docs only under /docs/. 27 CI fitness functions (hard-zero each).
  Env: LXC dev box ~9GB RAM cap. NO docker build locally. NO full test suite at once — run single
    files with --max-old-space-size + timeout. pnpm db:up before migrations/integration tests.

# Strict TDD is active: project has extensive coverage + a 0-defect obligation.
strict_tdd: true

testing:
  strict_tdd: true
  frameworks:
    backend_unit: vitest
    backend_integration: node:test
    frontend: vitest + @testing-library/react
    e2e: playwright
    mutation: stryker
  commands:
    backend_unit: "pnpm --filter @apps/api test" # vitest run
    backend_unit_coverage: "pnpm --filter @apps/api test:unit:coverage"
    backend_integration: "pnpm --filter @apps/api test:integration" # bash scripts/run-tests.sh -> node --import tsx --test
    backend_all: "pnpm --filter @apps/api test:all"
    frontend: "pnpm --filter @apps/admin test" # vitest
    e2e: "pnpm exec playwright test"
    mutation: "cd apps/api && pnpm exec stryker run"
    lint: "pnpm lint" # eslint --max-warnings 0
    typecheck: "pnpm typecheck" # turbo run typecheck
    build: "pnpm build" # turbo run build
  coverage_targets:
    domain: 90
    application: 85
    infrastructure: 70
    routes: 70
    providers: 75
  notes: |
    LXC SAFETY: never run the full suite at once. Run single test files with
    --max-old-space-size and a timeout wrapper. pnpm db:up (PostgreSQL + Redis)
    before integration tests. vitest auto-loads .env.test via setupFiles.

rules:
  proposal:
    - Include a rollback plan for risky changes.
    - State which fitness functions (#1-#26) the change interacts with.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Respect the NodeNext (backend) vs bundler (frontend) split — do not unify them.
    - Document architecture decisions with rationale; cite ADR-0017 for build/emit choices.
    - New canon-affecting decisions require an ADR (docs/technical/ADR-NNNN-*.md).
  tasks:
    - Group by phase, hierarchical numbering; keep tasks completable in one session.
    - Honor the 400-line PR review budget; recommend chained PRs when exceeded.
  apply:
    tdd: true # RED -> GREEN -> REFACTOR, mandatory
    test_command: "pnpm --filter @apps/api test"
    rules:
      - Follow existing code patterns; never throw across layers (use Result).
      - LXC-safe test runs only (single files, --max-old-space-size, timeout).
      - Conventional commits, NO AI attribution. Commit only when the user asks.
      - End at 0 error / 0 warning; never defer or suppress a failure.
  verify:
    test_command: "pnpm --filter @apps/api test"
    build_command: "pnpm build"
    coverage_threshold: 85
    rules:
      - Run all 27 fitness functions; each must be hard-zero.
  archive:
    - Warn before merging destructive deltas.
    - Archive is an audit trail — never delete or modify archived changes.
