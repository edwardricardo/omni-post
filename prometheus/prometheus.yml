# Prometheus configuration for omni-post monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: "omni-post"
    environment: "development"

# Alertmanager configuration. §4.2.b PENDING — alertmanager wireup +
# Slack/PagerDuty notification routing. Sin esto, las rules se evalúan y
# quedan disponibles en /api/v1/alerts pero no se envía notification push.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

# Rule files. §4.2 Phase A1 — primeras 4 rules canon:
#   - alerts/api.yml    (ApiLatencyP99High, ApiErrorRateHigh)
#   - alerts/saga.yml   (SagaTimeoutSpike)
#   - alerts/outbox.yml (OutboxLagHigh)
# §4.2.b agregará 6+ rules adicionales (DLQ, billing, AI, Redis, DB pool, worker backlog).
rule_files:
  - "alerts/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # API server metrics
  - job_name: "api-server"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: "api"
          component: "fastify"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "api-server"

  # Workers metrics — publishWorker exposes /metrics on port 3300.
  # 3300 is outside Prometheus's reserved 9090–9999 exporter range so it
  # avoids collisions with this container (9090) and node_exporter (9100).
  - job_name: "workers"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3300"]
        labels:
          service: "workers"
          component: "bullmq"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "workers"

  # PostgreSQL exporter (optional - can be added later)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgres'

  # Redis exporter (optional - can be added later)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'
# Storage configuration
# Note: retention settings are passed as command-line flags in docker-compose.yml
