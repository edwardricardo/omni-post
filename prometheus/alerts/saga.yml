# Saga alerts — §4.2 Normalization Roadmap Phase A1.
# Métricas fuente: SagaManagerLifecycle + sagas_failed_total counter.
# Invariante: las sagas son críticas para correctness distribuida (pre-pivot
# rollback semantics); timeout spike indica step que cuelga.
groups:
  - name: saga
    interval: 30s
    rules:
      - alert: SagaTimeoutSpike
        expr: increase(sagas_failed_total{reason="timeout"}[10m]) > 3
        for: 1m
        labels:
          severity: critical
          component: saga
        annotations:
          summary: "More than 3 sagas timed out in 10min"
          description: "El SagaManagerLifecycle.startTimeoutChecker (60s poll) marcó más de 3 sagas como FAILED por timeout en 10min. Esto indica step que cuelga (provider API down, DB deadlock, infinite loop). Inspeccionar Grafana saga-health dashboard + Jaeger traces. NO incluye las filas parkeadas: esas terminan con reason='parked-expired' y tienen su propia alerta, porque su causa (nadie actuó dentro de la ventana del operador) y su runbook son distintos."
          runbook: docs/runbooks/alert-saga-timeout.md
          slo: docs/observability/SLO.md#saga

      - alert: SagaParkedWindowExpired
        expr: increase(sagas_failed_total{reason="parked-expired"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
          component: saga
        annotations:
          summary: "A parked saga was terminalized because nobody acted inside its operator window"
          description: "Una saga cortada en (o pasado) su pivot quedó PARKED y nadie la resolvió: el timeout checker la llevó a FAILED una ventana completa (30min por defecto) después del momento del parking. La saga canon prohíbe un RUNNING infinito, así que la fila SÍ termina — pero el efecto externo del pivot pudo haber ocurrido, así que este FAILED no significa 'no se publicó'. Cotejar contra el proveedor antes de reintentar nada. Si esto se repite, o el volumen de parking excede lo que un humano puede revisar (SagaParkedAtPivot), o la ventana es demasiado corta para el turno de guardia."
          runbook: docs/security/MULTI_TENANT_GUARDS.md
          slo: docs/observability/SLO.md#saga

      - alert: SagaTenantMismatch
        expr: increase(saga_recovery_failures_total{stage="mismatch"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
          component: saga
        annotations:
          summary: "A saga's persisted account contradicts its own context"
          description: "The saga engine refused to run a saga because SagaInstance.accountId names a different tenant than the saga context does. Every such saga is skipped and then driven to FAILED, so ANY increase matters. The expected source is a process still running pre-cutover code that re-writes the acting user into the tenant column: stop the stale writers, then re-run the idempotent backfill (docs/security/MULTI_TENANT_GUARDS.md, backfill runbook). A sustained rate outside a deploy window means a writer is still corrupting rows."
          runbook: docs/security/MULTI_TENANT_GUARDS.md
          slo: docs/observability/SLO.md#saga

      # Deliberately NOT on the failures series: parking is a decision the
      # engine takes correctly, and `saga_recovery_parked_total` keeps it out of
      # any unfiltered sum of `saga_recovery_failures_total`.
      #
      # Deploy-window semantics: every restart with in-flight pivot work parks
      # rows, so this fires on ordinary deploys BY DESIGN — the row really is
      # waiting on a human, and the window is finite. The `for: 15m` is the
      # dedup: a restart's parked rows are normally resolved or terminalized
      # inside it, so what survives to page is a BACKLOG rather than a blip. Pair
      # it with a silence for planned deploy windows; do NOT lower `for` without
      # one, or the alert stops being read exactly when it matters.
      - alert: SagaParkedAtPivot
        expr: increase(saga_recovery_parked_total[10m]) > 0
        for: 15m
        labels:
          severity: warning
          component: saga
        annotations:
          summary: "Sagas cut at or past their pivot are holding an operator window"
          description: "Boot recovery found sagas cut at or after their point of no return (reason=pivot) or carrying a definition the process has not registered (reason=definition-unregistered) and deliberately did NOT replay them: the queue absorbs a re-enqueued publish job, but the step after the pivot re-issues its status transition with a stale optimistic-concurrency token and the use case rejects it, so an automatic resume would drive a saga that actually succeeded into FAILED. The row is intact and non-terminal and NO automatic mechanism will advance it — but it is NOT waiting forever: the timeout checker terminalizes it as reason='parked-expired' one full saga horizon (30min) after the moment it was PARKED, and a process restart re-derives the parking and re-opens that window. Act inside it: find the `PARKED` warning carrying the saga id, step and pivot index, confirm whether the external effect happened, then resume it deliberately via POST /sagas/:sagaId/continue or terminalize it. See the runbook for the enumeration query — parking is per-process and is NOT persisted. A sustained non-zero rate OUTSIDE a restart window means processes are dying mid-pivot. reason='definition-unregistered' on every inherited row is a COMPOSITION defect, not a data one, and is also reported as a boot-load failure."
          runbook: docs/security/MULTI_TENANT_GUARDS.md
          slo: docs/observability/SLO.md#saga

      # A GAUGE, not a counter: it is a level read at scrape time by the metric's
      # collect provider (a live COUNT of COMPENSATING rows),
      # so `max` across replicas is the honest read and a rate would be
      # meaningless. Deferral is a BOUND doing its job — never a malfunction —
      # which is why it is on neither the failures nor the parked series.
      - alert: SagaBootLoadDeferred
        expr: max(saga_recovery_deferred_rows) > 0
        for: 10m
        labels:
          severity: warning
          component: saga
        annotations:
          summary: "Inherited sagas are uncovered: a boot hit its load ceiling"
          description: "A process started with MORE non-terminal sagas in the table than its boot load ceiling (`bootLoadLimit`, default 500), so the rows beyond it were not read and this process is not covering them. They are not lost: the retry checker claims them once they schedule a retry, and the next boot reads a fresh oldest-first page — and since every advancer is also a terminalizer, a deferred row the scan picks up is ALSO checked against its horizon and terminalized there if it has outlived it, rather than depending on this process tracking it. But nothing advances a row that has NO pending retry and did not make the page, so a sustained non-zero value means a backlog is aging toward its 30-minute horizon with no owner. Check `/sagas/metrics` -> recovery.bootLoadDeferred per process, drain the backlog (or restart once it shrinks), and if this is steady state rather than an outage tail, raise `bootLoadLimit` deliberately — the ceiling exists to protect the shared connection pool, so raise it together with pool sizing, never alone."
          runbook: docs/security/MULTI_TENANT_GUARDS.md
          slo: docs/observability/SLO.md#saga

      # The gauge is measured AT SCRAPE TIME (a prom-client collect callback runs
      # the COUNT), so this series tracks the real level continuously rather
      # than whatever a process last published at boot. `min_over_time` is the
      # FLOOR of the window: a walk that starts and finishes puts a 0 into the
      # series, so the floor is 0 and this stays silent; a rollback nothing can
      # finish keeps every sample non-zero. `max(...) > 0` would page on every
      # inherited compensation the engine correctly completed.
      #
      # The threshold, stated honestly: the expression is true at T when NO
      # sample in [T-10m, T] was zero, and `for: 5m` requires that to hold
      # continuously — so this pages after roughly 15 minutes of a level
      # that never drains, of which the first ten are the lookback. That is
      # comfortably inside the compensation liveness horizon (one saga horizon,
      # 30 min) and the absolute deadline (three), so an operator hears about a
      # stuck rollback well before the engine terminalizes it as
      # `compensation-expired`.
      - alert: SagaCompensatingOrphans
        expr: min_over_time(saga_compensating_orphans[10m]) > 0
        for: 5m
        labels:
          severity: warning
          component: saga
        annotations:
          summary: "A compensation walk is STUCK: the COMPENSATING level is not draining"
          description: 'Sagas have been sitting in COMPENSATING for about 15 minutes without the level ever returning to zero (a 10-minute lookback that never saw a zero, held for a further 5), so this is not a walk in progress: the engine loads COMPENSATING rows at boot and resumes their WALKS from the durable per-step record in `compensationResults`, and the gauge reports the live level at every scrape, so a backlog that accrues between boots is visible and a drained one reads zero. What is left is a walk this process could not finish — a `compensate()` that keeps failing, a definition this process has not registered, or an account it cannot resolve. Each such exit is also counted as `saga_recovery_failures_total{stage="compensation"}` and logged at ERROR. Handling: identify the rows (`SELECT id, "definitionId", "currentStep", "compensationResults", "updatedAt" FROM "SagaInstance" WHERE status = ''COMPENSATING''`), read `compensationResults` to see exactly which steps are already undone (a resumed walk will not repeat them), fix the cause, then re-drive with `POST /sagas/:sagaId/compensate` — which RESUMES rather than restarts. If nothing advances the row, the compensation liveness horizon terminalizes it as reason=`compensation-expired` one full saga horizon after its last write, and SOME OF ITS EFFECTS MAY STILL STAND.'
          runbook: docs/security/MULTI_TENANT_GUARDS.md
          slo: docs/observability/SLO.md#saga

      - alert: SagaCompensationExpired
        expr: increase(sagas_failed_total{reason="compensation-expired"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
          component: saga
        annotations:
          summary: "A saga's ROLLBACK was terminalized unfinished"
          description: "A saga in COMPENSATING stopped making progress for a full saga horizon and was terminalized FAILED under reason='compensation-expired'. Read this as 'the rollback did not finish', NOT as 'the publish failed': the saga's forward work had already failed, and what ran out is the undo — so one or more of its pre-pivot effects are still standing (a created post, an external record). Distinct from reason='timeout' (a step hung) and from reason='parked-expired' (a human window ran out), and it goes to a different runbook: read `compensationResults` on the row to see which steps ARE undone, undo the remainder by hand, and record why the walk stalled. A recurrence means the compensation itself is broken, which the retry policy cannot fix."
          runbook: docs/security/MULTI_TENANT_GUARDS.md
          slo: docs/observability/SLO.md#saga

      - alert: SagaWaitingRowsAccumulating
        expr: min_over_time(saga_waiting_rows[15m]) > 50
        for: 10m
        labels:
          severity: warning
          component: saga
        annotations:
          summary: "The population of sagas waiting on external work is not draining"
          description: 'More than 50 sagas have been parked on a step that has not finished, continuously, for about 25 minutes (a 15-minute lookback whose FLOOR never dropped to 50, held for a further 10) — so this is a backlog, not a busy minute. A step that waits spends no retry budget by design: it re-arms on the poll cadence (SAGA_WAIT_POLL_MS, default 30s) and is bounded only by the saga horizon, which means a stalled dependency no longer converts into a burst of step failures within ~35s — it accumulates here instead, quietly, until the horizon terminalizes the whole cohort at once as reason=''timeout''. Read this as ''work is being started and not finished'': publish workers down or not consuming, a provider outage, or a queue the workers cannot reach. Handling: check the publish workers are alive and draining (`bull:publish:*`), check `SagaTimeoutSpike` for the cohort about to expire, and enumerate the population with `SELECT id, "definitionId", "currentStep", "nextRetryAt" FROM "SagaInstance" WHERE status = ''RUNNING'' AND "nextRetryAt" IS NOT NULL ORDER BY "nextRetryAt"`. The retry scan pages 50 due rows every 5s, so a population far above ~300 also means poll latency is growing (see SMELL-73).'
          runbook: docs/runbooks/alert-saga-timeout.md
          slo: docs/observability/SLO.md#saga

      - alert: SagaRecoveryLoopFailing
        expr: increase(saga_recovery_failures_total{stage=~"boot|retry-scan|timeout|instance-load|resume-row|compensation|rehydration|event-dispatch|wait-poll"}[10m]) > 3
        for: 5m
        labels:
          severity: warning
          component: saga
        annotations:
          summary: "A saga background loop is failing repeatedly"
          description: "The boot load, boot resume pass, retry scan, timeout checker or by-id instance load failed more than 3 times in 10min, the engine could not resolve the owning account of more than 3 sagas, or more than 3 compensation walks did not complete. These loops swallow their errors by design so one failure cannot kill the process — this counter is the ONLY external signal that a loop is dead. stage='resume-row' is per-ROW: the pass could not even classify a saga (a persisted context without its metadata object is the known shape), the row was skipped and its neighbours still recovered. stage='compensation' is per-WALK: an undo that could not start or could not finish, or a forward dispatch refused because the walk owns the row — pair it with SagaCompensatingOrphans, which says whether the level is draining. stage='event-dispatch' is per-EVENT: a worker completion event carried no usable saga identity, so it advanced nothing — every publish it belonged to falls back to the poll cadence and finishes a poll interval later than it should. stage='wait-poll' is per-RE-ARM: a step that had not finished could not have its next poll persisted, which means a degraded database, not a broken saga — the saga is deliberately NOT terminalized for it. stage='boot' additionally means this process has NO recovery coverage: it also degrades the saga health check, and the remedy is a RESTART, not waiting. Inspect the ERROR logs carrying the matching `loop` field and its correlation id."
          runbook: docs/security/MULTI_TENANT_GUARDS.md
          slo: docs/observability/SLO.md#saga
