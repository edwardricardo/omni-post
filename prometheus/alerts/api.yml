# API alerts — §4.2 Normalization Roadmap Phase A1.
# Métricas fuente: prom-client custom en apps/api/src/metrics/apiMetrics.ts.
groups:
  - name: api
    interval: 30s
    rules:
      - alert: ApiLatencyP99High
        expr: histogram_quantile(0.99, rate(http_duration_bucket{job="api"}[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API p99 latency > 1s for 5min"
          description: "p99 HTTP request duration ha excedido 1000ms por más de 5min sostenido. Indica saturación de DB, dependencias externas lentas, o algún endpoint con regression."
          runbook: docs/runbooks/alert-api-latency.md
          slo: docs/observability/SLO.md#api

      - alert: ApiErrorRateHigh
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API 5xx error rate > 5% for 5min"
          description: "Tasa de 5xx ha excedido 5% por más de 5min. Crítico — afecta a usuarios reales. Investigá deploys recientes + logs Sentry + Grafana api-performance dashboard."
          runbook: docs/runbooks/alert-api-error-rate.md
          slo: docs/observability/SLO.md#api

      # Sin `for:`: la ventana [15m] del `increase()` ya es el suavizado, y un
      # `for:` agregaría una segunda demora sobre una serie que en estado normal
      # se mantiene en cero. Sin `slo:`: ninguna definición de SLO cubre
      # api_security_threats_total.
      - alert: MfaBackupCodeReuseRejected
        expr: increase(api_security_threats_total{threat_type="mfa_backup_code_reuse"}[15m]) > 0
        labels:
          severity: warning
          component: api
        annotations:
          summary: "MFA backup code reuse refused — a consumed recovery code was presented again"
          description: "El claim del backup code rechazó al menos un intento de consumir un código ya consumido en los últimos 15 minutos. En estado normal esta serie se mantiene en cero, por lo que cualquier emisión sostenida es señal de reutilización de credenciales de recuperación. Consultar el runbook antes de escalar: una colisión entre claims de índices distintos del mismo usuario produce un falso positivo documentado."
          runbook: docs/runbooks/alert-mfa-backup-code-reuse.md

      # Misma forma que la regla de arriba y por las mismas razones: sin `for:`
      # (la ventana [15m] del `increase()` ya suaviza una serie que en estado
      # normal está en cero) y sin `slo:` (ningún SLO cubre
      # api_security_threats_total).
      - alert: AdminRefreshTokenReplayRejected
        expr: increase(api_security_threats_total{threat_type="admin_refresh_token_replay"}[15m]) > 0
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Admin refresh token replay refused — a rotated refresh token was presented again"
          description: "El claim de rotación rechazó al menos un refresh token ya rotado en los últimos 15 minutos. La revocación en vuelo (logout o revocación administrativa entre la lectura y la escritura) NO emite esta serie: se audita aparte como SESSION_REVOKED_MIDFLIGHT. Consultar el runbook antes de escalar: un refresh simultáneo desde dos pestañas produce un falso positivo documentado."
          runbook: docs/runbooks/alert-admin-refresh-token-replay.md
