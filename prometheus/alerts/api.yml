# API alerts.
# Source metrics: the custom prom-client metrics in apps/api/src/metrics/apiMetrics.ts.
groups:
  - name: api
    interval: 30s
    rules:
      - alert: ApiLatencyP99High
        expr: histogram_quantile(0.99, rate(http_duration_bucket{job="api"}[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API p99 latency > 1s for 5min"
          description: "p99 HTTP request duration has exceeded 1000ms for more than 5min, sustained. It points to DB saturation, slow external dependencies, or an endpoint with a regression."
          runbook: docs/runbooks/alert-api-latency.md
          slo: docs/observability/SLO.md#api

      - alert: ApiErrorRateHigh
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API 5xx error rate > 5% for 5min"
          description: "The 5xx rate has exceeded 5% for more than 5min. Critical — it affects real users. Investigate recent deploys + Sentry logs + the Grafana api-performance dashboard."
          runbook: docs/runbooks/alert-api-error-rate.md
          slo: docs/observability/SLO.md#api

      # No `for:`: the [15m] window of `increase()` is already the smoothing, and a
      # `for:` would add a second delay on a series that stays at zero in the
      # normal state. No `slo:`: no SLO definition covers
      # api_security_threats_total.
      - alert: MfaBackupCodeReuseRejected
        expr: increase(api_security_threats_total{threat_type="mfa_backup_code_reuse"}[15m]) > 0
        labels:
          severity: warning
          component: api
        annotations:
          summary: "MFA backup code reuse refused — a consumed recovery code was presented again"
          description: "The backup code claim refused at least one attempt to consume an already consumed code in the last 15 minutes. In the normal state this series stays at zero, so any sustained emission is a sign that recovery credentials are being reused. Read the runbook before escalating: a collision between claims on different indexes of the same user produces a documented false positive."
          runbook: docs/runbooks/alert-mfa-backup-code-reuse.md

      # Same shape as the rule above, for the same reasons: no `for:` (the [15m]
      # window of `increase()` already smooths a series that is at zero in the
      # normal state) and no `slo:` (no SLO covers
      # api_security_threats_total).
      - alert: AdminRefreshTokenReplayRejected
        expr: increase(api_security_threats_total{threat_type="admin_refresh_token_replay"}[15m]) > 0
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Admin refresh token replay refused — a rotated refresh token was presented again"
          description: "The rotation claim refused at least one already rotated refresh token in the last 15 minutes. An in-flight revocation (a logout or an administrative revocation between the read and the write) does NOT emit this series: it is audited separately as SESSION_REVOKED_MIDFLIGHT. Read the runbook before escalating: a simultaneous refresh from two tabs produces a documented false positive."
          runbook: docs/runbooks/alert-admin-refresh-token-replay.md
