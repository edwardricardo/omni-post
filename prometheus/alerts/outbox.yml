# Outbox alerts.
# Source metric: the outbox_pending_events gauge (OutboxRelay poll metric).
# Invariant: in steady state the relay processes events almost in real time; a
# high pending count indicates a stuck relay or a saturated downstream consumer.
groups:
  - name: outbox
    interval: 30s
    rules:
      - alert: OutboxLagHigh
        expr: outbox_pending_events > 100
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox has >100 pending events for 5min — relay may be stuck"
          description: "The outbox relay should process events in <1s in steady state. Pending > 100, sustained, indicates a crashed relay, an expired lease that cannot be reclaimed, or a saturated downstream BullMQ. The OutboxClaimService lease (5min) should re-claim — if it does not, the relay process died. Inspect the Grafana outbox dashboard + apps/api logs."
          runbook: docs/runbooks/alert-outbox-lag.md
          slo: docs/observability/SLO.md#outbox
