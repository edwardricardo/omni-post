catalogs:
  # OTel set: a named catalog documents the independent release train (the 0.NNN
  # instrumentation line vs the 2.x core/SDK line) and that they bump together.
  # Every value was taken on 2026-06-20 (`7d9da4aa`, then `725c8363`) and the set
  # moves atomically. It is not the newest: on 2026-10-03 the registry carries a
  # newer release for 12 of the 14 members, named per line. Only `core` is still
  # extended to transitive copies by an override, as a CVE floor (decision D47).
  otel:
    "@opentelemetry/api": 1.9.1 # the newest release on 2026-10-03
    "@opentelemetry/auto-instrumentations-node": 0.77.0 # 0.80.0 is newer and mature; was 0.75.0
    "@opentelemetry/core": 2.8.0 # the CVE floor of GHSA-8988-4f7v-96qf (SECURITY_CANON row `@opentelemetry/core`); 2.11.0 is newer and mature
    "@opentelemetry/exporter-prometheus": 0.219.0 # 0.222.0 is newer and mature; was 0.217.0
    "@opentelemetry/sdk-node": 0.219.0 # 0.222.0 is newer and mature; was 0.217.0
    "@opentelemetry/exporter-trace-otlp-http": 0.219.0 # 0.222.0 is newer and mature; was 0.214.0
    "@opentelemetry/instrumentation": 0.219.0 # 0.222.0 is newer and mature; was 0.214.0
    "@opentelemetry/instrumentation-fastify": 0.57.0 # the newest release on 2026-10-03
    "@opentelemetry/instrumentation-fs": 0.38.0 # 0.41.0 is newer and mature; was 0.33.0
    "@opentelemetry/instrumentation-http": 0.219.0 # 0.222.0 is newer and mature; was 0.214.0
    "@opentelemetry/instrumentation-redis": 0.67.0 # 0.70.0 is newer and mature; was 0.62.0
    "@opentelemetry/propagation-utils": 0.31.22 # 0.31.23 is newer and mature; was 0.31.17
    "@opentelemetry/resources": 2.8.0 # 2.11.0 is newer and mature; was 2.6.1
    "@opentelemetry/semantic-conventions": 1.41.1 # 1.43.0 is newer and mature; was 1.40.0

# Dependency resolution overrides. Migrated verbatim from the package.json `pnpm`
# field (ADR-0019). `catalog:` / `catalog:otel` values resolve against the catalogs
# above (dual-role direct deps, ADR-0018); the literal versions are CVE-floor pins
# (SECURITY_CANON.md §"CVE-floor pins"). Every key but `validator` moves a resolution
# today: removing it alone changes a lockfile snapshot. The override audit of 2026-10-15
# removed the 15 that changed none (SECURITY_CANON.md §"Override audit"); `validator`
# pins nothing too and leaves with DC-3 and DC-4, which own it (MASTER_PLAN_ES.md).
overrides:
  form-data: "catalog:"
  validator: "catalog:"
  uuid: "catalog:"
  postcss: "catalog:"
  # CVE floor, dual-role (ADR-0018), measured 2026-10-03 (decision D47): without it,
  # @sentry/node 10.48.0's @opentelemetry/instrumentation-http 0.214.0, which declares core 2.6.1
  # exactly, resolves 2.6.1, inside GHSA-8988-4f7v-96qf (moderate, unbounded W3C Baggage
  # allocation, fixed 2.8.0), and `pnpm audit` exits 1. The catalog:otel value 2.8.0 is the
  # minimal patched version. See SECURITY_CANON §"CVE-floor pins", row `@opentelemetry/core`.
  "@opentelemetry/core": "catalog:otel"
  # CVE floor added 2026-10-06 for GHSA-qqmp-wf37-98f9 (moderate, CWE-532): these eight
  # instrumentations set the database username as an unconditional `db.user` span attribute. OSV,
  # GitHub's first_patched_version and the upstream repository advisory agree on every target, all
  # published 2026-07-23 with open-telemetry/opentelemetry-js-contrib#3585; each band is the minimal
  # patched version. Neither consumer reaches them by its own range: @sentry/node 10.48.0 pins six
  # of them EXACTLY, and @opentelemetry/auto-instrumentations-node 0.77.0 declares 0.x caret ranges
  # two minors short of all eight. A Sentry bump is not the fix: from 10.54.0 these are no longer
  # Sentry dependencies, and the copies Sentry vendors instead still set db.user (read in 10.75.3
  # and 11.4.0), so the advisory would leave the audit while the attribute stayed. The patched
  # releases emit only stable semantic conventions: Sentry 10.48.0 still marks their spans op `db`,
  # but describes a query by its span name, since it reads `db.statement` and they write
  # `db.query.text`. pg 0.73.0 and mongoose 0.67.0 declare @opentelemetry/core ^2.9.0 and run on the
  # 2.8.0 the override above holds; the five core exports they reach, @opentelemetry/sql-common's
  # included, exist in 2.8.0. Measured with pg loaded through @prisma/adapter-pg: db.user on 4 of 4
  # Sentry spans and 4 of 6 SDK spans before, on none after. See SECURITY_CANON §"CVE-floor pins",
  # row `@opentelemetry/instrumentation-*`.
  "@opentelemetry/instrumentation-cassandra-driver@<0.66.0": 0.66.0
  "@opentelemetry/instrumentation-knex@<0.65.0": 0.65.0
  "@opentelemetry/instrumentation-mongoose@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-mysql@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-mysql2@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-oracledb@<0.46.0": 0.46.0
  "@opentelemetry/instrumentation-pg@<0.73.0": 0.73.0
  "@opentelemetry/instrumentation-tedious@<0.40.0": 0.40.0
  "@opentelemetry/propagator-jaeger@<2.9.0": 2.9.0
  "deepmerge-ts@<8.0.0": 8.0.0
  "mysql2@<3.23.1": 3.23.1
  dompurify: 3.4.16 # raised 2026-10-01 for GHSA-p98j-92pf-mc4p (low, OSV introduced 3.4.13 fixed 3.4.16); monaco-editor pins 3.2.7 exactly, so the floor stays an override
  js-yaml: 4.3.2

# Audited audit-ignores: GHSAs accepted as non-exploitable in our context, each with
# a documented remove-when (SECURITY_CANON §Audited-audit-ignores). pnpm audit still
# fails on any NEW advisory — the gate stays real. Migrated from package.json (ADR-0019).
# Empty since 2026-10-06: the last two entries, GHSA-848j-6mx2-7j84 (elliptic) and
# GHSA-vfj7-8cjw-p6xm (braces), left with @storybook/nextjs, the only package whose
# chains carried either, so neither suppressed anything any more.
auditConfig:
  ignoreGhsas: []

patchedDependencies:
  # Storybook's merged fix for next 16.4 (storybookjs/storybook#36732), absent from 10.6.1; leaves when 10.6.3 is published (ADR-0037)
  "@storybook/nextjs-vite@10.6.1": patches/@storybook__nextjs-vite@10.6.1.patch
