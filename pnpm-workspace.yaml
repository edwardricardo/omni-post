# Audited audit-ignores: GHSAs accepted as non-exploitable in our context, each with
# a documented remove-when (SECURITY_CANON §Audited-audit-ignores). pnpm audit still
# fails on any NEW advisory — the gate stays real. Migrated from package.json (ADR-0019).
auditConfig:
  ignoreGhsas:
    - GHSA-p8p7-x288-28g6
    - GHSA-848j-6mx2-7j84
    - GHSA-q7cg-457f-vx79
    # image-size ICNS/JXL/HEIF parser infinite-loop DoS (added 2026-08-11). The
    # advisories name >=2.0.3 as patched but npm has no release above 2.0.2 —
    # there is nothing to pin to. The one production caller
    # (packages/providers/bluesky BlueskyClient.getImageDimensions) now gates
    # buffers by magic bytes and admits only jpeg/png/gif/webp — the vulnerable
    # parsers are unreachable by construction, pinned by unit tests asserting
    # image-size is never invoked for crafted ICNS/JXL/HEIF signatures. The
    # remaining path (@storybook/nextjs) is dev-only tooling. Remove when
    # image-size publishes >=2.0.3 and the tree resolves it.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

# Patched dependency (migrated from package.json `pnpm` field, ADR-0019).
patchedDependencies:
  "@secretlint/node@12.3.1": patches/@secretlint__node@12.3.1.patch
