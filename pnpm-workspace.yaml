# Dependency resolution overrides. Migrated verbatim from the package.json `pnpm`
# field (ADR-0019). `catalog:` / `catalog:otel` values resolve against the catalogs
# above (dual-role direct deps, ADR-0018); the literal versions are CVE-floor pins
# and dated-debt holds (SECURITY_CANON §Audited-audit-ignores, PENDING_WORK_INVENTORY §7).
overrides:
  axios: "catalog:"
  # Added 2026-09-04, when the root declared `fastify-type-provider-zod` but no
  # fastify, so its `fastify` peer was auto-installed UNCONSTRAINED and drifted from
  # the catalog — two fastify copies in one tree, the CVE floor authoritative for only
  # one of them. That root copy left on 2026-10-03 (decision D35): every fastify in
  # the lockfile is now the catalog-declared direct dependency of apps/api or
  # api-common, or the peer that apps/api's own `fastify-type-provider-zod` resolves
  # to it. The override stays as the dual-role CVE-floor override, the `axios`
  # precedent: a future transitive or peer fastify resolves to the catalog floor
  # instead of drifting below it. Not a de-dup-only override (ADR-0018 drops those).
  fastify: "catalog:"
  form-data: "catalog:"
  validator: "catalog:"
  uuid: "catalog:"
  ws: "catalog:"
  postcss: "catalog:"
  # CVE floor, dual-role (the `axios` shape), measured 2026-10-03 (decision D47): without it,
  # @sentry/node 10.48.0's @opentelemetry/instrumentation-http 0.214.0, which declares core 2.6.1
  # exactly, resolves 2.6.1, inside GHSA-8988-4f7v-96qf (moderate, unbounded W3C Baggage
  # allocation, fixed 2.8.0), and `pnpm audit` exits 1. The catalog:otel value 2.8.0 is the
  # minimal patched version. See SECURITY_CANON §"CVE-floor pins", row `@opentelemetry/core`.
  "@opentelemetry/core": "catalog:otel"
  "@opentelemetry/propagator-jaeger@<2.9.0": 2.9.0
  "deepmerge-ts@<8.0.0": 8.0.0
  # All three bands raised 2026-09-30 for THREE new advisories, each with a fix on
  # every line (OSV-derived): GHSA-6j4f-fj2g-mc7p (high, DoS via uncontrolled
  # recursion in parseCommaParts), GHSA-qhr7-859c-m2p7 (high, DoS via uncontrolled
  # recursion on nested braces) and GHSA-q2hr-2g5m-vwhr (moderate, quadratic-time
  # expansion of `{a},b}`). Each band takes the HIGHEST of the three fixes for its
  # own line, which is the minimal version satisfying all three: 1.1.19/1.1.20/1.1.21
  # -> 1.1.21, 2.1.5/2.1.6/2.1.7 -> 2.1.7, 3.0.7/3.0.8/3.0.9 -> 3.0.9,
  # 5.0.10/5.0.11/5.0.12 -> 5.0.12; 4.x has no fix of its own (OSV: introduced
  # 4.0.0, fixed 5.0.x), so 4.x -> 5.0.12 is upstream's own path. The tree
  # resolved exactly 1.1.18, 2.1.4 and 5.0.9 — all three previous TARGETS — so all
  # three bands were inert against these advisories: the band-overtaken-by-its-own-
  # target gotcha, three more times in one raise. Lines 1 and 2 stay within their
  # major, which keeps the callable default export the eslint toolchain needs
  # (minimatch 3 -> brace-expansion ^1; see SECURITY_CANON §"Build-tool version
  # holds", the minimatch/brace-expansion row), and 3.x keeps its own band so no
  # band forces a 3.x consumer across a major.
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=3.0.0 <3.0.9": 3.0.9
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  # Raised 2026-09-30 for GHSA-qw65-cvwx-89v3 (high, authority injection via an
  # unvalidated port in serialize) and GHSA-58mr-gqgx-xq4g (high, host confusion via
  # an unclosed bracket) — the second named the then-targets EXACTLY (=3.1.6,
  # =4.1.3) — and then raised AGAIN the same day, after the first raise had landed
  # and been verified, for GHSA-hrr3-gc8f-f4qj (moderate, inconsistent host case
  # normalization; fixed 3.1.8 / 4.1.5) and GHSA-jvvf-x445-j334 (moderate, mailto
  # header injection via percent-encoding; introduced 4.1.3, fixed 4.1.5). The
  # second raise found the tree on 3.1.7 / 4.1.4 — the targets set 90 minutes
  # earlier — so this single package supplied the gotcha TWICE in one batch, which
  # is why the floors are cross-derived from OSV and re-measured immediately before
  # the final gate rather than once at the start.
  # Minimal patched per ADR-0018, NOT the latest 4.2.1, and the 3.x band stays
  # range-scoped so the 4.x line is not dragged into it.
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "fast-uri@>=4.0.0 <4.1.5": 4.1.5
  # Added 2026-09-30 for GHSA-g84c-rxfj-3j2c (high, path traversal via a
  # non-slash-terminated publicPath; CVE-2024-29180 / CVE-2026-76844).
  # THE FLOOR IS 7.4.6, NOT 7.4.5, AND `pnpm audit` CANNOT SEE THE DIFFERENCE. The
  # advisory's own `vulnerable_version_range` string reads "< 7.4.5" while its
  # `first_patched_version` is 7.4.6, and OSV records `introduced 0, fixed 7.4.6`
  # (plus `introduced 8.0.0, fixed 8.3.0`). Upstream confirms OSV: v7.4.6
  # (2026-09-03) is "reject requests that resolve outside the output directory",
  # while v7.4.5 (2025-09-24) is "unpin memfs", a year earlier and unrelated. So a
  # 7.4.5 pin makes `pnpm audit` go green by matching a malformed range string over
  # a still-vulnerable version. EVERY floor here is therefore cross-derived from OSV
  # + the upstream changelog, never from the audit range alone.
  # DEV-only chain, measured: @storybook/builder-webpack5 > @storybook/nextjs >
  # apps/{admin,client} devDependencies. It CANNOT resolve naturally —
  # builder-webpack5 declares `webpack-dev-middleware: ^6.1.2` at 10.4.6, at the
  # installed 10.6.0 and at 10.6.1 (re-read 2026-10-02), and 6.1.3 is the 6.x
  # ceiling, so `pnpm update -r` leaves it on the
  # vulnerable version (verified). A MAJOR forced over an upstream range, the
  # @hono/node-server / deepmerge-ts precedent: 7.4.6's peerDependencies and engines
  # are byte-identical to 7.4.5's; its peer (`webpack ^5.0.0`) is 6.1.3's, and
  # engines.node rises only from >=14.15.0 to >=18.12.0, below this repo's
  # >=24.15.0. Honest scope: builder-webpack5 imports the 7.x major statically and
  # calls it only on the `storybook dev` path; `storybook dev --smoke-test --ci`
  # (apps/client) and `storybook build` are green on 7.4.6, under Storybook 10.4.6
  # on 2026-10-01 and under 10.6.0 on 2026-10-02.
  # Minimal patched 7.4.6, not the latest 8.3.0, per ADR-0018.
  "webpack-dev-middleware@<7.4.6": 7.4.6
  # Raised 2026-09-09 for GHSA-rgj7-g3m4-5g8c (high) — sharp's bundled libvips ships
  # libheif, wrapping GHSA-g89c-p67h-r497 + GHSA-2jg2-4ch7-h545; vulnerable <0.35.4.
  # BOTH the band and the target moved, the fast-uri gotcha again: the tree already
  # resolved 0.35.0 — the previous target — which the old band (<0.35.0) no longer
  # matches, so raising only the value would have left an INERT override pinning
  # nothing while the audit stayed red.
  "sharp@<0.35.4": 0.35.4
  # Added 2026-09-09 for GHSA-7w5x-hrqm-74c2 (high, DoS via malformed TOML,
  # patched >=1.7.1). DEV-only chain: root knip > smol-toml — the dead-code
  # gate's TOML parser, no production runtime path. Minimal patched 1.7.1, not
  # the latest 1.8.0, per ADR-0018; range-scoped so only the vulnerable band
  # is lifted.
  "smol-toml@<1.7.1": 1.7.1
  "find-my-way@<9.6.1": 9.7.0 # minimal AVAILABLE patched version: the advisory names 9.6.1 but npm never published it (9.6.0 -> 9.7.0)
  "protobufjs@>=7.5.0 <7.6.5": 7.6.5
  "browserslist@<4.28.7": 4.28.7
  "mysql2@<3.23.1": 3.23.1
  "@xmldom/xmldom@>=0.7.0 <0.8.15": 0.8.15
  # Band normalized 2026-09-30 from `<=1.4.1` to `<1.4.2`. The SET of lifted versions is the same
  # (no release sits between 1.4.1 and 1.4.2, and no valibot prerelease is in the tree), but an
  # INCLUSIVE bound names a DIFFERENT number from the target, so the next raise could move one and
  # leave the other behind — the shape `scripts/testing/override-bands-gate.mjs` refuses. With
  # `<1.4.2` the bound IS the target and the two can only move together. Resolution unchanged: 1.4.2.
  "valibot@<1.4.2": 1.4.2
  esbuild: 0.28.1
  dompurify: 3.4.16 # raised 2026-10-01 for GHSA-p98j-92pf-mc4p (low, OSV introduced 3.4.13 fixed 3.4.16); monaco-editor pins 3.2.7 exactly, so the floor stays an override
  js-yaml: 4.3.2

# Audited audit-ignores: GHSAs accepted as non-exploitable in our context, each with
# a documented remove-when (SECURITY_CANON §Audited-audit-ignores). pnpm audit still
# fails on any NEW advisory — the gate stays real. Migrated from package.json (ADR-0019).
auditConfig:
  ignoreGhsas:
    - GHSA-848j-6mx2-7j84
    # braces stack-exhaustion DoS through deeply nested brace patterns,
    # CVE-2026-93687 (added 2026-10-03). No fixed release exists: npm ends at
    # 3.0.3, OSV records last_affected 3.0.3 and GitHub first_patched_version
    # null. The one copy, braces@3.0.3, sits under micromatch@4.0.8 on
    # devDependency chains only (eslint-plugin-boundaries, @storybook/nextjs;
    # depcheck, secretlint and jscpd carried it until 2026-10-03, decisions
    # D35, D38 and D39); no production importer reaches it, and
    # micromatch hands braces glob patterns only, which here come from
    # repository configuration alone. secretlint was the one carrier that
    # received a committer's staged paths as patterns, and 13.0.6 no longer
    # depends on micromatch (decision D38). Remove when
    # braces publishes a release above 3.0.3 and the lockfile resolves it.
    - GHSA-vfj7-8cjw-p6xm
