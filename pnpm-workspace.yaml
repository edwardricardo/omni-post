  fast-check: 4.10.2 # latest stable AND latest mature, measured 2026-10-18T04:00Z: published 2026-09-19T19:34Z, mature since 2026-09-26T19:34Z, nothing newer; OSV lists nothing for it or for its one dependency, pure-rand (^8.0.0, resolves 8.4.2). Added 2026-10-18 for the first property suites: declared by apps/api, @core/domain and @core/bulk-scheduling (devDependency), so a catalog entry (ADR-0018). The transitive fast-check 3.23.2 under @prisma/config > effect stays a second copy, because the majors differ
