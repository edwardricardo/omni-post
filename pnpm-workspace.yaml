packages:
  - apps/*
  - packages/*
  - packages/providers/*
  - packages/adapters/*
  - packages/core/*
  - packages/monitoring/*
  - packages/observability/*
  - infra/*

enableGlobalVirtualStore: false

# Build-script approval. pnpm 11 unified `onlyBuiltDependencies` +
# `ignoredBuiltDependencies` into `allowBuilds` (map of package -> boolean),
# migrated here from the package.json `pnpm` field (ADR-0019). true = run the
# install script, false = skip it.
allowBuilds:
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  esbuild: true
  bcrypt: false
  # The following carry build scripts but were NOT in pnpm-10's exclusive
  # `onlyBuiltDependencies` allowlist, so their scripts did NOT run under pnpm 10
  # (they rely on prebuilt binaries). `false` preserves that exact behavior — pnpm 11's
  # allowBuilds is exhaustive, so every build-script package must be listed (ADR-0019).
  "@ast-grep/cli": false
  "@parcel/watcher": false
  "@sentry/cli": false
  "@swc/core": false
  argon2: false
  bufferutil: false
  contextify: false
  core-js-pure: false
  es5-ext: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false

# `pnpm add` writes an exact spec (no caret range), backing the ADR-0018
# "no ^ ~ * >=" rule at the tooling level before syncpack lints it. Moved out of
# .npmrc: pnpm 11 reads ONLY auth/registry keys from there, so the non-auth
# settings live here now (ADR-0019).
savePrefix: ""

# Install-time freshness gate (minutes). Held at 0 to preserve pnpm-10 behavior;
# pnpm 11 would otherwise default to 1440 (1 day). ADR-0018 already governs
# freshness at update time via `taze --maturity-period 7` — aligning this to the
# 7-day window (10080) is a deliberate follow-up (ADR-0019 §Revisit if).
minimumReleaseAge: 0

# Off-catalog `pnpm add` errors before reaching CI: a duplicate version becomes
# structurally un-representable.
catalogMode: strict

catalog:
  # ── React family (move atomically: react + react-dom + @types) ──
  react: 19.2.7 # latest stable (taze -l --maturity-period 7); was 19.2.4
  react-dom: 19.2.7 # latest stable; was 19.2.4
  "@types/react": 19.2.17 # latest stable; was 19.2.14
  "@types/react-dom": 19.2.3 # already latest stable

  # ── Tiptap + prosemirror family (atomic) ──
  # CVE floor raised 2026-09-09 to 3.30.5: GHSA-j95f-988m-3j2f (high) — quadratic
  # ReDoS in block and inline Markdown attribute parsing; vulnerable >=3.7.0 <3.30.5.
  # Supersedes the 2026-09-04 floor at 3.30.4 (GHSA-cp6q-959q-f8rh, moderate,
  # mergeAttributes() prototype pollution). Pinned to the MINIMAL patched 3.30.5 per
  # ADR-0018. The family moves ATOMICALLY — every member publishes 3.30.5 (verified
  # against the registry), and the apps/client single-manifest literals
  # (extension-color/-highlight/-link/-text-style/-typography) move in the same
  # commit, so no member can drag a pre-3.30.5 @tiptap/core back in transitively.
  "@tiptap/core": 3.30.5
  "@tiptap/react": 3.30.5
  "@tiptap/pm": 3.30.5
  "@tiptap/starter-kit": 3.30.5
  "@tiptap/extension-character-count": 3.30.5
  "@tiptap/extension-placeholder": 3.30.5

  # ── LangChain family (atomic) ──
  "@langchain/core": 1.2.0 # already latest stable (7d candidate 1.1.49 is older; never pin lower)
  "@langchain/langgraph": 1.4.4 # already latest stable (7d candidate 1.4.2 is older; never pin lower)

  # ── Google API clients (the `google-auth-library@10` scoped override stays in pnpm.overrides) ──
  google-auth-library: 10.7.0 # latest stable (taze -l --maturity-period 7); was 9.14.1 (MAJOR 9->10)
  # The per-API packages, NOT the `googleapis` monolith this replaced: that one
  # ships EVERY Google API and weighs 204MB, of which this repository uses two
  # surfaces. Measured in a `pnpm deploy --prod` of the API: 204MB of 998MB.
  # These two are NOT an atomic family — they version independently and share no
  # advisory, so each is pinned on its own evidence.
  "@googleapis/youtube": 39.0.1 # latest stable
  "@googleapis/youtubeanalytics": 11.0.1 # latest stable

  # ── Build/test toolchain ──
  vitest: 4.1.11 # CVE floor raised 2026-09-09: GHSA-82fw-gwwq-j7x9 (moderate, @vitest/mocker redirect-mock path traversal), vulnerable >=2.1.0 <4.1.11. vitest 4.1.11 pins @vitest/mocker EXACTLY at 4.1.11, so the transitive needs no override of its own. Peer-locked to @vitest/* 4.1.11 (was 4.1.10)
  typescript: 6.0.3 # NOT latest stable (the previous comment said so and was false, corrected 2026-09-27): latest mature is 7.0.2. 6.0.3 is the v6 ceiling, HELD — @typescript-eslint 8.70.1 peers typescript ">=4.8.4 <6.1.0" (the range is unchanged from 8.70.0; only the version naming it moved, 2026-09-30). See SECURITY_CANON §"Build-tool version holds"
  tsx: 4.23.15 # latest MATURE and latest stable, re-measured 2026-10-02T07:22Z: published 2026-09-20T07:22:17Z, no later release. No hold row, because there is no lag. Declared via `catalog:` by root, apps/api, apps/workers and infra/prisma; also an optional peer (^4.8.1) of vite and postcss-load-config. Depends on esbuild ~0.28.0, which the blanket esbuild 0.28.1 override satisfies
  "@types/node": 24.13.6 # DELIBERATELY NOT latest stable, and not latest mature either: the runtime major is 24 (the Krypton LTS line — .nvmrc, setup-node and both Dockerfiles), and types ahead of the runtime describe APIs it does not have. 24.13.6 is the latest MATURE 24.x measured 2026-09-28T02:42:36Z (published 2026-09-19, 9.1 d; 24.19.0 is 2.2 d and immature). Was 25.9.3 — a major ABOVE the runtime on an odd, non-LTS line. The major is now gated by scripts/testing/engines-node-gate.mjs against engines.node; holds row in SECURITY_CANON
  jsdom: 29.1.1 # NOT latest stable (corrected 2026-09-27): latest mature is 30.1.0, HELD by three crossings — engines.node ^24.15.0, undici ^8 leaving its CVE band, and the BLANKET tough-cookie 4.1.3 override. See SECURITY_CANON §"Build-tool version holds"
  msw: 2.14.6 # NOT latest stable (corrected 2026-09-27): latest mature is 2.15.0 (81.7 d), no blocker measured — scheduled bump, holds row in SECURITY_CANON
  next: 16.3.8 # CVE floor raised 2026-09-30 to the MINIMAL version that patches the WHOLE advisory set, which is NOT the one `pnpm audit` can see: the DB knows only GHSA-vcvr-r3jv-pc5j (CRITICAL, RCE in next/og ImageResponse, >=16.2.0 <16.3.6, first_patched 16.3.6), but the 16.3.8 release notes name SEVEN more — GHSA-cjq9-62q9-8jv4 (HIGH, SSRF in Image Optimization, REACHABLE: optimization is on by default) + 5 medium + 1 low, all published 2026-09-30T16:14Z as vercel/next.js repository advisories and not yet globalized to OSV. Pinning 16.3.6 would make the audit go GREEN over a version with a reachable HIGH still open — the exact webpack-dev-middleware defect of 2026-09-30, and what the canon's cross-derive-from-the-changelog rule exists to stop. Deviates from the 7-day maturity buffer (16.3.8 is 9.6 h old when committed — published 2026-09-30T16:07Z) DELIBERATELY and measured: both portal production builds and both portal suites are green on it. Was 16.3.3 (GHSA-p293-qw3h-jr36 + GHSA-2xp9-vwfh-vxw4, 2026-09-09); before that 16.2.11
  next-intl: 4.13.0 # latest stable; was 4.9.2
  postcss: 8.5.24 # latest stable within the 7-day maturity buffer (2026-08-05; 8.5.25 is younger), >= the 8.5.23 CVE floor (GHSA-fxqj-rqcc-2cmp); was 8.5.21
  zustand: 5.0.14 # latest stable (taze -l --maturity-period 7); was 5.0.12
  "@tanstack/react-query": 5.101.0 # latest stable; was 5.95.0

  # ── Runtime-critical drifters (MAX of declared) ──
  "@prisma/client": 7.9.1 # latest stable (taze -l --maturity-period 7); was 7.8.0
  opossum: 9.0.0 # MAX of 8.0.0 / 9.0.0 (fitness #25)
  prom-client: 15.1.3 # MAX of 15.0.0 / 15.1.3

  # ── App/server runtime (DIRECT) ──
  # CVE floor 5.12.1 — closes GHSA-w2qp-rph6-63g4 (schema validation bypass) and
  # GHSA-3m5p-2c4r-xxw2 (X-Forwarded-* spoofing under hop-count trustProxy), both moderate.
  # The floor was HELD at 5.10.0 until 2026-09-04 because fastify's fix for the second
  # advisory REMOVES numeric hop-count trust in the RUNTIME, not only in the types:
  # lib/request.js getTrustProxyFn returns `() => false` for a number ("Hop-count-only trust
  # cannot validate the immediate peer"), so `request.ip` degraded to the socket peer for
  # every request. ADR-0021 unblocked it by migrating this repo to fastify's sanctioned
  # trusted-peer model: TRUSTED_PROXY_MODE selects socket-only or a TRUSTED_PROXY_RANGES
  # IP/CIDR allowlist that proxy-addr compiles and validates against the IMMEDIATE PEER.
  # Re-implementing `(addr, hop) => hop < N` as a TrustProxyFunction was rejected outright:
  # it would type-check, keep tests green, and restore the exact vulnerability the advisory
  # patched (Security canon: NO exception). See SECURITY_CANON.md §"Rate Limiting".
  fastify: 5.12.5 # CVE floor raised 2026-10-01: five advisories published 2026-09-30T23:44-23:53Z — GHSA-667r-xxjv-c9mm, GHSA-p68q-wchp-6fh7 (auth bypass via malformed URLs), GHSA-hwr6-493r-vm6h, GHSA-9q9j-q6p8-xq58 (all high, fixed 5.12.2) and GHSA-4mh8-r7rc-xpvc (moderate, fixed 5.12.5); OSV and the 5.12.2/5.12.5 release notes agree, so 5.12.5 is the minimal version closing the set and also the latest (14.8 d mature). Still paired with the find-my-way override: 5.12.5 declares find-my-way ^9.6.0, which still admits the vulnerable 9.6.0, so the override stays
  pino: 10.3.1
  zod: 4.4.3 # reconcile UP to apps' 4.4.3 (override 4.3.6 is stale)
  "@anthropic-ai/sdk": 0.104.1 # latest stable (taze -l --maturity-period 7); was 0.91.1
  cloudinary: 2.10.0 # latest stable; was 2.7.0
  handlebars: 4.7.9 # override forces newer than manifest 4.7.8
  axios: 1.20.0 # CVE floor raised 2026-09-30: TWELVE advisories landed in 34 minutes (GHSA-542g-h47m-68v8, -3pq3-5fj3-cg6v, -x97p-jq2g-jp4f, -mghh-pgcx-3jjj, -c29m-xwm3-cm6r, -9fr6-4gfg-395g, -vh66-26gq-q6x8, -r4gj-5m52-g5wh, -44g4-m2mj-wpvx, -m8m8-qj5v-23w3, -4hqw-qxg8-jxx2, -j8rh-479h-cp32 — 7 high / 5 moderate), every one first_patched at 1.20.0, so 1.20.0 is the minimal patched version for the whole set even though it is also the latest. Was 1.18.0 (GHSA-42h9-826w-cgv3 + GHSA-xj6q-8x83-jv6g + GHSA-pmv8-rq9r-6j72; MAX over tiktok 1.7.7)
  form-data: 4.0.6 # CVE floor (MAX over tiktok 4.0.0)
  validator: 13.15.35 # latest stable (taze -l --maturity-period 7), >= CVE floor; was 13.15.22
  uuid: 14.0.0 # latest stable; was 13.0.1 (MAJOR 13->14)
  ws: 8.21.1 # CVE floor

  # ── Shared direct deps (T1.11 completion — declared in ≥2 manifests; reconcile-UP, structure-only) ──
  "@sentry/node": 10.48.0
  "@sentry/nextjs": 10.48.0
  "@t3-oss/env-core": 0.13.11
  "@t3-oss/env-nextjs": 0.13.11
  argon2: 0.44.0
  bullmq: 5.58.9
  csv-parse: 7.0.2 # CVE floor raised 2026-09-09: GHSA-8cw4-87c7-c6xx (moderate, prototype replacement still reachable via the `columns` path), vulnerable <7.0.2 with no 6.x backport, so the minimal patched version is a MAJOR. REACHABLE here — parseSchedulingCsv parses uploaded CSV with `columns: true`; was 6.2.1
  dotenv: 17.2.2
  fastify-type-provider-zod: 6.1.0
  ioredis: 5.11.1
  date-fns: 4.1.0
  lucide-react: 1.7.0
  recharts: 3.8.1
  tw-animate-css: 1.4.0
  tailwindcss: 4.3.0
  "@tailwindcss/postcss": 4.3.0
  postcss-load-config: 6.0.1
  webpack: 5.106.2
  vite: 8.0.16 # single version — the former vite-7 hold was a workaround for apps/client missing @vitejs/plugin-react (apps/admin had it). Adding the plugin to client (ADR-0019) lets it parse JSX under vite 8's rolldown SSR transform, collapsing the vite 7/8 split. Verified: client 510/510 + admin 106/106 on vite 8.
  eslint: 9.39.5 # the v9 line's FINAL release and its ceiling. Still held below 10: eslint-plugin-react@7.37.5 peers eslint up to ^9.7, eslint-plugin-jsx-a11y@6.10.2 up to ^9, both already at their own latest. Measured 2026-09-27; see SECURITY_CANON §"Build-tool version holds"
  "@playwright/test": 1.61.1
  "@axe-core/playwright": 4.10.2
  "@formatjs/icu-messageformat-parser": 3.5.9
  # @testing-library family (atomic)
  "@testing-library/dom": 10.4.1
  "@testing-library/jest-dom": 7.0.0 # MAJOR 6->7: drops Node <22 (repo on Node 24)
  "@testing-library/react": 16.3.2
  "@testing-library/user-event": 14.6.1
  # Vitest JSX transform (apps/admin + apps/client) — required for vite 8 (ADR-0019).
  "@vitejs/plugin-react": 5.1.4
  # @vitest/* family (peer = vitest 4.1.11)
  "@vitest/coverage-v8": 4.1.11
  "@vitest/ui": 4.1.11
  # Storybook family (atomic; 10.4.6 = vite 8 peer)
  storybook: 10.4.6
  "@storybook/addon-a11y": 10.4.6
  "@storybook/addon-docs": 10.4.6
  "@storybook/nextjs": 10.4.6
  "@types/opossum": 8.1.9
  image-size: 2.0.2

catalogs:
  # OTel set: a named catalog documents the independent release train (the 0.NNN
  # instrumentation line vs the 2.x core/SDK line) and that they bump together.
  # Values adopt the override (newer) where the manifest is stale — removing the
  # override must not downgrade.
  # All values at latest stable (taze -l --maturity-period 7) — moved atomically.
  otel:
    "@opentelemetry/api": 1.9.1 # already latest stable
    "@opentelemetry/auto-instrumentations-node": 0.77.0 # latest stable; was 0.75.0
    "@opentelemetry/core": 2.8.0 # already latest stable
    "@opentelemetry/exporter-prometheus": 0.219.0 # latest stable; was 0.217.0
    "@opentelemetry/sdk-node": 0.219.0 # latest stable; was 0.217.0
    "@opentelemetry/exporter-trace-otlp-http": 0.219.0 # latest stable; was 0.214.0
    "@opentelemetry/instrumentation": 0.219.0 # latest stable; was 0.214.0
    "@opentelemetry/instrumentation-fastify": 0.57.0 # already latest stable
    "@opentelemetry/instrumentation-fs": 0.38.0 # latest stable; was 0.33.0
    "@opentelemetry/instrumentation-http": 0.219.0 # latest stable; was 0.214.0
    "@opentelemetry/instrumentation-redis": 0.67.0 # latest stable; was 0.62.0
    "@opentelemetry/propagation-utils": 0.31.22 # latest stable; was 0.31.17
    "@opentelemetry/resources": 2.8.0 # latest stable; was 2.6.1
    "@opentelemetry/semantic-conventions": 1.41.1 # latest stable; was 1.40.0

# Dependency resolution overrides. Migrated verbatim from the package.json `pnpm`
# field (ADR-0019). `catalog:` / `catalog:otel` values resolve against the catalogs
# above (dual-role direct deps, ADR-0018); the literal versions are CVE-floor pins
# and dated-debt holds (SECURITY_CANON §Audited-audit-ignores, PENDING_WORK_INVENTORY §7).
overrides:
  axios: "catalog:"
  # Added 2026-09-04. The root declares `fastify-type-provider-zod` but no fastify,
  # so its `fastify` peer is auto-installed UNCONSTRAINED and drifted to a different
  # version than the catalog governs (apps/api + api-common) — two fastify copies in
  # one tree, with the security-relevant pin authoritative for only one of them. This
  # binds every fastify in the tree to the catalog value, so when the held 5.12.1
  # floor is unblocked (see SECURITY_CANON §"Blocked floors") the dev-only peer moves
  # with it instead of silently lagging. Not a de-dup-only override (ADR-0018 drops
  # those): it exists to make ONE version answer for the CVE floor.
  fastify: "catalog:"
  form-data: "catalog:"
  validator: "catalog:"
  uuid: "catalog:"
  ws: "catalog:"
  postcss: "catalog:"
  "@opentelemetry/auto-instrumentations-node": "catalog:otel"
  "@opentelemetry/core": "catalog:otel"
  "@opentelemetry/exporter-prometheus": "catalog:otel"
  "@opentelemetry/sdk-node": "catalog:otel"
  "@opentelemetry/propagator-jaeger@<2.9.0": 2.9.0
  "deepmerge-ts@<8.0.0": 8.0.0
  # All three bands raised 2026-09-30 for THREE new advisories, each with a fix on
  # every line (OSV-derived): GHSA-6j4f-fj2g-mc7p (high, DoS via uncontrolled
  # recursion in parseCommaParts), GHSA-qhr7-859c-m2p7 (high, DoS via uncontrolled
  # recursion on nested braces) and GHSA-q2hr-2g5m-vwhr (moderate, quadratic-time
  # expansion of `{a},b}`). Each band takes the HIGHEST of the three fixes for its
  # own line, which is the minimal version satisfying all three: 1.1.19/1.1.20/1.1.21
  # -> 1.1.21, 2.1.5/2.1.6/2.1.7 -> 2.1.7, 3.0.7/3.0.8/3.0.9 -> 3.0.9,
  # 5.0.10/5.0.11/5.0.12 -> 5.0.12; 4.x has no fix of its own (OSV: introduced
  # 4.0.0, fixed 5.0.x), so 4.x -> 5.0.12 is upstream's own path. The tree
  # resolved exactly 1.1.18, 2.1.4 and 5.0.9 — all three previous TARGETS — so all
  # three bands were inert against these advisories: the band-overtaken-by-its-own-
  # target gotcha, three more times in one raise. Lines 1 and 2 stay within their
  # major, which keeps the callable default export the eslint toolchain needs
  # (minimatch 3 -> brace-expansion ^1; see SECURITY_CANON §"Build-tool version
  # holds", the minimatch/brace-expansion row), and 3.x keeps its own band so no
  # band forces a 3.x consumer across a major.
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=3.0.0 <3.0.9": 3.0.9
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  # Raised 2026-09-30 for GHSA-qw65-cvwx-89v3 (high, authority injection via an
  # unvalidated port in serialize) and GHSA-58mr-gqgx-xq4g (high, host confusion via
  # an unclosed bracket) — the second named the then-targets EXACTLY (=3.1.6,
  # =4.1.3) — and then raised AGAIN the same day, after the first raise had landed
  # and been verified, for GHSA-hrr3-gc8f-f4qj (moderate, inconsistent host case
  # normalization; fixed 3.1.8 / 4.1.5) and GHSA-jvvf-x445-j334 (moderate, mailto
  # header injection via percent-encoding; introduced 4.1.3, fixed 4.1.5). The
  # second raise found the tree on 3.1.7 / 4.1.4 — the targets set 90 minutes
  # earlier — so this single package supplied the gotcha TWICE in one batch, which
  # is why the floors are cross-derived from OSV and re-measured immediately before
  # the final gate rather than once at the start.
  # Minimal patched per ADR-0018, NOT the latest 4.2.1, and the 3.x band stays
  # range-scoped so the 4.x line is not dragged into it.
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "fast-uri@>=4.0.0 <4.1.5": 4.1.5
  # Raised 2026-09-30 for ten advisories (2 high / 5 moderate / 3 low, the split
  # re-derived per-id from OSV), all patched
  # >=7.29.1 — the highest being TLS certificate validation bypass
  # (GHSA-w293-vg96-wgc3) and unrequested-WebSocket DoS (GHSA-rfgv-xxqx-mfg5). Band
  # AND target moved together: the tree resolved exactly 7.29.0, the previous target,
  # which the old band (<7.29.0) no longer matched. Minimal patched 7.29.1, not the
  # 8.x line: jsdom 29.1.1, the only consumer, declares the dependency undici
  # ^7.25.0 (8.10.2, the 8.x fix, is mature but outside that range).
  "undici@>=7.0.0 <7.29.1": 7.29.1
  # Added 2026-09-30 for GHSA-g84c-rxfj-3j2c (high, path traversal via a
  # non-slash-terminated publicPath; CVE-2024-29180 / CVE-2026-76844).
  # THE FLOOR IS 7.4.6, NOT 7.4.5, AND `pnpm audit` CANNOT SEE THE DIFFERENCE. The
  # advisory's own `vulnerable_version_range` string reads "< 7.4.5" while its
  # `first_patched_version` is 7.4.6, and OSV records `introduced 0, fixed 7.4.6`
  # (plus `introduced 8.0.0, fixed 8.3.0`). Upstream confirms OSV: v7.4.6
  # (2026-09-03) is "reject requests that resolve outside the output directory",
  # while v7.4.5 (2025-09-24) is "unpin memfs", a year earlier and unrelated. So a
  # 7.4.5 pin makes `pnpm audit` go green by matching a malformed range string over
  # a still-vulnerable version. EVERY floor here is therefore cross-derived from OSV
  # + the upstream changelog, never from the audit range alone.
  # DEV-only chain, measured: @storybook/builder-webpack5 > @storybook/nextjs >
  # apps/{admin,client} devDependencies. It CANNOT resolve naturally —
  # builder-webpack5 declares `webpack-dev-middleware: ^6.1.2` at BOTH 10.4.6 and
  # 10.6.0, and 6.1.3 is the 6.x ceiling, so `pnpm update -r` leaves it on the
  # vulnerable version (verified). A MAJOR forced over an upstream range, the
  # @hono/node-server / deepmerge-ts precedent: 7.4.6's peerDependencies and engines
  # are byte-identical to 7.4.5's; its peer (`webpack ^5.0.0`) is 6.1.3's, and
  # engines.node rises only from >=14.15.0 to >=18.12.0, below this repo's
  # >=24.15.0. Honest scope: builder-webpack5 imports the 7.x major statically and
  # calls it only on the `storybook dev` path; `storybook dev --smoke-test --ci`
  # (apps/client) and `storybook build` are green on 7.4.6.
  # Minimal patched 7.4.6, not the latest 8.3.0, per ADR-0018.
  "webpack-dev-middleware@<7.4.6": 7.4.6
  # Raised 2026-09-09 for GHSA-rgj7-g3m4-5g8c (high) — sharp's bundled libvips ships
  # libheif, wrapping GHSA-g89c-p67h-r497 + GHSA-2jg2-4ch7-h545; vulnerable <0.35.4.
  # BOTH the band and the target moved, the fast-uri gotcha again: the tree already
  # resolved 0.35.0 — the previous target — which the old band (<0.35.0) no longer
  # matches, so raising only the value would have left an INERT override pinning
  # nothing while the audit stayed red.
  "sharp@<0.35.4": 0.35.4
  # Added 2026-09-09 for GHSA-7w5x-hrqm-74c2 (high, DoS via malformed TOML,
  # patched >=1.7.1). DEV-only chain: root knip > smol-toml — the dead-code
  # gate's TOML parser, no production runtime path. Minimal patched 1.7.1, not
  # the latest 1.8.0, per ADR-0018; range-scoped so only the vulnerable band
  # is lifted.
  "smol-toml@<1.7.1": 1.7.1
