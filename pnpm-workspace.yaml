  "@types/node": 26.6.5 # The runtime major's line: the runtime is Node 26 (.nvmrc, engines.node ">=26.12.1 <27" in every manifest, setup-node and the four Dockerfiles) since 2026-10-15, ahead of its 2026-10-28 LTS date (ADR-0038), and types ahead of the runtime describe APIs it does not have, so the pin follows the runtime major and never a higher one. 26.6.5 is latest, published 2026-10-09T18:46:47Z and taken inside the 7-day buffer under the owner's 72-hour rule (it matures 2026-10-16T18:46Z; its watchlist entry, with its two reviews on 2026-10-16 and 2026-10-23, is added by the follow-up commit once this change has its sha and PR number, as every entry of that file); 26.6.4 (2026-10-01) is the latest mature 26.x. Every consumer's range admits it, so the tree keeps one copy: 18 transitive dependents declare `*`, protobufjs `>=13.7.0` and jsdoc-type-pratt-parser `^26.4.0`, and the optional peers of vite, vitest, sharp, stripe, mysql2 and @inquirer/* are open ranges. Was 24.13.6 (the 24 line, 2026-09-28), and before that 25.9.3, a major above the runtime. The major is gated by scripts/testing/engines-node-gate.mjs against .nvmrc and engines.node; holds row in SECURITY_CANON
  jsdom: 30.1.3 # latest stable AND latest mature, measured 2026-10-27T19:36Z: published 2026-10-15T09:24:38Z, mature since 2026-10-22T09:24Z, nothing newer; OSV lists nothing. Weekly-window bump from 30.1.2 (ADR-0036) together with isomorphic-dompurify 4.6.0 (an apps/api literal, which requires jsdom ^30.1.3), so this pin reaches production through the HTML sanitizer; the 30.x line was first taken by slice 0.12 on 2026-10-02 under human gate H1. Declared via `catalog:` by apps/admin, apps/client, packages/query-client, packages/observability/browser-logger and packages/observability/sentry-next; also vitest's optional peer, which resolves the same copy. Its `undici ^8.12.1` keeps the lockfile's 8.12.2 (the CVE floor, SECURITY_CANON row `undici`) and `tough-cookie ^6.0.2` resolves 6.0.2; its `@asamuzakjp/dom-selector ^10.0.3` (a major from 9.2.4: 10.0.0 refactors internals and adds attribute names to the subjects jsdom uses to skip style rules) resolves 10.0.4, the newest release of that range outside the 7-day buffer, which also fixes `|=` against an empty value and `querySelectorAll` on a disconnected element matching the element itself; its `@asamuzakjp/css-color ^7.1.3` resolves 7.1.3, and its engines.node `^22.22.2 || ^24.15.0 || >=26.0.0` admits the repository's `>=26.12.1 <27`
  msw: 2.15.0 # latest MATURE, re-measured 2026-10-02T07:36Z: published 2026-07-08T01:43:07Z. NOT latest stable: 3.0.0 (2026-09-28T15:45Z) and 3.0.1 (2026-09-30T12:39Z) are younger than 7 days, and 2 -> 3 is a crossing, not a bump — ESM-only, Node >= 22, TypeScript >= 5.9, and outside the `msw ^2.4.9` peer of @vitest/mocker 4.1.11 (4.1.12 declares the same peer). No lag while 2.15.0 is the latest mature. 3.0.0 matures 2026-10-05T15:45Z and 3.0.1 on 2026-10-07T12:39Z; the holds gate targets the highest stable release published at least 7 days earlier, so 3.0.0's maturity is the instant msw becomes a lag, held from then by the `msw` row of SECURITY_CANON §"Build-tool version holds", and 3.0.1's maturity only moves that target from 3.0.0 to 3.0.1. Declared via `catalog:` by root, apps/api and apps/client (devDependency) and by packages/providers/shared (OPTIONAL peer). Its dependency ranges equal 2.14.6's key for key: `tough-cookie ^6.0.1` resolves naturally to 6.0.2 and no override touches it: the tough-cookie override was range-scoped to `<4.1.3` (2026-10-02, decision H1), then deleted with the root devDependency jq (2026-10-02, decision D32), and `path-to-regexp ^6.3.0` resolves 6.3.0 on its own: the scoped `msw>path-to-regexp: 6.3.0` override existed only to undo a global 8.4.2 pin, and both left together (2026-10-03, decision D47)
