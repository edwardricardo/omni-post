packages:
  - apps/*
  - packages/*
  - packages/providers/*
  - packages/adapters/*
  - packages/core/*
  - packages/monitoring/*
  - packages/observability/*
  - infra/*

enableGlobalVirtualStore: false

# Build-script approval. pnpm 11 unified `onlyBuiltDependencies` +
# `ignoredBuiltDependencies` into `allowBuilds` (map of package -> boolean),
# migrated here from the package.json `pnpm` field (ADR-0019). true = run the
# install script, false = skip it.
allowBuilds:
  prisma: true
  "@prisma/engines": true
  esbuild: true
  # The following carry build scripts but were NOT in pnpm-10's exclusive
  # `onlyBuiltDependencies` allowlist, so their scripts did NOT run under pnpm 10
  # (they rely on prebuilt binaries). `false` preserves that exact behavior — pnpm 11's
  # allowBuilds is exhaustive, so every build-script package must be listed (ADR-0019).
  # Every entry names a package the lockfile resolves: one that leaves the tree leaves
  # this map with it, and one that returns needs a new explicit entry.
  "@parcel/watcher": false
  "@sentry/cli": false
  "@swc/core": false
  argon2: false
  bufferutil: false
  core-js-pure: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  utf-8-validate: false

# `pnpm add` writes an exact spec (no caret range), backing the ADR-0018
# "no ^ ~ * >=" rule at the tooling level before syncpack lints it. Moved out of
# .npmrc: pnpm 11 reads ONLY auth/registry keys from there, so the non-auth
# settings live here now (ADR-0019).
savePrefix: ""

# Install-time freshness gate (minutes). Held at 0 to preserve pnpm-10 behavior;
# pnpm 11 would otherwise default to 1440 (1 day). ADR-0018 already governs
# freshness at update time via `taze --maturity-period 7` — aligning this to the
# 7-day window (10080) is a deliberate follow-up (ADR-0019 §Revisit if).
minimumReleaseAge: 0

# Off-catalog `pnpm add` errors before reaching CI: a duplicate version becomes
# structurally un-representable.
catalogMode: strict

catalog:
  # ── React family (move atomically: react + react-dom + @types) ──
  react: 19.2.7 # taken 2026-06-20 (`08e662b6`), not moved since; 19.3.0 is newer and mature (registry, 2026-10-03); was 19.2.4
  react-dom: 19.2.7 # moves with react; 19.3.0 is newer and mature (registry, 2026-10-03); was 19.2.4
  "@types/react": 19.2.17 # moves with react; 19.3.0 is newer and mature (registry, 2026-10-03); was 19.2.14
  "@types/react-dom": 19.2.3 # moves with react, unchanged since 2026-06-20 (`7d9da4aa`); 19.3.0 is newer and mature (registry, 2026-10-03)

  # ── Tiptap + prosemirror family (atomic) ──
  # CVE floor raised 2026-09-09 to 3.30.5: GHSA-j95f-988m-3j2f (high) — quadratic
  # ReDoS in block and inline Markdown attribute parsing; vulnerable >=3.7.0 <3.30.5.
  # Supersedes the 2026-09-04 floor at 3.30.4 (GHSA-cp6q-959q-f8rh, moderate,
  # mergeAttributes() prototype pollution). Pinned to the MINIMAL patched 3.30.5 per
  # ADR-0018. The family moves ATOMICALLY — every member publishes 3.30.5 (verified
  # against the registry), and the apps/client single-manifest literals
  # (extension-color/-highlight/-link/-text-style/-typography) move in the same
  # commit, so no member can drag a pre-3.30.5 @tiptap/core back in transitively.
  "@tiptap/core": 3.30.5
  "@tiptap/react": 3.30.5
  "@tiptap/pm": 3.30.5
  "@tiptap/starter-kit": 3.30.5
  "@tiptap/extension-character-count": 3.30.5
  "@tiptap/extension-placeholder": 3.30.5

  # ── LangChain family (atomic) ──
  "@langchain/core": 1.2.0 # taken 2026-06-20 (`7d9da4aa`), not moved since; 1.2.14 is newer, 1.2.12 the newest mature (registry, 2026-10-03)
  "@langchain/langgraph": 1.4.4 # taken 2026-06-20 (`7d9da4aa`), not moved since; 1.4.19 is newer, 1.4.18 the newest mature (registry, 2026-10-03)

  # ── Google API clients ──
  google-auth-library: 11.1.0 # raised 2026-10-04 from 10.7.0 (MAJOR 10->11): published 2026-09-16T14:49Z and `latest` on 2026-10-04 (registry). 11.x is the line googleapis-common ^9 declares (`google-auth-library ^11.0.0`, 9.0.4 and 9.1.0 alike), so the googleapis-common and google-auth-library@10 compatibility pins left with this raise (SECURITY_CANON §"Compatibility pins"); engines.node >=22; was 10.7.0, before that 9.14.1 (MAJOR 9->10)
  # The per-API packages, NOT the `googleapis` monolith this replaced: that one
  # ships EVERY Google API and weighs 204MB, of which this repository uses two
  # surfaces. Measured in a `pnpm deploy --prod` of the API: 204MB of 998MB.
  # These two are NOT an atomic family — they version independently and share no
  # advisory, so each is pinned on its own evidence.
  "@googleapis/youtube": 39.0.1 # taken 2026-09-25 (`feb371ae`), a day after its publication, so the maturity watchlist reviews it; 40.0.0 is newer, published 2026-10-03 and still inside the 7-day buffer
  "@googleapis/youtubeanalytics": 11.0.1 # the newest release on 2026-10-03

  # ── Build/test toolchain ──
  cross-env: 10.0.0 # catalog since 2026-10-03 (decision D35): declared by apps/api and apps/workers, and ADR-0018 gives a direct dependency declared in two manifests a catalog entry, not two literals. NOT latest mature: 10.1.0 (2025-09-29) is, and the lag is held by the SECURITY_CANON row `vite` (the six build tools, one shared reason), so the move into the catalog keeps the installed version
  vitest: 4.1.11 # CVE floor raised 2026-09-09: GHSA-82fw-gwwq-j7x9 (moderate, @vitest/mocker redirect-mock path traversal), vulnerable >=2.1.0 <4.1.11. vitest 4.1.11 pins @vitest/mocker EXACTLY at 4.1.11, so the transitive needs no override of its own. Peer-locked to @vitest/* 4.1.11 (was 4.1.10)
  typescript: 6.0.3 # NOT latest stable (the previous comment said so and was false, corrected 2026-09-27): latest mature is 7.0.2. 6.0.3 is the v6 ceiling, HELD — @typescript-eslint 8.70.1 peers typescript ">=4.8.4 <6.1.0" (the range is unchanged from 8.70.0; only the version naming it moved, 2026-09-30). See SECURITY_CANON §"Build-tool version holds"
  tsx: 4.23.15 # latest MATURE and latest stable, re-measured 2026-10-02T07:22Z: published 2026-09-20T07:22:17Z, no later release. No hold row, because there is no lag. Declared via `catalog:` by root, apps/api, apps/workers and infra/prisma; also an optional peer (^4.8.1) of vite and postcss-load-config. Depends on esbuild ~0.28.0, which the blanket esbuild 0.28.1 override satisfies
  "@types/node": 24.13.6 # DELIBERATELY NOT latest stable, and not latest mature either: the runtime major is 24 (the Krypton LTS line — .nvmrc, setup-node and both Dockerfiles), and types ahead of the runtime describe APIs it does not have. 24.13.6 is the latest MATURE 24.x measured 2026-09-28T02:42:36Z (published 2026-09-19, 9.1 d; 24.19.0 is 2.2 d and immature). Was 25.9.3 — a major ABOVE the runtime on an odd, non-LTS line. The major is now gated by scripts/testing/engines-node-gate.mjs against engines.node; holds row in SECURITY_CANON
  jsdom: 30.1.1 # latest stable AND latest mature, re-measured 2026-10-02T20:22Z: published 2026-09-22T02:07Z. Taken under human gate H1 together with isomorphic-dompurify 4.4.0 (an apps/api literal, which requires jsdom ^30.0.0), so this pin reaches production through the HTML sanitizer. Declared via `catalog:` by apps/admin, apps/client, packages/query-client and packages/observability/browser-logger; also vitest's optional peer. Its `undici ^8.10.2` and `tough-cookie ^6.0.2` resolve naturally (8.11.2, 6.0.2) and its engines.node `^22.22.2 || ^24.15.0 || >=26.0.0` admits the repository's `>=24.15.0 <25`
  msw: 2.15.0 # latest MATURE, re-measured 2026-10-02T07:36Z: published 2026-07-08T01:43:07Z. NOT latest stable: 3.0.0 (2026-09-28T15:45Z) and 3.0.1 (2026-09-30T12:39Z) are younger than 7 days, and 2 -> 3 is a crossing, not a bump — ESM-only, Node >= 22, TypeScript >= 5.9, and outside the `msw ^2.4.9` peer of @vitest/mocker 4.1.11. No lag while 2.15.0 is the latest mature. 3.0.0 matures 2026-10-05T15:45Z and 3.0.1 on 2026-10-07T12:39Z; the holds gate targets the highest stable release published at least 7 days earlier, so 3.0.0's maturity is the instant msw becomes a lag, held from then by the `msw` row of SECURITY_CANON §"Build-tool version holds", and 3.0.1's maturity only moves that target from 3.0.0 to 3.0.1. Declared via `catalog:` by root, apps/api and apps/client (devDependency) and by packages/providers/shared (OPTIONAL peer). Its dependency ranges equal 2.14.6's key for key: `tough-cookie ^6.0.1` resolves naturally to 6.0.2 and no override touches it: the tough-cookie override was range-scoped to `<4.1.3` (2026-10-02, decision H1), then deleted with the root devDependency jq (2026-10-02, decision D32), and `path-to-regexp ^6.3.0` resolves 6.3.0 on its own: the scoped `msw>path-to-regexp: 6.3.0` override existed only to undo a global 8.4.2 pin, and both left together (2026-10-03, decision D47)
  next: 16.3.8 # CVE floor raised 2026-09-30 to the MINIMAL version that patches the WHOLE advisory set, which is NOT the one `pnpm audit` can see: the DB knows only GHSA-vcvr-r3jv-pc5j (CRITICAL, RCE in next/og ImageResponse, >=16.2.0 <16.3.6, first_patched 16.3.6), but the 16.3.8 release notes name SEVEN more — GHSA-cjq9-62q9-8jv4 (HIGH, SSRF in Image Optimization, REACHABLE: optimization is on by default) + 5 medium + 1 low, all published 2026-09-30T16:14Z as vercel/next.js repository advisories and not yet globalized to OSV. Pinning 16.3.6 would make the audit go GREEN over a version with a reachable HIGH still open — the exact webpack-dev-middleware defect of 2026-09-30, and what the canon's cross-derive-from-the-changelog rule exists to stop. Deviates from the 7-day maturity buffer (16.3.8 is 9.6 h old when committed — published 2026-09-30T16:07Z) DELIBERATELY and measured: both portal production builds and both portal suites are green on it. Was 16.3.3 (GHSA-p293-qw3h-jr36 + GHSA-2xp9-vwfh-vxw4, 2026-09-09); before that 16.2.11
  next-intl: 4.13.0 # taken 2026-06-20 (`4681bcb7`), not moved since; 4.14.9 is newer, 4.14.7 the newest mature (registry, 2026-10-03); was 4.9.2
  postcss: 8.5.24 # CVE floor >= 8.5.23 (GHSA-fxqj-rqcc-2cmp); taken 2026-08-05 (`daf74565`) as the newest release outside the 7-day buffer that day; 8.5.28 is newer and mature (registry, 2026-10-03); was 8.5.21
  zustand: 5.0.14 # taken 2026-06-20 (`80627448`), not moved since; 5.0.15 is newer and mature (registry, 2026-10-03); was 5.0.12
  "@tanstack/react-query": 5.101.0 # taken 2026-06-20 (`80627448`), not moved since; 5.104.1 is newer, 5.104.0 the newest mature (registry, 2026-10-03); was 5.95.0

  # ── Runtime-critical drifters (MAX of declared) ──
  "@prisma/client": 7.9.1 # taken 2026-08-17 (`9b872895`), not moved since; 7.10.0 is newer and mature (registry, 2026-10-03); was 7.8.0
  opossum: 9.0.0 # MAX of 8.0.0 / 9.0.0 (fitness #25)
  prom-client: 15.1.3 # MAX of 15.0.0 / 15.1.3

  # ── App/server runtime (DIRECT) ──
  # CVE floor 5.12.1 — closes GHSA-w2qp-rph6-63g4 (schema validation bypass) and
  # GHSA-3m5p-2c4r-xxw2 (X-Forwarded-* spoofing under hop-count trustProxy), both moderate.
  # The floor was HELD at 5.10.0 until 2026-09-04 because fastify's fix for the second
  # advisory REMOVES numeric hop-count trust in the RUNTIME, not only in the types:
  # lib/request.js getTrustProxyFn returns `() => false` for a number ("Hop-count-only trust
  # cannot validate the immediate peer"), so `request.ip` degraded to the socket peer for
  # every request. ADR-0021 unblocked it by migrating this repo to fastify's sanctioned
  # trusted-peer model: TRUSTED_PROXY_MODE selects socket-only or a TRUSTED_PROXY_RANGES
  # IP/CIDR allowlist that proxy-addr compiles and validates against the IMMEDIATE PEER.
  # Re-implementing `(addr, hop) => hop < N` as a TrustProxyFunction was rejected outright:
  # it would type-check, keep tests green, and restore the exact vulnerability the advisory
  # patched (Security canon: NO exception). See SECURITY_CANON.md §"Rate Limiting".
  fastify: 5.12.5 # CVE floor raised 2026-10-01: five advisories published 2026-09-30T23:44-23:53Z — GHSA-667r-xxjv-c9mm, GHSA-p68q-wchp-6fh7 (auth bypass via malformed URLs), GHSA-hwr6-493r-vm6h, GHSA-9q9j-q6p8-xq58 (all high, fixed 5.12.2) and GHSA-4mh8-r7rc-xpvc (moderate, fixed 5.12.5); OSV and the 5.12.2/5.12.5 release notes agree, so 5.12.5 is the minimal version closing the set and also the latest (14.8 d mature). Still paired with the find-my-way override: 5.12.5 declares find-my-way ^9.6.0, which still admits the vulnerable 9.6.0, so the override stays
  pino: 10.3.1
  zod: 4.4.3 # reconcile UP to apps' 4.4.3 (override 4.3.6 is stale)
  "@anthropic-ai/sdk": 0.104.1 # taken 2026-06-20 (`9ab44e82`), not moved since; 0.131.0 is newer, 0.128.0 the newest mature (registry, 2026-10-03); was 0.91.1
  cloudinary: 2.10.0 # taken 2026-06-20 (`9ab44e82`), not moved since; 2.11.0 is newer and mature (registry, 2026-10-03); was 2.7.0
  handlebars: 4.7.9 # override forces newer than manifest 4.7.8
  axios: 1.20.0 # CVE floor raised 2026-09-30: TWELVE advisories landed in 34 minutes (GHSA-542g-h47m-68v8, -3pq3-5fj3-cg6v, -x97p-jq2g-jp4f, -mghh-pgcx-3jjj, -c29m-xwm3-cm6r, -9fr6-4gfg-395g, -vh66-26gq-q6x8, -r4gj-5m52-g5wh, -44g4-m2mj-wpvx, -m8m8-qj5v-23w3, -4hqw-qxg8-jxx2, -j8rh-479h-cp32 — 7 high / 5 moderate), every one first_patched at 1.20.0, so 1.20.0 is the minimal patched version for the whole set even though it is also the latest. Was 1.18.0 (GHSA-42h9-826w-cgv3 + GHSA-xj6q-8x83-jv6g + GHSA-pmv8-rq9r-6j72; MAX over tiktok 1.7.7)
  form-data: 4.0.6 # CVE floor (MAX over tiktok 4.0.0)
  validator: 13.15.35 # the newest release on 2026-10-03, >= CVE floor; was 13.15.22
  uuid: 14.0.0 # CVE floor, dual-role: the `uuid: "catalog:"` override extends it to the five transitive consumers, four of which declare ^8 or ^9 — ranges that admit only versions inside GHSA-w5hq-g745-h8pq (moderate, vulnerable <11.1.1, no 8.x or 9.x fix). Measured 2026-10-03: removing the override resolves uuid 8.3.2 and 9.0.1 and turns `pnpm audit` red. See SECURITY_CANON §"CVE-floor pins", row `uuid`. NOT latest stable: 14.0.2 is (published 2026-08-18); OSV lists nothing for 14.0.0. Was 13.0.1 (MAJOR 13->14)
  ws: 8.21.1 # CVE floor

  # ── Shared direct deps (T1.11 completion — declared in ≥2 manifests; reconcile-UP, structure-only) ──
  "@sentry/node": 10.48.0
  "@sentry/nextjs": 10.48.0
  "@t3-oss/env-core": 0.13.11
  "@t3-oss/env-nextjs": 0.13.11
  argon2: 0.44.0
  bullmq: 5.58.9
  csv-parse: 7.0.2 # CVE floor raised 2026-09-09: GHSA-8cw4-87c7-c6xx (moderate, prototype replacement still reachable via the `columns` path), vulnerable <7.0.2 with no 6.x backport, so the minimal patched version is a MAJOR. REACHABLE here — parseSchedulingCsv parses uploaded CSV with `columns: true`; was 6.2.1
  dotenv: 17.2.2
  fastify-type-provider-zod: 6.1.0
  ioredis: 5.11.1
  date-fns: 4.1.0
  lucide-react: 1.7.0
  recharts: 3.8.1
  tw-animate-css: 1.4.0
  tailwindcss: 4.3.0
  "@tailwindcss/postcss": 4.3.0
  postcss-load-config: 6.0.1
  webpack: 5.106.2
  vite: 8.0.16 # single version — the former vite-7 hold was a workaround for apps/client missing @vitejs/plugin-react (apps/admin had it). Adding the plugin to client (ADR-0019) lets it parse JSX under vite 8's rolldown SSR transform, collapsing the vite 7/8 split. Verified: client 510/510 + admin 106/106 on vite 8.
  eslint: 9.39.5 # the v9 line's FINAL release and its ceiling. Still held below 10: eslint-plugin-react@7.37.5 peers eslint up to ^9.7, eslint-plugin-jsx-a11y@6.10.2 up to ^9, both already at their own latest. Measured 2026-09-27; see SECURITY_CANON §"Build-tool version holds"
  "@playwright/test": 1.63.0 # latest stable AND latest mature, re-measured 2026-10-02T09:27Z: published 2026-09-04T22:44Z; only 1.64.0 alphas are newer. Declared by apps/admin + apps/client; pins its own `playwright` at the identical exact version, which carries `playwright-core`. engines.node ">=20" (was ">=18"), below the repo floor ">=24.15.0 <25", so it raises nothing here
  "@axe-core/playwright": 4.13.0 # latest stable AND latest mature, re-measured 2026-10-02T09:27Z: published 2026-08-11T17:07Z; only 4.13.1 prerelease builds are newer. Declared by the root + apps/admin + apps/client; pins `axe-core ~4.13.0` and peers `playwright-core >= 1.0.0`, satisfied by the driver above. One `axe-core` tree-wide takes `pnpm dedupe`: a plain install leaves eslint-plugin-jsx-a11y and @storybook/addon-a11y on 4.12.1. Moves with it: the browser driver and its axe companion are one family
  "@formatjs/icu-messageformat-parser": 3.5.9
  # @testing-library family (atomic) — all four are latest stable AND latest mature, re-measured 2026-10-02T09:39Z. Declarers: apps/admin (all four), apps/client (dom + jest-dom + react), packages/query-client and packages/observability/browser-logger (react). They move as ONE set because the set is version-locked: `react` peers `@testing-library/dom ^10.0.0`, `user-event` peers it `>=7.21.4`, and `jest-dom` peers it `>=10 <11` — the tightest bound of the three — so a half-moved family is what the single-version gate exists to catch
  "@testing-library/dom": 10.4.2 # published 2026-09-13T18:08Z. engines.node ">=18", no peers; its dependency map is identical to 10.4.1's
  "@testing-library/jest-dom": 7.0.1 # published 2026-08-09T23:44Z. MAJOR 6->7 dropped Node <22 (repo floor is ">=24.15.0 <25"); 7.0.1 adds an OPTIONAL peer `vitest ">= 0.32"`, satisfied by the catalog's 4.1.11
  "@testing-library/react": 16.3.3 # published 2026-08-27T17:41Z. peers react/react-dom "^18 || ^19" (catalog 19.2.7) and @testing-library/dom "^10.0.0"; @types/react and @types/react-dom are optional peers
  "@testing-library/user-event": 14.6.7 # published 2026-09-02T01:56Z. No dependencies; peers @testing-library/dom ">=7.21.4"
  # Vitest JSX transform (apps/admin + apps/client) — required for vite 8 (ADR-0019).
  "@vitejs/plugin-react": 5.1.4
  # @vitest/* family (peer = vitest 4.1.11)
  "@vitest/coverage-v8": 4.1.11
  "@vitest/ui": 4.1.11
  # Storybook family (atomic). 10.6.0 since 2026-10-02 (slice 0.11): the latest MATURE release,
  # published 2026-09-02, 29.8 days old at 2026-10-02T10:04Z. `latest` is 10.6.1, published
  # 2026-09-29 and mature only from 2026-10-06T17:14Z-17:20Z, so it is a pre-registered scheduled
  # hold in SECURITY_CANON.md rather than this pin. @storybook/nextjs@10.6.0 peers next "^14.1.0 ||
  # ^15.0.0 || ^16.0.0" (repo 16.3.8), react/react-dom up to ^19 (19.2.7) and webpack ^5 (5.106.2);
  # storybook's own vite-plus and prettier peers are optional. Builds measured 2026-10-02:
  # @apps/client green at 10.6.0 (build and `storybook dev --smoke-test --ci`); @apps/admin red at
  # 10.6.0 with SB_BUILDER-WEBPACK5_0002, the signature it also produced at 10.4.6 in the A/B
  # control of 2026-09-29 (it has no stories and its config globs a missing directory), so that red
  # is not the version's.
  storybook: 10.6.0
  "@storybook/addon-a11y": 10.6.0
  "@storybook/addon-docs": 10.6.0
  "@storybook/nextjs": 10.6.0
  "@types/opossum": 8.1.9
  image-size: 2.0.4 # latest stable AND latest mature, measured 2026-10-03T08:14Z: published 2026-09-14T16:38Z; nothing newer. Also a CVE floor: GHSA-w3rx-r6r6-pgpr (ICNS) and GHSA-5p2g-fcmc-qvqq (JXL/HEIF), both high infinite-loop DoS, are vulnerable <=2.0.2 and fixed in 2.0.3 per OSV and GitHub; 2.0.4 adds one bound check on the ICO/CUR image count, and OSV lists nothing for either. Declared by packages/providers/bluesky alone, whose magic-byte gate stays as defense in depth. Was 2.0.2, which the two advisories were ignored on until 2026-10-03 (decision D37)

