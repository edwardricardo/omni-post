packages:
  - apps/*
  - packages/*
  - packages/providers/*
  - packages/adapters/*
  - packages/core/*
  - packages/monitoring/*
  - packages/observability/*
  - infra/*

enableGlobalVirtualStore: false

# Build-script approval. pnpm 11 unified `onlyBuiltDependencies` +
# `ignoredBuiltDependencies` into `allowBuilds` (map of package -> boolean),
# migrated here from the package.json `pnpm` field (ADR-0019). true = run the
# install script, false = skip it.
allowBuilds:
  prisma: true
  "@prisma/engines": true
  esbuild: true
  # The following carry build scripts but were NOT in pnpm-10's exclusive
  # `onlyBuiltDependencies` allowlist, so their scripts did NOT run under pnpm 10
  # (they rely on prebuilt binaries). `false` preserves that exact behavior — pnpm 11's
  # allowBuilds is exhaustive, so every build-script package must be listed (ADR-0019).
  # Every entry names a package the lockfile resolves: one that leaves the tree leaves
  # this map with it, and one that returns needs a new explicit entry.
  "@parcel/watcher": false
  "@sentry/cli": false
  "@swc/core": false
  argon2: false
  bufferutil: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  utf-8-validate: false

# `pnpm add` writes an exact spec (no caret range), backing the ADR-0018
# "no ^ ~ * >=" rule at the tooling level before syncpack lints it. Moved out of
# .npmrc: pnpm 11 reads ONLY auth/registry keys from there, so the non-auth
# settings live here now (ADR-0019).
savePrefix: ""

# Install-time freshness gate (minutes). Held at 0 to preserve pnpm-10 behavior;
# pnpm 11 would otherwise default to 1440 (1 day). ADR-0018 already governs
# freshness at update time via `taze --maturity-period 7` — aligning this to the
# 7-day window (10080) is a deliberate follow-up (ADR-0019 §Revisit if).
minimumReleaseAge: 0

# Off-catalog `pnpm add` errors before reaching CI: a duplicate version becomes
# structurally un-representable.
catalogMode: strict

catalog:
  # ── React family (move atomically: react + react-dom + @types) ──
  react: 19.2.7 # taken 2026-06-20 (`08e662b6`), not moved since; 19.3.0 is newer and mature (registry, 2026-10-03); was 19.2.4
  react-dom: 19.2.7 # moves with react; 19.3.0 is newer and mature (registry, 2026-10-03); was 19.2.4
  "@types/react": 19.2.17 # moves with react; 19.3.0 is newer and mature (registry, 2026-10-03); was 19.2.14
  "@types/react-dom": 19.2.3 # moves with react, unchanged since 2026-06-20 (`7d9da4aa`); 19.3.0 is newer and mature (registry, 2026-10-03)

  # ── Tiptap + prosemirror family (atomic) ──
  # CVE floor raised 2026-09-09 to 3.30.5: GHSA-j95f-988m-3j2f (high) — quadratic
  # ReDoS in block and inline Markdown attribute parsing; vulnerable >=3.7.0 <3.30.5.
  # Supersedes the 2026-09-04 floor at 3.30.4 (GHSA-cp6q-959q-f8rh, moderate,
  # mergeAttributes() prototype pollution). Pinned to the MINIMAL patched 3.30.5 per
  # ADR-0018. The family moves ATOMICALLY — every member publishes 3.30.5 (verified
  # against the registry), and the apps/client single-manifest literals
  # (extension-color/-highlight/-link/-text-style/-typography) move in the same
  # commit, so no member can drag a pre-3.30.5 @tiptap/core back in transitively.
  "@tiptap/core": 3.30.5
  "@tiptap/react": 3.30.5
  "@tiptap/pm": 3.30.5
  "@tiptap/starter-kit": 3.30.5
  "@tiptap/extension-character-count": 3.30.5
  "@tiptap/extension-placeholder": 3.30.5

  # ── LangChain family (atomic) ──
  "@langchain/core": 1.2.0 # taken 2026-06-20 (`7d9da4aa`), not moved since; 1.2.14 is newer, 1.2.12 the newest mature (registry, 2026-10-03)
  "@langchain/langgraph": 1.4.4 # taken 2026-06-20 (`7d9da4aa`), not moved since; 1.4.19 is newer, 1.4.18 the newest mature (registry, 2026-10-03)

  # ── Google API clients ──
  google-auth-library: 11.2.0 # raised 2026-10-04 from 10.7.0 (MAJOR 10->11): published 2026-09-16T14:49Z and `latest` on 2026-10-04 (registry). 11.x is the line googleapis-common ^9 declares (`google-auth-library ^11.0.0`, 9.0.4 and 9.1.0 alike), so the googleapis-common and google-auth-library@10 compatibility pins left with this raise (SECURITY_CANON §"Compatibility pins"); engines.node >=22; was 10.7.0, before that 9.14.1 (MAJOR 9->10)
  # The per-API packages, NOT the `googleapis` monolith this replaced: that one
  # ships EVERY Google API and weighs 204MB, of which this repository uses two
  # surfaces. Measured in a `pnpm deploy --prod` of the API: 204MB of 998MB.
  # These two are NOT an atomic family — they version independently and share no
  # advisory, so each is pinned on its own evidence.
  "@googleapis/youtube": 39.0.1 # taken 2026-09-25 (`feb371ae`), a day after its publication, so the maturity watchlist reviews it; its final review (2026-10-11) is flagged, not clean: 40.0.0, a breaking major published 2026-10-03T03:50Z and mature since 2026-10-10, is owed in its own PR with the provider's typecheck, build and tests
  "@googleapis/youtubeanalytics": 11.0.1 # the newest release on 2026-10-03

