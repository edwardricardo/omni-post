  cross-env: 10.1.0 # latest stable AND latest mature, measured 2026-10-04T04:45Z: published 2025-09-29T17:34Z, nothing newer; OSV lists nothing. Catalog since 2026-10-03 (decision D35): declared by apps/api and apps/workers, and ADR-0018 gives a direct dependency declared in two manifests a catalog entry, not two literals. 10.1.0 adds only the `${VAR:-default}` expansion, which no script here uses. Was 10.0.0
  vitest: 4.1.11 # CVE floor raised 2026-09-09: GHSA-82fw-gwwq-j7x9 (moderate, @vitest/mocker redirect-mock path traversal), vulnerable >=2.1.0 <4.1.11. vitest 4.1.11 pins @vitest/mocker EXACTLY at 4.1.11, so the transitive needs no override of its own. Peer-locked to @vitest/* 4.1.11 (was 4.1.10)
  typescript: 6.0.3 # NOT latest stable (the previous comment said so and was false, corrected 2026-09-27): latest mature is 7.0.2. 6.0.3 is the v6 ceiling, HELD — @typescript-eslint 8.71.1 peers typescript ">=4.8.4 <6.1.0" (re-measured 2026-10-11 on 8.71.1: the range is unchanged from 8.70.0 through 8.71.0, and the 8.71.2 alphas carry it too). See SECURITY_CANON §"Build-tool version holds"
  tsx: 4.23.15 # latest MATURE and latest stable, re-measured 2026-10-02T07:22Z: published 2026-09-20T07:22:17Z, no later release. No hold row, because there is no lag. Declared via `catalog:` by root, apps/api, apps/workers and infra/prisma; also an optional peer (^4.8.1) of vite and postcss-load-config. Depends on esbuild ~0.28.0, which resolves 0.28.2 unaided: the blanket esbuild override left on 2026-10-15 (SECURITY_CANON.md §"CVE-floor pins", row `esbuild`)
  "@types/node": 26.6.5 # The runtime major's line: the runtime is Node 26 (.nvmrc, engines.node ">=26.11.1 <27" in every manifest, setup-node and the four Dockerfiles) since 2026-10-15, ahead of its 2026-10-28 LTS date (ADR-0038), and types ahead of the runtime describe APIs it does not have, so the pin follows the runtime major and never a higher one. 26.6.5 is latest, published 2026-10-09T18:46:47Z and taken inside the 7-day buffer under the owner's 72-hour rule (it matures 2026-10-16T18:46Z; its watchlist entry, with its two reviews on 2026-10-16 and 2026-10-23, is added by the follow-up commit once this change has its sha and PR number, as every entry of that file); 26.6.4 (2026-10-01) is the latest mature 26.x. Every consumer's range admits it, so the tree keeps one copy: 18 transitive dependents declare `*`, protobufjs `>=13.7.0` and jsdoc-type-pratt-parser `^26.4.0`, and the optional peers of vite, vitest, sharp, stripe, mysql2 and @inquirer/* are open ranges. Was 24.13.6 (the 24 line, 2026-09-28), and before that 25.9.3, a major above the runtime. The major is gated by scripts/testing/engines-node-gate.mjs against .nvmrc and engines.node; holds row in SECURITY_CANON
  jsdom: 30.1.2 # latest stable AND latest mature, measured 2026-10-11T09:39Z: published 2026-10-04T09:15:00Z, mature since 2026-10-11T09:15Z, nothing newer; OSV lists nothing. Hold bump from 30.1.1, which slice 0.12 took on 2026-10-02 under human gate H1 together with isomorphic-dompurify 4.4.0 (an apps/api literal, 4.5.0 since 2026-10-13, which requires jsdom ^30.1.2), so this pin reaches production through the HTML sanitizer. Declared via `catalog:` by apps/admin, apps/client, packages/query-client and packages/observability/browser-logger; also vitest's optional peer. Its `undici ^8.11.2` and `tough-cookie ^6.0.2` resolve naturally (8.11.2, 6.0.2), its `@asamuzakjp/css-color ^7.1.3` resolves 7.1.3, the newest release of that range outside the 7-day buffer, and its engines.node `^22.22.2 || ^24.15.0 || >=26.0.0` admits the repository's `>=26.11.1 <27`
  msw: 2.15.0 # latest MATURE, re-measured 2026-10-02T07:36Z: published 2026-07-08T01:43:07Z. NOT latest stable: 3.0.0 (2026-09-28T15:45Z) and 3.0.1 (2026-09-30T12:39Z) are younger than 7 days, and 2 -> 3 is a crossing, not a bump — ESM-only, Node >= 22, TypeScript >= 5.9, and outside the `msw ^2.4.9` peer of @vitest/mocker 4.1.11. No lag while 2.15.0 is the latest mature. 3.0.0 matures 2026-10-05T15:45Z and 3.0.1 on 2026-10-07T12:39Z; the holds gate targets the highest stable release published at least 7 days earlier, so 3.0.0's maturity is the instant msw becomes a lag, held from then by the `msw` row of SECURITY_CANON §"Build-tool version holds", and 3.0.1's maturity only moves that target from 3.0.0 to 3.0.1. Declared via `catalog:` by root, apps/api and apps/client (devDependency) and by packages/providers/shared (OPTIONAL peer). Its dependency ranges equal 2.14.6's key for key: `tough-cookie ^6.0.1` resolves naturally to 6.0.2 and no override touches it: the tough-cookie override was range-scoped to `<4.1.3` (2026-10-02, decision H1), then deleted with the root devDependency jq (2026-10-02, decision D32), and `path-to-regexp ^6.3.0` resolves 6.3.0 on its own: the scoped `msw>path-to-regexp: 6.3.0` override existed only to undo a global 8.4.2 pin, and both left together (2026-10-03, decision D47)
  next: 16.4.1 # CVE floor raised 2026-10-14 to the MINIMAL version patching three vercel/next.js repository advisories published 2026-10-14T17:46Z-17:47Z, which cover 16.3.8 and are fixed on the 16.x line only in 16.4.1: GHSA-673q-mjm6-r5xr (CRITICAL, RCE in a 'use cache' function returning multiple typed arrays; not reachable, no 'use cache' or cacheComponents here), GHSA-2464-fhr4-w9xw (CRITICAL, CVE-2026-96889, the librsvg use-after-free through the Image Optimization API on glibc Linux; mitigated by the lockfile's sharp 0.35.5, its own workaround, and 16.4.1 raises its optional sharp range to ^0.35.5) and GHSA-p3m5-59mp-jv5r (HIGH, CPU denial of service in an App Router app with a Server Action; REACHABLE through both portals' app/actions/auth.ts). OSV, GitHub's global endpoint and `pnpm audit` do not see them yet (404 at 2026-10-14T19:51Z), the 2026-09-30 shape. 16.4.1 is also latest. Deviates from the 7-day maturity buffer DELIBERATELY (published 2026-10-14T17:43:55Z, matures 2026-10-21T17:43Z) and measured: both portals' production builds, the admin (129) and client (556) suites and the Sentry init probe of each standalone build are green on it. Was 16.3.8 (2026-09-30, eight advisories); the dated history is SECURITY_CANON.md §Floor history, `next`
