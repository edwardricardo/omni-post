catalogs:
  # OTel set: a named catalog documents the independent release train (the 0.NNN
  # instrumentation line vs the 2.x core/SDK line) and that they bump together.
  # Every value was taken on 2026-06-20 (`7d9da4aa`, then `725c8363`) and the set
  # moves atomically. It is not the newest: on 2026-10-03 the registry carries a
  # newer release for 10 of the 12 members, named per line. Two members left on
  # 2026-10-16, `@opentelemetry/instrumentation` and `@opentelemetry/propagation-utils`,
  # with their one declaration, which nothing imported. `@opentelemetry/instrumentation-fastify`
  # left on 2026-10-23, deprecated upstream for `@fastify/otel`, which the Fastify authors
  # release on their own train and its one manifest declares as a literal. Four left on
  # 2026-10-26 with their one declaration: `@opentelemetry/instrumentation-http`, a second
  # instance of the auto-instrumentations map's own, whose two hooks moved into the map's
  # configuration; `@opentelemetry/instrumentation-fs`, a second instance of the map's own fs
  # entry; `@opentelemetry/instrumentation-redis`, which instruments the node-redis package
  # nothing loads; and `@opentelemetry/semantic-conventions`, whose two constants became the
  # literal keys `service.name` and `service.version`. All four stay in the tree as transitive
  # dependencies.
  # No member has been extended to transitive copies by an override since 2026-10-22, when the
  # `core` CVE-floor override left (the overrides header below).
  otel:
    "@opentelemetry/api": 1.9.1 # the newest release on 2026-10-03
    "@opentelemetry/auto-instrumentations-node": 0.77.0 # 0.80.0 is newer and mature; was 0.75.0
    "@opentelemetry/core": 2.8.0 # the CVE floor of GHSA-8988-4f7v-96qf (SECURITY_CANON row `@opentelemetry/core`); 2.11.0 is newer and mature
    "@opentelemetry/exporter-prometheus": 0.219.0 # 0.222.0 is newer and mature; was 0.217.0
    "@opentelemetry/sdk-node": 0.219.0 # 0.222.0 is newer and mature; was 0.217.0
    "@opentelemetry/exporter-trace-otlp-http": 0.219.0 # 0.222.0 is newer and mature; was 0.214.0
    "@opentelemetry/resources": 2.8.0 # 2.11.0 is newer and mature; was 2.6.1

# Dependency resolution overrides. Migrated verbatim from the package.json `pnpm`
# field (ADR-0019). `catalog:` / `catalog:otel` values resolve against the catalogs
# above (dual-role direct deps, ADR-0018); the literal versions are CVE-floor pins
# (SECURITY_CANON.md §"CVE-floor pins"). Every key but `validator` moves a resolution
# today: removing it alone changes a lockfile snapshot. The override audit of 2026-10-15
# removed the 15 that changed none (SECURITY_CANON.md §"Override audit"); `validator`
# pins nothing too and leaves with DC-3 and DC-4, which own it (MASTER_PLAN_ES.md).
# `form-data` and `postcss` left the same day by the owner's decision: each forced one
# version on a consumer whose own range resolves a patched one (form-data 2.5.6 under
# @types/request, postcss 8.5.23 under next), so neither held a floor. `@opentelemetry/core`
# left on 2026-10-22 with @sentry/node 10.48.0, whose instrumentation-http 0.214.0 was its one
# consumer below the 2.8.0 floor (SECURITY_CANON.md, row `@opentelemetry/core`).
overrides:
  validator: "catalog:"
  uuid: "catalog:"
  # Dual-role CVE floor (the `uuid` shape) added 2026-10-23 for GHSA-mrhx-c7xc-m3w5: the catalog value
  # reaches every transitive zod copy, so @atproto/lexicon and @atproto/common-web (`^3.23.8`, the
  # unfixable 3.x line) resolve the patched 4.6.7 instead of 3.25.76. Measured with the bluesky
  # provider suites on the forced major; remove-when in SECURITY_CANON §CVE-floor pins, row `zod`.
  zod: "catalog:"
  # CVE floor added 2026-10-06 for GHSA-qqmp-wf37-98f9 (moderate, CWE-532): these eight
  # instrumentations set the database username as an unconditional `db.user` span attribute. OSV,
  # GitHub's first_patched_version and the upstream repository advisory agree on every target, all
  # published 2026-07-23 with open-telemetry/opentelemetry-js-contrib#3585; each band is the minimal
  # patched version. Their one consumer, @opentelemetry/auto-instrumentations-node 0.77.0, declares
  # 0.x caret ranges two minors short of all eight. The bands cover the OpenTelemetry SDK the API
  # starts under TRACING_ENABLED, never Sentry: from 10.54.0 Sentry vendors its own copies, which
  # still set db.user (read in 10.76.2), and the API's beforeSendSpan strips the attribute from
  # Sentry's spans. Until 2026-10-22 @sentry/node 10.48.0 pinned six of the eight EXACTLY and these
  # bands held them too. The patched releases emit only stable semantic conventions
  # (`db.query.text`, not `db.statement`); pg 0.73.0 and mongoose 0.67.0 run on @opentelemetry/core
  # 2.12.0, inside their ^2.9.0. Measured with pg loaded through @prisma/adapter-pg: db.user on
  # 4 of 4 Sentry spans and 4 of 6 SDK spans before, on none after. See SECURITY_CANON
  # §"CVE-floor pins", row `@opentelemetry/instrumentation-*`.
  "@opentelemetry/instrumentation-cassandra-driver@<0.66.0": 0.66.0
  "@opentelemetry/instrumentation-knex@<0.65.0": 0.65.0
  "@opentelemetry/instrumentation-mongoose@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-mysql@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-mysql2@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-oracledb@<0.46.0": 0.46.0
  "@opentelemetry/instrumentation-pg@<0.73.0": 0.73.0
  "@opentelemetry/instrumentation-tedious@<0.40.0": 0.40.0
  "@opentelemetry/propagator-jaeger@<2.9.0": 2.9.0
  js-yaml: 4.3.2

