# gitleaks: secret scanning at pre-commit + CI.
#
# Inherits the default ruleset (150+ patterns) and adds project-specific
# allowlists for known-safe strings (test fixtures, doc examples).

[extend]
useDefault = true

[[allowlists]]
description = "Project-wide ignore list (binary assets + generated output + lock files + reports + gitignored env files)"

paths = [
  '''(.*?)(jpg|jpeg|png|gif|webp|ico|svg|woff2?|ttf|eot|mp4|webm|pdf)$''',
  '''node_modules/''',
  '''dist/''',
  '''\.next/''',
  '''\.stryker-tmp/''',
  '''reports/''',
  '''coverage/''',
  '''pnpm-lock\.yaml''',
  # Prisma generated client (no secrets, large file)
  '''infra/prisma/generated/''',
  # Local-dev env files: gitignored, never reach a commit, but `gitleaks
  # --no-git` reads them from disk. The canon path is `apps/api/src/config/env.ts`
  # (Zod-validated typed env constant) — these files hold dev-only values.
  '''^\.env$''',
  '''^\.env\.test$''',
  # Hook + session logs: gitignored, written by Claude Code hooks at runtime.
  # `gitleaks --no-git` would otherwise flag rule-pattern matches that show
  # up in the log text (e.g. an example payload echoed back). Never commit.
  '''\.claude/.*\.log$''',
]

regexes = [
  # Test/example values used in fixtures and docs
  '''password123''',  # Documented in T2-F + PR-23 backlog as test-only
  '''sk_test_''',
  '''pk_test_''',
  '''rk_test_''',
  '''whsec_test_''',
  # Storybook ENV defaults shipped with @fastify/cors examples
  '''Bearer test-token''',
  # JWT signing secret placeholder used in CLAUDE.md examples
  '''dev-jwt-secret-not-for-production''',
]

stopwords = [
  "EXAMPLE",
  "PLACEHOLDER",
  "DUMMY",
  "FAKE",
]

# ─── Path-scoped allowlists (audited 2026-05-20) ─────────────────────────
#
# Every entry below carves out a known-safe finding from the default
# ruleset. Each entry justifies itself in `description` so a future reader
# can audit the carve-out. Anything not listed here is a real leak — the
# canon expects it to be sanitised at source, not silenced.

[[allowlists]]
description = """
GA4TrackingAdapter reads `env.GA4_API_SECRET` from the typed Zod env
constant (`apps/api/src/config/env.ts`). The variable name `apiSecret`
triggers the generic-api-key rule by pattern, but the value is
constructor-injected from the validated env constant per CWE-798 canon —
no literal secret lives in this file.
"""
paths = ['''apps/api/src/infrastructure/adapters/GA4TrackingAdapter\.ts''']
regexes = ['''const apiSecret = env\.GA4_API_SECRET;''']

[[allowlists]]
description = """
LinkedIn adapter declares two stateless metadata constants (rate-limit
hints and provider metadata). The default ruleset matches them as
`linkedin-client-id` / `linkedin-client-secret` by the symbol name
pattern, but neither line stores credentials — `LINKEDIN_LIMITS` is a
`ProviderLimits` object and `LINKEDIN_METADATA` is a `ProviderMetadata`
object. Real credentials are injected per-call by the application's
CredentialResolver.
"""
paths = ['''packages/providers/linkedin/src/LinkedInAdapter\.ts''']
regexes = [
  '''const LINKEDIN_LIMITS: ProviderLimits =''',
  '''const LINKEDIN_METADATA: ProviderMetadata =''',
]

[[allowlists]]
description = """
`<aes-256-key>` / `<aes-256-key-for-encryption>` are explicit
angle-bracket placeholders in security docs. The default generic-api-key
rule matches the `KEY=<...>` shape regardless of whether the value is
obviously a placeholder. Sanitising further would lose the canonical
"fill in your own AES-256 key" instruction.
"""
paths = [
  '''docs/architecture/SECURITY\.md''',
  '''docs/security/OVERVIEW\.md''',
]
regexes = ['''<aes-256-key''']

[[allowlists]]
description = """
The TESTING.md command line `pnpm --filter @apps/api
test:phase4c-integration` matches the default generic-api-key rule by the
colon + entropy in the package-script name. The matched substring is a
pnpm script identifier (defined in `apps/api/package.json`), not a
credential.
"""
paths = ['''docs/architecture/TESTING\.md''']
regexes = ['''test:phase4c-integration''']

[[allowlists]]
description = """
The dx-documentation-manager agent prompt embeds illustrative curl
snippets — one literal and one inside a template literal that the agent
uses to generate code samples — both with `YOUR_API_KEY` as the universal
placeholder convention. No real tokens.
"""
paths = ['''\.claude/agents/dx-documentation-manager\.md''']
regexes = ['''Bearer YOUR_API_KEY''']

[[allowlists]]
description = """
The application migration roadmap prose names the use-case class
`GenerateIntegrationApiKey` (file `apps/api/src/application/integrations/
GenerateIntegrationApiKeyUseCase.ts`). The default generic-api-key rule
flags the `...IntegrationApiKey` substring by shape/entropy. It is a class
identifier in documentation, not a credential.
"""
paths = ['''docs/architecture/APPLICATION_MIGRATION_ROADMAP_ES\.md''']
regexes = ['''GenerateIntegrationApiKey''']

