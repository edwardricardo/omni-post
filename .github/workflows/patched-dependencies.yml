name: Patched Dependencies

# Watches every patched dependency until it is resolved (the owner's rule of 2026-10-15). Every six
# hours it reads the registry for each record of scripts/testing/patched-dependencies.json and, when
# a stable release inside the record's resolvedBy range is published, opens one issue for that patch
# (label patched-dependency), comments on it once a day while it stays open, reopens it when it is
# closed while the patch still stands, and fails the run, so the signal never waits for a calendar.
# The consistency half of the same gate is fitness #48 (fitness.yml, Dependency Consistency job) and
# the battery step patched-deps; this half stays out of pull-request CI, so an upstream release never
# blocks unrelated work. Pinned by apps/api/tests/unit/scripts/patchedDependenciesGate.test.ts.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: patched-dependencies
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  resolution:
    name: Is any patched dependency resolvable?
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js, pnpm and the workspace
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Read the registry and remind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --resolution asks the registry whether a stable release inside each record's resolvedBy
          # range exists, and exits 1 when one does; --remind then opens the issue for each resolvable
          # patch, comments on it once a day and reopens it if closed, and makes no API call otherwise.
          if ! node scripts/testing/patched-dependencies-gate.mjs --resolution --remind; then
            echo "::error title=Patched dependency resolvable::A release that resolves a patched dependency is published, a record or a registry document could not be read, or a GitHub call failed. The patched-dependencies-gate lines above name each one; the issue labelled patched-dependency carries the record's remove-when. Take the move it names, in one change that deletes the patch file, its patchedDependencies entry and its record."
            exit 1
          fi
