# Automated Dependency Updates & Security Monitoring
# Automated updates with testing and security validation
# superseded-by-renovate (dep-baseline Step 5) — the update mechanism is replaced by
# .github/renovate.json (rangeStrategy: pin, catalog-aware, family-grouped). The pnpm
# audit analysis job below is retained as a daily security report.
name: Dependency Updates

on:
  schedule:
    # Check for updates daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      update_type:
        description: "Type of updates to apply"
        required: true
        default: "security"
        type: choice
        options:
          - security
          - minor
          - major
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ===== DEPENDENCY ANALYSIS =====
  analyze-dependencies:
    name: Analyze Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-security-updates: ${{ steps.analysis.outputs.has-security }}
      has-minor-updates: ${{ steps.analysis.outputs.has-minor }}
      has-major-updates: ${{ steps.analysis.outputs.has-major }}
      update-summary: ${{ steps.analysis.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for security vulnerabilities
        id: security-check
        run: |
          echo "🔍 Checking for security vulnerabilities..."

          # pnpm audit exits 1 when vulnerabilities are found — we want the report
          # to be generated either way, but only swallow that specific exit code.
          # Any other failure (network, malformed output) should still fail the job.
          set +e
          pnpm audit --json > audit-results.json
          AUDIT_EXIT=$?
          set -e
          if [ "$AUDIT_EXIT" -ne 0 ] && [ "$AUDIT_EXIT" -ne 1 ]; then
            echo "::error::pnpm audit failed with exit code $AUDIT_EXIT"
            exit "$AUDIT_EXIT"
          fi

          # Check if there are vulnerabilities
          VULN_COUNT=$(cat audit-results.json | jq '.metadata.vulnerabilities.total // 0')

          echo "vulnerabilities=${VULN_COUNT}" >> $GITHUB_OUTPUT

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "🚨 Found ${VULN_COUNT} security vulnerabilities"
            cat audit-results.json | jq '.advisories'
          else
            echo "✅ No security vulnerabilities found"
          fi

      - name: Check for outdated packages
        id: outdated-check
        run: |
          echo "📦 Checking for outdated packages..."

          # pnpm outdated exits 1 when outdated deps exist — we want the report
          # regardless. Only swallow exit code 1; other failures bubble up.
          set +e
          pnpm outdated --json > outdated.json
          OUTDATED_EXIT=$?
          set -e
          if [ "$OUTDATED_EXIT" -ne 0 ] && [ "$OUTDATED_EXIT" -ne 1 ]; then
            echo "::error::pnpm outdated failed with exit code $OUTDATED_EXIT"
            exit "$OUTDATED_EXIT"
          fi

          # Count updates by type
          SECURITY_COUNT=$(cat outdated.json | jq '[.[] | select(.severity == "high" or .severity == "critical")] | length')
          MINOR_COUNT=$(cat outdated.json | jq '[.[] | select(.updateType == "minor")] | length')
          MAJOR_COUNT=$(cat outdated.json | jq '[.[] | select(.updateType == "major")] | length')

          echo "security-count=${SECURITY_COUNT}" >> $GITHUB_OUTPUT
          echo "minor-count=${MINOR_COUNT}" >> $GITHUB_OUTPUT
          echo "major-count=${MAJOR_COUNT}" >> $GITHUB_OUTPUT

      - name: Analyze update recommendations
        id: analysis
        run: |
          SECURITY_VULNS="${{ steps.security-check.outputs.vulnerabilities }}"
          SECURITY_UPDATES="${{ steps.outdated-check.outputs.security-count }}"
          MINOR_UPDATES="${{ steps.outdated-check.outputs.minor-count }}"
          MAJOR_UPDATES="${{ steps.outdated-check.outputs.major-count }}"

          # Determine what updates are available
          HAS_SECURITY="false"
          HAS_MINOR="false"
          HAS_MAJOR="false"

          if [ "$SECURITY_VULNS" -gt 0 ] || [ "$SECURITY_UPDATES" -gt 0 ]; then
            HAS_SECURITY="true"
          fi

          if [ "$MINOR_UPDATES" -gt 0 ]; then
            HAS_MINOR="true"
          fi

          if [ "$MAJOR_UPDATES" -gt 0 ]; then
            HAS_MAJOR="true"
          fi

          # Generate summary
          SUMMARY="Security: ${SECURITY_VULNS} vulnerabilities, ${SECURITY_UPDATES} updates available"
          SUMMARY="${SUMMARY}\nMinor: ${MINOR_UPDATES} updates available"
          SUMMARY="${SUMMARY}\nMajor: ${MAJOR_UPDATES} updates available"

          echo "has-security=${HAS_SECURITY}" >> $GITHUB_OUTPUT
          echo "has-minor=${HAS_MINOR}" >> $GITHUB_OUTPUT
          echo "has-major=${HAS_MAJOR}" >> $GITHUB_OUTPUT
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo -e "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dependency-analysis
          path: |
            audit-results.json
            outdated.json
          retention-days: 7

  # ===== SECURITY UPDATES =====
  security-updates:
    name: Apply Security Updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze-dependencies
    if: needs.analyze-dependencies.outputs.has-security-updates == 'true' || github.event.inputs.update_type == 'security' || github.event.inputs.update_type == 'all'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply security updates
        run: |
          echo "🔒 Applying security updates..."

          # Fix security vulnerabilities
          pnpm audit fix

          # Update lockfile
          pnpm install

      - name: Verify security fixes
        run: |
          echo "🔍 Verifying security fixes..."

          # Check if vulnerabilities are resolved
          pnpm audit --audit-level moderate

      - name: Run tests after security updates
        run: |
          echo "🧪 Running tests after security updates..."
          pnpm run build
          pnpm run lint
          pnpm run test

      - name: Create security update PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
          commit-message: "security: update dependencies to fix vulnerabilities"
          title: "🔒 Security Updates - Fix Vulnerabilities"
          body: |
            ## 🔒 Security Dependency Updates

            This PR applies security updates to fix known vulnerabilities.

            ### 🛡️ Security Fixes
            ${{ needs.analyze-dependencies.outputs.update-summary }}

            ### ✅ Validation
            - [x] Security vulnerabilities resolved
            - [x] All tests passing
            - [x] Build successful
            - [x] Linting passed

            ### 🤖 Automated Changes
            This PR was automatically generated by the dependency update workflow.

            **Priority**: 🔴 Critical - Security fixes should be reviewed and merged promptly.
          branch: security/dependency-updates-${{ github.run_id }}
          labels: |
            security
            dependencies
            automated
          reviewers: |
            ${{ github.repository_owner }}
          assignees: |
            ${{ github.repository_owner }}

  # ===== MINOR UPDATES =====
  minor-updates:
    name: Apply Minor Updates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: analyze-dependencies
    if: needs.analyze-dependencies.outputs.has-minor-updates == 'true' && (github.event.inputs.update_type == 'minor' || github.event.inputs.update_type == 'all')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Update minor versions
        run: |
          echo "📦 Updating minor versions..."

          # Update minor versions only
          pnpm update --latest --filter "^@types/*" --filter "^eslint*" --filter "prettier"
          pnpm update --latest --depth 1

          # Update lockfile
          pnpm install

      - name: Run comprehensive tests
        run: |
          echo "🧪 Running comprehensive test suite..."

          # Type checking
          pnpm run build --dry-run || pnpm exec tsc --noEmit

          # Linting
          pnpm run lint

          # Unit tests
          pnpm run test

          # Build verification
          pnpm run build

      - name: Performance regression check
        run: |
          echo "⚡ Checking for performance regressions..."

          # Basic bundle size check
          BUNDLE_SIZE_BEFORE=$(du -s node_modules | cut -f1)
          echo "Bundle size: ${BUNDLE_SIZE_BEFORE} KB"

          # This could be expanded with more sophisticated performance testing

      - name: Create minor update PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
          commit-message: "deps: update minor versions"
          title: "📦 Minor Dependency Updates"
          body: |
            ## 📦 Minor Dependency Updates

            This PR updates dependencies to their latest minor versions.

            ### 🔄 Updates Applied
            - Minor version updates for all compatible packages
            - Development dependencies updated
            - Lockfile regenerated

            ### ✅ Validation
            - [x] All tests passing
            - [x] Build successful
            - [x] Type checking passed
            - [x] Linting passed
            - [x] No performance regressions detected

            ### 🔍 Review Notes
            - All updates are backward compatible (minor versions)
            - No breaking changes expected
            - Automated testing has validated functionality

            ### 🤖 Automated Changes
            This PR was automatically generated by the dependency update workflow.
          branch: deps/minor-updates-${{ github.run_id }}
          labels: |
            dependencies
            automated
            minor-update
          reviewers: |
            ${{ github.repository_owner }}

  # ===== MAJOR UPDATES =====
  major-updates:
    name: Prepare Major Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze-dependencies
    if: needs.analyze-dependencies.outputs.has-major-updates == 'true' && (github.event.inputs.update_type == 'major' || github.event.inputs.update_type == 'all')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Analyze major updates
        run: |
          echo "📈 Analyzing major updates..."

          pnpm outdated --json > major-updates.json

          # Extract major updates
          cat major-updates.json | jq '[.[] | select(.updateType == "major")] | sort_by(.package)' > major-updates-filtered.json

          echo "## 📈 Major Updates Available" >> major-updates-report.md
          echo "" >> major-updates-report.md

          cat major-updates-filtered.json | jq -r '.[] | "- **\(.package)**: \(.current) → \(.latest) (Major update - review required)"' >> major-updates-report.md

      - name: Create major update issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('major-updates-report.md', 'utf8');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📈 Major Dependency Updates Available',
              body: `${report}

            ## 🔍 Manual Review Required

            Major version updates may contain breaking changes and require manual review:

            ### 📋 Review Checklist
            - [ ] Review changelogs for breaking changes
            - [ ] Update code for API changes
            - [ ] Update tests if needed
            - [ ] Verify compatibility with other dependencies
            - [ ] Test thoroughly in staging environment

            ### 🚀 Next Steps
            1. Create feature branch for major updates
            2. Apply updates one by one
            3. Test each update individually
            4. Create PR with comprehensive testing

            ---
            *This issue was automatically created by the dependency update workflow.*`,
              labels: ['dependencies', 'major-update', 'needs-review', 'enhancement']
            });

            console.log('Created issue:', issue.data.html_url);

      - name: Upload major updates analysis
        uses: actions/upload-artifact@v7
        with:
          name: major-updates-analysis
          path: |
            major-updates.json
            major-updates-filtered.json
            major-updates-report.md
          retention-days: 30

  # ===== NOTIFICATION & REPORTING =====
  dependency-report:
    name: Dependency Update Report
    runs-on: ubuntu-latest
    needs: [analyze-dependencies, security-updates, minor-updates, major-updates]
    if: always()

    steps:
      - name: Generate dependency report
        run: |
          echo "# 📊 Dependency Update Report" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔍 Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.analyze-dependencies.outputs.update-summary }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔄 Actions Taken" >> $GITHUB_STEP_SUMMARY
          echo "- Security Updates: ${{ needs.security-updates.result || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Minor Updates: ${{ needs.minor-updates.result || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Major Updates: ${{ needs.major-updates.result || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify team about dependency updates
        if: needs.analyze-dependencies.outputs.has-security-updates == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "channel": "#security",
              "attachments": [
                {
                  "color": "warning",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🔒 Security Updates Available"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "Automated security updates have been applied to dependencies."
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${{ needs.security-updates.result }}"
                        }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Workflow"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
