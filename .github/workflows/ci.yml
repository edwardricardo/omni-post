name: CI

on:
  push:
    # PR branches (workstream/**, refactor/**) validate via the pull_request
    # trigger below; keeping them here too fired a redundant second run per push.
    branches: [main, omni-post-cc]
  pull_request:
    branches: [main, omni-post-cc]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    # 15m: a fully cold run (no restored turbo cache) measured 6m56s, so the
    # previous 10m budget left too little headroom for a cache-miss run.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Restore Turborepo cache (read-only)
        # Restore-only on purpose: this job's typecheck executes build tasks,
        # but only the gated Build Check job may PERSIST cache entries — its
        # no-output gate vets every entry that reaches the cache (see the key
        # rationale below).
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          # Canonical restore-key rationale — the other turbo cache steps in
          # this file point here; full evidence in
          # docs/reports/CI_CACHE_INTEGRITY_AUDIT.md (AC-1):
          # - The bare os-turbo- catch-all restore-key is intentionally absent:
          #   it matched a .turbo cache from ANY commit, branch, or lockfile,
          #   and served a months-stale dist that produced the TS2724 false red
          #   on PR #189.
          # - Honest residual limitation: the key below still matches any commit
          #   sharing the same pnpm-lock.yaml + turbo.json hash, so removing the
          #   catch-all closes only the lockfile-or-turbo.json-change subset of
          #   stale-cache transport.
          # - Entries also flow BETWEEN jobs of the same run under this shared
          #   key — which is why only the gated Build Check job saves and every
          #   other turbo job restores read-only.
          # - Coupled expression: .github/workflows/cache-divergence.yml probes
          #   this exact key scheme read-only; changing the scheme here without
          #   changing it there leaves the probe observing a cache CI no longer
          #   uses.
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: TypeScript type check (full monorepo)
        run: pnpm exec turbo run typecheck

  test:
    name: Test Suite (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # 20m per shard: maxWorkers:1 serializes the coverage run (one fork instead
    # of two, to bound peak RSS and stop the OS OOM-kill of a fork). Each shard
    # runs half the suite, so wall-clock drops versus the single-fork full run.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        # pgvector-enabled image — the glossary/style-guide migrations CREATE
        # EXTENSION vector, which plain postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password123
          POSTGRES_USER: postgres
          POSTGRES_DB: omnipostdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      # No turbo cache step here on purpose: this job never invokes turbo, so
      # restoring .turbo cost ~46 MB/run and only entered (and lost) the save race.

      - name: Setup test environment
        run: |
          cp .env.example .env
          # env.ts loads `.env.test` when NODE_ENV=test; the tracked file was
          # removed for credential hygiene, so CI synthesizes it (deterministic
          # non-production secrets). DB/Redis are passed in, not hardcoded here.
          export DATABASE_URL="postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Generate Prisma client
        run: pnpm --filter @infra/prisma exec prisma generate

      - name: Run database migrations
        # See the Integration Tests job for the full rationale: `db:migrate`
        # resolves no script under @infra/prisma (pnpm exits 0, migration
        # silently skipped). Mocked unit shards don't touch a real DB so this
        # latent bug never surfaced here — fixed for correctness. Explicit DB
        # env pins the postgres service on the `public` schema.
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
        run: pnpm --filter @infra/prisma run migrate

      - name: Run API tests (shard, blob reporter)
        env:
          # Heap-ceiling backstop only — the actual RSS fix is maxWorkers:1 in
          # apps/api/vitest.config.ts. This bounds V8 heap growth so a borderline
          # run trends toward a graceful heap error instead of an OS SIGKILL.
          NODE_OPTIONS: "--max-old-space-size=6144"
          # Per-shard runs cover only half the suite, so coverage thresholds must
          # not gate here — they are enforced once on merged blobs in coverage-merge.
          # vitest.config.ts reads this flag to drop the thresholds for shard runs.
          VITEST_SHARDED: "true"
        run: pnpm --filter @apps/api exec vitest run --shard=${{ matrix.shard }}/2 --reporter=blob --coverage.enabled

      - name: Upload coverage blob
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: apps/api/.vitest-reports/
          # Dot-directories are excluded by default since upload-artifact v4.4;
          # the blob lives in a hidden dir, so opt it back in explicitly.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Regenerate API types (OpenAPI drift gate)
        # Runs on a single shard only; the gate is independent of test sharding
        # and re-running it on every shard would duplicate the full Fastify boot.
        if: matrix.shard == 1
        # dump:openapi boots the FULL Fastify app (Zod env validation + DI
        # construction, incl. base64-256-bit encryption keys), so it needs a
        # complete valid env. Seed .env from the committed test template (which
        # holds valid test secrets/keys) and override only the infra URLs at the
        # job's postgres/redis services (a process env var wins over --env-file).
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
          REDIS_URL: redis://localhost:6379
        run: |
          cp .env.test.example .env
          pnpm generate:api-types

      - name: Verify no API-types drift
        if: matrix.shard == 1
        run: |
          if ! git diff --quiet -- packages/shared/src/api-generated/; then
            echo "::error title=API types out of sync::Generated OpenAPI types differ from committed copy."
            echo "::error::Run 'pnpm generate:api-types' locally and commit the result."
            git diff --stat -- packages/shared/src/api-generated/
            exit 1
          fi
          echo "API types are in sync with the OpenAPI spec."

  coverage-merge:
    name: Coverage Merge
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Download shard blobs
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: apps/api/.vitest-reports/
          merge-multiple: true

      - name: Merge blobs and enforce coverage thresholds
        # No VITEST_SHARDED here: vitest.config.ts keeps the 55/45 thresholds, so
        # coverage is gated once against the merged data from both shards.
        # --mergeReports (camelCase) reconstructs the full run from the blobs.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: pnpm --filter @apps/api exec vitest run --mergeReports --coverage.enabled

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: apps/api/coverage/
          retention-days: 14
          if-no-files-found: warn

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # One budget for both events, because both now run the same tier. Flat 15
    # rather than the old push value of 25: the measured worst case is ~640s, and
    # a wider budget only doubles the time it takes a hung run to go red.
    timeout-minutes: 15

    services:
      postgres:
        # pgvector-enabled image — the glossary/style-guide migrations CREATE
        # EXTENSION vector, which plain postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password123
          POSTGRES_USER: postgres
          POSTGRES_DB: omnipostdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      # No turbo cache step here on purpose: this job never invokes turbo, so
      # restoring .turbo cost ~46 MB/run and only entered (and lost) the save race.

      - name: Setup test environment
        run: |
          cp .env.example .env
          # env.ts loads `.env.test` when NODE_ENV=test; the tracked file was
          # removed for credential hygiene, so CI synthesizes it (deterministic
          # non-production secrets). DB/Redis are passed in, not hardcoded here.
          export DATABASE_URL="postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Generate Prisma client
        run: pnpm --filter @infra/prisma exec prisma generate

      - name: Run database migrations
        # `migrate` is the script defined on @infra/prisma (`prisma migrate
        # deploy`); the `db:migrate` alias only exists in the ROOT package, so
        # `--filter @infra/prisma db:migrate` matches no script and pnpm exits 0
        # WITHOUT applying anything — the schema never lands. Explicit DB env so
        # prisma.config.ts targets the postgres service on the `public` schema
        # (the same schema the adapter-pg test client uses — see test env below).
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
        run: pnpm --filter @infra/prisma run migrate

      # Both tiers need the seeded baseline (roles/permissions and reference
      # rows the integration suites assume exist — the local dev DB always has
      # them). The seed is idempotent, so running it on every tier is safe.
      - name: Seed roles + permissions
        # Explicit DB env: seed.ts loads via prisma.config.ts (root .env holds
        # only placeholders in CI), so pin the postgres service + public schema.
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
        # seed.ts requires PLATFORM_ENCRYPTION_KEY (32 bytes, base64). Generate
        # the same deterministic test-only key ci-setup-test-env.sh writes to
        # .env.test (no secret-shaped literal stored in the workflow).
        run: |
          export PLATFORM_ENCRYPTION_KEY="$(head -c 32 /dev/zero | tr '\0' 'c' | base64 | tr -d '\n')"
          pnpm --filter @infra/prisma run seed

      # Both events run the SAME tier. Pull requests used to run a DB-only tier
      # that boots no server and executes no live publish batch, so a change to
      # the saga engine was approved by evidence that structurally could not see
      # it and the first signal arrived on the trunk, after the merge. The tier
      # that exercises an area must be the tier that can still block the merge.
      #
      # No path filter: a change can break the publish path without touching any
      # saga file (the poll-interval config, the container that hands the engine
      # its queue port, the SagaInstance row shape, the test runner itself), and
      # a hand-maintained list of paths would reproduce the exact blind spot this
      # is fixing. The cost is bounded instead: the added critical path is
      # budgeted at 60s, and the reduced variant is the escape if it is exceeded.
      #
      # The API listens on port 3000 (process env wins over .env.test's PORT).
      - name: Start API in background
        env:
          NODE_ENV: test
          PORT: "3000"
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
          REDIS_URL: redis://localhost:6379
          # The full tier includes rate-limiting tests (Advanced Rate Limiting in
          # integration:flows) that assert the limiter actually blocks; the
          # synthesized .env.test disables it for unit ergonomics, so the API
          # boot re-enables it (process env wins over the dotenv file).
          ENABLE_RATE_LIMITING: "true"
        run: |
          pnpm --filter @apps/api dev:test > "$RUNNER_TEMP/api.log" 2>&1 &
          API_PID=$!
          echo "API_PID=$API_PID" >> "$GITHUB_ENV"
          # The server's output goes to a file so the whole failure window is
          # readable after the fact (it used to stop appearing in the job log the
          # moment this step ended, leaving zero server-side telemetry for the
          # test window). Because the output is no longer live, the readiness
          # loop carries its own liveness term: a boot that dies must be named
          # immediately instead of spinning the full budget and reporting "not
          # ready" when the truth is "exited".
          gate=0
          timeout 90s bash -c '
            until curl -fsS http://localhost:3000/health >/dev/null; do
              kill -0 "$1" 2>/dev/null || exit 1
              sleep 2
            done' _ "$API_PID" || gate=$?
          if [ "$gate" -ne 0 ]; then
            if [ "$gate" -eq 124 ]; then
              echo "::error title=API never became ready::/health on :3000 did not answer within 90s — see the api.log group at the end of this job"
            else
              echo "::error title=API exited during boot::the process is gone — see the api.log group at the end of this job"
            fi
            exit 1
          fi

      # The publish pipeline's jobs need a consumer or the saga's wait step parks
      # until the 30-minute saga horizon and every publish case burns its full
      # per-test budget. The workers must share this job's Redis with the API,
      # which is why they boot here rather than in a job of their own.
      - name: Start workers in background
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
          REDIS_URL: redis://localhost:6379
        run: |
          # Same deterministic test-only key ci-setup-test-env.sh writes to
          # .env.test, so the workers decrypt channel credentials with the key
          # the API encrypted them under (no secret-shaped literal in this file).
          export PLATFORM_ENCRYPTION_KEY="$(head -c 32 /dev/zero | tr '\0' 'c' | base64 | tr -d '\n')"
          # METRICS_PORT is left unset: the worker health server defaults to 3300,
          # which does not clash with the API on 3000.
          pnpm --filter @apps/workers dev:test > "$RUNNER_TEMP/workers.log" 2>&1 &
          WORKERS_PID=$!
          echo "WORKERS_PID=$WORKERS_PID" >> "$GITHUB_ENV"
          # Readiness is proven on the workers' OWN surface, and /health/ready is
          # only ready once a consumer is registered on the publish queue in the
          # broker's client registry — a process that started, or datastores that
          # are reachable, do not satisfy this gate. 120s (wider than the API's
          # 90s) because the worker boot initialises telemetry, verifies database
          # auth and constructs every provider adapter on a runner that is already
          # hosting the API, Postgres and Redis.
          gate=0
          timeout 120s bash -c '
            until curl -fsS http://localhost:3300/health/ready >/dev/null; do
              kill -0 "$1" 2>/dev/null || exit 1
              sleep 2
            done' _ "$WORKERS_PID" || gate=$?
          if [ "$gate" -ne 0 ]; then
            if [ "$gate" -eq 124 ]; then
              echo "::error title=publish workers never became ready::/health/ready on :3300 did not report ready within 120s — see the workers.log group at the end of this job"
            else
              echo "::error title=publish workers exited during boot::the process is gone — see the workers.log group at the end of this job"
            fi
            exit 1
          fi

      - name: Run integration tests (full tier)
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          TIER: full-integration
          # Explicit DB/Redis env so run-tests.sh never falls back to sourcing
          # the repo .env (dotenv files are not valid bash).
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
          REDIS_URL: redis://localhost:6379
        run: pnpm --filter @apps/api run test:integration

      # Both halves of the pipeline are read together after the fact. Without
      # this the last incident had no server-side output at all for the failing
      # window and had to be diagnosed by reproducing it on a developer machine.
      - name: Dump server logs and report process liveness
        if: always()
        run: |
          for proc in api workers; do
            log="$RUNNER_TEMP/$proc.log"
            if [ -f "$log" ]; then
              echo "::group::$proc.log"
              cat "$log"
              echo "::endgroup::"
            fi
          done
          # A process that is gone by the end explains failures the test output
          # alone attributes to the code under test.
          liveness=0
          if [ -n "${API_PID:-}" ] && ! kill -0 "$API_PID" 2>/dev/null; then
            echo "::error title=API is no longer running::any batch that ran after it exited was talking to a dead server"
            liveness=1
          fi
          if [ -n "${WORKERS_PID:-}" ] && ! kill -0 "$WORKERS_PID" 2>/dev/null; then
            echo "::error title=publish workers are no longer running::any publish case that ran after they exited had no consumer"
            liveness=1
          fi
          # An annotation colours a line in the log and leaves the job green, so
          # a run whose suites all passed against a server that died halfway
          # would still report success — the exact shape this tier exists to
          # remove. The liveness verdict is therefore the step's exit status.
          exit "$liveness"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup Turborepo cache
        # The ONLY turbo cache step in this file with save enabled: every entry
        # that reaches the cache is minted by this job, under the no-output
        # gate below. Key + restore-key rationale: see the canonical comment on
        # the Lint job's restore step (docs/reports/CI_CACHE_INTEGRITY_AUDIT.md
        # AC-1).
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Build all packages
        # Turbo 2.9.16 has no --fail-on-warning flag, so a task that declares
        # dist/** outputs but writes nothing logs "no output files found for
        # task" as a WARNING and exits 0. This gate turns that warning into a
        # job failure. Honest scope: turbo emits the warning only when a task
        # EXECUTES — a cache hit replays the stored logs without re-emitting
        # it, so a warning baked into an existing cache entry is invisible
        # here. That replay blindness is acceptable ONLY because this is the
        # sole job that saves .turbo (the others restore read-only): every
        # persisted entry was minted under a run where this gate watched the
        # task execute. Exemptions: @packages/api-errors and @packages/ui
        # declare `outputs: []` in per-package turbo.json files. The
        # discriminator is the BUILD SCRIPT: those two are the only packages
        # whose build is verdict-only (`tsc --noEmit` — type-checks, emits
        # nothing); other source-consumed packages have no build script at all.
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/turbo-build.log"
          # grep exits 1 on a clean log; running the extraction as the `if`
          # condition keeps that from tripping the shell's -e mode. The sed
          # strips the message prefix and the sentence-ending period turbo
          # appends after the task id.
          if offenders="$(grep -oE 'no output files found for task [^ ]+' "$RUNNER_TEMP/turbo-build.log" | sed 's/.*task //; s/\.$//' | sort -u | paste -sd, -)" && [ -n "$offenders" ]; then
            echo "::error title=Turbo task produced no output files::${offenders} declared outputs but wrote none. Either make the package's build emit its declared outputs, or — if the build is verdict-only (tsc --noEmit) — declare 'outputs: []' in that package's own turbo.json (see packages/ui/turbo.json)."
            exit 1
          fi

      - name: Build admin app
        run: pnpm --filter @apps/admin build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Run security audit
        run: pnpm audit --audit-level moderate

  # ── Code quality checks: dead code, duplication, circular deps ──
  code-quality:
    name: Code Quality (knip + jscpd + madge)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Dead code check (knip)
        run: pnpm check:dead-code

      - name: Duplicate code check (jscpd)
        run: pnpm check:duplicates

      - name: Circular dependency check (madge)
        run: pnpm check:circular

  # ── Monorepo package tests (providers, adapters, core, observability) ──
  # Deterministic turbo run over every package with a `test` script, excluding the
  # apps covered elsewhere: @apps/api (Test Suite shards) and @apps/admin/@apps/client
  # (Frontend Tests). @apps/client is excluded by necessity — its `test` script is
  # watch-mode vitest, which would hang the job. These are Tier 0 unit tests:
  # cache-redis uses a FakeRedis, db-prisma tests are unit/DI — no live DB or Redis.
  test-packages:
    name: Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Restore Turborepo cache (read-only)
        # Restore-only on purpose: `turbo run test` executes build tasks for
        # the dependency closure, but only the gated Build Check job may
        # persist cache entries. Key + restore-key rationale: see the
        # canonical comment on the Lint job's restore step.
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Setup test environment
        # Some package suites (e.g. fallback-strategies) self-skip without env
        # config and vitest exits 1 on a zero-test run. Mirror the FULL env
        # synthesis production-ci performed before its turbo test run: .env from
        # the example plus a synthesized .env.test (vitest setupFiles load it).
        run: |
          cp .env.example .env
          export DATABASE_URL="postgresql://test_user:test_pass@localhost:5432/test_db"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Run package tests (turbo)
        # --continue: a single package failure must not abort the remaining
        # ~59 packages — the job still fails, but with the FULL picture.
        run: >-
          pnpm exec turbo run test
          --continue
          --filter=!@apps/api
          --filter=!@apps/admin
          --filter=!@apps/client

  # ── Tier 0: Frontend unit tests (vitest + jsdom, no DB) ──
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Run Admin unit tests (vitest)
        run: pnpm --filter @apps/admin test

      - name: Run Client unit tests (vitest)
        run: pnpm --filter @apps/client exec vitest run
