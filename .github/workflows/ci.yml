name: CI

on:
  push:
    branches: [main, omni-post-cc]
  pull_request:
    branches: [main, omni-post-cc]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm --filter @apps/api run typecheck

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password123
          POSTGRES_USER: postgres
          POSTGRES_DB: omnipostdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Setup test environment
        run: |
          cp .env.example .env
          # env.ts loads `.env.test` when NODE_ENV=test; the tracked file was
          # removed for credential hygiene, so CI synthesizes it (deterministic
          # non-production secrets). DB/Redis are passed in, not hardcoded here.
          export DATABASE_URL="postgresql://postgres:password123@localhost:5432/omnipostdb?schema=test"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Generate Prisma client
        run: pnpm --filter @infra/prisma exec prisma generate

      - name: Run database migrations
        run: pnpm --filter @infra/prisma db:migrate

      - name: Run API tests with coverage
        run: pnpm --filter @apps/api test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: apps/api/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Regenerate API types (OpenAPI drift gate)
        # dump:openapi boots the Fastify app to extract the schema, so it runs
        # the Zod env validation (fail-fast). The script loads .env (copied from
        # .env.example, whose placeholders fail the >=32-char secret checks), so
        # provide CI test values here — a process env var wins over --env-file.
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=test
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-openapi-drift-gate-jwt-access-secret-0001
          JWT_REFRESH_SECRET: ci-openapi-drift-gate-jwt-refresh-secret-001
          CUSTOMER_JWT_SECRET: ci-openapi-drift-gate-customer-jwt-secret-01
          ADMIN_JWT_ACCESS_SECRET: ci-openapi-drift-gate-admin-jwt-access-secret
          ADMIN_JWT_REFRESH_SECRET: ci-openapi-drift-gate-admin-jwt-refresh-secret
          COOKIE_SECRET: ci-openapi-drift-gate-cookie-secret-00000001
          PLATFORM_ENCRYPTION_KEY: ci-openapi-drift-gate-platform-enc-key-001
          OAUTH_ENCRYPTION_KEY: ci-openapi-drift-gate-oauth-enc-key-00000001
        run: pnpm generate:api-types

      - name: Verify no API-types drift
        run: |
          if ! git diff --quiet -- packages/shared/src/api-generated/; then
            echo "::error title=API types out of sync::Generated OpenAPI types differ from committed copy."
            echo "::error::Run 'pnpm generate:api-types' locally and commit the result."
            git diff --stat -- packages/shared/src/api-generated/
            exit 1
          fi
          echo "API types are in sync with the OpenAPI spec."

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Build all packages
        run: pnpm build

      - name: Build admin app
        run: pnpm --filter @apps/admin build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Run security audit
        run: pnpm audit --audit-level moderate

  # ── Code quality checks: dead code, duplication, circular deps ──
  code-quality:
    name: Code Quality (knip + jscpd + madge)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Dead code check (knip)
        run: pnpm check:dead-code

      - name: Duplicate code check (jscpd)
        run: pnpm check:duplicates

      - name: Circular dependency check (madge)
        run: pnpm check:circular

  # ── Tier 0: Provider adapter unit tests (no DB, no Redis) ──
  test-providers:
    name: Provider Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Run X provider tests
        run: pnpm --filter @providers/x test

      - name: Run Facebook provider tests
        run: pnpm --filter @providers/facebook test

      - name: Run Shared provider tests
        run: pnpm --filter @providers/shared test

      - name: Run TikTok provider tests
        run: pnpm --filter @providers/tiktok test

      - name: Run YouTube provider tests
        run: pnpm --filter @providers/youtube test

      - name: Run Instagram provider tests
        run: pnpm --filter @providers/instagram test

      - name: Run api-common tests
        run: pnpm --filter @packages/api-common test

      - name: Run Core engine tests
        run: pnpm --filter @core/engine test

  # ── Tier 0: Frontend unit tests (vitest + jsdom, no DB) ──
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Run Admin unit tests (vitest)
        run: pnpm --filter @apps/admin test

      - name: Run Client unit tests (vitest)
        run: pnpm --filter @apps/client exec vitest run

  # ── Tier 2: Cache adapter tests (needs Redis) ──
  test-cache-redis:
    name: Cache Redis Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Run Cache Redis tests
        run: pnpm --filter @adapters/cache-redis test
        env:
          REDIS_URL: redis://localhost:6379
