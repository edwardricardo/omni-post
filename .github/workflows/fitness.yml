name: Architectural Fitness Functions

# Wires the fitness greps documented in CLAUDE.md §Automated Compliance
# Checks to CI (the step summary enumerates the current set). Any new
# occurrence of any pattern fails the workflow and is annotated on the PR diff.
#
# Strategy: hard-zero (each returns count = 0), with the documented ratchets that
# CLAUDE.md names: #1 and #21 ran as ratchets during the prisma->DI remediation
# and are hard-zero again; #38 carries one ratcheted sub-count for
# packages/adapters/db-prisma; #45 and #46 hold one `pending` count per
# inventory, exact at its pendingBaseline. Every baseline may fall and must
# never rise. #30 is hard-zero as well: the reach engine derives it, its
# quarantine names every file it holds, and that quarantine may only shrink
# against the base commit's.
#
# A check whose scope path does not exist is WORSE than no check: `grep -r` on
# an absent directory exits 2, prints nothing, and `| wc -l` renders that as 0 —
# a green annotation asserting an invariant nobody measured. #2, #3 and #4 spent
# the whole post-relocation period in exactly that state, which is why each of
# them now asserts its scope directories exist BEFORE running its grep, and
# fails loudly when one is missing rather than passing quietly. The former
# `2>/dev/null` on those three greps is gone for the same reason: it hid the
# exit-2 that was the only remaining evidence.
#
# Canon: Ford & Parsons "Building Evolutionary Architectures" (2nd ed) —
# hard-zero is the correct mode for invariants in a clean codebase; ratchets
# are only correct when a non-zero baseline cannot be eliminated immediately.
#
# Design: one named step per check with `if: always()` so a violation in one
# step does NOT mask later violations — every PR sees every check. The greps, and
# the node scripts of #44 and #53, which read only tracked files, run in the
# `fitness` job, which installs nothing; a check that needs the installed
# tree runs in a job that installs it: #45 to #48, #50 and #51 in `dependency-consistency`,
# #30, #36 and #52 in `test-contracts`. Two exceptions to `if: always()` alone: #37
# and #47 gate the delta against the PR base, which only exists on pull_request
# events — their `if` adds that event condition and the step is skipped
# (visibly, not silently green) on push runs.
# Annotations are aggregated to one `::error` per check (bypasses the
# 10-errors-per-step / 50-per-job silent cap of GitHub Actions).

on:
  push:
    # PR branches validate via the pull_request trigger; listing them here too
    # fired a redundant second run per push.
    branches: [main, omni-post-cc]
  pull_request:
    # Chained pull requests target a feature tracker or a sibling workstream branch, not main;
    # without these patterns a child PR ran no checks at all until it merged into the tracker.
    branches: [main, omni-post-cc, "feature/**", "workstream/**"]

concurrency:
  group: fitness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fitness:
    name: Fitness Functions (CLAUDE.md greps)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # #37 and #41 run node heredocs, #41 expanding its scope with node's fs.glob
      # (node >= 22; stable on 24), and #44 and #53 run node scripts. The runner's default
      # node is not version-pinned, so pin it here to the version .nvmrc names. This job
      # sets up Node directly rather than through the setup-node-pnpm-cache action, because
      # that action installs pnpm and the dependency tree, and the fitness job runs zero
      # package code: no pnpm, no install, no cache.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: "#1 No Prisma singleton imports in routes"
        if: always()
        run: |
          set -uo pipefail
          # Glob fixed: *[Rr]outes* also matches PascalCase *Routes.ts. The old
          # *routes* was case-sensitive and missed every *Routes.ts, so this
          # guard silently passed while admin routes imported the singleton.
          # Hard-zero (the prisma->DI remediation is complete).
          MATCHES=$(grep -rn "import { prisma" apps/api/src/ --include="*[Rr]outes*" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #1 violation::$COUNT Prisma singleton imports in route files. Resolve use cases from DI: fastify.container.resolve(TOKENS.X). Do NOT add any."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#2 Domain + application core is framework-free"
        if: always()
        run: |
          set -uo pipefail
          # Scope repointed: `apps/api/src/domain/` no longer exists — the layers
          # moved to `packages/core/` in the relocation fitness #22 enforces. A
          # `grep -r` on an absent directory exits 2, prints nothing, and
          # `| wc -l` renders that as 0, so this guard reported a clean domain
          # over code it never opened. The scope is the whole `packages/core`
          # tree because the canon forbids concrete infrastructure in BOTH layers
          # it holds (application imports domain only, never an adapter), and
          # because a per-context package is added by creating a directory — a
          # scope that names them one by one goes stale the same way the old path
          # did. Tests are out: they are @layer infrastructure and legitimately
          # name the technologies they replace with doubles. Mirrors CLAUDE.md #2.
          for d in packages/core; do
            [ -d "$d" ] || { echo "::error title=Fitness #2 scope missing::'$d' does not exist, so this check would scan nothing and pass. Repoint the scope to where the layer lives now."; exit 1; }
          done
          MATCHES=$(grep -rn "prisma\|fastify\|redis\|bullmq" packages/core --include="*.ts" | \
            grep -vE "/dist/|/node_modules/|/tests/|\.test\.ts:" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #2 violation::$COUNT framework references found in the domain/application core (expected 0). Domain must import nothing external — no Prisma, Fastify, Redis, BullMQ — and application imports domain only."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#3 No `any` in the core or in apps/api infrastructure"
        if: always()
        run: |
          set -uo pipefail
          # Same repoint as #2: two of the three original path arguments were
          # gone, so grep errored on them and the surviving `infrastructure` arm
          # carried the whole check while the annotation still claimed all three
          # layers. Excludes JSDoc/comment lines and tests — a negative test may
          # need `as any` to construct invalid state, which is the `test-fixture`
          # scenario in CLAUDE.md §Pragmatic Exceptions. Mirrors CLAUDE.md #3.
          # packages/adapters/db-prisma joined the scope with the Post persistence relocation
          # (measured 0 at entry); its tests/ are excluded by the same /tests/ filter as
          # everywhere else.
          for d in packages/core apps/api/src/infrastructure packages/adapters/db-prisma; do
            [ -d "$d" ] || { echo "::error title=Fitness #3 scope missing::'$d' does not exist, so this check would scan nothing and pass. Repoint the scope to where the layer lives now."; exit 1; }
          done
          MATCHES=$(grep -rnE "(:\s+any\b|\bas any\b|<any>)" \
            packages/core apps/api/src/infrastructure packages/adapters/db-prisma \
            --include="*.ts" | \
            grep -vE "/dist/|/node_modules/|/tests/|\.test\.ts:" | \
            grep -vE "//.*any|^[^:]+:[0-9]+:\s*\*" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #3 violation::$COUNT \`any\` usages in the domain/application core or apps/api infrastructure (expected 0). Use proper interfaces, generics, or \`unknown\` + type guard."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#4 No raw throws in the core (domain + application)"
        if: always()
        run: |
          set -uo pipefail
          # Same repoint as #2/#3, and the most misleading of the three: BOTH of
          # its path arguments were gone, so it scanned nothing at all. Canon:
          # fallible operations return Result<T, DomainError> and a throw never
          # crosses a layer boundary. Excludes dist, node_modules, tests, and
          # comment lines (`MAY throw` in JSDoc prose is documentation, not a
          # statement). The four excepted files each hold a real throw and are
          # named so the debt is attributable rather than absorbed by a path that
          # reads as green:
          #   - GatewayBillingService.ts + TrialManagementService.ts: the throw is
          #     the rollback signal inside unitOfWork.executeInTransaction() — an
          #     interactive Prisma transaction aborts only by throwing — and the
          #     method's own try/catch converts it to err(...). Never leaves the
          #     service. Remove-when: MET (ADR-0023) —
          #     UnitOfWork.executeResultInTransaction IS that explicit abort: a
          #     callback resolving to err rolls back and gets its err returned
          #     unchanged, with no throw in the core. Migrating these 15 throws
          #     onto it is a NAMED SEPARATE CHANGE (own bounded context, own
          #     regressions), so the exception stays listed until it lands — it is
          #     now scheduled debt, not open-ended debt. Mirrors CLAUDE.md #4.
          #   - DeletePostUseCase.ts: exhaustiveness guard on a `never`,
          #     unreachable by construction. Remove-when: the caller union is
          #     closed by a compiler-checked schema.
          #   - ComplianceService.ts: NOT audited-safe, and the reason this list
          #     is explicit. getGdprSettings()/getSecuritySettings() are typed
          #     Promise<GdprSettings>/Promise<SecuritySettings>, so their throws
          #     DO escape the application layer — a live canon violation the dead
          #     scope was concealing. Remove-when: both getters return
          #     Result<T, DomainError> and every caller narrows on .ok.
          # Mirrors CLAUDE.md #4.
          for d in packages/core; do
            [ -d "$d" ] || { echo "::error title=Fitness #4 scope missing::'$d' does not exist, so this check would scan nothing and pass. Repoint the scope to where the layer lives now."; exit 1; }
          done
          MATCHES=$(grep -rn "throw " packages/core --include="*.ts" | \
            grep -vE "/dist/|/node_modules/|/tests/|\.test\.ts:" | \
            grep -vE "^[^:]+:[0-9]+:\s*(\*|//)" | \
            grep -vE "/GatewayBillingService\.ts|/TrialManagementService\.ts|/ComplianceService\.ts|/DeletePostUseCase\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #4 violation::$COUNT raw \`throw\` statements in the domain/application core (expected 0). Use Result<T, DomainError> for fallible operations."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#5 No @ts-ignore or @ts-nocheck in production source"
        if: always()
        run: |
          set -uo pipefail
          # packages/*/src/ is ONE directory level deep and never reached
          # packages/adapters/db-prisma/src/; the relocated Post persistence adapters live
          # there, so it is named explicitly (0 at entry). The general two-level widening is
          # unmeasured — backlog.
          MATCHES=$(grep -rn "@ts-ignore\|@ts-nocheck" apps/api/src/ packages/*/src/ packages/adapters/db-prisma/src/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #5 violation::$COUNT @ts-ignore/@ts-nocheck in production source (expected 0). Fix the underlying type issue."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#6 CQRS handlers don't touch Prisma directly"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "prisma\." apps/api/src/cqrs/handlers/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #6 violation::$COUNT direct Prisma calls in CQRS handlers (expected 0). Delegate to Application layer use cases."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#7 No randomUUID/Math.random in dedupeKey"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "dedupeKey.*randomUUID\|dedupeKey.*Math.random" apps/api/src/ packages/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #7 violation::$COUNT dedupeKey uses non-deterministic ID (expected 0). DedupeKey must be deterministic: saga-\${sagaId}-\${stepIndex}."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#8 No sprint/phase references in source comments"
        if: always()
        run: |
          set -uo pipefail
          # Catches: "Sprint 1", "Sprint A", "Sprint 8", "Part of Sprint X",
          # "Phase 1", "Phase 2", the legacy "T0A_" / "T0-A" task-batch prefixes,
          # and the parenthesised phase/task shorthand "(P8)" / "(P2-1)" / "(P3-A)"
          # / "(P1-DI-7)". Prisma-safe: `\(P[0-9]\)` matches a single digit and
          # `\(P[0-9]+-` requires a dash, so Prisma error codes like "(P2002)"
          # (P + 4 digits, no dash) are NOT flagged. All belong in git history /
          # PR descriptions, not in source comments where they rot.
          MATCHES=$(grep -rnE "Part of Sprint|Phase.*Sprint|Sprint [0-9A-Z]|Phase [0-9]|T0A_|T0-A|\(P[0-9]\)|\(P[0-9]+-[A-Za-z0-9]" \
            apps/ packages/ infra/ --include="*.ts" --include="*.tsx" --include="*.prisma" 2>/dev/null | \
            grep -vE "node_modules|dist|\.next|infra/prisma/generated/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #8 violation::$COUNT sprint/phase references in source (expected 0). Belongs in git history, not source comments."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#9 Every file has @file header"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rL "@file" apps/ packages/ --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "node_modules\|dist\|\.next\|next-env\.d\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #9 violation::$COUNT files missing @file header (expected 0)."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#10 Only valid @layer values (domain/application/infrastructure)"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "@layer" apps/ packages/ --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "node_modules\|dist\|\.next" | \
            grep -v "@layer application\|@layer domain\|@layer infrastructure" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #10 violation::$COUNT files with invalid @layer value (expected 0). Allowed: domain, application, infrastructure."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#11 No raw setInterval in backend"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "setInterval\(" apps/api/src apps/workers/src packages/ --include="*.ts" 2>/dev/null | \
            grep -vE "default-scheduler|node_modules|dist|\.test\.|/tests/|eslint\.config" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #11 violation::$COUNT raw setInterval calls in backend (expected 0). Register via TOKENS.BackgroundTaskScheduler."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#12 Every component file carries @component tag"
        if: always()
        run: |
          set -uo pipefail
          MISSING=""
          for f in $(find apps/admin/components apps/client/components packages/ui/src/components \
            -type f -name "*.tsx" 2>/dev/null | grep -v "\.stories\.\|\.test\.\|\.next" || true); do
            basename=$(basename "$f")
            case "$basename" in use*) continue;; esac
            if ! grep -qE "^export (default )?(function|const) [A-Z]" "$f"; then continue; fi
            if ! grep -q "@component" "$f"; then
              MISSING="$MISSING\n$f"
            fi
          done
          COUNT=$(printf "%b" "$MISSING" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #12 violation::$COUNT React component files missing @component JSDoc tag (expected 0)."
            printf "%b\n" "$MISSING" | head -20
            exit 1
          fi

      - name: "#13 No direct pino imports in apps/api"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "^import pino\b|^const \w+ = pino\(" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "lib/logger\.ts\|\.test\.\|/tests/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #13 violation::$COUNT direct pino imports in apps/api (expected 0). Use createLogger() from apps/api/src/lib/logger.ts so redaction config is uniform."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#14 No per-class `private *Cache = new Map` in apps/api/src"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "^\s+private \w*[Cc]ache.*= new Map" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "\.test\.\|/tests/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #14 violation::$COUNT per-class private *Cache = new Map() in apps/api/src (expected 0). All cross-pod cached state MUST go through TOKENS.CachePort. Reason: OWASP A07:2021 cache coherence."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#15 No insecure secret fallbacks (CWE-798)"
        if: always()
        run: |
          set -uo pipefail
          # 15. No insecure secret fallbacks (CWE-798) in apps/api/src + apps/workers/src
          # + packages/providers/*/src.
          # Reason: `process.env.X || "dev-only-..."`, `... ?? ""`, `... || generated()`
          # patterns let the app boot with hard-coded / empty / per-restart secrets,
          # masking misconfiguration in dev and shipping insecurely to prod. The fix
          # is the typed env constant from apps/api/src/config/env.ts (Zod fail-fast)
          # in app code, and constructor injection of secrets into provider apiClients.
          # The typed constant is matched too: `env.X_SECRET ?? ""` on a variable the
          # schema marks optional boots with an empty string that reads as configured,
          # and a request then carries it as the secret. An unconfigured secret is an
          # absent optional field, never "". `env` matches after any character but `!`
          # or an identifier character, so `process.env`, the typed `env` and a member
          # chain (`this.env`) are all read, while the boolean guard `!env.X_SECRET ||`
          # is not a fallback and is skipped. Residual limits: an alias
          # (`const e = env`), bracket access (`env["X_SECRET"]`) or a destructuring
          # default is invisible to this line grep.
          # Excludes `_template` (scaffolding example).
          MATCHES=$(grep -rnE '(^|[^![:alnum:]_])env\.[A-Z_]*(SECRET|KEY|PASSWORD|TOKEN|CREDENTIAL)[A-Z_]*\s*(\|\||\?\?)' \
            apps/api/src apps/workers/src packages/providers --include="*.ts" 2>/dev/null | \
            grep -v "node_modules\|\.test\.\|/tests/\|/dist/\|config/env\.ts\|providers/_template/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #15 violation::$COUNT insecure secret fallbacks (expected 0). Replace with the typed env constant from apps/api/src/config/env.ts — Zod schema fails fast at boot, no fallback. Reason: CWE-798 (Use of Hard-coded Credentials), OWASP A07:2025."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#19 No process.env reads inside provider Adapter classes"
        if: always()
        run: |
          set -uo pipefail
          # Provider adapters are stateless and receive credentials per-call
          # from the application layer's CredentialResolver. Any env read
          # inside an Adapter.ts file reintroduces the CWE-798 anti-pattern
          # by smuggling secrets through the module rather than via injection.
          # Operational config that legitimately lives in apiClient.ts is
          # allowed there but NOT in the adapter itself. Excludes _template.
          MATCHES=$(grep -rnE 'process\.env\.' packages/providers/*/src/*Adapter.ts 2>/dev/null | \
            grep -v "providers/_template/\|/dist/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #19 violation::$COUNT process.env reads inside provider Adapter classes (expected 0). Adapters must receive credentials per-call and any operational config via constructor injection from the composition root."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#16 No direct process.env.* in apps/api/src outside config/env.ts"
        if: always()
        run: |
          set -uo pipefail
          # apps/api/src must consume the typed `env` constant from
          # config/env.ts — direct process.env access bypasses Zod validation
          # and creates a regression vector for #15. Workers + packages are
          # out of scope (separate refactor) but this gate locks in the API.
          # Exception: process.env.NODE_ENV — Node ecosystem convention treats
          # this as runtime-readable, and tests rely on dynamic mutation.
          MATCHES=$(grep -rn "process\.env\." apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "config/env\.ts\|/tests/\|\.test\.\|process\.env\.NODE_ENV\b" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #16 violation::$COUNT direct process.env.* references in apps/api/src outside config/env.ts (expected 0). Use the typed env constant — see apps/api/src/config/env.ts."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#17 No direct process.env.* in Next.js apps outside lib/env.ts"
        if: always()
        run: |
          set -uo pipefail
          # Next.js client bundles inline process.env reads at BUILD TIME via
          # Webpack DefinePlugin. A `process.env.SOME_SECRET` referenced in a
          # client component leaks the value into the JS shipped to the
          # browser. Routing every consumer through `lib/env.ts` (t3-env)
          # enforces server/client split via the `clientPrefix` convention
          # and fails build when a secret is referenced from client code.
          # Exception: process.env.NODE_ENV (Node ecosystem convention) +
          # playwright config (runs outside Next bundle).
          MATCHES=$(grep -rnE "process\.env\." \
              apps/admin/{app,components,hooks,lib,providers} \
              apps/client/{app,components,hooks,lib,providers} \
              --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "lib/env\.ts\|process\.env\.NODE_ENV\b\|/tests/\|\.test\." || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #17 violation::$COUNT direct process.env.* references in Next.js apps outside lib/env.ts (expected 0). Use the typed env constant — see apps/{admin,client}/lib/env.ts. Reason: Webpack DefinePlugin inlines client process.env at build time; client components must consume only NEXT_PUBLIC_* via env."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#18 No direct argon2.hash/verify outside passwordHashing.ts"
        if: always()
        run: |
          set -uo pipefail
          # Centralised Argon2id hashing in `apps/api/src/auth/passwordHashing.ts`
          # ensures every password / API-key / backup-code hash uses identical
          # canonical parameters (RFC 9106 second-recommended). Direct calls to
          # `argon2.hash()` or `argon2.verify()` elsewhere create drift risk —
          # one site might use lib defaults, another might pass weaker params.
          # Route everything through `hashPassword`, `verifyPassword`,
          # `needsRehash` from the helper.
          MATCHES=$(grep -rnE "argon2\.(hash|verify)\(" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "passwordHashing\.ts\|/tests/\|\.test\." || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #18 violation::$COUNT direct argon2.hash/verify calls outside apps/api/src/auth/passwordHashing.ts (expected 0). Route through the helper — see hashPassword / verifyPassword / needsRehash."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#20 No legacy BullMQ repeatable API"
        if: always()
        run: |
          set -uo pipefail
          # addRepeatable / getRepeatableJobs / removeRepeatableByKey /
          # removeRepeatable are deprecated since BullMQ 5.16.0 (removed in
          # v6). The canonical recurring primitive is upsertJobScheduler
          # (idempotent by scheduler id). The four method names are
          # BullMQ-exclusive so this is a precise hard-zero with no false
          # positives (unlike a bare `repeat:` which collides with domain
          # fields and provider API params). Excludes tests + sandboxes.
          MATCHES=$(grep -rnE "\.(addRepeatable|getRepeatableJobs|removeRepeatableByKey|removeRepeatable)\(" apps/*/src packages/*/src --include="*.ts" 2>/dev/null | \
            grep -vE "node_modules|/dist/|\.test\.|/tests/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #20 violation::$COUNT legacy BullMQ repeatable API call(s) (expected 0). Use Queue.upsertJobScheduler / getJobSchedulers / removeJobScheduler — deprecated since BullMQ 5.16.0."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#21 No Prisma singleton imports outside composition roots"
        if: always()
        run: |
          set -uo pipefail
          # DI canon: only a composition root may import the `prisma` singleton;
          # every other unit RECEIVES PrismaClient (or a port) by constructor
          # injection. Scope: apps/api/src + apps/workers/src. Exceptions: the
          # api composition root (infrastructure/container), the api bootstrap
          # (index.ts), the workers composition root (**/container/), and tests.
          # Hard-zero (the prisma->DI remediation is complete). This guard
          # supersedes #1 (routes are a subset).
          MATCHES=$(grep -rlE "import \{[^}]*\bprisma\b[^}]*\} from \"@infra/prisma\"" apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
            grep -vE "/infrastructure/container/|/index\.ts$|/container/|\.test\.|/tests/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #21 violation::$COUNT prisma singleton importer(s) outside composition roots. Inject PrismaClient via constructor and resolve from the container. Do NOT add any."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#22 No @layer application in apps/api/src (application code lives in @core/application)"
        if: always()
        run: |
          set -uo pipefail
          # Workstream application-services-to-core (S1' -> S4) relocated every
          # @layer application file from apps/api/src to packages/core/application/.
          # Re-introducing @layer application in apps/api/src reverses that move
          # and reintroduces the inverted-dependency smell. New application-layer
          # code MUST go to packages/core/application/<context>/ and apps/api
          # consumers import it as @core/application/<context>/<Service>.js.
          # Hard-zero (S5 closed the workstream).
          MATCHES=$(grep -rlE "^[[:space:]]*\*[[:space:]]*@layer application[[:space:]]*$" apps/api/src --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #22 violation::$COUNT @layer application file(s) in apps/api/src. Move the file to packages/core/application/<context>/ and repoint consumers via @core/application/<context>/<Service>.js."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#23 No raw Prisma queries outside tenant guard + composition root"
        if: always()
        run: |
          set -uo pipefail
          # Raw Prisma queries ($queryRaw, $executeRaw, $queryRawUnsafe,
          # $executeRawUnsafe) BYPASS the Prisma $extends tenant-guard
          # middleware (S2.1b) because Prisma extensions only hook the typed
          # query API. Any raw SQL touching tenant-scoped tables introduces
          # a CWE-639 (Authorization Bypass) risk unless wrapped in a UoW
          # (so PostgreSQL RLS catches it via SET LOCAL app.account_id from
          # TenantContext, S2.1c) or explicitly opted-in via
          # withSystemContext() for admin/system flows.
          # Hard-zero.
          # Exceptions (as of the close of S2.1d) — all are audited-safe, no known-gap:
          #   - events/EventStore.ts: StoredEvent is a global table (no accountId). OK.
          #   - PrismaStyleGuideRuleRepository.ts + PrismaGlossaryRepository.ts:
          #     raw pgvector UPDATEs — AUDITED S2.1d, both filter by
          #     `AND "accountId" = ${requireTenantContext().accountId}`. CWE-639 closed.
          #     Why they stay an exception: the regex cannot validate the AND clause in
          #     a multi-line Prisma.sql; a periodic manual audit is documented in
          #     `docs/security/MULTI_TENANT_AUDIT_2026-05-27.md`.
          #   - packages/adapters/db-prisma/src/unitofwork/PrismaUnitOfWork.ts (relocated from
          #     apps/api/src/infrastructure/unitofwork/ with the Post persistence adapters): emits
          #     `set_config('app.account_id', ..., true)` to bind the RLS GUC at tx start — THE
          #     canonical entry point for tenant scope in transactions. INERT TODAY, stated so nobody
          #     reads it as coverage: the statement is a TAGGED TEMPLATE (tx.$queryRaw`...`) and this
          #     regex is anchored on `\(`, so the line has never matched (SMELL-111's class). Kept
          #     because it turns live the day SMELL-111 closes the regex; deleting it instead needs
          #     authorisation (backlog).
          #   - packages/adapters/db-prisma/src entered this scope with that relocation. Measured at
          #     entry: 0 paren-form calls. Its one tagged-template site, resilience.ts:308
          #     (prisma.$queryRaw`SELECT 1`, a connection probe touching no tenant table), is
          #     invisible to this regex for the same reason and gets NO exception line — a second
          #     inert line would be fat, not coverage; SMELL-111's closure enrols it.
          MATCHES=$(grep -rnE "\.\\\$(queryRaw|executeRaw|queryRawUnsafe|executeRawUnsafe)\(" \
            apps/api/src apps/workers/src packages/adapters/db-prisma/src --include="*.ts" 2>/dev/null | \
            grep -vE "/extensions/tenantGuard|/infrastructure/container/|/tests/|\.test\." | \
            grep -vE "/events/EventStore\.ts|/PrismaStyleGuideRuleRepository\.ts|/PrismaGlossaryRepository\.ts" | \
            grep -vE "/db-prisma/src/unitofwork/PrismaUnitOfWork\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #23 violation::$COUNT raw Prisma query(s) outside tenant guard + composition root. Raw queries bypass the Prisma extension tenant guard (S2.1b); wrap in UoW (RLS catches) OR use withSystemContext() for admin flows OR add to fitness #23 exception list with ADR justification."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#24 Canon child docs MUST exist + structured (anti-deletion)"
        if: always()
        run: |
          set -uo pipefail
          # The 4 canon child docs are auto-loaded into every Claude Code
          # session via @-imports in CLAUDE.md. Deleting one silently strips
          # load-bearing rules from every future session, so this fitness
          # step asserts each file exists AND carries the required structure
          # (§"How to extend" + **Owner:** line). Hard-zero anti-deletion guardrail.
          MISSING=0
          for f in docs/architecture/ARCHITECTURE_CANON.md \
                   docs/development/CODING_STANDARDS.md \
                   docs/security/SECURITY_CANON.md \
                   docs/observability/LOGGING_CANON.md; do
            if [ ! -f "$f" ]; then
              echo "::error title=Fitness #24 violation::MISSING canon child: $f"
              MISSING=$((MISSING + 1))
              continue
            fi
            if ! grep -q '^## How to extend' "$f"; then
              echo "::error title=Fitness #24 violation::MISSING §'How to extend' heading in $f"
              MISSING=$((MISSING + 1))
            fi
            if ! grep -q '^\*\*Owner:' "$f"; then
              echo "::error title=Fitness #24 violation::MISSING **Owner:** line in $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            exit 1
          fi

      - name: "#25 Circuit-breaker fail-fast for writes (two-part hard-zero)"
        if: always()
        run: |
          set -uo pipefail
          # Threat: a write-path fallback resolves provider failures with a
          # synthetic receipt ({id:"queued",status:"pending"}) instead of
          # surfacing an error — silently losing the post. Locks the two
          # CB-fallback invariants: the breaker default stays fail-fast, and no
          # write-verb operation opts in to a fallback. Mirrors CLAUDE.md #25.
          A=$(grep -nA6 "DEFAULT_EXTERNAL_API_OPTIONS: ExternalApiOptions = {" \
                packages/adapters/external-apis/src/circuitBreaker.ts 2>/dev/null | \
                grep -E "fallbackEnabled:\s*true" || true)
          ACOUNT=$(printf "%s" "$A" | grep -c . || true); ACOUNT=${ACOUNT:-0}
          B=$(grep -rn "fallbackEnabled: true" \
                packages/providers packages/adapters apps/api/src --include="*.ts" 2>/dev/null | \
                grep -vE "/tests/|\.test\." | \
                grep -E "(post-tweet|post-to-page|publish-media|create-container|create-stories|create-reels|send-message|send-photo|send-video|send-poll|send-document|send-audio|create-story|create-pin|create-post|upload-video|upload-short|upload-media|schedule|process-video|process-segment|optimize-reel|create-thumbnail|create-stream|start-stream|stop-stream)" || true)
          BCOUNT=$(printf "%s" "$B" | grep -c . || true); BCOUNT=${BCOUNT:-0}
          if [ "$ACOUNT" -gt 0 ]; then
            echo "::error title=Fitness #25 violation::DEFAULT_EXTERNAL_API_OPTIONS has fallbackEnabled:true (count=$ACOUNT) — the breaker default must stay fail-fast"
          fi
          if [ "$BCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #25 violation::$BCOUNT write-verb call site(s) opt into a fallback — surfaces the synthetic-receipt anti-pattern"
            printf "%s\n" "$B" | head -20
          fi
          if [ "$ACOUNT" -gt 0 ] || [ "$BCOUNT" -gt 0 ]; then
            exit 1
          fi

      - name: "#26 No .js-on-.ts relative imports in bundler-compiled frontend dirs"
        if: always()
        run: |
          set -uo pipefail
          # Next 16 Turbopack can't resolve a written ./x.js to its ./x.ts source
          # (vercel/next.js #82945 OPEN); the NodeNext .js convention is backend-only.
          # The Next apps + frontend-only packages use moduleResolution:bundler =
          # extensionless. A .js here silently breaks next dev/build. Mirrors CLAUDE.md #26.
          COUNT=$(grep -rnE 'from "\.\.?/[^"]*\.js"' \
                    apps/admin apps/client packages/ui/src packages/api-errors/src \
                    packages/query-client/src packages/observability/browser-logger/src \
                    --include="*.ts" --include="*.tsx" \
                    --exclude-dir=.next --exclude-dir=node_modules --exclude-dir=dist 2>/dev/null | wc -l || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #26 violation::$COUNT .js-on-.ts relative import(s) in bundler-compiled frontend dirs — Turbopack can't resolve them; use extensionless (backend keeps .js)"
            grep -rnE 'from "\.\.?/[^"]*\.js"' apps/admin apps/client packages/ui/src packages/api-errors/src packages/query-client/src packages/observability/browser-logger/src --include="*.ts" --include="*.tsx" --exclude-dir=.next --exclude-dir=node_modules --exclude-dir=dist 2>/dev/null | head -20
            exit 1
          fi

      - name: "#27 Dev/test source-resolution invariants (--conditions development + @shared/types build-first)"
        if: always()
        run: |
          set -uo pipefail
          # The dev-prod-resolution-model contract (ADR-0017 §1c). Part A: source-mode
          # node:test/seed/service invocations must pass --conditions development (else
          # they resolve workspace packages to the unbuilt dist via Node exports).
          # apps/workers/package.json + src/bootstrap.ts are in scope because CI boots
          # the workers from source in the integration job: without the condition the
          # worker resolves ~12 workspace packages to a dist CI never builds and dies
          # during boot, so the readiness gate reports "not ready" for a reason that has
          # nothing to do with the queue it exists to prove. Part B: the size-limit job
          # must build the Next apps via turbo (^build -> @shared/types dist first), not
          # a bare pnpm --filter. Mirrors CLAUDE.md #27.
          A=$(grep -rnE "node ([^|&]*)--import tsx" \
                apps/api/package.json apps/api/scripts/run-tests.sh infra/prisma/package.json \
                apps/workers/package.json 2>/dev/null | \
                grep -E -- "--test|security/tests|seed\.ts|src/bootstrap\.ts" | \
                grep -v -- "--conditions development" | \
                grep -vE '"dev":|dump:openapi' || true)
          ACOUNT=$(printf "%s" "$A" | grep -c . || true); ACOUNT=${ACOUNT:-0}
          B=$(grep -nE "pnpm --filter @apps/(admin|client)( --filter @apps/(admin|client))* build" \
                .github/workflows/audit.yml 2>/dev/null || true)
          BCOUNT=$(printf "%s" "$B" | grep -c . || true); BCOUNT=${BCOUNT:-0}
          if [ "$ACOUNT" -gt 0 ]; then
            echo "::error title=Fitness #27 violation::$ACOUNT source-mode node:test/seed invocation(s) missing --conditions development — they resolve to the unbuilt dist (exports->dist regression)"
            printf "%s\n" "$A" | head -20
          fi
          if [ "$BCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #27 violation::size-limit job uses a bare 'pnpm --filter @apps build' — must use 'turbo run build' so @shared/types dist is built before next build"
            printf "%s\n" "$B" | head -20
          fi
          if [ "$ACOUNT" -gt 0 ] || [ "$BCOUNT" -gt 0 ]; then
            exit 1
          fi

      - name: "#28 Fastify trustProxy comes ONLY from the derived policy"
        if: always()
        run: |
          set -uo pipefail
          # An ALLOWLIST, and it used to be a denylist — the inversion is the point.
          # The old form banned `trustProxy: true` and REQUIRED the numeric
          # TRUSTED_PROXY_HOP_COUNT. Fastify 5.12.1 (GHSA-3m5p-2c4r-xxw2) deleted
          # numeric hop-count trust: getTrustProxyFn returns `() => false` for a
          # number, because hop-count-only trust cannot validate the immediate peer.
          # So the old check REQUIRED the spelling that had become dangerous and was
          # blind to it: measured, `trustProxy: 2` returned count=0 and passed, while
          # `trustProxy: true` was caught. A gate that mandates the defect it exists
          # to prevent is worse than no gate.
          #
          # A denylist cannot fix this — the dangerous set is open-ended (any number,
          # any hand-rolled `(addr, hop) => hop < N` that would type-check and keep
          # tests green while restoring the patched vulnerability). So: every
          # `trustProxy:` MUST be the single derived binding FASTIFY_TRUST_PROXY,
          # computed by apps/api/src/security/trustedProxy.ts from the boot-validated
          # TRUSTED_PROXY_MODE + TRUSTED_PROXY_RANGES pair. See ADR-0021 and
          # SECURITY_CANON.md §Rate Limiting. Mirrors CLAUDE.md #28.
          V=$(grep -rnE "trustProxy:" apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
                grep -vE "/tests/|\.test\.|/security/trustedProxy\.ts:" | \
                grep -vE "trustProxy:\s*FASTIFY_TRUST_PROXY\b" || true)
          COUNT=$(printf "%s" "$V" | grep -c . || true); COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #28 violation::$COUNT trustProxy binding(s) that are not the derived FASTIFY_TRUST_PROXY. Numeric hop counts are inert since fastify 5.12.1 (they resolve request.ip to the socket peer, collapsing every user into one rate-limit bucket), 'true' trusts the client-controlled leftmost XFF entry, and a hand-rolled hop function restores the exact vulnerability the advisory patched. Derive the policy from TRUSTED_PROXY_MODE + TRUSTED_PROXY_RANGES instead (ADR-0021)."
            printf "%s\n" "$V" | head -20
            exit 1
          fi

      - name: "#29 No raw client-IP header reads outside resolveClientIp"
        if: always()
        run: |
          set -uo pipefail
          # Every IP-keyed security decision (rate limit, IP allowlist, brute-force
          # throttle, audit IP) MUST go through resolveClientIp(); a direct
          # x-forwarded-for / x-real-ip read is the carrier for the leftmost-entry
          # spoof (see SECURITY_CANON.md §Rate Limiting). Excludes the resolver file
          # itself + tests. Mirrors CLAUDE.md #29.
          V=$(grep -rniE '"x-forwarded-for"|"x-real-ip"|headers\[.x-forwarded-for|headers\[.x-real-ip' \
                apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
                grep -vE "resolveClientIp|/tests/|\.test\." || true)
          COUNT=$(printf "%s" "$V" | grep -c . || true); COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #29 violation::$COUNT raw client-IP header read(s) outside resolveClientIp — route every IP-keyed decision through the canonical resolver"
            printf "%s\n" "$V" | head -20
            exit 1
          fi

      - name: "#31 No vacuous-pass escape hatch in a test entry point (two-part hard-zero)"
        if: always()
        run: |
          set -uo pipefail
          # Threat: a suite that collects ZERO tests and still exits 0. The
          # nightly chaos job ran `vitest run tests/chaos/` for the life of that
          # workflow against node:test files vitest's `include` globs never
          # covered, collected nothing, and reported green over scenarios it
          # never executed.
          # Part A: vitest's pass-with-no-tests flag appears in no tracked JSON,
          # TypeScript or workflow file of the repository, whichever directory it
          # sits in. Vitest defaults it to false — zero collected is exit 1 — so
          # every occurrence is an explicit opt-OUT of the one default that
          # notices an empty run, and it keeps reporting green forever once a
          # rename or an `include` change breaks collection. This step is itself
          # a tracked .yml file: the pattern carries a bracket class so it does
          # not match its own text, and the flag's name is spelled out nowhere
          # else in it. Fail-closed: a git grep that errors, or a scope below
          # PART_A_SCOPE_FLOOR files, read less of the tree than it holds.
          # Part B: the node:test runner must KEEP its zero-collection guards and
          # read its counts from the summary reporter. node:test has no equivalent
          # default: it counts a file that registers no test as one passing test,
          # and counts read from a formatted report parse as zero the day its text
          # changes, so run-tests.sh takes each file's counts from the one anchored
          # line of scripts/testing/node-summary-reporter.mjs, which reads Node's
          # test events, and carries the zero check itself, once per file and once
          # on the total. Both zero terms are pinned because deleting either
          # restores the silent green with nothing left to notice it; the reporter
          # assignment is pinned, and the TAP reporter must be gone. Mirrors
          # CLAUDE.md #31.
          # GitHub runs this body under `bash -e`: each status is captured with `||`, so
          # git grep's exit 1, which means "no match", is read rather than ending the step.
          # The repository tracks about 3,100 JSON, TypeScript and workflow files (3132 on
          # 2026-10-16), so a count below 2500 means a partial checkout, not a smaller tree.
          PART_A_SCOPE_FLOOR=2500
          SCOPE=$(git ls-files -- '*.json' '*.ts' '*.mts' '*.yml' | wc -l) || SCOPE=0
          if [ "$SCOPE" -lt "$PART_A_SCOPE_FLOOR" ]; then
            echo "::error title=Fitness #31 scope error::git ls-files found $SCOPE JSON, TypeScript and workflow files against a floor of $PART_A_SCOPE_FLOOR — the checkout is missing or partial, and Part A would report a clean zero over files it never read."
            exit 1
          fi
          ASTATUS=0
          A=$(git grep -nE 'pass[W]ithNoTests' -- '*.json' '*.ts' '*.mts' '*.yml') || ASTATUS=$?
          if [ "$ASTATUS" -gt 1 ]; then
            echo "::error title=Fitness #31 scope error::git grep exited $ASTATUS over the Part A scope — it could not read the files it was given, so a zero would be a blind one."
            exit 1
          fi
          ACOUNT=$(printf "%s" "$A" | grep -c . || true); ACOUNT=${ACOUNT:-0}
          BATCH_PIN=$(grep -c '\[ "\$tests" -eq 0 \]' apps/api/scripts/run-tests.sh || true)
          TOTAL_PIN=$(grep -c '\[ "\$TOTAL_TESTS" -eq 0 \]' apps/api/scripts/run-tests.sh || true)
          BATCH_PIN=${BATCH_PIN:-0}; TOTAL_PIN=${TOTAL_PIN:-0}
          REPORTER_PIN=$(grep -c '^SUMMARY_REPORTER=.*/scripts/testing/node-summary-reporter\.mjs"$' apps/api/scripts/run-tests.sh || true)
          TAP_PIN=$(grep -c -- '--test-reporter=tap' apps/api/scripts/run-tests.sh || true)
          REPORTER_PIN=${REPORTER_PIN:-0}; TAP_PIN=${TAP_PIN:-0}
          if [ "$ACOUNT" -gt 0 ]; then
            echo "::error title=Fitness #31 violation::$ACOUNT line(s) of tracked files set vitest's pass-with-no-tests flag — that opts out of the only default that fails an empty run, so the suite reports green the day collection breaks"
            printf "%s\n" "$A" | head -20
          fi
          if [ "$BATCH_PIN" -lt 1 ] || [ "$TOTAL_PIN" -lt 1 ]; then
            echo "::error title=Fitness #31 violation::apps/api/scripts/run-tests.sh lost a zero-collection guard (per-file found=$BATCH_PIN, total found=$TOTAL_PIN, each must be >= 1). node:test counts a file that registers no test as one passing test; without these terms the runner passes over tests nobody executed."
          fi
          if [ "$REPORTER_PIN" -lt 1 ] || [ "$TAP_PIN" -gt 0 ]; then
            echo "::error title=Fitness #31 violation::apps/api/scripts/run-tests.sh no longer reads its counts from scripts/testing/node-summary-reporter.mjs (reporter assignment found=$REPORTER_PIN, must be >= 1; --test-reporter=tap found=$TAP_PIN, must be 0). Counts read from a formatted report parse as zero the day its text changes, and only the reporter leaves the stand-in pass of an empty file uncounted."
          fi
          if [ "$ACOUNT" -gt 0 ] || [ "$BATCH_PIN" -lt 1 ] || [ "$TOTAL_PIN" -lt 1 ] || [ "$REPORTER_PIN" -lt 1 ] || [ "$TAP_PIN" -gt 0 ]; then
            exit 1
          fi

      - name: "#32 No committed skipped or focused test"
        if: always()
        run: |
          set -uo pipefail
          # CODING_STANDARDS §Zero Cancelled Tests states this as canon; nothing
          # enforced it mechanically. A committed `.only(` is the sharper harm of
          # the two: the runner then executes ONLY that test and every sibling in
          # the file reports green without running. `forbidOnly: true` catches
          # `.only` at RUNTIME, but only in the 5 of 83 vitest configs that set
          # it; this catches both forms statically, in every package and both
          # frameworks, before a runner is even chosen.
          # Two deliberate non-matches:
          #   - `.todo(` marks a test that was never written — a declared gap,
          #     not a written test switched off. The canon forbids .skip and
          #     .only, not the backlog marker.
          #   - The runtime form `t.skip("...")` inside a node:test body is a
          #     conditional skip decided at execution time, which a static grep
          #     cannot tell from a legitimate one. It has its own gate:
          #     run-tests.sh fails any TIER-driven batch reporting a non-zero
          #     skip count, which is the only place the distinction (was the
          #     service supposed to be there?) is actually knowable.
          # Mirrors CLAUDE.md #32.
          MATCHES=$(grep -rnE "\b(it|test|describe|suite)\.(skip|only)\(" \
            apps/ packages/ --include="*.test.ts" --include="*.test.tsx" | \
            grep -vE "node_modules|/dist/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #32 violation::$COUNT committed .skip/.only test declaration(s) (expected 0). A skipped test is a test that never ran; a committed .only silently drops every sibling in its file. Delete the marker and fix or remove the test."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#33 Every extended root tsconfig listed in turbo.json globalDependencies"
        if: always()
        run: |
          set -uo pipefail
          # Turbo hashes per-package inputs plus globalDependencies and NOTHING
          # else, so a ROOT-level tsconfig a workspace package merely extends is
          # invisible to that package's hash. Editing it invalidates ZERO cache
          # entries and every dependent task replays a dist compiled with the
          # PREVIOUS compiler settings (target, module, declaration, skipLibCheck)
          # under a green exit code — a false green, reproduced end-to-end in
          # docs/reports/CI_CACHE_INTEGRITY_AUDIT.md. Membership is a
          # shell-pattern match because turbo accepts glob entries in
          # globalDependencies — a literal compare would flag configs a glob
          # already covers. The second pass walks ONE extends hop from every root
          # config that is listed or demanded by the first pass: a root->root
          # chain link (live today: tsconfig.build.base.json extends
          # tsconfig.base.json) is equally invisible to every per-package hash,
          # and since each properly listed link becomes checkable itself, longer
          # chains are covered link by link. Two skips, both justified:
          # non-relative extends targets resolve into node_modules and change
          # only with the lockfile, which turbo already hashes on its own;
          # targets that resolve inside a workspace directory stay covered by
          # that package's own input hash — in-tree today every relative target
          # resolves to a root config, so this second skip currently matches
          # nothing. Hard-zero. Mirrors CLAUDE.md #33.
          GLOBALS=$(tr -d ' \n' < turbo.json | grep -oE '"globalDependencies":\[[^]]*\]' | \
            grep -oE '"[^"]*"' | tr -d '"' | grep -v '^globalDependencies$' || true)
          listed() {
            # set -f keeps glob entries as case patterns instead of expanding them
            # against the working directory; restored on every return path.
            set -f
            for entry in $GLOBALS; do
              case "$1" in $entry) set +f; return 0;; esac
            done
            set +f
            return 1
          }
          MISSING=""
          REACHED=""
          for cfg in $(find apps packages infra -name 'tsconfig*.json' \
              -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.next/*' \
              -not -path '*/.turbo/*' 2>/dev/null); do
            for target in $(grep -oE '"extends"[[:space:]]*:[[:space:]]*(\[[^]]*\]|"[^"]*")' "$cfg" 2>/dev/null | \
                grep -oE '"[^"]*"' | tr -d '"' | grep -v '^extends$' || true); do
              case "$target" in ./*|../*) ;; *) continue;; esac
              resolved=$(realpath -m --relative-to="$PWD" "$(dirname "$cfg")/$target" 2>/dev/null || true)
              case "$resolved" in "" | */*) continue;; esac
              REACHED="$REACHED $resolved"
              listed "$resolved" || MISSING="$MISSING$cfg -> $resolved\n"
            done
          done
          for cfg in tsconfig*.json; do
            [ -f "$cfg" ] || continue
            if ! listed "$cfg"; then case " $REACHED " in *" $cfg "*) ;; *) continue;; esac; fi
            for target in $(grep -oE '"extends"[[:space:]]*:[[:space:]]*(\[[^]]*\]|"[^"]*")' "$cfg" 2>/dev/null | \
                grep -oE '"[^"]*"' | tr -d '"' | grep -v '^extends$' || true); do
              case "$target" in ./*|../*) ;; *) continue;; esac
              resolved=$(realpath -m --relative-to="$PWD" "$(dirname "$cfg")/$target" 2>/dev/null || true)
              case "$resolved" in "" | */*) continue;; esac
              listed "$resolved" || MISSING="$MISSING$cfg -> $resolved\n"
            done
          done
          COUNT=$(printf "%b" "$MISSING" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #33 violation::$COUNT root tsconfig(s) reached by a workspace extends but missing from turbo.json globalDependencies — edits to them invalidate zero turbo cache entries and dependent tasks replay a stale dist as a false green. Add each listed file to globalDependencies."
            printf "%b\n" "$MISSING" | head -20
            exit 1
          fi

      - name: "#34 Every ::error in a workflow step pairs with a real failure in the same step"
        if: always()
        run: |
          set -uo pipefail
          # echo "::error..." only ANNOTATES — the step still exits 0 and the run
          # stays green, so an unpaired ::error is a failure that fails nothing.
          # Pairing is per-STEP, not per-file: a step counts as paired only when
          # the SAME step carries a real failure mechanism (exit <n>, exit "$VAR",
          # core.setFailed). ::warning is out of scope — advisory by design
          # (audit.yml carries intentional ones). Residual limits, stated
          # honestly: this is a line-based tripwire, not a YAML parser — an
          # emission not written as `echo "::error` (printf, github-script
          # core.error) is invisible to it, and a mechanism named only in a
          # comment inside the step satisfies the pairing. Hard-zero.
          # Mirrors CLAUDE.md #34.
          VIOLATIONS=$(for wf in .github/workflows/*.yml; do
            awk -v f="$wf" '
              /^[[:space:]]*-[[:space:]]+(name|uses):/ {
                if (in_step && has_err && !has_fail) print f " line " start ": step emits ::error without exit/core.setFailed";
                in_step=1; has_err=0; has_fail=0; start=NR;
              }
              /echo "::error/ { has_err=1 }
              /exit[[:space:]]+[1-9]|exit[[:space:]]+"?\$[A-Za-z_]|core\.setFailed/ { has_fail=1 }
              END { if (in_step && has_err && !has_fail) print f " line " start ": step emits ::error without exit/core.setFailed" }
            ' "$wf"
          done)
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #34 violation::$COUNT workflow step(s) emit ::error without a real failure mechanism in the same step — the annotation leaves the job green. Pair every ::error with exit 1 / exit \"\$CODE\" / core.setFailed in its step."
            printf "%s\n" "$VIOLATIONS" | head -20
            exit 1
          fi

      - name: "#35 outputs:[] build overrides bound to verdict-only build scripts"
        if: always()
        run: |
          set -uo pipefail
          # A per-package turbo.json declaring "outputs": [] for build tells
          # turbo the task writes nothing. Paired with an EMITTING build script
          # it earns a green cache entry that restores NOTHING — every later
          # cache hit replays "built" while the dist is missing (the
          # silent-cache-of-nothing defect, the converse of ci.yml's
          # no-output-files gate). The override is legitimate ONLY while the
          # build is verdict-only (tsc --noEmit); a build that starts emitting
          # must delete the override in the same change. Hard-zero.
          # Mirrors CLAUDE.md #35.
          VIOLATIONS=""
          for tj in $(find apps packages infra -name 'turbo.json' -not -path '*/node_modules/*' 2>/dev/null); do
            tr -d ' \n' < "$tj" | grep -q '"build":{[^}]*"outputs":\[\]' || continue
            pkg="$(dirname "$tj")/package.json"
            script=$([ -f "$pkg" ] && tr -d '\n' < "$pkg" | grep -oE '"build":[[:space:]]*"[^"]*"' | head -1 || true)
            printf '%s' "$script" | grep -qE 'tsc[^"]*--noEmit' || VIOLATIONS="$VIOLATIONS$tj -> ${script:-no build script}\n"
          done
          COUNT=$(printf "%b" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #35 violation::$COUNT per-package turbo.json outputs:[] override(s) whose build script is not verdict-only (tsc --noEmit) — turbo would cache a green entry that restores nothing. Make the build verdict-only or delete the override so real outputs get cached."
            printf "%b\n" "$VIOLATIONS" | head -20
            exit 1
          fi

      - name: "#37 Coverage threshold floors never descend vs the PR base (pull_request only)"
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          FITNESS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          # The four literal thresholds in apps/api/vitest.config.ts are a
          # ratchet (autoUpdate raises them in the commit that earns them); the
          # only hand-written move to reject is a LOWERED number. pull_request
          # only: the subject is the PR's delta against its base — on push there
          # is no base and this step is skipped by its `if`. Reads the GLOBAL
          # thresholds block only, block comments dropped, so a commented-out
          # block cannot keep answering for a floor that no longer exists and a
          # per-scope block (CODING_STANDARDS §Coverage Targets) coexists.
          # Fail-closed on BOTH sides: head ambiguity and base ambiguity exit 1,
          # absent-on-base still passes by metric. A descent ships with a
          # `// canon-exception: <scenario>` marker on or above the lowered
          # literal, which this step honours and logs. A scenario in SUBJECTS
          # names its subject after a colon (ADR-0039), and a marker the base
          # already carries on that metric accepts no new descent. Mirrors
          # CLAUDE.md #37.
          set -uo pipefail
          BASE_REF="${FITNESS_BASE_REF:-origin/main}"
          if ! git rev-parse --verify --quiet "$BASE_REF^{commit}" >/dev/null; then
            for attempt in 1 2 3; do
              git fetch --quiet --depth=1 origin "$BASE_REF" && break
              [ "$attempt" -eq 3 ] || sleep $((attempt * 3))
            done
          fi
          if ! git rev-parse --verify --quiet "$BASE_REF^{commit}" >/dev/null; then
            echo "fitness #37: base ref $BASE_REF did not resolve after 3 fetch attempts — either the base commit is genuinely gone (force-push, deleted branch) or the fetch hit a transient network failure. Failing closed rather than comparing against nothing; re-run the job if the network was the cause."
            exit 1
          fi
          VIOLATIONS=$(FITNESS_BASE_SRC="$(git show "$BASE_REF:apps/api/vitest.config.ts" 2>/dev/null || true)" node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const HEAD_FILE = "apps/api/vitest.config.ts";
          const METRICS = ["lines", "functions", "branches", "statements"];
          // Scenarios from CLAUDE.md §Pragmatic Exceptions. A descent marked with anything
          // else is not a canon exception, it is an unlabelled one.
          const SCENARIOS = new Set(["migration", "prototype", "hotfix", "spike", "test-fixture", "decorative-demolition"]);
          // A scenario whose marker names its subject after a colon, and the subject's
          // grammar: decorative-demolition names the demolition slice the committed ledger
          // lists (ADR-0039), so each descent it accepts is attributable to one slice.
          const SUBJECTS = new Map([["decorative-demolition", /^[0-9]+(?:\.[0-9]+)+[a-z]?$/]]);

          // Split every line into its code half and its line-comment half: block-comment
          // bytes are dropped (a commented-out block must not keep answering for a floor
          // that no longer exists) and string literals are preserved verbatim (a glob key
          // like "src/**/*.ts" holds the exact byte pairs that a naive comment strip eats).
          // The canon-exception markers live in the comment half, which is why comments are
          // separated rather than discarded.
          const scanLines = (source) => {
            const lines = [];
            let code = "";
            let comment = "";
            let state = "code";
            let i = 0;
            while (i < source.length) {
              const c = source[i];
              if (c === "\n") {
                lines.push({ code, comment });
                code = "";
                comment = "";
                if (state === "line") state = "code";
                i += 1;
                continue;
              }
              if (state === "block") {
                if (c === "*" && source[i + 1] === "/") { state = "code"; i += 2; continue; }
                i += 1;
                continue;
              }
              if (state === "line") { comment += c; i += 1; continue; }
              if (c === '"' || c === "'" || c === "`") {
                let j = i + 1;
                while (j < source.length && source[j] !== c && source[j] !== "\n") j += source[j] === "\\" ? 2 : 1;
                code += source.slice(i, j + 1);
                i = j + 1;
                continue;
              }
              if (c === "/" && source[i + 1] === "/") { state = "line"; comment = "//"; i += 2; continue; }
              if (c === "/" && source[i + 1] === "*") { state = "block"; i += 2; continue; }
              code += c;
              i += 1;
            }
            lines.push({ code, comment });
            return lines;
          };
          const markerOf = (comment) => {
            const m = /canon-exception:\s*([a-z-]+)(?::(\S+))?/.exec(comment ?? "");
            if (m === null) return null;
            const id = m[2] === undefined ? m[1] : `${m[1]}:${m[2]}`;
            const grammar = SUBJECTS.get(m[1]);
            const why = !SCENARIOS.has(m[1]) ? "unlisted" : grammar !== undefined && !grammar.test(m[2] ?? "") ? "subject" : null;
            return { scenario: m[1], id, valid: why === null, why };
          };
          // Reads the GLOBAL thresholds block only. A metric is accepted only at the top
          // level of `thresholds: {`, so a per-scope block — which CODING_STANDARDS
          // §Coverage Targets requires (Domain 90 / Application 85 / Infrastructure 70) —
          // nests one level deeper and coexists instead of reading as ambiguity.
          const floorsOf = (source) => {
            const lines = scanLines(source);
            const found = new Map(METRICS.map((metric) => [metric, []]));
            let started = false;
            let depth = 0;
            for (let n = 0; n < lines.length; n += 1) {
              const { code, comment } = lines[n];
              const braces = code.replace(/"[^"]*"|'[^']*'|`[^`]*`/g, '""');
              if (!started) {
                if (/(^|[^A-Za-z0-9_$])thresholds\s*:\s*\{/.test(braces)) {
                  started = true;
                  depth = 1;
                }
                continue;
              }
              if (depth === 1) {
                const m = /^\s*(lines|functions|branches|statements)\s*:\s*([0-9]+(?:\.[0-9]+)?)\s*,?\s*$/.exec(code);
                if (m !== null) {
                  found.get(m[1]).push({
                    value: m[2],
                    marker: markerOf(comment) ?? markerOf(n > 0 ? lines[n - 1].comment : ""),
                  });
                }
              }
              for (const ch of braces) {
                if (ch === "{") depth += 1;
                else if (ch === "}") depth -= 1;
              }
              if (depth <= 0) break;
            }
            return started ? found : null;
          };
          const head = floorsOf(readFileSync(HEAD_FILE, "utf8"));
          if (head === null) {
            console.error(`fitness #37: no global 'thresholds: {' block found in ${HEAD_FILE} — the floor is missing, renamed, or commented out. The guard cannot see it, failing closed.`);
            process.exit(1);
          }
          const baseSource = process.env.FITNESS_BASE_SRC ?? "";
          const base = baseSource.trim() === "" ? null : floorsOf(baseSource);
          const violations = [];
          for (const metric of METRICS) {
            const headHits = head.get(metric);
            if (headHits.length !== 1) {
              const why = headHits.length === 0
                ? "the literal is missing, commented out, or built by a helper call"
                : "the GLOBAL block declares it more than once (a per-scope block nested deeper is ignored on purpose and is not this)";
              console.error(`fitness #37: expected exactly one literal '${metric}:' at the top level of the global thresholds block in ${HEAD_FILE}, found ${headHits.length} — ${why}; the guard cannot see the floor, failing closed.`);
              process.exit(1);
            }
            const baseHits = base === null ? [] : base.get(metric);
            // Absent on base passes BY METRIC: a base with no literal for it is the
            // pre-ratchet format, which has no comparable floor. TWO or more is ambiguity,
            // and ambiguity fails closed on this side exactly as it does on the head side —
            // an open base side let a 90 -> 56.9 descent through on all four metrics.
            if (baseHits.length === 0) continue;
            if (baseHits.length > 1) {
              console.error(`fitness #37: the base declares '${metric}:' ${baseHits.length} times at the top level of its global thresholds block — the guard cannot tell which value is the floor, failing closed (the head side fails closed on the same ambiguity).`);
              process.exit(1);
            }
            if (Number(headHits[0].value) >= Number(baseHits[0].value)) continue;
            const marker = headHits[0].marker;
            // A marker the base already carries on this metric accepted an earlier descent;
            // it accepts no new one, so every descent ships with a marker of its own.
            const inherited = marker !== null && marker.valid && baseHits[0].marker?.id === marker.id;
            if (marker !== null && marker.valid && !inherited) {
              console.error(`fitness #37: coverage.thresholds.${metric} lowered ${baseHits[0].value} -> ${headHits[0].value}, ACCEPTED under the 'canon-exception: ${marker.id}' marker on or above that line. The marker ships in the diff for a human to approve and carries its own follow-up per CLAUDE.md §Pragmatic Exceptions.`);
              continue;
            }
            if (inherited) {
              console.error(`fitness #37: coverage.thresholds.${metric} carries 'canon-exception: ${marker.id}', which the base already carries on that metric: it accepted an earlier descent and accepts no new one — not honoured.`);
            } else if (marker !== null && marker.why === "subject") {
              console.error(`fitness #37: coverage.thresholds.${metric} carries 'canon-exception: ${marker.id}', whose subject after the colon is missing or outside its scenario's grammar (${SUBJECTS.get(marker.scenario)}) — not honoured.`);
            } else if (marker !== null) {
              console.error(`fitness #37: coverage.thresholds.${metric} carries 'canon-exception: ${marker.id}', which is not a scenario from the CLAUDE.md §Pragmatic Exceptions allowed list (${[...SCENARIOS].join(", ")}) — not honoured.`);
            }
            violations.push(`coverage.thresholds.${metric} lowered: ${baseHits[0].value} (base) -> ${headHits[0].value} (head)`);
          }
          console.log(violations.join("\n"));
          EOF
          ) || { echo "fitness #37: the threshold extraction could not see a floor it must compare — failing closed (see the scope error above)"; exit 1; }
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #37 violation::$COUNT coverage threshold floor(s) lowered vs the PR base. The floor is a ratchet: autoUpdate raises it in the commit that earns it, and a regression below it goes red. The legitimate descent — deleting covered code lowers aggregate coverage — ships with a \`// canon-exception: <scenario>\` marker (scenario from CLAUDE.md §Pragmatic Exceptions) on the lowered literal's own line or the line directly above it; this step accepts THAT metric and logs what it accepted, and the marker stays in the diff for a human to approve."
            printf "%s\n" "$VIOLATIONS"
            exit 1
          fi

      - name: "#38 Soft-delete read coherence: no read of a swept soft-deletable model without its deletedAt filter"
        if: always()
        run: |
          # Mirrors CLAUDE.md #38. Closes the CLASS behind B-READS: the delete went
          # soft and ~90 read sites kept returning rows the tenant had deleted —
          # including getProjectAccess, an access GATE — while every suite stayed
          # green. Two streams from ONE detection: the swept tree is hard-zero;
          # packages/adapters/db-prisma is a RATCHET at its measured baseline
          # (SMELL-87) — live-wired reads whose sweep needs its own tests. The
          # baseline may fall and must never rise.
          set -uo pipefail
          SCHEMA=infra/prisma/schema.prisma
          SWEPT="account channel post project"
          UNSWEPT="conversationNote customerUser mediaAsset postComment task template"
          DBPRISMA=packages/adapters/db-prisma
          DBPRISMA_BASELINE=11
          for d in apps/api/src apps/workers/src packages "$DBPRISMA"; do
            [ -d "$d" ] || { echo "fitness #38 scope error: '$d' does not exist — the read scan would silently skip it. If $DBPRISMA was deleted, delete its ratchet here and in fitness.yml in the same change; a baseline naming an absent directory is a gate measuring nothing."; exit 1; }
          done
          ALL=$(awk '/^model /{m=$2} /^[[:space:]]+deletedAt[[:space:]]/{print tolower(substr(m,1,1)) substr(m,2)}' "$SCHEMA" | sort -u)
          [ -n "$ALL" ] || { echo "fitness #38 scope error: zero deletedAt-bearing models extracted from $SCHEMA — the column convention changed or the schema moved; the check would scan for nothing and pass, failing closed instead."; exit 1; }
          [ "$(echo $UNSWEPT | wc -w)" -le 6 ] || { echo "fitness #38 scope error: the UNSWEPT quarantine grew past its floor of 6 — it may only shrink. A new soft-deletable model is enrolled by sweeping its reads, not by quarantining it."; exit 1; }
          for m in $ALL; do
            case " $SWEPT $UNSWEPT " in *" $m "*) ;; *)
              echo "fitness #38 scope error: model '$m' carries deletedAt but is in neither the SWEPT set nor the UNSWEPT quarantine — sweep its reads and add it to SWEPT (or quarantine it with an owning backlog entry)."; exit 1;;
            esac
          done
          for m in $SWEPT $UNSWEPT; do
            printf '%s\n' "$ALL" | grep -qx "$m" || { echo "fitness #38 scope error: '$m' is listed but no longer carries deletedAt in $SCHEMA — delete the stale name so a future model cannot inherit its slot."; exit 1; }
          done
          MODELS=$(printf '%s|' $SWEPT); MODELS=${MODELS%|}
          EXCEPTIONS='/PrismaPostRepository\.ts:|/PrismaPostQueryRepository\.ts:|/SchedulingPostHandlers\.ts:|/CustomerAccountBillingService\.ts:|/gatewaySwitchProcessor\.ts:|/realtimeWebhookBroadcaster\.ts:|/PrismaAccountBillingRepository\.ts:'
          # ONE detection, two streams: the swept tree is hard-zero, db-prisma is the
          # same scan held against its baseline. Identical logic by construction — a
          # second copy would drift.
          scan_reads() {
            grep -rnE "\.($MODELS)\.(findFirst|findFirstOrThrow|findMany|findUnique|findUniqueOrThrow|count|aggregate|groupBy)\b" \
                "$@" --include="*.ts" | \
              grep -vE "/node_modules/|/dist/|/tests/|\.test\.ts:" | \
              grep -vE "$EXCEPTIONS" | grep -v "typeof " | \
              while IFS= read -r hit; do
                file=${hit%%:*}; rest=${hit#*:}; ln=${rest%%:*}
                from=$((ln - 15)); [ "$from" -lt 1 ] && from=1
                sed -n "${from},$((ln + 9))p" "$file" | grep -q "DELIBERATE soft-delete-sweep exception" && continue
                if sed -n "${ln},$((ln + 9))p" "$file" | grep -q "deletedAt" && \
                   ! printf '%s' "$hit" | grep -qE "\.findUnique(OrThrow)?\b"; then
                  continue
                fi
                printf '%s\n' "$hit"
              done
          }
          VIOLATIONS=$(scan_reads apps/api/src apps/workers/src packages | grep -vF "$DBPRISMA/") || true
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          DBPRISMA_HITS=$(scan_reads "$DBPRISMA") || true
          DBCOUNT=$(printf "%s" "$DBPRISMA_HITS" | grep -c . || true)
          DBCOUNT=${DBCOUNT:-0}
          echo "Fitness #38 (swept tree): $COUNT violations (expect 0)"
          echo "Fitness #38 (db-prisma ratchet): $DBCOUNT (baseline $DBPRISMA_BASELINE — may fall, must never rise)"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #38 violation::$COUNT read(s) of a swept soft-deletable model without the deletedAt filter. A soft-deleted row is not gone to the database, only to the reads that remember to filter it — an unfiltered read returns rows the tenant deleted (getProjectAccess was an ACCESS GATE doing exactly this). Filter with deletedAt: null, or mark a read that MUST see soft-deleted rows with the greppable marker 'DELIBERATE soft-delete-sweep exception' and its reason."
            printf "%s\n" "$VIOLATIONS"
            exit 1
          fi
          if [ "$DBCOUNT" -gt "$DBPRISMA_BASELINE" ]; then
            echo "::error title=Fitness #38 db-prisma ratchet::$DBCOUNT unfiltered reads in $DBPRISMA against a baseline of $DBPRISMA_BASELINE. The existing ones are owned as SMELL-87 (their sweep changes publish-worker and health-route behaviour and needs its own tests) — but the count may only FALL. A new unfiltered read in this package is a new violation hiding behind old debt."
            printf "%s\n" "$DBPRISMA_HITS"
            exit 1
          fi

      - name: "#39 Every accountId-bearing model is tenant-guard-enrolled or in the documented denylist"
        if: always()
        run: |
          # Mirrors CLAUDE.md #39. The gate whose absence let DeletionRecord land
          # carrying accountId with neither TENANT_SCOPED_MODELS nor any documented
          # denylist knowing it existed: the $extends guard silently SKIPS a model
          # it does not know (fail-open by construction), so an unenrolled
          # accountId-bearing model is cross-tenant by default (CWE-639).
          set -uo pipefail
          SCHEMA=infra/prisma/schema.prisma
          GUARD=infra/prisma/src/extensions/tenantGuard.ts
          DOC=docs/security/MULTI_TENANT_GUARDS.md
          for f in "$SCHEMA" "$GUARD" "$DOC"; do
            [ -f "$f" ] || { echo "::error title=Fitness #39 scope error::$f does not exist — the check would compare against nothing and pass, failing closed instead."; exit 1; }
          done
          BEARING=$(awk '/^model /{m=$2} /^[[:space:]]+accountId[[:space:]]/{print m}' "$SCHEMA" | sort -u)
          [ -n "$BEARING" ] || { echo "::error title=Fitness #39 scope error::zero accountId-bearing models extracted from $SCHEMA — the column convention changed; failing closed."; exit 1; }
          SCOPED=$(sed -n '/TENANT_SCOPED_MODELS = new Set/,/\]);/p' "$GUARD" | grep -oE '"[^"]+"' | tr -d '"')
          [ -n "$SCOPED" ] || { echo "::error title=Fitness #39 scope error::TENANT_SCOPED_MODELS extraction from $GUARD yielded zero names — the Set was renamed or is assembled at runtime; failing closed."; exit 1; }
          DENY=$(sed -n '/^## Global tables (denylist/,/^## /p' "$DOC" | sed -n '/^```/,/^```/p' | tr -s ' ' '\n' | grep -E '^[A-Z][A-Za-z0-9]*$' || true)
          [ -n "$DENY" ] || { echo "::error title=Fitness #39 scope error::the fenced table list under '## Global tables (denylist — guard bypasses)' in $DOC yielded zero names — the heading or the grid moved; failing closed."; exit 1; }
          VIOLATIONS=$(for model in $BEARING; do
            lower=$(printf '%s' "$model" | awk '{print tolower(substr($0,1,1)) substr($0,2)}')
            printf '%s\n' "$SCOPED" | grep -qx "$lower" && continue
            printf '%s\n' "$DENY" | grep -qx "$model" && continue
            echo "$model: accountId-bearing but neither enrolled in TENANT_SCOPED_MODELS nor named in the documented denylist"
          done) || true
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          echo "Fitness #39: $COUNT violations (expect 0)"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #39 violation::$COUNT accountId-bearing model(s) in neither TENANT_SCOPED_MODELS nor the documented denylist. The tenant guard silently SKIPS models it does not know, so an unenrolled model is cross-tenant by default. Enroll it (SECURITY_CANON §Multi-Tenant Isolation 3-step checklist) or denylist it in MULTI_TENANT_GUARDS.md with a design note saying WHY it must see across tenants."
            printf "%s\n" "$VIOLATIONS"
            exit 1
          fi

      - name: "#40 One transaction seam (allowlist) + the scope it binds is derived"
        if: always()
        run: |
          # Mirrors CLAUDE.md #40. Layer 2 of tenant isolation is a transaction-local
          # GUC, so a statement is covered only if the transaction it runs in bound
          # `app.account_id` first — and an operation that opens a transaction of its
          # own leaves its caller's connection, taking its caller's rollback with it.
          # Both properties come from ONE seam (`withGucBoundTransaction`), so a
          # transaction opened any other way in application code silently opts out of
          # both. ALLOWLIST, the #28 form: the dangerous set is open-ended (a raw batch
          # array, a hand-rolled interactive transaction, a helper that forgets the
          # marker, a hand-built scope) while the admissible set is small and nameable.
          #
          # `PrismaUnitOfWork` lives at `packages/adapters/db-prisma/src/unitofwork/` since
          # the Post persistence adapters were relocated there. The `/saga/sagaTenant\.ts:`
          # term is INERT — measured: `apps/api/src/saga/sagaTenant.ts` holds ZERO
          # `.$transaction(` calls (its two primitives open THROUGH
          # `withGucBoundTransaction`), so the floor of 3 is carried by TWO files:
          # `PrismaUnitOfWork.ts` once and `db-prisma/src/ChannelRepository.ts` twice. The
          # term stays listed until its deletion is authorised, and it is named here so a
          # reader does not trust a list that is one-third fiction.
          set -uo pipefail
          for d in apps/api/src packages/adapters/db-prisma/src; do
            [ -d "$d" ] || { echo "::error title=Fitness #40 scope error::'$d' does not exist — the scan would skip it silently and print 0."; exit 1; }
          done
          TX_SEAMS='/db-prisma/src/unitofwork/PrismaUnitOfWork\.ts:|/saga/sagaTenant\.ts:|/db-prisma/src/ChannelRepository\.ts:'
          tx_calls() {
            grep -rnE "\.\\\$transaction\(" apps/api/src packages/adapters/db-prisma/src --include="*.ts" | \
              grep -vE "/node_modules/|/dist/|/tests/|\.test\.ts:" | \
              grep -vE "^[^:]+:[0-9]+:[[:space:]]*(\*|//)"
          }
          SEAM_HITS=$(tx_calls | grep -cE "$TX_SEAMS" || true)
          if [ "${SEAM_HITS:-0}" -lt 3 ]; then
            echo "::error title=Fitness #40 scope error::the named seams hold ${SEAM_HITS:-0} \`.\$transaction(\` calls against a floor of 3 — the method was renamed, a seam moved, or the scan stopped matching. Failing closed rather than reporting a clean zero over code it never read."
            exit 1
          fi
          VIOLATIONS=$(tx_calls | grep -vE "$TX_SEAMS" || true)
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          echo "Fitness #40 part A: $COUNT transactions opened outside the seam (expect 0)"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #40 violation (part A)::$COUNT transaction(s) opened in application code outside the three named seams. A transaction opened without \`withGucBoundTransaction\` binds no tenant scope and holds no marker, so RLS fails closed on its statements and every operation inside it can escape onto a second pooled connection. Route it through the helper (or \`withTenantTransaction\` when a repository must join an open unit of work)."
            printf "%s\n" "$VIOLATIONS"
            exit 1
          fi
          # Part B — the scope a seam call binds is DERIVED from the same provider the
          # tenant guard reads, never hand-built. `withGucBoundTransaction` takes any
          # string, so without this a future site could mint a scope that disagrees with
          # the accountId layer 1 injected. The saga is the one named exception: its
          # primitives take the account explicitly because a saga step has no ambient
          # request, and that module exists to keep the surface narrow.
          #
          # The relocated `@core/domain` adapters under
          # packages/adapters/db-prisma/src/{post,outbox,unitofwork} have no ambient request
          # either: they take a TenantContextProvider by constructor and derive the scope as
          # `resolveGucScope(this.tenantProvider)` — the same function `getAmbientGucScope()`
          # wraps, over the provider the composition root handed them. That is the second
          # admissible expression, and those three directories are Part B's second scope; each
          # must exist or the check fails closed, which also pins the relocation's layout. The
          # FLAT db-prisma files (MentionRepository.ts, ProjectRepository.ts, PostRepository.ts
          # — 6 sites measured) keep the explicit-scope worker convention and stay OUTSIDE
          # Part B, as residual (4) states; they were not exempted by file because the exempt
          # list may only shrink.
          PART_B_SCOPE="apps/api/src packages/adapters/db-prisma/src/post packages/adapters/db-prisma/src/outbox packages/adapters/db-prisma/src/unitofwork"
          for d in $PART_B_SCOPE; do
            [ -d "$d" ] || { echo "::error title=Fitness #40 scope error::Part B scope '$d' does not exist — a relocated adapter home is gone, and the scan would skip it silently and print 0."; exit 1; }
          done
          SCOPE_EXEMPT='/saga/sagaTenant\.ts:'
          seam_call_sites() {
            grep -rnE "withGucBoundTransaction\(" $PART_B_SCOPE --include="*.ts" | \
              grep -vE "/node_modules/|/dist/|/tests/|\.test\.ts:" | \
              grep -vE "^[^:]+:[0-9]+:[[:space:]]*(import|\*|//)" | \
              grep -vE "$SCOPE_EXEMPT"
          }
          SITES=$(seam_call_sites | grep -c . || true)
          if [ "${SITES:-0}" -lt 10 ]; then
            echo "::error title=Fitness #40 scope error::${SITES:-0} seam call sites found against a floor of 10 — the helper was renamed or the adoption was undone. Failing closed."
            exit 1
          fi
          UNDERIVED=$(seam_call_sites | while IFS= read -r hit; do
            file=${hit%%:*}; rest=${hit#*:}; ln=${rest%%:*}
            sed -n "${ln},$((ln + 3))p" "$file" | grep -qE "getAmbientGucScope\(\)|resolveGucScope\(this\.tenantProvider\)" || printf '%s\n' "$hit"
          done)
          BCOUNT=$(printf "%s" "$UNDERIVED" | grep -c . || true)
          BCOUNT=${BCOUNT:-0}
          echo "Fitness #40 part B: $BCOUNT seam calls with an underived scope (expect 0)"
          if [ "$BCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #40 violation (part B)::$BCOUNT seam call(s) bind a scope that is not \`getAmbientGucScope()\` or \`resolveGucScope(this.tenantProvider)\`. Layer 1 (the guard's injected accountId) and layer 2 (the policy's GUC) must come from the SAME provider object, or a request can inject one tenant and bind another. Use \`getAmbientGucScope()\` (or \`withTenantTransaction\`, which calls it) in apps/api, and \`resolveGucScope(this.tenantProvider)\` in a relocated adapter."
            printf "%s\n" "$UNDERIVED"
            exit 1
          fi
          # RESIDUAL LIMITS, stated rather than implied — mirrors CLAUDE.md #40 verbatim.
          # (1) Textual, not a parser: a call reached through an alias
          # (`const t = prisma.$transaction`) or built by string is invisible — the floors above
          # turn a wholesale rename into a red, but not a single deliberately obfuscated call.
          # (2) Part B proves the scope EXPRESSION, not that the provider behind it is the
          # guard's — that one is structural instead, because `getAmbientGucScope()` and the
          # guard read the same exported `ambientTenantContextProvider` object; at the relocated
          # sites the provider's identity is a property of the composition root instead, proven
          # by `setupRepositories.test.ts` and `tenantGucTransactionBinding.integration.test.ts`.
          # (3) A whole-file
          # seam exemption exempts future calls in that file; the exempt list is `sagaTenant.ts`
          # alone and may only shrink. (4) The FLAT `packages/adapters/db-prisma` files are in
          # Part A's scope but not Part B's: they have no ambient request to derive from, and
          # their explicit-scope convention is the shipped worker pattern. Its
          # `{post,outbox,unitofwork}` subdirectories are in BOTH — the relocated adapters
          # derive their scope from an injected provider, so the derivation is greppable there.
          # (5) `apps/workers/src` IS OUTSIDE BOTH PARTS, and its transactions are therefore
          # UNGATED. Part A's scope is `apps/api/src` + `packages/adapters/db-prisma/src`;
          # Part B's is `apps/api/src` plus those three relocated subdirectories. Measured at
          # the time of writing: 2
          # `.$transaction(` calls live there — `services/ChannelAuthFailureRecorder.ts` and
          # `mentionIngestWorker.ts` — and neither part reads them. The exclusion is deliberate
          # (the worker process has no ambient request to derive a scope from) and is declared
          # in this change's tasks under 6b.7; converting that seam belongs to the links that
          # own the worker process. It is named HERE because a residual a future reader cannot
          # see in the gate is not a stated residual, and this is the check they will read.

      - name: "#41 Single-use claim shape: a consumption marker in data names its credential in where"
        if: always()
        run: |
          # Mirrors CLAUDE.md #41.
          # 41. Single-use claim shape. An ALLOWLIST-by-shape gate in the #28/#40 form, and the CLASS gate the
          # admin reset/rotation slice (SMELL-97) owes: a Prisma write whose `data` carries a CONSUMPTION MARKER
          # for a single-use credential must name that credential's prior state in the SAME call's `where`.
          #
          # Threat, in one line: a consuming write that does not name the credential it consumes lets two callers
          # consume it once each. Keyed on `{ id }` alone the write matches whether or not the credential still
          # exists — EvalPlanQual re-checks only the columns the WHERE names, and `id` is never contested — so two
          # presentations of ONE token both pass the read and both write, and the last writer owns the account.
          # Named, the write is a compare-and-swap the database serialises, and `count` is the verdict.
          #
          # POPULATION, measured when the gate landed: 8 marker sites = 7 claim sites + 1 named issuance exception.
          # Of the 7 claims, 2 were unsound before this gate's slice and 0 after —
          # PasswordService.confirmPasswordReset and authServiceSession.refreshTokens are the two it converted; the
          # customer reset claim and the four MFA claims were already sound. SITE_FLOOR holds that population: the
          # floor may fall and must never rise — it falls only with the deliberate removal of a site, never to
          # absorb a new violation.
          # ALLOWLIST by shape: the dangerous set is open-ended, the admissible shape is one sentence. MARKERS are
          # the literal `data` forms that consume a credential today:
          #   passwordResetToken: null     admin reset consumed
          #   resetToken: null             customer reset consumed
          #   mfaBackupUsedAt: <value>     backup-code used-map extended (`{}` is a re-enrolment
          #                                RESET, excluded by the lookahead)
          #   mfaLastUsedTotpStep: <value> TOTP step advanced
          #   refreshTokenHash <: , }>     refresh token rotated — the property-shorthand form
          #                                `{ refreshTokenHash }` is matched too, so a rotation
          #                                is never exempt by syntax
          # STRUCTURAL, not line-windowed: each `.update(` / `.updateMany(` / `.upsert(` call's argument is sliced
          # to its balanced close (this step's own string- and comment-aware slicer); the `data:` literal (`update:` for upsert)
          # is tested for a marker, whose column must then appear as a key in that SAME call's `where:` literal. A
          # `select:` cannot satisfy the gate — a line window could not tell the two apart.
          # NAMED EXCEPTION, exactly one, held to exactly ONE site so a second write in that file fails closed:
          # PrismaAdminSessionRepository.updateRefreshTokenHash is the second step of session ISSUANCE —
          # createSession inserts a throwaway hash nobody holds, mints the JWT that embeds the new session id, then
          # swaps the real hash in — so no presented credential is consumed. Remove-when: the session id is minted
          # before the insert and the final hash written on create. The exemption keys on FILE + COLUMN while its
          # justification is a property of the CALLERS: it is sound only while updateRefreshTokenHash has ONE
          # caller (verified tree-wide at apply: authServiceCore.ts:383, inside createSession) — a second consuming
          # caller would inherit it unseen.
          # OUT OF CLASS by decision, not oversight — writes this gate is silent on, and why: idempotent session
          # revocations (`isActive: false` keyed on `isActive: true`; revoking twice is one state); the outbox
          # work-item lease (a lease, not a credential); the customer refresh flow (a stateless JWT with NO
          # server-side consumption marker — SMELL-113's subject, not a marker site); the SECOND admin refresh flow
          # (`AdminAuthService.refreshToken`, the ADMIN_JWT_*/TokenService family: compares the stored hash and
          # issues only a new ACCESS token — it never rotates, so there is no consuming write for this gate to see;
          # its lifetime-of-token non-rotation is its own backlog row, the admin twin of SMELL-113); and the admin
          # reset ISSUANCE that writes the "CHANGE_REQUIRED" sentinel (an issuance, not a consumption — SMELL-110).
          # FAIL-CLOSED: a missing scope directory, fewer than SITE_FLOOR marker sites, or an exception count other
          # than 1 is a blind scan, not a clean one — exit 1. SCOPE: apps/api/src apps/workers/src packages
          # infra/prisma/src, *.ts, minus node_modules/dist/tests/generated. infra/prisma/scripts is OUT
          # by path: the backfill's `data: { passwordResetToken: null }` keyed on id is the `migration`
          # canon-exception scenario (a one-off over rows it selected itself), and so is every future script there
          # — stated, not hidden.
          # RESIDUAL LIMITS, stated rather than implied. (1) Textual, not a type-checker: `data` or `where` passed
          # by identifier, spread, or built by a helper is invisible — the generic `update(id, data)` helpers on
          # the admin-user and MFA adapters are exactly that shape; a claim routed through one must be enrolled by
          # hand. (2) The gate proves the column is NAMED in `where`, not that the predicate is right
          # (`refreshTokenHash: { not: null }` would pass); the racers own the predicate. (3) The marker list is
          # enumerated, not derived from the schema — "single-use" is not a schema property — so a NEW credential
          # column is invisible until its marker is added (the How-to-extend step). (4) Cache-backed consumption
          # (`OAuthFlowStore.consume`, a read-then-delete outside Prisma) and raw SQL (fitness #23's domain, itself
          # blind to tagged templates — SMELL-111) are outside. (5) `upsert`'s `create` arm is not checked:
          # creation issues, never consumes. (6) The slicer keeps string-literal bytes and knows no regex literals:
          # a marker inside a string is a false positive it does not filter, and a regex literal with an unbalanced
          # brace or quote inside a write call mis-slices that call — at a marker site the site is dropped, which
          # the floor turns into exit 1 (fail-closed); neither exists in scope today. (7) Line-window matching is
          # NOT a limit here: the #38 form pairs `data` and `where` inside a bounded window and misses a call whose
          # halves sit further apart; this gate slices the whole argument, so that residual is eliminated and (6)
          # replaces it.
          # Hard-zero.
          set -uo pipefail
          for d in apps/api/src apps/workers/src packages infra/prisma/src; do
            [ -d "$d" ] || { echo "fitness #41 scope error: '$d' does not exist — the scan would skip it silently and print 0."; exit 1; }
          done
          VIOLATIONS=$(node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          import { glob } from "node:fs/promises";

          const SCOPE = ["apps/api/src", "apps/workers/src", "packages", "infra/prisma/src"];
          const SKIP = /(^|\/)(node_modules|dist|tests|generated)\//;
          const MARKERS = [
            { column: "passwordResetToken", re: /\bpasswordResetToken\s*:\s*null\b/ },
            { column: "resetToken", re: /\bresetToken\s*:\s*null\b/ },
            { column: "mfaBackupUsedAt", re: /\bmfaBackupUsedAt\s*:\s*(?!\{\s*\})/ },
            { column: "mfaLastUsedTotpStep", re: /\bmfaLastUsedTotpStep\s*:/ },
            { column: "refreshTokenHash", re: /\brefreshTokenHash\s*[:,}]/ },
          ];
          const SITE_FLOOR = 8;
          const EXCEPTION = {
            file: "apps/api/src/infrastructure/repositories/PrismaAdminSessionRepository.ts",
            column: "refreshTokenHash",
          };
          // Slice from `open` at `from` to its balanced `close`, dropping comment bytes and
          // skipping brackets inside string/template literals (this step's own slicer).
          const sliceBalanced = (src, from, open, close) => {
            let depth = 0;
            let i = from;
            let body = "";
            while (i < src.length) {
              const c = src[i];
              if (c === '"' || c === "'" || c === "`") {
                let j = i + 1;
                while (j < src.length && src[j] !== c) j += src[j] === "\\" ? 2 : 1;
                body += src.slice(i, j + 1);
                i = j + 1;
                continue;
              }
              if (c === "/" && src[i + 1] === "/") {
                const nl = src.indexOf("\n", i);
                i = nl === -1 ? src.length : nl;
                continue;
              }
              if (c === "/" && src[i + 1] === "*") {
                const end = src.indexOf("*/", i + 2);
                i = end === -1 ? src.length : end + 2;
                continue;
              }
              if (c === open) depth += 1;
              if (c === close && --depth === 0) return body + c;
              body += c;
              i += 1;
            }
            return null;
          };
          const literalOf = (args, key) => {
            const m = new RegExp(`(^|[{,\\s])${key}\\s*:\\s*\\{`).exec(args);
            return m === null ? null : sliceBalanced(args, m.index + m[0].length - 1, "{", "}");
          };
          const files = [];
          for (const dir of SCOPE) {
            for await (const f of glob("**/*.ts", { cwd: dir })) {
              const path = `${dir}/${f}`;
              if (!SKIP.test(path) && !path.endsWith(".test.ts")) files.push(path);
            }
          }
          files.sort();
          let sites = 0;
          let exceptionHits = 0;
          const violations = [];
          for (const file of files) {
            const src = readFileSync(file, "utf8");
            const call = /\.(update|updateMany|upsert)\s*\(/g;
            let m;
            while ((m = call.exec(src)) !== null) {
              const args = sliceBalanced(src, m.index + m[0].length - 1, "(", ")");
              if (args === null) continue;
              const data = literalOf(args, m[1] === "upsert" ? "update" : "data");
              if (data === null) continue;
              const line = src.slice(0, m.index).split("\n").length;
              for (const { column, re } of MARKERS) {
                if (!re.test(data)) continue;
                sites += 1;
                if (file === EXCEPTION.file && column === EXCEPTION.column) {
                  exceptionHits += 1;
                  continue;
                }
                const where = literalOf(args, "where");
                if (where === null) {
                  violations.push(`${file}:${line}: ${column} consumed in data, and the call has no where literal to name it`);
                  continue;
                }
                if (!new RegExp(`\\b${column}\\s*:`).test(where)) {
                  violations.push(`${file}:${line}: ${column} consumed in data but not named in where`);
                }
              }
            }
          }
          if (sites < SITE_FLOOR) {
            console.error(`fitness #41 scope error: ${sites} marker sites found against a floor of ${SITE_FLOOR} — a marker was renamed, a claim moved out of scope, or the scan stopped matching. Failing closed rather than reporting a clean zero over code it never read.`);
            process.exit(1);
          }
          if (exceptionHits !== 1) {
            console.error(`fitness #41 scope error: the named exception matched ${exceptionHits} site(s) in ${EXCEPTION.file}; it covers exactly one issuance write. A second write there is not covered by its reasoning, and zero means the site moved — delete the exception with it.`);
            process.exit(1);
          }
          console.log(violations.join("\n"));
          EOF
          ) || { echo "::error title=Fitness #41 scan error::the scan crashed or the scope is invalid — failing closed (needs node >= 22 for fs.glob)"; exit 1; }
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          echo "Fitness #41: $COUNT violations (expect 0)"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #41 violation::$COUNT single-use claim(s) consume a credential in data without naming it in where. A write keyed on id alone lets two presentations of one token both succeed (the SMELL-97 TOCTOU). Name the credential's prior state in the same call's where so the database serialises the claim and count is the verdict."
            printf "%s\n" "$VIOLATIONS"
            exit 1
          fi

      - name: "#42 No install-lifecycle script in a workspace package (one named exception)"
        if: always()
        run: |
          # Mirrors CLAUDE.md #42.
          # 42. No install-lifecycle script in a workspace package, except the ONE named.
          # The gate the `pnpm deploy` switch owes: both image pipelines now deploy with
          # `--ignore-scripts`, because @infra/prisma's `postinstall: prisma generate` has
          # no CLI to run in a prod tree and its emit is already inside the dist being
          # copied. That flag is correct for THAT package and silent for every other: a
          # package that later declares `postinstall`, `prepare` or `install` has its
          # script SKIPPED in the production tree with nothing anywhere reporting the
          # skip, and the first symptom is a runtime failure in production — the exact
          # shape (a green build over work that never ran) this suite exists to prevent.
          # MEASURED at the time of writing: 104 manifests under apps/ packages/ infra/,
          # of which exactly ONE declares an install-lifecycle script, and it is the named
          # exception. So this lands hard-zero with no ramp-down.
          # SCOPED TO `.scripts`, VIA jq, AND THAT IS NOT STYLE. A regex over the whole
          # manifest matches a DEPENDENCY named `prepare`, `install` or `postinstall` —
          # all real, publishable npm names — and would fail the workflow over something
          # this gate is explicitly not trying to prevent. The mirror is worse: the
          # fail-closed guard below would keep passing on a dependency named `postinstall`
          # after the exception's script was deleted, quietly defeating the very intent it
          # cites. Asking jq for the keys of `.scripts` removes both paths.
          # ONE EXCLUSION VOCABULARY, for the same reason. The floor walk and the
          # violation walk must open the SAME files: if the floor counted a directory the
          # scan skipped, TOTAL could clear 90 over manifests VIOLATIONS never read, which
          # is the failure mode the floor exists to prevent. `manifests()` backs both.
          # FAIL-CLOSED on both sides. If the exception stops declaring ANY lifecycle
          # script, the check exits 1 rather than quietly exempting whatever is re-created
          # at that path — the rule #30's quarantine holds too, where an entry whose file
          # is gone fails. And if fewer than 90 manifests are found the workspace layout
          # moved and the gate would report a clean zero over packages it never opened, so
          # that exits 1 too.
          # RESIDUAL LIMIT, stated rather than implied: this proves no manifest DECLARES
          # such a script. It does not prove a dependency's install script is unnecessary —
          # that is `allowBuilds` in pnpm-workspace.yaml, a different list with a different
          # owner. Nor does it prove @infra/prisma's own skip stays safe; that holds only
          # while `prisma generate` runs explicitly in the build stage before the deploy,
          # which both Dockerfiles do and neither may stop doing.
          set -uo pipefail
          EXCEPTION="infra/prisma/package.json"
          LIFECYCLE_KEYS='["preinstall","install","postinstall","prepare","prepublishOnly"]'
          manifests() {
            find apps packages infra -name package.json \
              -not -path '*/node_modules/*' -not -path '*/dist/*' \
              -not -path '*/.next/*' 2>/dev/null
          }
          declares_lifecycle() {
            jq -e --argjson keys "$LIFECYCLE_KEYS" \
              '(.scripts // {}) | keys_unsorted | any(. as $k | $keys | index($k) != null)' "$1" >/dev/null 2>&1
          }
          if ! declares_lifecycle "$EXCEPTION"; then
            echo "fitness #42 scope error: the named exception $EXCEPTION no longer declares any install-lifecycle script — delete the exception with it, or a package re-created under that path inherits it unscanned."
            exit 1
          fi
          TOTAL=$(manifests | wc -l)
          if [ "$TOTAL" -lt 90 ]; then
            echo "fitness #42 scope error: only $TOTAL manifests found against a floor of 90 — the workspace layout moved and this gate would report a clean zero over packages it never opened."
            exit 1
          fi
          VIOLATIONS=$(manifests | while IFS= read -r f; do
            declares_lifecycle "$f" || continue
            [ "$f" = "$EXCEPTION" ] && continue
            echo "$f declares an install-lifecycle script; both image pipelines deploy with --ignore-scripts, so it would be skipped in the production tree with nothing reporting the skip"
          done)
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          echo "$COUNT"   # expect 0
          echo "Fitness #42: $COUNT violations (expect 0)"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #42 violation::$COUNT workspace package(s) declare an install-lifecycle script. Both image pipelines deploy with --ignore-scripts, so the script is SKIPPED in the production tree with nothing reporting the skip, and the first symptom is a runtime failure in production. Move the work into the package's build, or run it explicitly in the build stage the way prisma generate is run."
            printf "%s\n" "$VIOLATIONS"
            exit 1
          fi

      - name: "#43 One route-test composition root: every harness composes through the seam"
        if: always()
        run: |
          # Mirrors CLAUDE.md #43.
          # 43. One route-test composition root. An ALLOWLIST (the #28/#40 form), two arms.
          # Threat: `setupContainer` requires `apiMetrics`, and `apps/api/tests` is opened by NO
          # compiler — `tsconfig.json` includes `src` only, `tsconfig.type-tests.json` includes only
          # `*.type-test.ts` — so that requirement had an enforcement surface of ONE call site while
          # 22 harnesses omitted it and registered `TOKENS.ApiMetrics` as `undefined`. There was no
          # runtime signal either: `Container.ts:86` takes the cached-instance fast path only when
          # `instance !== undefined`, so a registration OF undefined falls through to the stored
          # `() => instance` factory and hands the undefined straight back — the "Service not
          # registered" throw at `:79` never fires. `RedisBruteForceAdapter` then dereferences it
          # unguarded on the customer login path.
          # ALLOWLIST, not denylist: the wrong shapes are open-ended while the admissible set is
          # three named files that together OWN the seam — the seam, its suite, and its
          # compile-time pin. FAIL-CLOSED on scope twice: the three files must exist, and the total
          # invocation count is held against a floor measured at 6 when the gate landed.
          set -uo pipefail
          SEAM=apps/api/tests/unit/helpers/testContainer.ts
          SEAMTEST=apps/api/tests/unit/helpers/testContainer.test.ts
          PIN=apps/api/tests/unit/infrastructure/container/containerSetupOptionsContract.type-test.ts
          for f in "$SEAM" "$SEAMTEST" "$PIN"; do
            if [ ! -f "$f" ]; then
              echo "::error title=Fitness #43 scope error::$f does not exist — the allowlist names a file that is gone, so the scan would print a clean zero over a seam nobody owns."
              exit 1
            fi
          done
          invocations() {
            grep -rn "setupContainer({" apps/api/src apps/api/tests --include="*.ts" | \
              grep -vE "node_modules|/dist/" | \
              grep -vE "^[^:]+:[0-9]+:[[:space:]]*(//|\*)" | \
              grep -v "/container/setup\.ts:"
          }
          FLOOR=$(invocations | grep -c . || true)
          FLOOR=${FLOOR:-0}
          if [ "$FLOOR" -lt 6 ]; then
            echo "::error title=Fitness #43 scope error::$FLOOR invocations found against a floor of 6 — setupContainer was renamed, the seam moved, or the scan stopped matching. Failing closed rather than reporting a clean zero over code it never read."
            exit 1
          fi
          SRC_BAD=$(invocations | grep "^apps/api/src/" | grep -v "apiMetrics" | grep -c . || true)
          SRC_BAD=${SRC_BAD:-0}
          TST_BAD=$(invocations | grep "^apps/api/tests/" | grep -vE "^($SEAM|$SEAMTEST|$PIN):" | grep -c . || true)
          TST_BAD=${TST_BAD:-0}
          echo "Fitness #43: $FLOOR invocations, SRC_BAD=$SRC_BAD, TST_BAD=$TST_BAD (expect 0 and 0)"
          if [ "$SRC_BAD" -gt 0 ]; then
            echo "::error title=Fitness #43 violation (production)::$SRC_BAD production setupContainer call(s) do not name apiMetrics on the invocation line. The composition root must pass the collector the bootstrap built; a container without it registers TOKENS.ApiMetrics as undefined and resolution hands that undefined back without throwing."
            invocations | grep "^apps/api/src/" | grep -v "apiMetrics"
            exit 1
          fi
          if [ "$TST_BAD" -gt 0 ]; then
            echo "::error title=Fitness #43 violation (harness)::$TST_BAD harness call(s) bypass createRouteTestContainer. A route unit suite has no bootstrap to build an ApiMetrics from, so it composes through apps/api/tests/unit/helpers/testContainer.ts, whose options type makes the omission inexpressible. Nothing under apps/api/tests is typechecked, so this gate is the only thing that sees the bypass."
            invocations | grep "^apps/api/tests/" | grep -vE "^($SEAM|$SEAMTEST|$PIN):"
            exit 1
          fi

      - name: "#44 Fitness inventory is contiguous and its count is derived"
        if: always()
        run: |
          # Mirrors CLAUDE.md #44. The rule, its fail-closed paths and its residual limits live in
          # scripts/testing/fitness-inventory-gate.mjs, pinned by
          # apps/api/tests/unit/scripts/fitnessInventoryGate.test.ts. This step only runs it; the
          # script derives N from the step names above and writes the job summary from it.
          set -euo pipefail
          if ! node scripts/testing/fitness-inventory-gate.mjs --summary "${GITHUB_STEP_SUMMARY:-/dev/null}"; then
            echo "::error title=Fitness #44 violation::The fitness inventory has a hole or a duplicate, fitness.yml and CLAUDE.md §Automated Compliance Checks disagree on its set, the stated count is not the derived N, or the gate could not read one of its inputs. The fitness-inventory-gate lines above name each violation with its file and line."
            exit 1
          fi

      - name: "#49 Every test-block lint rule stays at error and no inline directive turns one off"
        if: always()
        run: |
          # Mirrors CLAUDE.md #49. eslint-suppressions.json holds the tree's test blocks that cannot
          # fail at the count they had when their rules landed, and lets it only shrink; that holds
          # only while each rule is an error. Part A pins each rule's error line in
          # eslint.config.ts, exactly as prettier writes it: no-console's line in the test-files
          # block, with console.warn and console.error as its only allowed members, and its one off
          # block, scoped to the runner's entry points (unrunTestFiles); and it refuses any line that
          # sets one of the eleven test-block rules to off or warn (no-console is left out of that
          # scan: its off lines are the scripts, stories, seeds and runner blocks). Part B refuses an
          # inline eslint-disable directive naming one of the twelve rules in a tracked .ts or .tsx
          # file: a directive takes a block out of the ratchet without pruning it. Fail-closed: a
          # missing config, and a git grep that cannot read the tree, each exit 1.
          set -uo pipefail
          CONFIG=eslint.config.ts
          if [ ! -f "$CONFIG" ]; then
            echo "::error title=Fitness #49 scope error::$CONFIG does not exist, so no rule can be pinned and a zero would be a blind one."
            exit 1
          fi
          # Part A: each rule holds its `error` line in the config. Three forms, one pin each: the ten
          # single-line rules below (SINGLE_LINE_RULES), expect-expect's two-line array (EXPECT_PIN), and
          # no-console's bracketed allow list (CONSOLE_PIN) with its one off block (RUNNER_OFF, RUNNER_PIN).
          SINGLE_LINE_RULES="vitest/no-conditional-expect vitest/valid-expect vitest/no-standalone-expect vitest/no-identical-title vitest/no-commented-out-tests vitest/no-disabled-tests vitest/no-focused-tests testing/no-empty-test testing/no-existence-only-test testing/no-tautological-assertion"
          MISSING=""
          for rule in $SINGLE_LINE_RULES; do
            PIN=$(grep -cxF "      \"$rule\": \"error\"," "$CONFIG" || true)
            [ "${PIN:-0}" -ge 1 ] || MISSING="$MISSING $rule"
          done
          EXPECT_PIN=$(grep -A1 -xF '      "vitest/expect-expect": [' "$CONFIG" | grep -cxF '        "error",' || true)
          [ "${EXPECT_PIN:-0}" -ge 1 ] || MISSING="$MISSING vitest/expect-expect"
          CONSOLE_PIN=$(grep -A2 -xF '    files: testFiles,' "$CONFIG" | grep -cxF '      "no-console": ["error", { allow: ["warn", "error"] }],' || true)
          [ "${CONSOLE_PIN:-0}" -ge 1 ] || MISSING="$MISSING no-console(test files)"
          RUNNER_OFF=$(grep -cxF '    rules: { "no-console": "off" },' "$CONFIG" || true)
          RUNNER_PIN=$(grep -B1 -xF '    rules: { "no-console": "off" },' "$CONFIG" | grep -cxF '    files: unrunTestFiles,' || true)
          [ "${RUNNER_OFF:-0}" -eq 1 ] && [ "${RUNNER_PIN:-0}" -eq 1 ] || MISSING="$MISSING no-console-off(runner entry points only)"
          RULES_RE='vitest/(expect-expect|no-conditional-expect|valid-expect|no-standalone-expect|no-identical-title|no-commented-out-tests|no-disabled-tests|no-focused-tests)|testing/(no-empty-test|no-existence-only-test|no-tautological-assertion)'
          WEAKENED=$(grep -nE "\"($RULES_RE)\": *(\"(off|warn)\"|[01]\b|\[ *(\"(off|warn)\"|[01]\b))" "$CONFIG" || true)
          WCOUNT=$(printf "%s" "$WEAKENED" | grep -c . || true); WCOUNT=${WCOUNT:-0}
          # Part B: no inline directive turns one of them off in a tracked source file.
          DSTATUS=0
          DIRECTIVES=$(git grep -nE "eslint-disable[^*]*($RULES_RE|no-console)" -- '*.ts' '*.tsx' ':!eslint.config.ts') || DSTATUS=$?
          if [ "$DSTATUS" -gt 1 ]; then
            echo "::error title=Fitness #49 scope error::git grep exited $DSTATUS over the tracked TypeScript files, so a zero would be a blind one."
            exit 1
          fi
          DCOUNT=$(printf "%s" "$DIRECTIVES" | grep -c . || true); DCOUNT=${DCOUNT:-0}
          echo "Fitness #49: missing pins:${MISSING:- none}; weakened=$WCOUNT; inline directives=$DCOUNT (expect none, 0 and 0)"
          if [ -n "$MISSING" ]; then
            echo "::error title=Fitness #49 violation::eslint.config.ts no longer sets these rules to error on their globs, or a reformat moved their lines (the pins are indentation-exact, so a moved line reads as a missing one):$MISSING. Each one names a test block that cannot fail or a test that hides from its runner, and eslint-suppressions.json holds the tree's violations only while the rule is an error; at warn or off the ratchet stops counting and the classes grow back unseen."
          fi
          if [ "$WCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #49 violation::eslint.config.ts sets one of the test-block rules to off or warn on some glob; a later block overrides the error line the pin reads."
            printf "%s\n" "$WEAKENED"
          fi
          if [ "$DCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #49 violation::$DCOUNT inline eslint-disable directive(s) name a test-block rule or no-console: a directive takes a block out of the suppressions ratchet without pruning anything. Fix the block, or delete it and prune its entry with eslint . --prune-suppressions."
            printf "%s\n" "$DIRECTIVES" | head -20
          fi
          if [ -n "$MISSING" ] || [ "$WCOUNT" -gt 0 ] || [ "$DCOUNT" -gt 0 ]; then
            exit 1
          fi

      - name: "#53 Every tracked artifact is in English and names roles, never a person"
        if: always()
        run: |
          # Mirrors CLAUDE.md #53. The rule, its exemptions, its fail-closed paths and its residual
          # limits live in scripts/testing/artifact-language-gate.mjs, pinned by
          # apps/api/tests/unit/scripts/artifactLanguageGate.test.ts. It reads git's listing and the
          # tracked files only, so it runs here, in the job that installs nothing.
          set -euo pipefail
          if ! node scripts/testing/artifact-language-gate.mjs; then
            echo "::error title=Fitness #53 violation::A tracked file's Spanish lines or personal-name mentions differ from scripts/testing/artifact-language-baseline.json (new debt, or a stale entry to lower in the same change), an exemption names no tracked file, or the gate could not read one of its inputs. The artifact-language-gate lines above name each file, its counter and its lines: write the text in English, name the role (Product Owner or Maintainer), and when a count falls rewrite the baseline with node scripts/testing/artifact-language-gate.mjs --write."
            exit 1
          fi

  dependency-consistency:
    name: Dependency Consistency (catalog single-version + lockfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The action's install step runs `pnpm install --frozen-lockfile` (its frozen-lockfile
      # input defaults to true), so it is this job's lockfile gate: a lockfile that disagrees
      # with the manifests fails here.
      - name: "Lockfile gate: setup Node and pnpm, pnpm install --frozen-lockfile"
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: "Single-version gate: syncpack (catalog-managed direct deps; transitives are consumer-governed)"
        # syncpack 15 is a native binary with no JavaScript dependency tree, so a fresh
        # `pnpm dlx` install prints no deprecation warning; syncpack 12 pulled the
        # npm-deprecated @effect/schema@0.69.0. v15 reads the pnpm catalog: protocol
        # natively, so `lint` is the gate itself: one version per manifest-declared
        # dependency across every workspace manifest, and exact ranges on literal specs.
        # The dependency types are a CLI flag because v15 deprecated the `dependencyTypes`
        # config key; `overrides` is the npm field, as before, and the pnpm-workspace.yaml
        # overrides stay out of scope. Consumer-governed transitives are not
        # manifest-declared, so the single-version group cannot see them. See ADR-0018.
        run: pnpm dlx syncpack@15.3.3 lint --dependency-types prod,dev,peer,overrides

      - name: "Dedupe gate: pnpm dedupe --check (no flattenable duplicates)"
        # pnpm 11 fixed the pnpm-10.16 false-positive (which needed a double invocation);
        # a single `dedupe --check` is now reliably exit 0. The former vite 7/8 split that
        # would otherwise surface here was resolved at the root (apps/client gained
        # @vitejs/plugin-react, collapsing to a single vite 8). See ADR-0019.
        run: pnpm dedupe --check

      - name: "Testing toolchain holds: every lag below latest mature has a documented hold"
        # A direct testing dependency sitting below its latest MATURE version (stable and at least
        # 7 days published) needs no row for 30 days, the staleness budget of ADR-0036: the weekly
        # dependency window takes it inside that time, and the gate prints it `within budget`. The
        # budget counts from the maturity of the OLDEST unmet release, so a lag turns red 37 days
        # after that release was published. Past the budget it is legal only while a row in
        # docs/security/SECURITY_CANON.md names it with a measured reason, a date and a remove-when
        # that can actually fire; a row that still describes a scheduled hold is refused. The
        # comparator is "latest mature", never `latest`: the newest release is frequently younger
        # than the buffer, and targeting it would convert the buffer into decoration.
        #
        # It lives in THIS job because the job already installs the workspace and already talks to
        # the registry (syncpack), which is what the maturity measurement needs.
        #
        # FAIL-CLOSED by construction: zero parsed hold rows, an unreadable table, a population
        # package that is neither installed nor declared absent, a stale declared absence, an
        # unreadable registry document, two installed versions of one direct dependency, or a
        # family (toolchain-population.json `families`) refused or not resolving to one version
        # each exit 1 rather than reporting a clean zero over inputs the gate never read. Pinned by
        # apps/api/tests/unit/scripts/holdsGate.test.ts, whose fixtures drive every one of those
        # refusals, and both sides of the budget, without touching the registry.
        run: |
          set -uo pipefail
          if ! node scripts/testing/holds-gate.mjs; then
            echo "::error title=Toolchain holds violation::A testing dependency has been below a mature release for 30 days or more with no hold row naming it in docs/security/SECURITY_CANON.md (Build-tool version holds & dated-debt overrides), a hold row still describes a scheduled hold, a family's members (scripts/testing/toolchain-population.json families) do not resolve to one version, or the gate could not read one of its inputs. The holds-gate lines above name each package with its installed version and its target, and each diverging family member with its version and importer: bump it in the weekly dependency window, move every member of a family in one change, or add a row carrying a measured reason, today's date and an observable remove-when (ADR-0036)."
            exit 1
          fi

      - name: "Node engines: every workspace manifest declares engines.node at the runtime major"
        # A manifest that declares no engines.node, or declares a major different from the runtime,
        # is refused. The root package.json's value is the ONE source of truth and must match the
        # shape >=<M>.<minor>.<patch> <<M+1> with <M> the .nvmrc major — an ALLOWLIST by shape, in the
        # form fitness #28 and #40 use, because ^26 / >=26 / 26.x each name no floor, no ceiling, or
        # neither, and would admit the next major silently.
        #
        # WHY IT EXISTS, measured: @types/node was pinned at 25.9.3 while every declared runtime here
        # was the Node 24 LTS line, and nothing noticed, because no manifest declared a runtime for the
        # pin to disagree with. Types ahead of the runtime describe APIs the runtime does not have. The
        # gate therefore also compares the @types/node catalog pin's major against that same runtime,
        # and refuses a manifest whose major is AHEAD exactly as loudly as one behind: moving the Node
        # line is a deliberate change that raises .nvmrc, engines.node and the types pin together.
        #
        # It lives in THIS job because the job already owns the manifest/catalog invariants (syncpack,
        # dedupe, the toolchain holds), and this gate reads only tracked files plus .nvmrc — no install
        # and no registry.
        #
        # FAIL-CLOSED by construction: an unreadable or non-integer .nvmrc, a process whose own major
        # differs from it, a population below the 90-manifest floor (fitness #42's rule — a moved
        # layout must not read as a clean zero), an unreadable manifest, a root with no value to be
        # canonical, and a catalog with no @types/node pin each exit 1 rather than reporting a clean
        # zero over inputs the gate never read. Pinned by
        # apps/api/tests/unit/scripts/enginesNodeGate.test.ts, whose fixtures drive every one of those
        # refusals without reading the repository's own manifests.
        run: |
          set -uo pipefail
          if ! node scripts/testing/engines-node-gate.mjs; then
            echo "::error title=engines.node declaration violation::A workspace manifest declares no engines.node, or declares a major different from the runtime in .nvmrc, or the @types/node catalog pin sits on a different major, or the gate could not read one of its inputs. The engines-node-gate lines above name each manifest with the value read and the runtime major. Fill a missing declaration with 'node scripts/testing/engines-node-gate.mjs --write'; a value that DISAGREES is never overwritten, because the disagreement is the finding — moving the Node line raises .nvmrc, the root engines.node and the @types/node pin in one deliberate change."
            exit 1
          fi

      - name: "Override bands: every range-scoped override band moves with its own target"
        # It lives in THIS job because the job already owns the manifest and lockfile invariants
        # (syncpack, dedupe, the toolchain holds, the engines declaration), and this gate reads one
        # tracked file — no install and no registry.
        #
        # The gate's rationale — why, allowlist, fail-closed — lives in the header of
        # scripts/testing/override-bands-gate.mjs. The one deliberate exception, an advisory whose
        # named patched version was never published, is named inside the gate with its measured
        # reason. Pinned by apps/api/tests/unit/scripts/overrideBandsGate.test.ts, whose fixtures
        # drive every refusal the header lists without reading the repository's own manifest.
        run: |
          set -uo pipefail
          if ! node scripts/testing/override-bands-gate.mjs; then
            echo "::error title=Override band violation::A range-scoped override in pnpm-workspace.yaml declares a band that no longer matches its own target, or the gate could not read one of its inputs. The override-bands-gate lines above name every key with its target and its verdict. A CVE floor is written so the band's exclusive upper bound IS the target ('pkg@<X' pinned to X), because that is what forces the two to move together: raise the band and the target in the same edit, never only the value. A band that genuinely cannot take that shape is recorded in the gate's allowlist with its measured reason, never left to drift — and an allowlist entry that matches no key is a violation too, so the list can only shrink."
            exit 1
          fi

      - name: "Maturity watchlist: every entry is well formed and its milestones derive from its publish date"
        # scripts/testing/maturity-watchlist.json lists the versions that entered inside the 7-day
        # maturity buffer with their 7- and 14-day review dates. A malformed entry, or a milestone that
        # is not its publish date plus 7 or 14 days, would put a review on the wrong day or on none;
        # this refuses it in the pull request that writes it. A review is dated the day it is
        # written, so one dated after the run's UTC date is refused; one dated before its milestone
        # is refused unless it carries early: { reason } and is at most 2 days early, and an early
        # field on a review that is not early is refused too. It also fails when a review is still
        # unrecorded more than three days past its milestone, measured against the run's UTC date,
        # so a missed review turns this step red on every run until its outcome is recorded. Reads
        # one tracked file: no install, no registry, no API. Pinned by
        # apps/api/tests/unit/scripts/maturityWatchlist.test.ts.
        run: |
          set -uo pipefail
          if ! node scripts/testing/maturity-watchlist.mjs --check; then
            echo "::error title=Maturity watchlist violation::scripts/testing/maturity-watchlist.json is unreadable or malformed, or a review is overdue by more than three days and not recorded. The maturity-watchlist lines above name each cause: a missing or malformed field, a milestone that is not its publish date plus 7 or 14 days, a review without a clean or flagged outcome, a review dated after the day the list is read, a review dated before its milestone with no early field, an early review more than 2 days early or without a reason, an early field on a review that is not early, a duplicate id, or a review due more than three days ago and not recorded. Record an overdue review's outcome under reviews.<milestone> in scripts/testing/maturity-watchlist.json."
            exit 1
          fi

      - name: "#45 Legal inventories are current and every row is classified"
        if: always()
        run: |
          # Mirrors CLAUDE.md #45. Every legal inventory generator under scripts/legal/ regenerates
          # its page in memory and compares it with the committed one under docs/legal/inventories/;
          # a stale page, a candidate with no entry in docs/legal/classification/, a stale entry, or
          # a pending count off its baseline exits 1. It lives in this job because the generators
          # render through prettier's API and need the installed tree; the Fitness Functions job
          # installs nothing. Pinned by apps/api/tests/unit/scripts/*Inventory.test.ts.
          set -euo pipefail
          if ! pnpm check:legal; then
            echo "::error title=Fitness #45 violation::A legal inventory is stale or incompletely classified. Run pnpm legal:inventory, classify every new row in docs/legal/classification/ (not applicable is a row, never a sentence), and commit the regenerated page with the change that moved it. The legal-inventory lines above name each problem with its generator."
            exit 1
          fi

      - name: "#46 Support documents are current and every tree candidate is classified"
        if: always()
        run: |
          # Mirrors CLAUDE.md #46, the support twin of #45. scripts/support/run.mjs --check
          # re-renders docs/support/README.md (the index of the support documents, each held to
          # docs/support/_TEMPLATE.md) and docs/support/NON_FEATURES.md (every route, package,
          # worker, queue and portal page the tree yields, classified in
          # docs/support/classification/non-features.json) and compares both with the committed
          # pages; a document off the template, a stale page, an unclassified candidate, a stale
          # entry or a pending count off its baseline exits 1. Same job as #45 for the same
          # reason: the pages render through prettier's API. Pinned by apps/api/tests/unit/scripts/
          # supportIndex.test.ts, supportNonFeatures.test.ts and supportFrontMatter.test.ts.
          set -euo pipefail
          if ! pnpm check:support; then
            echo "::error title=Fitness #46 violation::A support document breaks the template, a generated support page is stale, or a tree candidate is unclassified. Run pnpm support:index, classify every new candidate in docs/support/classification/non-features.json (documented with its doc, non-feature with its reason, or pending within the baseline), and commit the regenerated pages with the change that moved them. The support-docs lines above name each problem with its generator."
            exit 1
          fi

      - name: "#47 Every touched source file carries the canon's method-level JSDoc (pull_request only)"
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          FITNESS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          # Mirrors CLAUDE.md #47. scripts/testing/jsdoc-touched-gate.mjs lints, with
          # eslint.jsdoc.config.ts, every .ts/.tsx source file under apps/ and packages/ that this
          # pull request adds or modifies against its base (the merge base of the base sha and HEAD),
          # the whole file; a file the pull request does not touch is never read. A violation exits
          # 1; a base or scope it cannot resolve exits 2. pull_request only, like #37: a push run has
          # no base. Same job as #45 and #46 because ESLint needs the installed tree. The checkout is
          # shallow, so the script fetches the base and deepens the clone itself, with bounded
          # retries. Pinned by apps/api/tests/unit/scripts/jsdocRules.test.ts (the rules) and
          # jsdocTouchedGate.test.ts (the gate).
          set -euo pipefail
          if ! JSDOC_BASE_REF="${FITNESS_BASE_REF:-origin/main}" pnpm check:jsdoc; then
            echo "::error title=Fitness #47 violation::A source file this pull request adds or modifies breaks the method-level JSDoc rules of CODING_STANDARDS §Documentation, or the gate could not resolve its base. The jsdoc-touched-gate lines above name each file:line, rule and message. Document the whole file (an eslint-disable directive does not exempt it) and run pnpm check:jsdoc locally."
            exit 1
          fi

      - name: "#48 Every patched dependency has its record, its patch file and its ADR"
        if: always()
        run: |
          # Mirrors CLAUDE.md #48. `pnpm check:patched-deps` runs the consistency half of the gate,
          # `node scripts/testing/patched-dependencies-gate.mjs --check`. It reads two files: the
          # patchedDependencies block of pnpm-workspace.yaml, as text, through the reader the engines
          # and override-bands steps above share; and scripts/testing/patched-dependencies.json. Every
          # key must name one exact version and have one record with the same patch file. Every record
          # must have its key, its patch file and its ADR on disk. Every file under patches/ must be
          # named by a record. The step reads tracked files only: no install, no registry, no API. The
          # gate exits 1 on an inconsistency and 3 on an input it cannot read, and either fails this
          # step. The registry half of the same gate runs every 6 hours in patched-dependencies.yml and
          # never here, so an upstream release never blocks unrelated work. Pinned by
          # apps/api/tests/unit/scripts/patchedDependenciesGate.test.ts.
          set -euo pipefail
          if ! pnpm check:patched-deps; then
            echo "::error title=Fitness #48 violation::A patched dependency is inconsistent: a patchedDependencies key with no record or no exact version, a record with no key, a missing patch file or ADR, a file under patches/ no record names, a record missing a field, or a resolvedBy range that does not parse. The patched-dependencies-gate lines above name each one. A patch exists only by a Maintainer's decision in its own ADR (docs/security/SECURITY_CANON.md, Patched dependencies), with its record in scripts/testing/patched-dependencies.json."
            exit 1
          fi

      - name: "#50 The dependency-usage record is current and every name under the floor is decided or counted pending"
        if: always()
        run: |
          # Mirrors CLAUDE.md #50. `pnpm check:deps-ledger` runs
          # `node scripts/testing/dependency-ledger.mjs --check`: it rebuilds the dependency-usage
          # record from the tree (every direct dependency's declarations; for each name under the
          # floor of 3 real sites, its sites by kind and path class), compares it byte for byte with
          # dependency-ledger.json, and joins the names with the Maintainer's decisions in
          # scripts/testing/dependency-decisions.json. A stale record, a stale or malformed entry,
          # or a pending count off its exact baseline exits 1; an input it cannot read in full
          # exits 3; either fails this step. Same job as #45 for the same reason: the record
          # renders through prettier's API, and the bin names come from the installed tree.
          # Pinned by apps/api/tests/unit/scripts/dependencySites.test.ts and
          # dependencyLedger.test.ts.
          set -euo pipefail
          if ! pnpm check:deps-ledger; then
            echo "::error title=Fitness #50 violation::The dependency-usage record is stale, a Maintainer decision is stale or malformed, the pending count moved off its baseline, or an input could not be read. Run pnpm deps:ledger, decide every new name under the floor in scripts/testing/dependency-decisions.json (kept with its ground, or remove with its replacement; pending is counted, never silent), and commit the regenerated record with the change that moved it. The dependency-ledger lines above name each problem."
            exit 1
          fi

      - name: "#51 Every portal's message catalogs are complete and valid ICU for every declared locale"
        if: always()
        run: |
          # Mirrors CLAUDE.md #51. `pnpm check:i18n` runs `node scripts/testing/i18n-lint.mjs`. It
          # discovers every portal (a directory directly under apps/ holding i18n/routing.ts and
          # messages/), reads each portal's `locales` and `defaultLocale` from routing.ts and its
          # catalogs from messages/<locale>.json, and holds the two locale sets equal. Every leaf of
          # every catalog must be a string that parses as ICU MessageFormat; every other locale must
          # carry the default locale's key set and, per message, its argument and tag names. A violation
          # exits 1; an input it cannot read in full (fewer than 2 portals, a routing.ts whose
          # locales or default locale cannot be read, a catalog that does not parse as JSON) exits
          # 3; either fails this step. Same job as #45 because the ICU parser comes from the
          # installed tree. Pinned by apps/api/tests/unit/scripts/i18nLint.test.ts.
          set -euo pipefail
          if ! pnpm check:i18n; then
            echo "::error title=Fitness #51 violation::A portal's message catalogs disagree with its routing or with each other: a messages/<locale>.json its routing.ts does not list, or a listed locale with no catalog; a key missing or extra against the default locale; a leaf that is not a string or does not parse as ICU; or argument or rich-text tag names that differ from the default locale's; or an input could not be read. The i18n-lint lines above name each portal, locale and key. For the catalogs, a new locale is its catalog plus its entry in the routing.ts locales array; code that keeps its own locale list is outside this check."
            exit 1
          fi

  test-contracts:
    name: Test Contracts
    runs-on: ubuntu-latest
    # On a developer machine the reach engine lists every collector in about 3 s and the scope check
    # resolves every vitest config in about 2 s, and #52 rebuilds the test ledger, its own reach run
    # included, in about 9 s; the rest of the budget is checkout and install. The
    # job takes 42-66 s in the runs since 2026-10-08, but three of them spent 248-326 s in
    # setup-node-pnpm-cache, inside the pnpm self-installer (an `npm install` of the pnpm bootstrap)
    # while the npm registry was slow, and the slowest finished 15 s inside the old 6-minute budget.
    # 10 minutes holds one such stall plus an install with no pnpm store cache.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The canonical hermetic URL of the test environment contract: nothing listens on
      # 127.0.0.1:1, so a step that tried to reach a database would fail at once instead of
      # finding one. pnpm install runs Prisma's postinstall, `prisma generate`, whose config reads
      # this variable and connects to nothing.
      DATABASE_URL: postgresql://hermetic:hermetic@127.0.0.1:1/hermetic?schema=public
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history, so the `#30` step can read the base commit's quarantine for R3's
          # shrink-only clause; `git ls-files` itself needs only the checked-out commit.
          fetch-depth: 0

      # The job's DATABASE_URL above reaches the action's install step too: a composite action's
      # steps inherit the job environment.
      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: "#30 Every test file has exactly one collector run by a required check"
        if: always()
        env:
          # The commit the quarantine may only shrink against: a pull request's base, or on a push
          # the commit before it.
          FITNESS_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          # Mirrors CLAUDE.md #30. packages/test-contracts/src/reach.ts lists every test-shaped
          # tracked file, asks the four collectors (vitest, node:test through run-tests.sh --list,
          # Playwright, k6) what each one runs, and reads collectors.json, the workflows it names and
          # .github/rulesets/main.json to decide which sources a required check runs. It fails on R1
          # (outside the quarantine, a file collected zero times, twice, or only by a source no
          # required check runs), R2 (a collectors.json entry whose job, entrypoint or check name
          # does not hold), R3 (a quarantine entry that is untracked, collected, or absent from the
          # base commit's quarantine), C1 (a package with a vitest config whose `test` script is
          # not `vitest run`) and C2 (a vitest config whose resolved `exclude`, of its root config or
          # of one of its projects, lacks an entry of RESERVED_TIER_EXCLUDES), and on any input it
          # cannot read in full. Pinned by packages/test-contracts/tests/, which Package Tests runs.
          # The quarantine path resolves against the package directory, where `pnpm --filter` runs
          # the script, so the base quarantine is handed in by an absolute path.
          # The base fails closed in two ways, each with its own error: a base ref that names no
          # commit, and a base commit that holds no quarantine.json. A push whose commit has no
          # parent has no HEAD~1, so it fails at the first by construction.
          set -euo pipefail
          BASE_REF="${FITNESS_BASE_REF:-origin/main}"
          BASE_QUARANTINE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/base-quarantine.json"
          if ! BASE_COMMIT=$(git rev-parse --verify --quiet "$BASE_REF^{commit}"); then
            echo "::error title=Fitness #30 violation::The base ref $BASE_REF does not resolve to a commit, so there is no base quarantine to hold the quarantine to shrink-only. On a push the base is HEAD~1, which a commit with no parent does not have."
            exit 1
          fi
          if ! git show "$BASE_COMMIT:packages/test-contracts/quarantine.json" > "$BASE_QUARANTINE"; then
            echo "::error title=Fitness #30 violation::The base commit $BASE_REF ($BASE_COMMIT) holds no readable packages/test-contracts/quarantine.json, so the quarantine cannot be held to shrink-only. The git line above names the cause."
            exit 1
          fi
          if ! pnpm --filter @packages/test-contracts reach --quarantine quarantine.json --base "$BASE_QUARANTINE"; then
            echo "::error title=Fitness #30 violation::A test file runs in no collector, in two, or only in one no required check runs; a collectors.json entry does not hold; a quarantine entry is untracked, collected, or new against the base; a package's test script is not vitest run; a vitest config's resolved exclude lacks a reserved tier pattern; or the engine could not read one of its inputs. The R1, R2, R3, C1, C2 and error lines above name each file. Give the file its tier suffix or its collector, set the package's test script to vitest run, spread RESERVED_TIER_EXCLUDES into the config's exclude, or delete the file: the quarantine no longer grows."
            exit 1
          fi

      - name: "#36 Every positive scope glob of every vitest config matches a tracked file"
        if: always()
        run: |
          # Mirrors CLAUDE.md #36. packages/test-contracts/src/scopes.ts lists the tracked files and
          # resolves every tracked vitest.config.* with vitest's own config loader, so it reads the
          # globs a run applies: the shared factory's merge, projects and vitest's defaults
          # included. Each positive glob of every project's test.include, and of the root config's
          # coverage.include where a config sets one, must match at least one tracked file (S1),
          # and each scope must hold one; a negation is never checked, since an exclusion that
          # matches nothing is inert. It fails closed below the vitest collector's floor of tracked
          # configs, on a config vitest cannot resolve and on a file listing that fails. Pinned by
          # packages/test-contracts/tests/scopes.test.ts, which Package Tests runs. It runs in this
          # job, not in the Fitness Functions job, because resolving a config loads it and what it
          # imports, which needs the installed tree.
          set -euo pipefail
          if ! pnpm --filter @packages/test-contracts scopes; then
            echo "::error title=Fitness #36 violation::A positive test.include or coverage.include glob of a vitest config matches no tracked file, a scope holds no positive glob, a config does not resolve, or the tracked configs fall below the floor. The S1 and error lines above name each config and glob. Repoint or delete the glob; a scope that moved is a new scope, not a repoint."
            exit 1
          fi

      - name: "#52 The committed test ledger is what the tree yields"
        if: always()
        run: |
          # Mirrors CLAUDE.md #52. `pnpm check:ledger` runs `node scripts/testing/ledger.mjs
          # --check`: it rebuilds the test ledger from the tree (every test-shaped file, runner,
          # helper and dead-suffix file, each file's blocks classified and joined to the reach
          # engine's sources and the quarantine), applies the Maintainer's overlay in
          # docs/development/testing-refoundation/ (adjudications.json, slices.json), and compares
          # the bytes with ledger.json at the root and with LEDGER.md beside the overlay. A
          # differing row, or an overlay entry or slice assignment it refuses, exits 1; an input it
          # cannot read in full exits 3; either fails this step. It runs in this job because the
          # ledger runs the reach engine, which needs the installed tree. Pinned by
          # apps/api/tests/unit/scripts/ledger.test.ts.
          set -euo pipefail
          if ! pnpm check:ledger; then
            echo "::error title=Fitness #52 violation::The committed test ledger is not what the tree yields: a row of ledger.json or LEDGER.md differs from the rebuilt one, an overlay entry or slice assignment is refused, or an input could not be read. The ledger lines above name each differing row, or the summary or page that differs. Run pnpm ledger and commit the regenerated ledger.json and LEDGER.md with the change that moved the rows; fix or remove a refused overlay entry."
            exit 1
          fi
