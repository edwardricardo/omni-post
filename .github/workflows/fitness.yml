name: Architectural Fitness Functions

# Wires the fitness greps documented in CLAUDE.md §Automated Compliance
# Checks to CI (the step summary enumerates the current set). Any new
# occurrence of any pattern fails the workflow and is annotated on the PR diff.
#
# Strategy: hard-zero for every check (each returns count = 0). #1 and #21 ran
# as ratchets during the prisma->DI remediation; that workstream is complete, so
# both are now hard-zero like the rest.
#
# Canon: Ford & Parsons "Building Evolutionary Architectures" (2nd ed) —
# hard-zero is the correct mode for invariants in a clean codebase; ratchets
# are only correct when a non-zero baseline cannot be eliminated immediately.
#
# Design: single job + one named step per check with `if: always()` so a
# violation in one step does NOT mask later violations — every PR sees every check.
# Annotations are aggregated to one `::error` per check (bypasses the
# 10-errors-per-step / 50-per-job silent cap of GitHub Actions).

on:
  push:
    # PR branches validate via the pull_request trigger; listing them here too
    # fired a redundant second run per push.
    branches: [main, omni-post-cc]
  pull_request:
    branches: [main, omni-post-cc]

concurrency:
  group: fitness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fitness:
    name: Fitness Functions (CLAUDE.md greps)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: "#1 No Prisma singleton imports in routes"
        if: always()
        run: |
          set -uo pipefail
          # Glob fixed: *[Rr]outes* also matches PascalCase *Routes.ts. The old
          # *routes* was case-sensitive and missed every *Routes.ts, so this
          # guard silently passed while admin routes imported the singleton.
          # Hard-zero (the prisma->DI remediation is complete).
          MATCHES=$(grep -rn "import { prisma" apps/api/src/ --include="*[Rr]outes*" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #1 violation::$COUNT Prisma singleton imports in route files. Resolve use cases from DI: fastify.container.resolve(TOKENS.X). Do NOT add any."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#2 Domain layer is framework-free"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "prisma\|fastify\|redis\|bullmq" apps/api/src/domain/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #2 violation::$COUNT framework references found in domain layer (expected 0). Domain must import nothing external — no Prisma, Fastify, Redis, BullMQ."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#3 No `any` in domain/application/infrastructure"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "(:\s+any\b|\bas any\b|<any>)" \
            apps/api/src/domain/ apps/api/src/application/ apps/api/src/infrastructure/ \
            --include="*.ts" 2>/dev/null | \
            grep -vE "//.*any|^[^:]+:[0-9]+:\s*\*" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #3 violation::$COUNT \`any\` usages in domain/application/infrastructure (expected 0). Use proper interfaces, generics, or \`unknown\` + type guard."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#4 No raw throws in domain/application"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "throw " apps/api/src/domain/ apps/api/src/application/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #4 violation::$COUNT raw \`throw\` statements in domain/application (expected 0). Use Result<T, DomainError> for fallible operations."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#5 No @ts-ignore or @ts-nocheck in production source"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "@ts-ignore\|@ts-nocheck" apps/api/src/ packages/*/src/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #5 violation::$COUNT @ts-ignore/@ts-nocheck in production source (expected 0). Fix the underlying type issue."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#6 CQRS handlers don't touch Prisma directly"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "prisma\." apps/api/src/cqrs/handlers/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #6 violation::$COUNT direct Prisma calls in CQRS handlers (expected 0). Delegate to Application layer use cases."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#7 No randomUUID/Math.random in dedupeKey"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "dedupeKey.*randomUUID\|dedupeKey.*Math.random" apps/api/src/ packages/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #7 violation::$COUNT dedupeKey uses non-deterministic ID (expected 0). DedupeKey must be deterministic: saga-\${sagaId}-\${stepIndex}."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#8 No sprint/phase references in source comments"
        if: always()
        run: |
          set -uo pipefail
          # Catches: "Sprint 1", "Sprint A", "Sprint 8", "Part of Sprint X",
          # "Phase 1", "Phase 2", the legacy "T0A_" / "T0-A" task-batch prefixes,
          # and the parenthesised phase/task shorthand "(P8)" / "(P2-1)" / "(P3-A)"
          # / "(P1-DI-7)". Prisma-safe: `\(P[0-9]\)` matches a single digit and
          # `\(P[0-9]+-` requires a dash, so Prisma error codes like "(P2002)"
          # (P + 4 digits, no dash) are NOT flagged. All belong in git history /
          # PR descriptions, not in source comments where they rot.
          MATCHES=$(grep -rnE "Part of Sprint|Phase.*Sprint|Sprint [0-9A-Z]|Phase [0-9]|T0A_|T0-A|\(P[0-9]\)|\(P[0-9]+-[A-Za-z0-9]" \
            apps/ packages/ infra/ --include="*.ts" --include="*.tsx" --include="*.prisma" 2>/dev/null | \
            grep -vE "node_modules|dist|\.next|\.stryker-tmp|\.stryker|reports/mutation|infra/prisma/generated/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #8 violation::$COUNT sprint/phase references in source (expected 0). Belongs in git history, not source comments."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#9 Every file has @file header"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rL "@file" apps/ packages/ --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "node_modules\|dist\|\.next\|\.stryker\|reports/mutation\|next-env\.d\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #9 violation::$COUNT files missing @file header (expected 0)."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#10 Only valid @layer values (domain/application/infrastructure)"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "@layer" apps/ packages/ --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "node_modules\|dist\|\.next\|\.stryker\|reports/mutation" | \
            grep -v "@layer application\|@layer domain\|@layer infrastructure" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #10 violation::$COUNT files with invalid @layer value (expected 0). Allowed: domain, application, infrastructure."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#11 No raw setInterval in backend"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "setInterval\(" apps/api/src apps/workers/src packages/ --include="*.ts" 2>/dev/null | \
            grep -vE "default-scheduler|node_modules|dist|\.test\.|/tests/|/\.stryker-tmp/|eslint\.config|DANGEROUS_STRINGS|enhancedValidator\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #11 violation::$COUNT raw setInterval calls in backend (expected 0). Register via TOKENS.BackgroundTaskScheduler."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#12 Every component file carries @component tag"
        if: always()
        run: |
          set -uo pipefail
          MISSING=""
          for f in $(find apps/admin/components apps/client/components packages/ui/src/components \
            -type f -name "*.tsx" 2>/dev/null | grep -v "\.stories\.\|\.test\.\|\.next" || true); do
            basename=$(basename "$f")
            case "$basename" in use*) continue;; esac
            if ! grep -qE "^export (default )?(function|const) [A-Z]" "$f"; then continue; fi
            if ! grep -q "@component" "$f"; then
              MISSING="$MISSING\n$f"
            fi
          done
          COUNT=$(printf "%b" "$MISSING" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #12 violation::$COUNT React component files missing @component JSDoc tag (expected 0)."
            printf "%b\n" "$MISSING" | head -20
            exit 1
          fi

      - name: "#13 No direct pino imports in apps/api"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "^import pino\b|^const \w+ = pino\(" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "lib/logger\.ts\|\.test\.\|/tests/\|/\.stryker-tmp/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #13 violation::$COUNT direct pino imports in apps/api (expected 0). Use createLogger() from apps/api/src/lib/logger.ts so redaction config is uniform."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#14 No per-class `private *Cache = new Map` in apps/api/src"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "^\s+private \w*[Cc]ache.*= new Map" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "\.test\.\|/tests/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #14 violation::$COUNT per-class private *Cache = new Map() in apps/api/src (expected 0). All cross-pod cached state MUST go through TOKENS.CachePort. Reason: OWASP A07:2021 cache coherence."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#15 No insecure secret fallbacks (CWE-798)"
        if: always()
        run: |
          set -uo pipefail
          # Block the patterns:
          #   process.env.X_SECRET || "dev-only-..."
          #   process.env.X_KEY ?? ""
          #   process.env.X_TOKEN || generated()
          # The fix in app code is the typed `env` constant from
          # apps/api/src/config/env.ts (Zod-validated, fail-fast). In provider
          # apiClients, secrets must arrive via constructor injection from the
          # composition root, never read from env at module/method scope.
          # Scope: apps/api/src + apps/workers/src + packages/providers/*
          # (excluding _template scaffolding).
          MATCHES=$(grep -rnE 'process\.env\.[A-Z_]*(SECRET|KEY|PASSWORD|TOKEN|CREDENTIAL)[A-Z_]*\s*(\|\||\?\?)' \
            apps/api/src apps/workers/src packages/providers --include="*.ts" 2>/dev/null | \
            grep -v "node_modules\|\.test\.\|/tests/\|\.stryker\|/dist/\|config/env\.ts\|providers/_template/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #15 violation::$COUNT insecure secret fallbacks (expected 0). Replace with the typed env constant from apps/api/src/config/env.ts — Zod schema fails fast at boot, no fallback. Reason: CWE-798 (Use of Hard-coded Credentials), OWASP A07:2025."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#19 No process.env reads inside provider Adapter classes"
        if: always()
        run: |
          set -uo pipefail
          # Provider adapters are stateless and receive credentials per-call
          # from the application layer's CredentialResolver. Any env read
          # inside an Adapter.ts file reintroduces the CWE-798 anti-pattern
          # by smuggling secrets through the module rather than via injection.
          # Operational config that legitimately lives in apiClient.ts is
          # allowed there but NOT in the adapter itself. Excludes _template.
          MATCHES=$(grep -rnE 'process\.env\.' packages/providers/*/src/*Adapter.ts 2>/dev/null | \
            grep -v "providers/_template/\|\.stryker\|/dist/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #19 violation::$COUNT process.env reads inside provider Adapter classes (expected 0). Adapters must receive credentials per-call and any operational config via constructor injection from the composition root."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#16 No direct process.env.* in apps/api/src outside config/env.ts"
        if: always()
        run: |
          set -uo pipefail
          # apps/api/src must consume the typed `env` constant from
          # config/env.ts — direct process.env access bypasses Zod validation
          # and creates a regression vector for #15. Workers + packages are
          # out of scope (separate refactor) but this gate locks in the API.
          # Exception: process.env.NODE_ENV — Node ecosystem convention treats
          # this as runtime-readable, and tests rely on dynamic mutation.
          MATCHES=$(grep -rn "process\.env\." apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "config/env\.ts\|/tests/\|\.test\.\|process\.env\.NODE_ENV\b" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #16 violation::$COUNT direct process.env.* references in apps/api/src outside config/env.ts (expected 0). Use the typed env constant — see apps/api/src/config/env.ts."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#17 No direct process.env.* in Next.js apps outside lib/env.ts"
        if: always()
        run: |
          set -uo pipefail
          # Next.js client bundles inline process.env reads at BUILD TIME via
          # Webpack DefinePlugin. A `process.env.SOME_SECRET` referenced in a
          # client component leaks the value into the JS shipped to the
          # browser. Routing every consumer through `lib/env.ts` (t3-env)
          # enforces server/client split via the `clientPrefix` convention
          # and fails build when a secret is referenced from client code.
          # Exception: process.env.NODE_ENV (Node ecosystem convention) +
          # playwright config (runs outside Next bundle).
          MATCHES=$(grep -rnE "process\.env\." \
              apps/admin/{app,components,hooks,lib,providers} \
              apps/client/{app,components,hooks,lib,providers} \
              --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "lib/env\.ts\|process\.env\.NODE_ENV\b\|/tests/\|\.test\." || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #17 violation::$COUNT direct process.env.* references in Next.js apps outside lib/env.ts (expected 0). Use the typed env constant — see apps/{admin,client}/lib/env.ts. Reason: Webpack DefinePlugin inlines client process.env at build time; client components must consume only NEXT_PUBLIC_* via env."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#18 No direct argon2.hash/verify outside passwordHashing.ts"
        if: always()
        run: |
          set -uo pipefail
          # Centralised Argon2id hashing in `apps/api/src/auth/passwordHashing.ts`
          # ensures every password / API-key / backup-code hash uses identical
          # canonical parameters (RFC 9106 second-recommended). Direct calls to
          # `argon2.hash()` or `argon2.verify()` elsewhere create drift risk —
          # one site might use lib defaults, another might pass weaker params.
          # Route everything through `hashPassword`, `verifyPassword`,
          # `needsRehash` from the helper.
          MATCHES=$(grep -rnE "argon2\.(hash|verify)\(" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "passwordHashing\.ts\|/tests/\|\.test\." || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #18 violation::$COUNT direct argon2.hash/verify calls outside apps/api/src/auth/passwordHashing.ts (expected 0). Route through the helper — see hashPassword / verifyPassword / needsRehash."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#20 No legacy BullMQ repeatable API"
        if: always()
        run: |
          set -uo pipefail
          # addRepeatable / getRepeatableJobs / removeRepeatableByKey /
          # removeRepeatable are deprecated since BullMQ 5.16.0 (removed in
          # v6). The canonical recurring primitive is upsertJobScheduler
          # (idempotent by scheduler id). The four method names are
          # BullMQ-exclusive so this is a precise hard-zero with no false
          # positives (unlike a bare `repeat:` which collides with domain
          # fields and provider API params). Excludes tests + sandboxes.
          MATCHES=$(grep -rnE "\.(addRepeatable|getRepeatableJobs|removeRepeatableByKey|removeRepeatable)\(" apps/*/src packages/*/src --include="*.ts" 2>/dev/null | \
            grep -vE "node_modules|/dist/|\.test\.|/tests/|\.stryker" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #20 violation::$COUNT legacy BullMQ repeatable API call(s) (expected 0). Use Queue.upsertJobScheduler / getJobSchedulers / removeJobScheduler — deprecated since BullMQ 5.16.0."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#21 No Prisma singleton imports outside composition roots"
        if: always()
        run: |
          set -uo pipefail
          # DI canon: only a composition root may import the `prisma` singleton;
          # every other unit RECEIVES PrismaClient (or a port) by constructor
          # injection. Scope: apps/api/src + apps/workers/src. Exceptions: the
          # api composition root (infrastructure/container), the api bootstrap
          # (index.ts), the workers composition root (**/container/), and tests.
          # Hard-zero (the prisma->DI remediation is complete). This guard
          # supersedes #1 (routes are a subset).
          MATCHES=$(grep -rlE "import \{[^}]*\bprisma\b[^}]*\} from \"@infra/prisma\"" apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
            grep -vE "/infrastructure/container/|/index\.ts$|/container/|\.test\.|/tests/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #21 violation::$COUNT prisma singleton importer(s) outside composition roots. Inject PrismaClient via constructor and resolve from the container. Do NOT add any."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#22 No @layer application in apps/api/src (application code lives in @core/application)"
        if: always()
        run: |
          set -uo pipefail
          # Workstream application-services-to-core (S1' -> S4) relocated every
          # @layer application file from apps/api/src to packages/core/application/.
          # Re-introducing @layer application in apps/api/src reverses that move
          # and reintroduces the inverted-dependency smell. New application-layer
          # code MUST go to packages/core/application/<context>/ and apps/api
          # consumers import it as @core/application/<context>/<Service>.js.
          # Hard-zero (S5 closed the workstream).
          MATCHES=$(grep -rlE "^[[:space:]]*\*[[:space:]]*@layer application[[:space:]]*$" apps/api/src --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #22 violation::$COUNT @layer application file(s) in apps/api/src. Move the file to packages/core/application/<context>/ and repoint consumers via @core/application/<context>/<Service>.js."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#23 No raw Prisma queries outside tenant guard + composition root"
        if: always()
        run: |
          set -uo pipefail
          # Raw Prisma queries ($queryRaw, $executeRaw, $queryRawUnsafe,
          # $executeRawUnsafe) BYPASS the Prisma $extends tenant-guard
          # middleware (S2.1b) because Prisma extensions only hook the typed
          # query API. Any raw SQL touching tenant-scoped tables introduces
          # a CWE-639 (Authorization Bypass) risk unless wrapped in a UoW
          # (so PostgreSQL RLS catches it via SET LOCAL app.account_id from
          # TenantContext, S2.1c) or explicitly opted-in via
          # withSystemContext() for admin/system flows.
          # Hard-zero. Exceptions (all audited-safe, no known-gap):
          #   - events/EventStore.ts: StoredEvent is a global table (no accountId).
          #   - PrismaStyleGuideRuleRepository.ts + PrismaGlossaryRepository.ts:
          #     raw pgvector UPDATEs — AUDITED S2.1d, both now carry
          #     AND "accountId" = ${requireTenantContext().accountId}.
          #     CWE-639 closed. See docs/security/MULTI_TENANT_AUDIT_2026-05-27.md.
          #     The regex cannot validate the AND clause on a multi-line
          #     Prisma.sql template literal; exception remains for clarity.
          #   - unitofwork/PrismaUnitOfWork.ts (S2.1c): emits set_config(
          #     'app.account_id', ..., true) to bind the RLS GUC at tx start.
          #     THE canonical entry point for tenant scope in transactions.
          MATCHES=$(grep -rnE "\.\\\$(queryRaw|executeRaw|queryRawUnsafe|executeRawUnsafe)\(" \
            apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
            grep -vE "/extensions/tenantGuard|/infrastructure/container/|/tests/|\.test\." | \
            grep -vE "/events/EventStore\.ts|/PrismaStyleGuideRuleRepository\.ts|/PrismaGlossaryRepository\.ts" | \
            grep -vE "/unitofwork/PrismaUnitOfWork\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #23 violation::$COUNT raw Prisma query(s) outside tenant guard + composition root. Raw queries bypass the Prisma extension tenant guard (S2.1b); wrap in UoW (RLS catches) OR use withSystemContext() for admin flows OR add to fitness #23 exception list with ADR justification."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#24 Canon child docs MUST exist + structured (anti-borrado)"
        if: always()
        run: |
          set -uo pipefail
          # The 4 canon child docs are auto-loaded into every Claude Code
          # session via @-imports in CLAUDE.md. Deleting one silently strips
          # load-bearing rules from every future session, so this fitness
          # step asserts each file exists AND carries the required structure
          # (§"How to extend" + **Owner:** line). Hard-zero anti-borrado guardrail.
          MISSING=0
          for f in docs/architecture/ARCHITECTURE_CANON.md \
                   docs/development/CODING_STANDARDS.md \
                   docs/security/SECURITY_CANON.md \
                   docs/observability/LOGGING_CANON.md; do
            if [ ! -f "$f" ]; then
              echo "::error title=Fitness #24 violation::MISSING canon child: $f"
              MISSING=$((MISSING + 1))
              continue
            fi
            if ! grep -q '^## How to extend' "$f"; then
              echo "::error title=Fitness #24 violation::MISSING §'How to extend' heading in $f"
              MISSING=$((MISSING + 1))
            fi
            if ! grep -q '^\*\*Owner:' "$f"; then
              echo "::error title=Fitness #24 violation::MISSING **Owner:** line in $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            exit 1
          fi

      - name: "#25 Circuit-breaker fail-fast for writes (two-part hard-zero)"
        if: always()
        run: |
          set -uo pipefail
          # Threat: a write-path fallback resolves provider failures with a
          # synthetic receipt ({id:"queued",status:"pending"}) instead of
          # surfacing an error — silently losing the post. Locks the two
          # CB-fallback invariants: the breaker default stays fail-fast, and no
          # write-verb operation opts in to a fallback. Mirrors CLAUDE.md #25.
          A=$(grep -nA6 "DEFAULT_EXTERNAL_API_OPTIONS: ExternalApiOptions = {" \
                packages/adapters/external-apis/src/circuitBreaker.ts 2>/dev/null | \
                grep -E "fallbackEnabled:\s*true" || true)
          ACOUNT=$(printf "%s" "$A" | grep -c . || true); ACOUNT=${ACOUNT:-0}
          B=$(grep -rn "fallbackEnabled: true" \
                packages/providers packages/adapters apps/api/src --include="*.ts" 2>/dev/null | \
                grep -vE "/tests/|\.test\." | \
                grep -E "(post-tweet|post-to-page|publish-media|create-container|create-stories|create-reels|send-message|send-photo|send-video|send-poll|send-document|send-audio|create-story|create-pin|create-post|upload-video|upload-short|upload-media|schedule|process-video|process-segment|optimize-reel|create-thumbnail|create-stream|start-stream|stop-stream)" || true)
          BCOUNT=$(printf "%s" "$B" | grep -c . || true); BCOUNT=${BCOUNT:-0}
          if [ "$ACOUNT" -gt 0 ]; then
            echo "::error title=Fitness #25 violation::DEFAULT_EXTERNAL_API_OPTIONS has fallbackEnabled:true (count=$ACOUNT) — the breaker default must stay fail-fast"
          fi
          if [ "$BCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #25 violation::$BCOUNT write-verb call site(s) opt into a fallback — surfaces the synthetic-receipt anti-pattern"
            printf "%s\n" "$B" | head -20
          fi
          if [ "$ACOUNT" -gt 0 ] || [ "$BCOUNT" -gt 0 ]; then
            exit 1
          fi

      - name: "#26 No .js-on-.ts relative imports in bundler-compiled frontend dirs"
        if: always()
        run: |
          set -uo pipefail
          # Next 16 Turbopack can't resolve a written ./x.js to its ./x.ts source
          # (vercel/next.js #82945 OPEN); the NodeNext .js convention is backend-only.
          # The Next apps + frontend-only packages use moduleResolution:bundler =
          # extensionless. A .js here silently breaks next dev/build. Mirrors CLAUDE.md #26.
          COUNT=$(grep -rnE 'from "\.\.?/[^"]*\.js"' \
                    apps/admin apps/client packages/ui/src packages/api-errors/src \
                    packages/query-client/src packages/observability/browser-logger/src \
                    --include="*.ts" --include="*.tsx" \
                    --exclude-dir=.next --exclude-dir=node_modules --exclude-dir=dist 2>/dev/null | wc -l || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #26 violation::$COUNT .js-on-.ts relative import(s) in bundler-compiled frontend dirs — Turbopack can't resolve them; use extensionless (backend keeps .js)"
            grep -rnE 'from "\.\.?/[^"]*\.js"' apps/admin apps/client packages/ui/src packages/api-errors/src packages/query-client/src packages/observability/browser-logger/src --include="*.ts" --include="*.tsx" --exclude-dir=.next --exclude-dir=node_modules --exclude-dir=dist 2>/dev/null | head -20
            exit 1
          fi

      - name: "#27 Dev/test source-resolution invariants (--conditions development + @shared/types build-first)"
        if: always()
        run: |
          set -uo pipefail
          # The dev-prod-resolution-model contract (ADR-0017 §1c). Part A: source-mode
          # node:test/seed invocations must pass --conditions development (else they
          # resolve workspace packages to the unbuilt dist via Node exports). Part B:
          # the size-limit job must build the Next apps via turbo (^build -> @shared/types
          # dist first), not a bare pnpm --filter. Mirrors CLAUDE.md #27.
          A=$(grep -rnE "node ([^|&]*)--import tsx" \
                apps/api/package.json apps/api/scripts/run-tests.sh infra/prisma/package.json 2>/dev/null | \
                grep -E -- "--test|security/tests|seed\.ts" | \
                grep -v -- "--conditions development" | \
                grep -vE '"dev":|dump:openapi' || true)
          ACOUNT=$(printf "%s" "$A" | grep -c . || true); ACOUNT=${ACOUNT:-0}
          B=$(grep -nE "pnpm --filter @apps/(admin|client)( --filter @apps/(admin|client))* build" \
                .github/workflows/audit.yml 2>/dev/null || true)
          BCOUNT=$(printf "%s" "$B" | grep -c . || true); BCOUNT=${BCOUNT:-0}
          if [ "$ACOUNT" -gt 0 ]; then
            echo "::error title=Fitness #27 violation::$ACOUNT source-mode node:test/seed invocation(s) missing --conditions development — they resolve to the unbuilt dist (exports->dist regression)"
            printf "%s\n" "$A" | head -20
          fi
          if [ "$BCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #27 violation::size-limit job uses a bare 'pnpm --filter @apps build' — must use 'turbo run build' so @shared/types dist is built before next build"
            printf "%s\n" "$B" | head -20
          fi
          if [ "$ACOUNT" -gt 0 ] || [ "$BCOUNT" -gt 0 ]; then
            exit 1
          fi

      - name: "#28 No permissive Fastify trust-proxy (trustProxy: true)"
        if: always()
        run: |
          set -uo pipefail
          # `trustProxy: true` makes request.ip the leftmost (client-controlled)
          # X-Forwarded-For entry, letting any client spoof its IP and rotate
          # rate-limit / IP-allowlist buckets to defeat the limiter
          # (ERR_ERL_PERMISSIVE_TRUST_PROXY; CVE-2025-59152 / CVE-2023-49952 /
          # CVE-2026-55501 class; CWE-807/290/348). trustProxy MUST be the numeric
          # TRUSTED_PROXY_HOP_COUNT. Mirrors CLAUDE.md #28.
          V=$(grep -rnE "trustProxy:\s*true" apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
                grep -vE "/tests/|\.test\." || true)
          COUNT=$(printf "%s" "$V" | grep -c . || true); COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #28 violation::$COUNT permissive 'trustProxy: true' occurrence(s) — use the numeric TRUSTED_PROXY_HOP_COUNT so request.ip is proxy-addr-resolved"
            printf "%s\n" "$V" | head -20
            exit 1
          fi

      - name: "#29 No raw client-IP header reads outside resolveClientIp"
        if: always()
        run: |
          set -uo pipefail
          # Every IP-keyed security decision (rate limit, IP allowlist, brute-force
          # throttle, audit IP) MUST go through resolveClientIp(); a direct
          # x-forwarded-for / x-real-ip read is the carrier for the leftmost-entry
          # spoof (see SECURITY_CANON.md §Rate Limiting). Excludes the resolver file
          # itself + tests. Mirrors CLAUDE.md #29.
          V=$(grep -rniE '"x-forwarded-for"|"x-real-ip"|headers\[.x-forwarded-for|headers\[.x-real-ip' \
                apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
                grep -vE "resolveClientIp|/tests/|\.test\." || true)
          COUNT=$(printf "%s" "$V" | grep -c . || true); COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #29 violation::$COUNT raw client-IP header read(s) outside resolveClientIp — route every IP-keyed decision through the canonical resolver"
            printf "%s\n" "$V" | head -20
            exit 1
          fi

      - name: "#33 Every extended root tsconfig listed in turbo.json globalDependencies"
        if: always()
        run: |
          set -uo pipefail
          # Turbo hashes per-package inputs plus globalDependencies and NOTHING
          # else, so a ROOT-level tsconfig a workspace package merely extends is
          # invisible to that package's hash. Editing it invalidates ZERO cache
          # entries and every dependent task replays a dist compiled with the
          # PREVIOUS compiler settings (target, module, declaration, skipLibCheck)
          # under a green exit code — a false green, reproduced end-to-end in
          # docs/reports/CI_CACHE_INTEGRITY_AUDIT.md. Membership is a
          # shell-pattern match because turbo accepts glob entries in
          # globalDependencies — a literal compare would flag configs a glob
          # already covers. The second pass walks ONE extends hop from every root
          # config that is listed or demanded by the first pass: a root->root
          # chain link (live today: tsconfig.build.base.json extends
          # tsconfig.base.json) is equally invisible to every per-package hash,
          # and since each properly listed link becomes checkable itself, longer
          # chains are covered link by link. Two skips, both justified:
          # non-relative extends targets resolve into node_modules and change
          # only with the lockfile, which turbo already hashes on its own;
          # targets that resolve inside a workspace directory stay covered by
          # that package's own input hash — in-tree today every relative target
          # resolves to a root config, so this second skip currently matches
          # nothing. Numbering: #30-32 are reserved by
          # workstream/ci-live-tier-integrity; delete this note once that branch
          # merges and #30-32 appear above. Hard-zero. Mirrors CLAUDE.md #33.
          GLOBALS=$(tr -d ' \n' < turbo.json | grep -oE '"globalDependencies":\[[^]]*\]' | \
            grep -oE '"[^"]*"' | tr -d '"' | grep -v '^globalDependencies$' || true)
          listed() {
            # set -f keeps glob entries as case patterns instead of expanding them
            # against the working directory; restored on every return path.
            set -f
            for entry in $GLOBALS; do
              case "$1" in $entry) set +f; return 0;; esac
            done
            set +f
            return 1
          }
          MISSING=""
          REACHED=""
          for cfg in $(find apps packages infra -name 'tsconfig*.json' \
              -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.next/*' \
              -not -path '*/.turbo/*' -not -path '*/.stryker-tmp/*' 2>/dev/null); do
            for target in $(grep -oE '"extends"[[:space:]]*:[[:space:]]*(\[[^]]*\]|"[^"]*")' "$cfg" 2>/dev/null | \
                grep -oE '"[^"]*"' | tr -d '"' | grep -v '^extends$' || true); do
              case "$target" in ./*|../*) ;; *) continue;; esac
              resolved=$(realpath -m --relative-to="$PWD" "$(dirname "$cfg")/$target" 2>/dev/null || true)
              case "$resolved" in "" | */*) continue;; esac
              REACHED="$REACHED $resolved"
              listed "$resolved" || MISSING="$MISSING$cfg -> $resolved\n"
            done
          done
          for cfg in tsconfig*.json; do
            [ -f "$cfg" ] || continue
            if ! listed "$cfg"; then case " $REACHED " in *" $cfg "*) ;; *) continue;; esac; fi
            for target in $(grep -oE '"extends"[[:space:]]*:[[:space:]]*(\[[^]]*\]|"[^"]*")' "$cfg" 2>/dev/null | \
                grep -oE '"[^"]*"' | tr -d '"' | grep -v '^extends$' || true); do
              case "$target" in ./*|../*) ;; *) continue;; esac
              resolved=$(realpath -m --relative-to="$PWD" "$(dirname "$cfg")/$target" 2>/dev/null || true)
              case "$resolved" in "" | */*) continue;; esac
              listed "$resolved" || MISSING="$MISSING$cfg -> $resolved\n"
            done
          done
          COUNT=$(printf "%b" "$MISSING" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #33 violation::$COUNT root tsconfig(s) reached by a workspace extends but missing from turbo.json globalDependencies — edits to them invalidate zero turbo cache entries and dependent tasks replay a stale dist as a false green. Add each listed file to globalDependencies."
            printf "%b\n" "$MISSING" | head -20
            exit 1
          fi

      - name: "#34 Every ::error in a workflow step pairs with a real failure in the same step"
        if: always()
        run: |
          set -uo pipefail
          # echo "::error..." only ANNOTATES — the step still exits 0 and the run
          # stays green, so an unpaired ::error is a failure that fails nothing.
          # Pairing is per-STEP, not per-file: a step counts as paired only when
          # the SAME step carries a real failure mechanism (exit <n>, exit "$VAR",
          # core.setFailed). ::warning is out of scope — advisory by design
          # (audit.yml carries intentional ones). Residual limits, stated
          # honestly: this is a line-based tripwire, not a YAML parser — an
          # emission not written as `echo "::error` (printf, github-script
          # core.error) is invisible to it, and a mechanism named only in a
          # comment inside the step satisfies the pairing. Hard-zero.
          # Mirrors CLAUDE.md #34.
          VIOLATIONS=$(for wf in .github/workflows/*.yml; do
            awk -v f="$wf" '
              /^[[:space:]]*-[[:space:]]+(name|uses):/ {
                if (in_step && has_err && !has_fail) print f " line " start ": step emits ::error without exit/core.setFailed";
                in_step=1; has_err=0; has_fail=0; start=NR;
              }
              /echo "::error/ { has_err=1 }
              /exit[[:space:]]+[1-9]|exit[[:space:]]+"?\$[A-Za-z_]|core\.setFailed/ { has_fail=1 }
              END { if (in_step && has_err && !has_fail) print f " line " start ": step emits ::error without exit/core.setFailed" }
            ' "$wf"
          done)
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #34 violation::$COUNT workflow step(s) emit ::error without a real failure mechanism in the same step — the annotation leaves the job green. Pair every ::error with exit 1 / exit \"\$CODE\" / core.setFailed in its step."
            printf "%s\n" "$VIOLATIONS" | head -20
            exit 1
          fi

      - name: "#35 outputs:[] build overrides bound to verdict-only build scripts"
        if: always()
        run: |
          set -uo pipefail
          # A per-package turbo.json declaring "outputs": [] for build tells
          # turbo the task writes nothing. Paired with an EMITTING build script
          # it earns a green cache entry that restores NOTHING — every later
          # cache hit replays "built" while the dist is missing (the
          # silent-cache-of-nothing defect, the converse of ci.yml's
          # no-output-files gate). The override is legitimate ONLY while the
          # build is verdict-only (tsc --noEmit); a build that starts emitting
          # must delete the override in the same change. Hard-zero.
          # Mirrors CLAUDE.md #35.
          VIOLATIONS=""
          for tj in $(find apps packages infra -name 'turbo.json' -not -path '*/node_modules/*' 2>/dev/null); do
            tr -d ' \n' < "$tj" | grep -q '"build":{[^}]*"outputs":\[\]' || continue
            pkg="$(dirname "$tj")/package.json"
            script=$([ -f "$pkg" ] && tr -d '\n' < "$pkg" | grep -oE '"build":[[:space:]]*"[^"]*"' | head -1 || true)
            printf '%s' "$script" | grep -qE 'tsc[^"]*--noEmit' || VIOLATIONS="$VIOLATIONS$tj -> ${script:-no build script}\n"
          done
          COUNT=$(printf "%b" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #35 violation::$COUNT per-package turbo.json outputs:[] override(s) whose build script is not verdict-only (tsc --noEmit) — turbo would cache a green entry that restores nothing. Make the build verdict-only or delete the override so real outputs get cached."
            printf "%b\n" "$VIOLATIONS" | head -20
            exit 1
          fi

      - name: Fitness summary
        if: always()
        run: |
          echo "## Fitness Functions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "32 architectural invariants (#1-#29, #33-#35) defined in CLAUDE.md §Automated Compliance Checks." >> $GITHUB_STEP_SUMMARY
          echo "Hard-zero threshold: any new occurrence fails this workflow with an \`::error\` annotation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See individual step results above for any violations." >> $GITHUB_STEP_SUMMARY

  dependency-consistency:
    name: Dependency Consistency (catalog single-version + lockfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "Lockfile gate: pnpm install --frozen-lockfile"
        run: pnpm install --frozen-lockfile

      - name: "Single-version gate: syncpack (catalog-managed direct deps; transitives are consumer-governed)"
        # syncpack@12 `lint` chokes on the catalog: protocol (reports every catalog ref
        # as UnsupportedMismatch); `list-mismatches` is the real single-version + exact-range
        # gate. Consumer-governed transitives are not manifest-declared, so they are
        # structurally invisible to the single-version group. See ADR-0018 / Step 5 T5.1.
        run: pnpm dlx syncpack@12 list-mismatches

      - name: "Dedupe gate: pnpm dedupe --check (no flattenable duplicates)"
        # pnpm 11 fixed the pnpm-10.16 false-positive (which needed a double invocation);
        # a single `dedupe --check` is now reliably exit 0. The former vite 7/8 split that
        # would otherwise surface here was resolved at the root (apps/client gained
        # @vitejs/plugin-react, collapsing to a single vite 8). See ADR-0019.
        run: pnpm dedupe --check
