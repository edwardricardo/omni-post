name: Architectural Fitness Functions

# Wires the fitness greps documented in CLAUDE.md §Automated Compliance
# Checks to CI (the step summary enumerates the current set). Any new
# occurrence of any pattern fails the workflow and is annotated on the PR diff.
#
# Strategy: hard-zero for every check but one (each returns count = 0). #1 and
# #21 ran as ratchets during the prisma->DI remediation; that workstream is
# complete, so both are now hard-zero like the rest. #30 is the single live
# ratchet, at a measured baseline of 21, because its violations are unrun test
# suites whose wiring is a separate body of work.
#
# A check whose scope path does not exist is WORSE than no check: `grep -r` on
# an absent directory exits 2, prints nothing, and `| wc -l` renders that as 0 —
# a green annotation asserting an invariant nobody measured. #2, #3 and #4 spent
# the whole post-relocation period in exactly that state, which is why each of
# them now asserts its scope directories exist BEFORE running its grep, and
# fails loudly when one is missing rather than passing quietly. The former
# `2>/dev/null` on those three greps is gone for the same reason: it hid the
# exit-2 that was the only remaining evidence.
#
# Canon: Ford & Parsons "Building Evolutionary Architectures" (2nd ed) —
# hard-zero is the correct mode for invariants in a clean codebase; ratchets
# are only correct when a non-zero baseline cannot be eliminated immediately.
#
# Design: single job + one named step per check with `if: always()` so a
# violation in one step does NOT mask later violations — every PR sees every check.
# One exception: #37 gates the delta against the PR base, which only exists on
# pull_request events — its `if` adds that event condition and the step is
# skipped (visibly, not silently green) on push runs.
# Annotations are aggregated to one `::error` per check (bypasses the
# 10-errors-per-step / 50-per-job silent cap of GitHub Actions).

on:
  push:
    # PR branches validate via the pull_request trigger; listing them here too
    # fired a redundant second run per push.
    branches: [main, omni-post-cc]
  pull_request:
    branches: [main, omni-post-cc]

concurrency:
  group: fitness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fitness:
    name: Fitness Functions (CLAUDE.md greps)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Fitness #36 expands scope globs via node's fs.glob (node >= 22; stable on
      # 24). The runner's default node is not version-pinned, so pin it here —
      # no install/cache: the fitness job runs zero package code.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: "#1 No Prisma singleton imports in routes"
        if: always()
        run: |
          set -uo pipefail
          # Glob fixed: *[Rr]outes* also matches PascalCase *Routes.ts. The old
          # *routes* was case-sensitive and missed every *Routes.ts, so this
          # guard silently passed while admin routes imported the singleton.
          # Hard-zero (the prisma->DI remediation is complete).
          MATCHES=$(grep -rn "import { prisma" apps/api/src/ --include="*[Rr]outes*" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #1 violation::$COUNT Prisma singleton imports in route files. Resolve use cases from DI: fastify.container.resolve(TOKENS.X). Do NOT add any."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#2 Domain + application core is framework-free"
        if: always()
        run: |
          set -uo pipefail
          # Scope repointed: `apps/api/src/domain/` no longer exists — the layers
          # moved to `packages/core/` in the relocation fitness #22 enforces. A
          # `grep -r` on an absent directory exits 2, prints nothing, and
          # `| wc -l` renders that as 0, so this guard reported a clean domain
          # over code it never opened. The scope is the whole `packages/core`
          # tree because the canon forbids concrete infrastructure in BOTH layers
          # it holds (application imports domain only, never an adapter), and
          # because a per-context package is added by creating a directory — a
          # scope that names them one by one goes stale the same way the old path
          # did. Tests are out: they are @layer infrastructure and legitimately
          # name the technologies they replace with doubles. Mirrors CLAUDE.md #2.
          for d in packages/core; do
            [ -d "$d" ] || { echo "::error title=Fitness #2 scope missing::'$d' does not exist, so this check would scan nothing and pass. Repoint the scope to where the layer lives now."; exit 1; }
          done
          MATCHES=$(grep -rn "prisma\|fastify\|redis\|bullmq" packages/core --include="*.ts" | \
            grep -vE "/dist/|/node_modules/|/tests/|\.test\.ts:" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #2 violation::$COUNT framework references found in the domain/application core (expected 0). Domain must import nothing external — no Prisma, Fastify, Redis, BullMQ — and application imports domain only."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#3 No `any` in the core or in apps/api infrastructure"
        if: always()
        run: |
          set -uo pipefail
          # Same repoint as #2: two of the three original path arguments were
          # gone, so grep errored on them and the surviving `infrastructure` arm
          # carried the whole check while the annotation still claimed all three
          # layers. Excludes JSDoc/comment lines and tests — a negative test may
          # need `as any` to construct invalid state, which is the `test-fixture`
          # scenario in CLAUDE.md §Pragmatic Exceptions. Mirrors CLAUDE.md #3.
          for d in packages/core apps/api/src/infrastructure; do
            [ -d "$d" ] || { echo "::error title=Fitness #3 scope missing::'$d' does not exist, so this check would scan nothing and pass. Repoint the scope to where the layer lives now."; exit 1; }
          done
          MATCHES=$(grep -rnE "(:\s+any\b|\bas any\b|<any>)" \
            packages/core apps/api/src/infrastructure \
            --include="*.ts" | \
            grep -vE "/dist/|/node_modules/|/tests/|\.test\.ts:" | \
            grep -vE "//.*any|^[^:]+:[0-9]+:\s*\*" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #3 violation::$COUNT \`any\` usages in the domain/application core or apps/api infrastructure (expected 0). Use proper interfaces, generics, or \`unknown\` + type guard."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#4 No raw throws in the core (domain + application)"
        if: always()
        run: |
          set -uo pipefail
          # Same repoint as #2/#3, and the most misleading of the three: BOTH of
          # its path arguments were gone, so it scanned nothing at all. Canon:
          # fallible operations return Result<T, DomainError> and a throw never
          # crosses a layer boundary. Excludes dist, node_modules, tests, and
          # comment lines (`MAY throw` in JSDoc prose is documentation, not a
          # statement). The four excepted files each hold a real throw and are
          # named so the debt is attributable rather than absorbed by a path that
          # reads as green:
          #   - GatewayBillingService.ts + TrialManagementService.ts: the throw is
          #     the rollback signal inside unitOfWork.executeInTransaction() — an
          #     interactive Prisma transaction aborts only by throwing — and the
          #     method's own try/catch converts it to err(...). Never leaves the
          #     service. Remove-when: UnitOfWork exposes an explicit abort.
          #   - DeletePostUseCase.ts: exhaustiveness guard on a `never`,
          #     unreachable by construction. Remove-when: the caller union is
          #     closed by a compiler-checked schema.
          #   - ComplianceService.ts: NOT audited-safe, and the reason this list
          #     is explicit. getGdprSettings()/getSecuritySettings() are typed
          #     Promise<GdprSettings>/Promise<SecuritySettings>, so their throws
          #     DO escape the application layer — a live canon violation the dead
          #     scope was concealing. Remove-when: both getters return
          #     Result<T, DomainError> and every caller narrows on .ok.
          # Mirrors CLAUDE.md #4.
          for d in packages/core; do
            [ -d "$d" ] || { echo "::error title=Fitness #4 scope missing::'$d' does not exist, so this check would scan nothing and pass. Repoint the scope to where the layer lives now."; exit 1; }
          done
          MATCHES=$(grep -rn "throw " packages/core --include="*.ts" | \
            grep -vE "/dist/|/node_modules/|/tests/|\.test\.ts:" | \
            grep -vE "^[^:]+:[0-9]+:\s*(\*|//)" | \
            grep -vE "/GatewayBillingService\.ts|/TrialManagementService\.ts|/ComplianceService\.ts|/DeletePostUseCase\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #4 violation::$COUNT raw \`throw\` statements in the domain/application core (expected 0). Use Result<T, DomainError> for fallible operations."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#5 No @ts-ignore or @ts-nocheck in production source"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "@ts-ignore\|@ts-nocheck" apps/api/src/ packages/*/src/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #5 violation::$COUNT @ts-ignore/@ts-nocheck in production source (expected 0). Fix the underlying type issue."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#6 CQRS handlers don't touch Prisma directly"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "prisma\." apps/api/src/cqrs/handlers/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #6 violation::$COUNT direct Prisma calls in CQRS handlers (expected 0). Delegate to Application layer use cases."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#7 No randomUUID/Math.random in dedupeKey"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "dedupeKey.*randomUUID\|dedupeKey.*Math.random" apps/api/src/ packages/ --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #7 violation::$COUNT dedupeKey uses non-deterministic ID (expected 0). DedupeKey must be deterministic: saga-\${sagaId}-\${stepIndex}."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#8 No sprint/phase references in source comments"
        if: always()
        run: |
          set -uo pipefail
          # Catches: "Sprint 1", "Sprint A", "Sprint 8", "Part of Sprint X",
          # "Phase 1", "Phase 2", the legacy "T0A_" / "T0-A" task-batch prefixes,
          # and the parenthesised phase/task shorthand "(P8)" / "(P2-1)" / "(P3-A)"
          # / "(P1-DI-7)". Prisma-safe: `\(P[0-9]\)` matches a single digit and
          # `\(P[0-9]+-` requires a dash, so Prisma error codes like "(P2002)"
          # (P + 4 digits, no dash) are NOT flagged. All belong in git history /
          # PR descriptions, not in source comments where they rot.
          MATCHES=$(grep -rnE "Part of Sprint|Phase.*Sprint|Sprint [0-9A-Z]|Phase [0-9]|T0A_|T0-A|\(P[0-9]\)|\(P[0-9]+-[A-Za-z0-9]" \
            apps/ packages/ infra/ --include="*.ts" --include="*.tsx" --include="*.prisma" 2>/dev/null | \
            grep -vE "node_modules|dist|\.next|\.stryker-tmp|\.stryker|reports/mutation|infra/prisma/generated/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #8 violation::$COUNT sprint/phase references in source (expected 0). Belongs in git history, not source comments."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#9 Every file has @file header"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rL "@file" apps/ packages/ --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "node_modules\|dist\|\.next\|\.stryker\|reports/mutation\|next-env\.d\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #9 violation::$COUNT files missing @file header (expected 0)."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#10 Only valid @layer values (domain/application/infrastructure)"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rn "@layer" apps/ packages/ --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "node_modules\|dist\|\.next\|\.stryker\|reports/mutation" | \
            grep -v "@layer application\|@layer domain\|@layer infrastructure" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #10 violation::$COUNT files with invalid @layer value (expected 0). Allowed: domain, application, infrastructure."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#11 No raw setInterval in backend"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "setInterval\(" apps/api/src apps/workers/src packages/ --include="*.ts" 2>/dev/null | \
            grep -vE "default-scheduler|node_modules|dist|\.test\.|/tests/|/\.stryker-tmp/|eslint\.config|DANGEROUS_STRINGS|enhancedValidator\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #11 violation::$COUNT raw setInterval calls in backend (expected 0). Register via TOKENS.BackgroundTaskScheduler."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#12 Every component file carries @component tag"
        if: always()
        run: |
          set -uo pipefail
          MISSING=""
          for f in $(find apps/admin/components apps/client/components packages/ui/src/components \
            -type f -name "*.tsx" 2>/dev/null | grep -v "\.stories\.\|\.test\.\|\.next" || true); do
            basename=$(basename "$f")
            case "$basename" in use*) continue;; esac
            if ! grep -qE "^export (default )?(function|const) [A-Z]" "$f"; then continue; fi
            if ! grep -q "@component" "$f"; then
              MISSING="$MISSING\n$f"
            fi
          done
          COUNT=$(printf "%b" "$MISSING" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #12 violation::$COUNT React component files missing @component JSDoc tag (expected 0)."
            printf "%b\n" "$MISSING" | head -20
            exit 1
          fi

      - name: "#13 No direct pino imports in apps/api"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "^import pino\b|^const \w+ = pino\(" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "lib/logger\.ts\|\.test\.\|/tests/\|/\.stryker-tmp/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #13 violation::$COUNT direct pino imports in apps/api (expected 0). Use createLogger() from apps/api/src/lib/logger.ts so redaction config is uniform."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#14 No per-class `private *Cache = new Map` in apps/api/src"
        if: always()
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE "^\s+private \w*[Cc]ache.*= new Map" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "\.test\.\|/tests/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #14 violation::$COUNT per-class private *Cache = new Map() in apps/api/src (expected 0). All cross-pod cached state MUST go through TOKENS.CachePort. Reason: OWASP A07:2021 cache coherence."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#15 No insecure secret fallbacks (CWE-798)"
        if: always()
        run: |
          set -uo pipefail
          # Block the patterns:
          #   process.env.X_SECRET || "dev-only-..."
          #   process.env.X_KEY ?? ""
          #   process.env.X_TOKEN || generated()
          # The fix in app code is the typed `env` constant from
          # apps/api/src/config/env.ts (Zod-validated, fail-fast). In provider
          # apiClients, secrets must arrive via constructor injection from the
          # composition root, never read from env at module/method scope.
          # Scope: apps/api/src + apps/workers/src + packages/providers/*
          # (excluding _template scaffolding).
          MATCHES=$(grep -rnE 'process\.env\.[A-Z_]*(SECRET|KEY|PASSWORD|TOKEN|CREDENTIAL)[A-Z_]*\s*(\|\||\?\?)' \
            apps/api/src apps/workers/src packages/providers --include="*.ts" 2>/dev/null | \
            grep -v "node_modules\|\.test\.\|/tests/\|\.stryker\|/dist/\|config/env\.ts\|providers/_template/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #15 violation::$COUNT insecure secret fallbacks (expected 0). Replace with the typed env constant from apps/api/src/config/env.ts — Zod schema fails fast at boot, no fallback. Reason: CWE-798 (Use of Hard-coded Credentials), OWASP A07:2025."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#19 No process.env reads inside provider Adapter classes"
        if: always()
        run: |
          set -uo pipefail
          # Provider adapters are stateless and receive credentials per-call
          # from the application layer's CredentialResolver. Any env read
          # inside an Adapter.ts file reintroduces the CWE-798 anti-pattern
          # by smuggling secrets through the module rather than via injection.
          # Operational config that legitimately lives in apiClient.ts is
          # allowed there but NOT in the adapter itself. Excludes _template.
          MATCHES=$(grep -rnE 'process\.env\.' packages/providers/*/src/*Adapter.ts 2>/dev/null | \
            grep -v "providers/_template/\|\.stryker\|/dist/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #19 violation::$COUNT process.env reads inside provider Adapter classes (expected 0). Adapters must receive credentials per-call and any operational config via constructor injection from the composition root."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#16 No direct process.env.* in apps/api/src outside config/env.ts"
        if: always()
        run: |
          set -uo pipefail
          # apps/api/src must consume the typed `env` constant from
          # config/env.ts — direct process.env access bypasses Zod validation
          # and creates a regression vector for #15. Workers + packages are
          # out of scope (separate refactor) but this gate locks in the API.
          # Exception: process.env.NODE_ENV — Node ecosystem convention treats
          # this as runtime-readable, and tests rely on dynamic mutation.
          MATCHES=$(grep -rn "process\.env\." apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "config/env\.ts\|/tests/\|\.test\.\|process\.env\.NODE_ENV\b" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #16 violation::$COUNT direct process.env.* references in apps/api/src outside config/env.ts (expected 0). Use the typed env constant — see apps/api/src/config/env.ts."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#17 No direct process.env.* in Next.js apps outside lib/env.ts"
        if: always()
        run: |
          set -uo pipefail
          # Next.js client bundles inline process.env reads at BUILD TIME via
          # Webpack DefinePlugin. A `process.env.SOME_SECRET` referenced in a
          # client component leaks the value into the JS shipped to the
          # browser. Routing every consumer through `lib/env.ts` (t3-env)
          # enforces server/client split via the `clientPrefix` convention
          # and fails build when a secret is referenced from client code.
          # Exception: process.env.NODE_ENV (Node ecosystem convention) +
          # playwright config (runs outside Next bundle).
          MATCHES=$(grep -rnE "process\.env\." \
              apps/admin/{app,components,hooks,lib,providers} \
              apps/client/{app,components,hooks,lib,providers} \
              --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "lib/env\.ts\|process\.env\.NODE_ENV\b\|/tests/\|\.test\." || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #17 violation::$COUNT direct process.env.* references in Next.js apps outside lib/env.ts (expected 0). Use the typed env constant — see apps/{admin,client}/lib/env.ts. Reason: Webpack DefinePlugin inlines client process.env at build time; client components must consume only NEXT_PUBLIC_* via env."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#18 No direct argon2.hash/verify outside passwordHashing.ts"
        if: always()
        run: |
          set -uo pipefail
          # Centralised Argon2id hashing in `apps/api/src/auth/passwordHashing.ts`
          # ensures every password / API-key / backup-code hash uses identical
          # canonical parameters (RFC 9106 second-recommended). Direct calls to
          # `argon2.hash()` or `argon2.verify()` elsewhere create drift risk —
          # one site might use lib defaults, another might pass weaker params.
          # Route everything through `hashPassword`, `verifyPassword`,
          # `needsRehash` from the helper.
          MATCHES=$(grep -rnE "argon2\.(hash|verify)\(" apps/api/src --include="*.ts" 2>/dev/null | \
            grep -v "passwordHashing\.ts\|/tests/\|\.test\." || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #18 violation::$COUNT direct argon2.hash/verify calls outside apps/api/src/auth/passwordHashing.ts (expected 0). Route through the helper — see hashPassword / verifyPassword / needsRehash."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#20 No legacy BullMQ repeatable API"
        if: always()
        run: |
          set -uo pipefail
          # addRepeatable / getRepeatableJobs / removeRepeatableByKey /
          # removeRepeatable are deprecated since BullMQ 5.16.0 (removed in
          # v6). The canonical recurring primitive is upsertJobScheduler
          # (idempotent by scheduler id). The four method names are
          # BullMQ-exclusive so this is a precise hard-zero with no false
          # positives (unlike a bare `repeat:` which collides with domain
          # fields and provider API params). Excludes tests + sandboxes.
          MATCHES=$(grep -rnE "\.(addRepeatable|getRepeatableJobs|removeRepeatableByKey|removeRepeatable)\(" apps/*/src packages/*/src --include="*.ts" 2>/dev/null | \
            grep -vE "node_modules|/dist/|\.test\.|/tests/|\.stryker" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #20 violation::$COUNT legacy BullMQ repeatable API call(s) (expected 0). Use Queue.upsertJobScheduler / getJobSchedulers / removeJobScheduler — deprecated since BullMQ 5.16.0."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#21 No Prisma singleton imports outside composition roots"
        if: always()
        run: |
          set -uo pipefail
          # DI canon: only a composition root may import the `prisma` singleton;
          # every other unit RECEIVES PrismaClient (or a port) by constructor
          # injection. Scope: apps/api/src + apps/workers/src. Exceptions: the
          # api composition root (infrastructure/container), the api bootstrap
          # (index.ts), the workers composition root (**/container/), and tests.
          # Hard-zero (the prisma->DI remediation is complete). This guard
          # supersedes #1 (routes are a subset).
          MATCHES=$(grep -rlE "import \{[^}]*\bprisma\b[^}]*\} from \"@infra/prisma\"" apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
            grep -vE "/infrastructure/container/|/index\.ts$|/container/|\.test\.|/tests/" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #21 violation::$COUNT prisma singleton importer(s) outside composition roots. Inject PrismaClient via constructor and resolve from the container. Do NOT add any."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#22 No @layer application in apps/api/src (application code lives in @core/application)"
        if: always()
        run: |
          set -uo pipefail
          # Workstream application-services-to-core (S1' -> S4) relocated every
          # @layer application file from apps/api/src to packages/core/application/.
          # Re-introducing @layer application in apps/api/src reverses that move
          # and reintroduces the inverted-dependency smell. New application-layer
          # code MUST go to packages/core/application/<context>/ and apps/api
          # consumers import it as @core/application/<context>/<Service>.js.
          # Hard-zero (S5 closed the workstream).
          MATCHES=$(grep -rlE "^[[:space:]]*\*[[:space:]]*@layer application[[:space:]]*$" apps/api/src --include="*.ts" 2>/dev/null || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #22 violation::$COUNT @layer application file(s) in apps/api/src. Move the file to packages/core/application/<context>/ and repoint consumers via @core/application/<context>/<Service>.js."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#23 No raw Prisma queries outside tenant guard + composition root"
        if: always()
        run: |
          set -uo pipefail
          # Raw Prisma queries ($queryRaw, $executeRaw, $queryRawUnsafe,
          # $executeRawUnsafe) BYPASS the Prisma $extends tenant-guard
          # middleware (S2.1b) because Prisma extensions only hook the typed
          # query API. Any raw SQL touching tenant-scoped tables introduces
          # a CWE-639 (Authorization Bypass) risk unless wrapped in a UoW
          # (so PostgreSQL RLS catches it via SET LOCAL app.account_id from
          # TenantContext, S2.1c) or explicitly opted-in via
          # withSystemContext() for admin/system flows.
          # Hard-zero. Exceptions (all audited-safe, no known-gap):
          #   - events/EventStore.ts: StoredEvent is a global table (no accountId).
          #   - PrismaStyleGuideRuleRepository.ts + PrismaGlossaryRepository.ts:
          #     raw pgvector UPDATEs — AUDITED S2.1d, both now carry
          #     AND "accountId" = ${requireTenantContext().accountId}.
          #     CWE-639 closed. See docs/security/MULTI_TENANT_AUDIT_2026-05-27.md.
          #     The regex cannot validate the AND clause on a multi-line
          #     Prisma.sql template literal; exception remains for clarity.
          #   - unitofwork/PrismaUnitOfWork.ts (S2.1c): emits set_config(
          #     'app.account_id', ..., true) to bind the RLS GUC at tx start.
          #     THE canonical entry point for tenant scope in transactions.
          MATCHES=$(grep -rnE "\.\\\$(queryRaw|executeRaw|queryRawUnsafe|executeRawUnsafe)\(" \
            apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
            grep -vE "/extensions/tenantGuard|/infrastructure/container/|/tests/|\.test\." | \
            grep -vE "/events/EventStore\.ts|/PrismaStyleGuideRuleRepository\.ts|/PrismaGlossaryRepository\.ts" | \
            grep -vE "/unitofwork/PrismaUnitOfWork\.ts" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #23 violation::$COUNT raw Prisma query(s) outside tenant guard + composition root. Raw queries bypass the Prisma extension tenant guard (S2.1b); wrap in UoW (RLS catches) OR use withSystemContext() for admin flows OR add to fitness #23 exception list with ADR justification."
            printf "%s\n" "$MATCHES" | head -40
            exit 1
          fi

      - name: "#24 Canon child docs MUST exist + structured (anti-borrado)"
        if: always()
        run: |
          set -uo pipefail
          # The 4 canon child docs are auto-loaded into every Claude Code
          # session via @-imports in CLAUDE.md. Deleting one silently strips
          # load-bearing rules from every future session, so this fitness
          # step asserts each file exists AND carries the required structure
          # (§"How to extend" + **Owner:** line). Hard-zero anti-borrado guardrail.
          MISSING=0
          for f in docs/architecture/ARCHITECTURE_CANON.md \
                   docs/development/CODING_STANDARDS.md \
                   docs/security/SECURITY_CANON.md \
                   docs/observability/LOGGING_CANON.md; do
            if [ ! -f "$f" ]; then
              echo "::error title=Fitness #24 violation::MISSING canon child: $f"
              MISSING=$((MISSING + 1))
              continue
            fi
            if ! grep -q '^## How to extend' "$f"; then
              echo "::error title=Fitness #24 violation::MISSING §'How to extend' heading in $f"
              MISSING=$((MISSING + 1))
            fi
            if ! grep -q '^\*\*Owner:' "$f"; then
              echo "::error title=Fitness #24 violation::MISSING **Owner:** line in $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            exit 1
          fi

      - name: "#25 Circuit-breaker fail-fast for writes (two-part hard-zero)"
        if: always()
        run: |
          set -uo pipefail
          # Threat: a write-path fallback resolves provider failures with a
          # synthetic receipt ({id:"queued",status:"pending"}) instead of
          # surfacing an error — silently losing the post. Locks the two
          # CB-fallback invariants: the breaker default stays fail-fast, and no
          # write-verb operation opts in to a fallback. Mirrors CLAUDE.md #25.
          A=$(grep -nA6 "DEFAULT_EXTERNAL_API_OPTIONS: ExternalApiOptions = {" \
                packages/adapters/external-apis/src/circuitBreaker.ts 2>/dev/null | \
                grep -E "fallbackEnabled:\s*true" || true)
          ACOUNT=$(printf "%s" "$A" | grep -c . || true); ACOUNT=${ACOUNT:-0}
          B=$(grep -rn "fallbackEnabled: true" \
                packages/providers packages/adapters apps/api/src --include="*.ts" 2>/dev/null | \
                grep -vE "/tests/|\.test\." | \
                grep -E "(post-tweet|post-to-page|publish-media|create-container|create-stories|create-reels|send-message|send-photo|send-video|send-poll|send-document|send-audio|create-story|create-pin|create-post|upload-video|upload-short|upload-media|schedule|process-video|process-segment|optimize-reel|create-thumbnail|create-stream|start-stream|stop-stream)" || true)
          BCOUNT=$(printf "%s" "$B" | grep -c . || true); BCOUNT=${BCOUNT:-0}
          if [ "$ACOUNT" -gt 0 ]; then
            echo "::error title=Fitness #25 violation::DEFAULT_EXTERNAL_API_OPTIONS has fallbackEnabled:true (count=$ACOUNT) — the breaker default must stay fail-fast"
          fi
          if [ "$BCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #25 violation::$BCOUNT write-verb call site(s) opt into a fallback — surfaces the synthetic-receipt anti-pattern"
            printf "%s\n" "$B" | head -20
          fi
          if [ "$ACOUNT" -gt 0 ] || [ "$BCOUNT" -gt 0 ]; then
            exit 1
          fi

      - name: "#26 No .js-on-.ts relative imports in bundler-compiled frontend dirs"
        if: always()
        run: |
          set -uo pipefail
          # Next 16 Turbopack can't resolve a written ./x.js to its ./x.ts source
          # (vercel/next.js #82945 OPEN); the NodeNext .js convention is backend-only.
          # The Next apps + frontend-only packages use moduleResolution:bundler =
          # extensionless. A .js here silently breaks next dev/build. Mirrors CLAUDE.md #26.
          COUNT=$(grep -rnE 'from "\.\.?/[^"]*\.js"' \
                    apps/admin apps/client packages/ui/src packages/api-errors/src \
                    packages/query-client/src packages/observability/browser-logger/src \
                    --include="*.ts" --include="*.tsx" \
                    --exclude-dir=.next --exclude-dir=node_modules --exclude-dir=dist 2>/dev/null | wc -l || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #26 violation::$COUNT .js-on-.ts relative import(s) in bundler-compiled frontend dirs — Turbopack can't resolve them; use extensionless (backend keeps .js)"
            grep -rnE 'from "\.\.?/[^"]*\.js"' apps/admin apps/client packages/ui/src packages/api-errors/src packages/query-client/src packages/observability/browser-logger/src --include="*.ts" --include="*.tsx" --exclude-dir=.next --exclude-dir=node_modules --exclude-dir=dist 2>/dev/null | head -20
            exit 1
          fi

      - name: "#27 Dev/test source-resolution invariants (--conditions development + @shared/types build-first)"
        if: always()
        run: |
          set -uo pipefail
          # The dev-prod-resolution-model contract (ADR-0017 §1c). Part A: source-mode
          # node:test/seed/service invocations must pass --conditions development (else
          # they resolve workspace packages to the unbuilt dist via Node exports).
          # apps/workers/package.json + src/bootstrap.ts are in scope because CI boots
          # the workers from source in the integration job: without the condition the
          # worker resolves ~12 workspace packages to a dist CI never builds and dies
          # during boot, so the readiness gate reports "not ready" for a reason that has
          # nothing to do with the queue it exists to prove. Part B: the size-limit job
          # must build the Next apps via turbo (^build -> @shared/types dist first), not
          # a bare pnpm --filter. Mirrors CLAUDE.md #27.
          A=$(grep -rnE "node ([^|&]*)--import tsx" \
                apps/api/package.json apps/api/scripts/run-tests.sh infra/prisma/package.json \
                apps/workers/package.json 2>/dev/null | \
                grep -E -- "--test|security/tests|seed\.ts|src/bootstrap\.ts" | \
                grep -v -- "--conditions development" | \
                grep -vE '"dev":|dump:openapi' || true)
          ACOUNT=$(printf "%s" "$A" | grep -c . || true); ACOUNT=${ACOUNT:-0}
          B=$(grep -nE "pnpm --filter @apps/(admin|client)( --filter @apps/(admin|client))* build" \
                .github/workflows/audit.yml 2>/dev/null || true)
          BCOUNT=$(printf "%s" "$B" | grep -c . || true); BCOUNT=${BCOUNT:-0}
          if [ "$ACOUNT" -gt 0 ]; then
            echo "::error title=Fitness #27 violation::$ACOUNT source-mode node:test/seed invocation(s) missing --conditions development — they resolve to the unbuilt dist (exports->dist regression)"
            printf "%s\n" "$A" | head -20
          fi
          if [ "$BCOUNT" -gt 0 ]; then
            echo "::error title=Fitness #27 violation::size-limit job uses a bare 'pnpm --filter @apps build' — must use 'turbo run build' so @shared/types dist is built before next build"
            printf "%s\n" "$B" | head -20
          fi
          if [ "$ACOUNT" -gt 0 ] || [ "$BCOUNT" -gt 0 ]; then
            exit 1
          fi

      - name: "#28 Fastify trustProxy comes ONLY from the derived policy"
        if: always()
        run: |
          set -uo pipefail
          # An ALLOWLIST, and it used to be a denylist — the inversion is the point.
          # The old form banned `trustProxy: true` and REQUIRED the numeric
          # TRUSTED_PROXY_HOP_COUNT. Fastify 5.12.1 (GHSA-3m5p-2c4r-xxw2) deleted
          # numeric hop-count trust: getTrustProxyFn returns `() => false` for a
          # number, because hop-count-only trust cannot validate the immediate peer.
          # So the old check REQUIRED the spelling that had become dangerous and was
          # blind to it: measured, `trustProxy: 2` returned count=0 and passed, while
          # `trustProxy: true` was caught. A gate that mandates the defect it exists
          # to prevent is worse than no gate.
          #
          # A denylist cannot fix this — the dangerous set is open-ended (any number,
          # any hand-rolled `(addr, hop) => hop < N` that would type-check and keep
          # tests green while restoring the patched vulnerability). So: every
          # `trustProxy:` MUST be the single derived binding FASTIFY_TRUST_PROXY,
          # computed by apps/api/src/security/trustedProxy.ts from the boot-validated
          # TRUSTED_PROXY_MODE + TRUSTED_PROXY_RANGES pair. See ADR-0021 and
          # SECURITY_CANON.md §Rate Limiting. Mirrors CLAUDE.md #28.
          V=$(grep -rnE "trustProxy:" apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
                grep -vE "/tests/|\.test\.|/security/trustedProxy\.ts:" | \
                grep -vE "trustProxy:\s*FASTIFY_TRUST_PROXY\b" || true)
          COUNT=$(printf "%s" "$V" | grep -c . || true); COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #28 violation::$COUNT trustProxy binding(s) that are not the derived FASTIFY_TRUST_PROXY. Numeric hop counts are inert since fastify 5.12.1 (they resolve request.ip to the socket peer, collapsing every user into one rate-limit bucket), 'true' trusts the client-controlled leftmost XFF entry, and a hand-rolled hop function restores the exact vulnerability the advisory patched. Derive the policy from TRUSTED_PROXY_MODE + TRUSTED_PROXY_RANGES instead (ADR-0021)."
            printf "%s\n" "$V" | head -20
            exit 1
          fi

      - name: "#29 No raw client-IP header reads outside resolveClientIp"
        if: always()
        run: |
          set -uo pipefail
          # Every IP-keyed security decision (rate limit, IP allowlist, brute-force
          # throttle, audit IP) MUST go through resolveClientIp(); a direct
          # x-forwarded-for / x-real-ip read is the carrier for the leftmost-entry
          # spoof (see SECURITY_CANON.md §Rate Limiting). Excludes the resolver file
          # itself + tests. Mirrors CLAUDE.md #29.
          V=$(grep -rniE '"x-forwarded-for"|"x-real-ip"|headers\[.x-forwarded-for|headers\[.x-real-ip' \
                apps/api/src apps/workers/src --include="*.ts" 2>/dev/null | \
                grep -vE "resolveClientIp|/tests/|\.test\." || true)
          COUNT=$(printf "%s" "$V" | grep -c . || true); COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #29 violation::$COUNT raw client-IP header read(s) outside resolveClientIp — route every IP-keyed decision through the canonical resolver"
            printf "%s\n" "$V" | head -20
            exit 1
          fi

      - name: "#30 Every committed test file is reachable by a collector (ratchet)"
        if: always()
        run: |
          set -uo pipefail
          # RATCHET, not hard-zero — the only such check in this suite. Vitest
          # collects apps/api/tests/unit/** and tests/eval/** from the tree via
          # the `include` globs in apps/api/vitest.config.ts, so those are
          # reachable by construction. Every OTHER node:test file under
          # apps/api/tests is selected by an EXPLICIT file list in
          # apps/api/scripts/run-tests.sh, and a suite that no `run_batch` names
          # never executes anywhere — while still reading as coverage in the
          # tree, in review, and in a coverage report that only counts what ran.
          # Baseline 21, measured, tracked as SMELL-75 in
          # docs/reports/roadmap-detected-smells-backlog.md. Wiring them is its
          # own body of work (each needs a tier, services, and a runtime budget),
          # so the gate gives that work a floor instead of blocking on it: the
          # count may fall and must never rise. Mirrors CLAUDE.md #30.
          BASELINE=21
          for p in apps/api/tests apps/api/scripts/run-tests.sh; do
            [ -e "$p" ] || { echo "::error title=Fitness #30 scope missing::'$p' does not exist, so this check would scan nothing and pass."; exit 1; }
          done
          UNREACHED=$(for f in $(find apps/api/tests -name "*.test.ts" \
              -not -path "*/tests/unit/*" -not -path "*/tests/eval/*"); do
            grep -qF "${f#apps/api/}" apps/api/scripts/run-tests.sh || echo "UNREACHED: $f"
          done || true)
          COUNT=$(printf "%s" "$UNREACHED" | grep -c . || true)
          COUNT=${COUNT:-0}
          echo "Unreached suites: $COUNT (ratchet baseline $BASELINE)"
          printf "%s\n" "$UNREACHED" | head -40
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error title=Fitness #30 violation::$COUNT test suites are named by no run_batch and by no collector glob, above the ratchet baseline of $BASELINE. A suite nothing collects never runs while still reading as coverage. Name it in a run_batch in apps/api/scripts/run-tests.sh, or delete it."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice title=Fitness #30 ratchet::$COUNT unreached suites, below the baseline of $BASELINE. Lower BASELINE here and in CLAUDE.md #30 to lock the gain in."
          fi

      - name: "#31 No vacuous-pass escape hatch in a test entry point (two-part hard-zero)"
        if: always()
        run: |
          set -uo pipefail
          # Threat: a suite that collects ZERO tests and still exits 0. The
          # nightly chaos job ran `vitest run tests/chaos/` for the life of that
          # workflow against node:test files vitest's `include` globs never
          # covered, collected nothing, and reported green over scenarios it
          # never executed.
          # Part A: no `passWithNoTests` anywhere. Vitest defaults it to false —
          # zero collected is exit 1 — so every occurrence is an explicit opt-OUT
          # of the one default that notices an empty run, and it keeps reporting
          # green forever once a rename or an `include` change breaks collection.
          # Part B: the node:test runner must KEEP its zero-collection guards.
          # node:test has no equivalent default: a crashed or empty run prints a
          # 0/0/0 TAP summary that parses as success, so run-tests.sh carries the
          # check itself, once per batch and once on the total. Both terms are
          # pinned because deleting either restores the silent green with nothing
          # left to notice it. Mirrors CLAUDE.md #31.
          A=$(grep -rn "passWithNoTests" apps/ packages/ infra/ \
                --include="package.json" --include="*.ts" --include="*.json" | \
                grep -vE "node_modules|/dist/" || true)
          ACOUNT=$(printf "%s" "$A" | grep -c . || true); ACOUNT=${ACOUNT:-0}
          BATCH_PIN=$(grep -c '\[ "\$tests" -eq 0 \]' apps/api/scripts/run-tests.sh || true)
          TOTAL_PIN=$(grep -c '\[ "\$TOTAL_TESTS" -eq 0 \]' apps/api/scripts/run-tests.sh || true)
          BATCH_PIN=${BATCH_PIN:-0}; TOTAL_PIN=${TOTAL_PIN:-0}
          if [ "$ACOUNT" -gt 0 ]; then
            echo "::error title=Fitness #31 violation::$ACOUNT test entry point(s) declare passWithNoTests — that opts out of the only default that fails an empty run, so the suite reports green the day collection breaks"
            printf "%s\n" "$A" | head -20
          fi
          if [ "$BATCH_PIN" -lt 1 ] || [ "$TOTAL_PIN" -lt 1 ]; then
            echo "::error title=Fitness #31 violation::apps/api/scripts/run-tests.sh lost a zero-collection guard (per-batch found=$BATCH_PIN, total found=$TOTAL_PIN, each must be >= 1). node:test reports a crashed or empty run as a 0/0/0 TAP summary that parses as success; without these terms the runner passes over tests nobody executed."
          fi
          if [ "$ACOUNT" -gt 0 ] || [ "$BATCH_PIN" -lt 1 ] || [ "$TOTAL_PIN" -lt 1 ]; then
            exit 1
          fi

      - name: "#32 No committed skipped or focused test"
        if: always()
        run: |
          set -uo pipefail
          # CODING_STANDARDS §Zero Cancelled Tests states this as canon; nothing
          # enforced it mechanically. A committed `.only(` is the sharper harm of
          # the two: the runner then executes ONLY that test and every sibling in
          # the file reports green without running. `forbidOnly: true` catches
          # `.only` at RUNTIME, but only in the 5 of 83 vitest configs that set
          # it; this catches both forms statically, in every package and both
          # frameworks, before a runner is even chosen.
          # Two deliberate non-matches:
          #   - `.todo(` marks a test that was never written — a declared gap,
          #     not a written test switched off. The canon forbids .skip and
          #     .only, not the backlog marker.
          #   - The runtime form `t.skip("...")` inside a node:test body is a
          #     conditional skip decided at execution time, which a static grep
          #     cannot tell from a legitimate one. It has its own gate:
          #     run-tests.sh fails any TIER-driven batch reporting a non-zero
          #     skip count, which is the only place the distinction (was the
          #     service supposed to be there?) is actually knowable.
          # Mirrors CLAUDE.md #32.
          MATCHES=$(grep -rnE "\b(it|test|describe|suite)\.(skip|only)\(" \
            apps/ packages/ --include="*.test.ts" --include="*.test.tsx" | \
            grep -vE "node_modules|/dist/|\.stryker" || true)
          COUNT=$(printf "%s" "$MATCHES" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #32 violation::$COUNT committed .skip/.only test declaration(s) (expected 0). A skipped test is a test that never ran; a committed .only silently drops every sibling in its file. Delete the marker and fix or remove the test."
            printf "%s\n" "$MATCHES" | head -20
            exit 1
          fi

      - name: "#33 Every extended root tsconfig listed in turbo.json globalDependencies"
        if: always()
        run: |
          set -uo pipefail
          # Turbo hashes per-package inputs plus globalDependencies and NOTHING
          # else, so a ROOT-level tsconfig a workspace package merely extends is
          # invisible to that package's hash. Editing it invalidates ZERO cache
          # entries and every dependent task replays a dist compiled with the
          # PREVIOUS compiler settings (target, module, declaration, skipLibCheck)
          # under a green exit code — a false green, reproduced end-to-end in
          # docs/reports/CI_CACHE_INTEGRITY_AUDIT.md. Membership is a
          # shell-pattern match because turbo accepts glob entries in
          # globalDependencies — a literal compare would flag configs a glob
          # already covers. The second pass walks ONE extends hop from every root
          # config that is listed or demanded by the first pass: a root->root
          # chain link (live today: tsconfig.build.base.json extends
          # tsconfig.base.json) is equally invisible to every per-package hash,
          # and since each properly listed link becomes checkable itself, longer
          # chains are covered link by link. Two skips, both justified:
          # non-relative extends targets resolve into node_modules and change
          # only with the lockfile, which turbo already hashes on its own;
          # targets that resolve inside a workspace directory stay covered by
          # that package's own input hash — in-tree today every relative target
          # resolves to a root config, so this second skip currently matches
          # nothing. Hard-zero. Mirrors CLAUDE.md #33.
          GLOBALS=$(tr -d ' \n' < turbo.json | grep -oE '"globalDependencies":\[[^]]*\]' | \
            grep -oE '"[^"]*"' | tr -d '"' | grep -v '^globalDependencies$' || true)
          listed() {
            # set -f keeps glob entries as case patterns instead of expanding them
            # against the working directory; restored on every return path.
            set -f
            for entry in $GLOBALS; do
              case "$1" in $entry) set +f; return 0;; esac
            done
            set +f
            return 1
          }
          MISSING=""
          REACHED=""
          for cfg in $(find apps packages infra -name 'tsconfig*.json' \
              -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.next/*' \
              -not -path '*/.turbo/*' -not -path '*/.stryker-tmp/*' 2>/dev/null); do
            for target in $(grep -oE '"extends"[[:space:]]*:[[:space:]]*(\[[^]]*\]|"[^"]*")' "$cfg" 2>/dev/null | \
                grep -oE '"[^"]*"' | tr -d '"' | grep -v '^extends$' || true); do
              case "$target" in ./*|../*) ;; *) continue;; esac
              resolved=$(realpath -m --relative-to="$PWD" "$(dirname "$cfg")/$target" 2>/dev/null || true)
              case "$resolved" in "" | */*) continue;; esac
              REACHED="$REACHED $resolved"
              listed "$resolved" || MISSING="$MISSING$cfg -> $resolved\n"
            done
          done
          for cfg in tsconfig*.json; do
            [ -f "$cfg" ] || continue
            if ! listed "$cfg"; then case " $REACHED " in *" $cfg "*) ;; *) continue;; esac; fi
            for target in $(grep -oE '"extends"[[:space:]]*:[[:space:]]*(\[[^]]*\]|"[^"]*")' "$cfg" 2>/dev/null | \
                grep -oE '"[^"]*"' | tr -d '"' | grep -v '^extends$' || true); do
              case "$target" in ./*|../*) ;; *) continue;; esac
              resolved=$(realpath -m --relative-to="$PWD" "$(dirname "$cfg")/$target" 2>/dev/null || true)
              case "$resolved" in "" | */*) continue;; esac
              listed "$resolved" || MISSING="$MISSING$cfg -> $resolved\n"
            done
          done
          COUNT=$(printf "%b" "$MISSING" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #33 violation::$COUNT root tsconfig(s) reached by a workspace extends but missing from turbo.json globalDependencies — edits to them invalidate zero turbo cache entries and dependent tasks replay a stale dist as a false green. Add each listed file to globalDependencies."
            printf "%b\n" "$MISSING" | head -20
            exit 1
          fi

      - name: "#34 Every ::error in a workflow step pairs with a real failure in the same step"
        if: always()
        run: |
          set -uo pipefail
          # echo "::error..." only ANNOTATES — the step still exits 0 and the run
          # stays green, so an unpaired ::error is a failure that fails nothing.
          # Pairing is per-STEP, not per-file: a step counts as paired only when
          # the SAME step carries a real failure mechanism (exit <n>, exit "$VAR",
          # core.setFailed). ::warning is out of scope — advisory by design
          # (audit.yml carries intentional ones). Residual limits, stated
          # honestly: this is a line-based tripwire, not a YAML parser — an
          # emission not written as `echo "::error` (printf, github-script
          # core.error) is invisible to it, and a mechanism named only in a
          # comment inside the step satisfies the pairing. Hard-zero.
          # Mirrors CLAUDE.md #34.
          VIOLATIONS=$(for wf in .github/workflows/*.yml; do
            awk -v f="$wf" '
              /^[[:space:]]*-[[:space:]]+(name|uses):/ {
                if (in_step && has_err && !has_fail) print f " line " start ": step emits ::error without exit/core.setFailed";
                in_step=1; has_err=0; has_fail=0; start=NR;
              }
              /echo "::error/ { has_err=1 }
              /exit[[:space:]]+[1-9]|exit[[:space:]]+"?\$[A-Za-z_]|core\.setFailed/ { has_fail=1 }
              END { if (in_step && has_err && !has_fail) print f " line " start ": step emits ::error without exit/core.setFailed" }
            ' "$wf"
          done)
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #34 violation::$COUNT workflow step(s) emit ::error without a real failure mechanism in the same step — the annotation leaves the job green. Pair every ::error with exit 1 / exit \"\$CODE\" / core.setFailed in its step."
            printf "%s\n" "$VIOLATIONS" | head -20
            exit 1
          fi

      - name: "#35 outputs:[] build overrides bound to verdict-only build scripts"
        if: always()
        run: |
          set -uo pipefail
          # A per-package turbo.json declaring "outputs": [] for build tells
          # turbo the task writes nothing. Paired with an EMITTING build script
          # it earns a green cache entry that restores NOTHING — every later
          # cache hit replays "built" while the dist is missing (the
          # silent-cache-of-nothing defect, the converse of ci.yml's
          # no-output-files gate). The override is legitimate ONLY while the
          # build is verdict-only (tsc --noEmit); a build that starts emitting
          # must delete the override in the same change. Hard-zero.
          # Mirrors CLAUDE.md #35.
          VIOLATIONS=""
          for tj in $(find apps packages infra -name 'turbo.json' -not -path '*/node_modules/*' 2>/dev/null); do
            tr -d ' \n' < "$tj" | grep -q '"build":{[^}]*"outputs":\[\]' || continue
            pkg="$(dirname "$tj")/package.json"
            script=$([ -f "$pkg" ] && tr -d '\n' < "$pkg" | grep -oE '"build":[[:space:]]*"[^"]*"' | head -1 || true)
            printf '%s' "$script" | grep -qE 'tsc[^"]*--noEmit' || VIOLATIONS="$VIOLATIONS$tj -> ${script:-no build script}\n"
          done
          COUNT=$(printf "%b" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #35 violation::$COUNT per-package turbo.json outputs:[] override(s) whose build script is not verdict-only (tsc --noEmit) — turbo would cache a green entry that restores nothing. Make the build verdict-only or delete the override so real outputs get cached."
            printf "%b\n" "$VIOLATIONS" | head -20
            exit 1
          fi

      - name: "#36 Every positive scope glob in a coverage/mutation config matches a file"
        if: always()
        run: |
          # Dead scope = infallible gate (the #2/#3/#4 class): a POSITIVE glob
          # matching zero files makes the gate report green over code it never
          # touched. Scope: mutate arrays of apps/api/stryker*.config.mjs (minus
          # the quarantined pre-consolidation configs) + include arrays of
          # apps/api/vitest.config.ts. Negations (!...) are deliberately out of
          # scope: an empty negation is inert protection (SMELL-84), and flagging
          # it pushes authors to delete real exclusions. FAIL-CLOSED PER FILE:
          # zero globs extracted from a scanned config is a blind scan, not a
          # clean one (renaming `mutate:` in the config the pipeline runs made an
          # earlier form print nothing and exit 0 over 26 live globs it never
          # read). Comments inside the arrays are dropped, line AND block, so a
          # glob named in a comment is not reported; bracket counting skips
          # string literals, so a picomatch class neither ends the array early
          # nor leaks into the next key. Discovery is top-level only. Hard-zero.
          # Mirrors CLAUDE.md #36.
          set -uo pipefail
          VIOLATIONS=$(node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { glob } from "node:fs/promises";

          // Quarantine: 14 ad-hoc slicing configs predating the packages/core relocation,
          // holding 45 dead positive globs between them (SMELL-85 owns that debt; SMELL-84
          // is a different one — the 29 empty NEGATIONS inside stryker.config.mjs). They
          // are one-off local run shells, not the config the mutation pipeline executes
          // (stryker.config.mjs). The list is a RATCHET, not a permanent carve-out: it may
          // shrink and never grow, and every name must still name an existing file — a
          // name that outlives its file would silently exempt a NEW config re-created
          // under it. Delete each name in the same change that fixes or deletes the file
          // it names (the Stryker consolidation, SMELL-85).
          const quarantined = new Set([
            "stryker-batch-7.config.mjs",
            "stryker-batch-8.config.mjs",
            "stryker-domain-targeted.config.mjs",
            "stryker-inbox.config.mjs",
            "stryker-micro-A6.config.mjs",
            "stryker-micro-E1.config.mjs",
            "stryker-micro-E2.config.mjs",
            "stryker-micro-E3.config.mjs",
            "stryker-micro-E4.config.mjs",
            "stryker-micro-F1.config.mjs",
            "stryker-micro-F2.config.mjs",
            "stryker-micro-F3.config.mjs",
            "stryker-micro-F4.config.mjs",
            "stryker-session-c.config.mjs",
          ]);
          const QUARANTINE_FLOOR = 14;
          const cwd = "apps/api";
          if (quarantined.size > QUARANTINE_FLOOR) {
            console.error(`fitness #36 scope error: the quarantine holds ${quarantined.size} names against a floor of ${QUARANTINE_FLOOR} — the exemption list may only shrink. A new config that needs exempting is a config that needs fixing (SMELL-85).`);
            process.exit(1);
          }
          for (const name of [...quarantined].sort()) {
            if (existsSync(`${cwd}/${name}`)) continue;
            console.error(`fitness #36 scope error: quarantined config ${cwd}/${name} no longer exists — delete the name from the quarantine, or a config re-created under it inherits the exemption unscanned.`);
            process.exit(1);
          }
          const scanned = [];
          for await (const f of glob("stryker*.config.mjs", { cwd })) {
            if (!quarantined.has(f)) scanned.push([f, "mutate"]);
          }
          scanned.sort();
          if (scanned.length === 0) {
            console.error(`fitness #36 scope error: no non-quarantined stryker*.config.mjs under ${cwd}`);
            process.exit(1);
          }
          scanned.push(["vitest.config.ts", "include"]);
          // Walk to the array's closing bracket while IGNORING brackets that live inside
          // string literals or comments. Picomatch character classes (`src/api[Vv]2/**`)
          // are legitimate glob syntax, and counting them either ends the array early —
          // every glob after it goes unchecked — or runs past its end and pulls values out
          // of the next key. Comment bytes are dropped with the brackets they contain, so
          // a glob named inside a comment is neither extracted nor reported.
          const sliceArray = (source, from) => {
            let i = from;
            let depth = 1;
            let body = "";
            while (i < source.length) {
              const c = source[i];
              if (c === '"' || c === "'" || c === "`") {
                let j = i + 1;
                while (j < source.length && source[j] !== c) j += source[j] === "\\" ? 2 : 1;
                body += source.slice(i, j + 1);
                i = j + 1;
                continue;
              }
              if (c === "/" && source[i + 1] === "/") {
                const nl = source.indexOf("\n", i);
                i = nl === -1 ? source.length : nl;
                continue;
              }
              if (c === "/" && source[i + 1] === "*") {
                const end = source.indexOf("*/", i + 2);
                i = end === -1 ? source.length : end + 2;
                continue;
              }
              if (c === "[") depth += 1;
              if (c === "]" && --depth === 0) return { body, end: i + 1 };
              i += 1;
            }
            return null;
          };
          const extract = (source, key) => {
            const found = [];
            const re = new RegExp(`\\b${key}\\s*:\\s*\\[`, "g");
            while (re.exec(source) !== null) {
              const slice = sliceArray(source, re.lastIndex);
              if (slice === null) return null;
              for (const q of slice.body.matchAll(/"([^"]*)"|'([^']*)'/g)) found.push(q[1] ?? q[2]);
              re.lastIndex = slice.end;
            }
            return found;
          };
          const dead = [];
          for (const [file, key] of scanned) {
            const patterns = extract(readFileSync(`${cwd}/${file}`, "utf8"), key);
            if (patterns === null) {
              console.error(`fitness #36 scope error: unbalanced '${key}' array in ${cwd}/${file} — the extraction cannot see where the scope ends, failing closed`);
              process.exit(1);
            }
            if (patterns.length === 0) {
              console.error(`fitness #36 scope error: zero '${key}' globs extracted from ${cwd}/${file} — the key was renamed, or the array is assembled at runtime or inherited by spread. Either way the gate would report green over a scope it never read, so it fails closed. Give the config a literal '${key}' array, or quarantine it with an owning backlog entry.`);
              process.exit(1);
            }
            for (const pattern of patterns) {
              if (pattern.startsWith("!")) continue;
              let live = false;
              for await (const _ of glob(pattern, { cwd })) { live = true; break; }
              if (!live) dead.push(`${cwd}/${file}: dead positive glob "${pattern}"`);
            }
          }
          console.log(dead.join("\n"));
          EOF
          ) || { echo "fitness #36: expansion crashed or scope is invalid — failing closed (needs node >= 22 for fs.glob)"; exit 1; }
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #36 violation::$COUNT dead positive scope glob(s) in coverage/mutation configs — each names a scope the gate reports on without measuring. Repoint or delete the glob; if the scope moved (e.g. into packages/core), measuring it there is a separate scope, not a repoint."
            printf "%s\n" "$VIOLATIONS" | head -20
            exit 1
          fi

      - name: "#37 Coverage threshold floors never descend vs the PR base (pull_request only)"
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          FITNESS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          # The four literal thresholds in apps/api/vitest.config.ts are a
          # ratchet (autoUpdate raises them in the commit that earns them); the
          # only hand-written move to reject is a LOWERED number. pull_request
          # only: the subject is the PR's delta against its base — on push there
          # is no base and this step is skipped by its `if`. Reads the GLOBAL
          # thresholds block only, block comments dropped, so a commented-out
          # block cannot keep answering for a floor that no longer exists and a
          # per-scope block (CODING_STANDARDS §Coverage Targets) coexists.
          # Fail-closed on BOTH sides: head ambiguity and base ambiguity exit 1,
          # absent-on-base still passes by metric. A descent ships with a
          # `// canon-exception: <scenario>` marker on or above the lowered
          # literal, which this step honours and logs. Mirrors CLAUDE.md #37.
          set -uo pipefail
          BASE_REF="${FITNESS_BASE_REF:-origin/main}"
          if ! git rev-parse --verify --quiet "$BASE_REF^{commit}" >/dev/null; then
            for attempt in 1 2 3; do
              git fetch --quiet --depth=1 origin "$BASE_REF" && break
              [ "$attempt" -eq 3 ] || sleep $((attempt * 3))
            done
          fi
          if ! git rev-parse --verify --quiet "$BASE_REF^{commit}" >/dev/null; then
            echo "fitness #37: base ref $BASE_REF did not resolve after 3 fetch attempts — either the base commit is genuinely gone (force-push, deleted branch) or the fetch hit a transient network failure. Failing closed rather than comparing against nothing; re-run the job if the network was the cause."
            exit 1
          fi
          VIOLATIONS=$(FITNESS_BASE_SRC="$(git show "$BASE_REF:apps/api/vitest.config.ts" 2>/dev/null || true)" node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const HEAD_FILE = "apps/api/vitest.config.ts";
          const METRICS = ["lines", "functions", "branches", "statements"];
          // Scenarios from CLAUDE.md §Pragmatic Exceptions. A descent marked with anything
          // else is not a canon exception, it is an unlabelled one.
          const SCENARIOS = new Set(["migration", "prototype", "hotfix", "spike", "test-fixture"]);

          // Split every line into its code half and its line-comment half: block-comment
          // bytes are dropped (a commented-out block must not keep answering for a floor
          // that no longer exists) and string literals are preserved verbatim (a glob key
          // like "src/**/*.ts" holds the exact byte pairs that a naive comment strip eats).
          // The canon-exception markers live in the comment half, which is why comments are
          // separated rather than discarded.
          const scanLines = (source) => {
            const lines = [];
            let code = "";
            let comment = "";
            let state = "code";
            let i = 0;
            while (i < source.length) {
              const c = source[i];
              if (c === "\n") {
                lines.push({ code, comment });
                code = "";
                comment = "";
                if (state === "line") state = "code";
                i += 1;
                continue;
              }
              if (state === "block") {
                if (c === "*" && source[i + 1] === "/") { state = "code"; i += 2; continue; }
                i += 1;
                continue;
              }
              if (state === "line") { comment += c; i += 1; continue; }
              if (c === '"' || c === "'" || c === "`") {
                let j = i + 1;
                while (j < source.length && source[j] !== c && source[j] !== "\n") j += source[j] === "\\" ? 2 : 1;
                code += source.slice(i, j + 1);
                i = j + 1;
                continue;
              }
              if (c === "/" && source[i + 1] === "/") { state = "line"; comment = "//"; i += 2; continue; }
              if (c === "/" && source[i + 1] === "*") { state = "block"; i += 2; continue; }
              code += c;
              i += 1;
            }
            lines.push({ code, comment });
            return lines;
          };
          const markerOf = (comment) => {
            const m = /canon-exception:\s*([a-z-]+)/.exec(comment ?? "");
            if (m === null) return null;
            return { scenario: m[1], valid: SCENARIOS.has(m[1]) };
          };
          // Reads the GLOBAL thresholds block only. A metric is accepted only at the top
          // level of `thresholds: {`, so a per-scope block — which CODING_STANDARDS
          // §Coverage Targets requires (Domain 90 / Application 85 / Infrastructure 70) —
          // nests one level deeper and coexists instead of reading as ambiguity.
          const floorsOf = (source) => {
            const lines = scanLines(source);
            const found = new Map(METRICS.map((metric) => [metric, []]));
            let started = false;
            let depth = 0;
            for (let n = 0; n < lines.length; n += 1) {
              const { code, comment } = lines[n];
              const braces = code.replace(/"[^"]*"|'[^']*'|`[^`]*`/g, '""');
              if (!started) {
                if (/(^|[^A-Za-z0-9_$])thresholds\s*:\s*\{/.test(braces)) {
                  started = true;
                  depth = 1;
                }
                continue;
              }
              if (depth === 1) {
                const m = /^\s*(lines|functions|branches|statements)\s*:\s*([0-9]+(?:\.[0-9]+)?)\s*,?\s*$/.exec(code);
                if (m !== null) {
                  found.get(m[1]).push({
                    value: m[2],
                    marker: markerOf(comment) ?? markerOf(n > 0 ? lines[n - 1].comment : ""),
                  });
                }
              }
              for (const ch of braces) {
                if (ch === "{") depth += 1;
                else if (ch === "}") depth -= 1;
              }
              if (depth <= 0) break;
            }
            return started ? found : null;
          };
          const head = floorsOf(readFileSync(HEAD_FILE, "utf8"));
          if (head === null) {
            console.error(`fitness #37: no global 'thresholds: {' block found in ${HEAD_FILE} — the floor is missing, renamed, or commented out. The guard cannot see it, failing closed.`);
            process.exit(1);
          }
          const baseSource = process.env.FITNESS_BASE_SRC ?? "";
          const base = baseSource.trim() === "" ? null : floorsOf(baseSource);
          const violations = [];
          for (const metric of METRICS) {
            const headHits = head.get(metric);
            if (headHits.length !== 1) {
              const why = headHits.length === 0
                ? "the literal is missing, commented out, or built by a helper call"
                : "the GLOBAL block declares it more than once (a per-scope block nested deeper is ignored on purpose and is not this)";
              console.error(`fitness #37: expected exactly one literal '${metric}:' at the top level of the global thresholds block in ${HEAD_FILE}, found ${headHits.length} — ${why}; the guard cannot see the floor, failing closed.`);
              process.exit(1);
            }
            const baseHits = base === null ? [] : base.get(metric);
            // Absent on base passes BY METRIC: a base with no literal for it is the
            // pre-ratchet format, which has no comparable floor. TWO or more is ambiguity,
            // and ambiguity fails closed on this side exactly as it does on the head side —
            // an open base side let a 90 -> 56.9 descent through on all four metrics.
            if (baseHits.length === 0) continue;
            if (baseHits.length > 1) {
              console.error(`fitness #37: the base declares '${metric}:' ${baseHits.length} times at the top level of its global thresholds block — the guard cannot tell which value is the floor, failing closed (the head side fails closed on the same ambiguity).`);
              process.exit(1);
            }
            if (Number(headHits[0].value) >= Number(baseHits[0].value)) continue;
            const marker = headHits[0].marker;
            if (marker !== null && marker.valid) {
              console.error(`fitness #37: coverage.thresholds.${metric} lowered ${baseHits[0].value} -> ${headHits[0].value}, ACCEPTED under the 'canon-exception: ${marker.scenario}' marker on or above that line. The marker ships in the diff for a human to approve and carries its own follow-up per CLAUDE.md §Pragmatic Exceptions.`);
              continue;
            }
            if (marker !== null) {
              console.error(`fitness #37: coverage.thresholds.${metric} carries 'canon-exception: ${marker.scenario}', which is not a scenario from the CLAUDE.md §Pragmatic Exceptions allowed list (${[...SCENARIOS].join(", ")}) — not honoured.`);
            }
            violations.push(`coverage.thresholds.${metric} lowered: ${baseHits[0].value} (base) -> ${headHits[0].value} (head)`);
          }
          console.log(violations.join("\n"));
          EOF
          ) || { echo "fitness #37: the threshold extraction could not see a floor it must compare — failing closed (see the scope error above)"; exit 1; }
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #37 violation::$COUNT coverage threshold floor(s) lowered vs the PR base. The floor is a ratchet: autoUpdate raises it in the commit that earns it, and a regression below it goes red. The legitimate descent — deleting covered code lowers aggregate coverage — ships with a \`// canon-exception: <scenario>\` marker (scenario from CLAUDE.md §Pragmatic Exceptions) on the lowered literal's own line or the line directly above it; this step accepts THAT metric and logs what it accepted, and the marker stays in the diff for a human to approve."
            printf "%s\n" "$VIOLATIONS"
            exit 1
          fi

      - name: "#39 Every accountId-bearing model is tenant-guard-enrolled or in the documented denylist"
        if: always()
        run: |
          # Mirrors CLAUDE.md #39. The gate whose absence let DeletionRecord land
          # carrying accountId with neither TENANT_SCOPED_MODELS nor any documented
          # denylist knowing it existed: the $extends guard silently SKIPS a model
          # it does not know (fail-open by construction), so an unenrolled
          # accountId-bearing model is cross-tenant by default (CWE-639).
          set -uo pipefail
          SCHEMA=infra/prisma/schema.prisma
          GUARD=infra/prisma/src/extensions/tenantGuard.ts
          DOC=docs/security/MULTI_TENANT_GUARDS.md
          for f in "$SCHEMA" "$GUARD" "$DOC"; do
            [ -f "$f" ] || { echo "::error title=Fitness #39 scope error::$f does not exist — the check would compare against nothing and pass, failing closed instead."; exit 1; }
          done
          BEARING=$(awk '/^model /{m=$2} /^[[:space:]]+accountId[[:space:]]/{print m}' "$SCHEMA" | sort -u)
          [ -n "$BEARING" ] || { echo "::error title=Fitness #39 scope error::zero accountId-bearing models extracted from $SCHEMA — the column convention changed; failing closed."; exit 1; }
          SCOPED=$(sed -n '/TENANT_SCOPED_MODELS = new Set/,/\]);/p' "$GUARD" | grep -oE '"[^"]+"' | tr -d '"')
          [ -n "$SCOPED" ] || { echo "::error title=Fitness #39 scope error::TENANT_SCOPED_MODELS extraction from $GUARD yielded zero names — the Set was renamed or is assembled at runtime; failing closed."; exit 1; }
          DENY=$(sed -n '/^## Global tables (denylist/,/^## /p' "$DOC" | sed -n '/^```/,/^```/p' | tr -s ' ' '\n' | grep -E '^[A-Z][A-Za-z0-9]*$' || true)
          [ -n "$DENY" ] || { echo "::error title=Fitness #39 scope error::the fenced table list under '## Global tables (denylist — guard bypasses)' in $DOC yielded zero names — the heading or the grid moved; failing closed."; exit 1; }
          VIOLATIONS=$(for model in $BEARING; do
            lower=$(printf '%s' "$model" | awk '{print tolower(substr($0,1,1)) substr($0,2)}')
            printf '%s\n' "$SCOPED" | grep -qx "$lower" && continue
            printf '%s\n' "$DENY" | grep -qx "$model" && continue
            echo "$model: accountId-bearing but neither enrolled in TENANT_SCOPED_MODELS nor named in the documented denylist"
          done) || true
          COUNT=$(printf "%s" "$VIOLATIONS" | grep -c . || true)
          COUNT=${COUNT:-0}
          echo "Fitness #39: $COUNT violations (expect 0)"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Fitness #39 violation::$COUNT accountId-bearing model(s) in neither TENANT_SCOPED_MODELS nor the documented denylist. The tenant guard silently SKIPS models it does not know, so an unenrolled model is cross-tenant by default. Enroll it (SECURITY_CANON §Multi-Tenant Isolation 3-step checklist) or denylist it in MULTI_TENANT_GUARDS.md with a design note saying WHY it must see across tenants."
            printf "%s\n" "$VIOLATIONS"
            exit 1
          fi

      - name: Fitness summary
        if: always()
        run: |
          echo "## Fitness Functions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "38 architectural invariants (#1-#37 and #39) defined in CLAUDE.md §Automated Compliance Checks." >> $GITHUB_STEP_SUMMARY
          echo "#38 is deliberately absent, and the gap is intentional: the number is RESERVED for the soft-delete read-coherence gate, which ships with the read sweep that makes it green. Renumbering twice would churn every cross-reference (#39's own prose calls #38 \"this gate's tenant-guard twin\")." >> $GITHUB_STEP_SUMMARY
          echo "Hard-zero threshold for every check but #30, a ratchet at a measured baseline of 21 that may fall and must never rise." >> $GITHUB_STEP_SUMMARY
          echo "#37 compares against the PR base, so it runs on pull_request events only and skips cleanly on push." >> $GITHUB_STEP_SUMMARY
          echo "Any new occurrence fails this workflow with an \`::error\` annotation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See individual step results above for any violations." >> $GITHUB_STEP_SUMMARY

  dependency-consistency:
    name: Dependency Consistency (catalog single-version + lockfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "Lockfile gate: pnpm install --frozen-lockfile"
        run: pnpm install --frozen-lockfile

      - name: "Single-version gate: syncpack (catalog-managed direct deps; transitives are consumer-governed)"
        # syncpack@12 `lint` chokes on the catalog: protocol (reports every catalog ref
        # as UnsupportedMismatch); `list-mismatches` is the real single-version + exact-range
        # gate. Consumer-governed transitives are not manifest-declared, so they are
        # structurally invisible to the single-version group. See ADR-0018 / Step 5 T5.1.
        run: pnpm dlx syncpack@12 list-mismatches

      - name: "Dedupe gate: pnpm dedupe --check (no flattenable duplicates)"
        # pnpm 11 fixed the pnpm-10.16 false-positive (which needed a double invocation);
        # a single `dedupe --check` is now reliably exit 0. The former vite 7/8 split that
        # would otherwise surface here was resolved at the root (apps/client gained
        # @vitejs/plugin-react, collapsing to a single vite 8). See ADR-0019.
        run: pnpm dedupe --check
