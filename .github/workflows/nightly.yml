name: Nightly Full Test Suite

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: Full test suite (cache bypassed)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Least privilege: declaring this block replaces the default token scopes
    # wholesale, so `contents: read` is restated for checkout. A failure is
    # reported by the alarm job, so this job needs no other scope.
    permissions:
      contents: read

    services:
      postgres:
        # pgvector-enabled image — the glossary/style-guide migrations CREATE
        # EXTENSION vector, which plain postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password123
          POSTGRES_USER: postgres
          POSTGRES_DB: omnipostdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup test environment
        # Per-app env files were consolidated into the repo root, so the
        # apps/api/.env.example this step used to copy no longer exists and the
        # job died at its first command. Same synthesis as every other job:
        # env.ts loads `.env.test` when NODE_ENV=test, the tracked file was
        # removed for credential hygiene, and DB/Redis are passed in rather than
        # hardcoded in the script.
        run: |
          cp .env.example .env
          export DATABASE_URL="postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Generate Prisma client
        run: pnpm --filter @infra/prisma exec prisma generate

      - name: Run database migrations
        # `migrate` is the script defined on @infra/prisma (`prisma migrate
        # deploy`); the `db:migrate` alias only exists in the ROOT package, so
        # `--filter @infra/prisma db:migrate` matches no script and pnpm exits 0
        # WITHOUT applying anything — the schema never lands, and the run reports
        # a migration it did not perform. Explicit DB env so prisma.config.ts
        # targets the postgres service on the `public` schema.
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
        run: pnpm --filter @infra/prisma run migrate

      - name: Build (cache bypassed)
        run: pnpm turbo run build --force

      - name: Run full test suite (cache bypassed)
        run: pnpm turbo run test --force

  # The services tier in an order drawn from a seed, once per matrix entry, so a
  # suite that passes only after another one has run turns red here instead of
  # passing in the merge gate's byte order. One seed drives both levels: the
  # runner's file order (TEST_ORDER=random) and node's test order inside each file
  # (--test-randomize). Each entry gets its own Postgres and Redis, so no run reads
  # another run's rows. No retry: a re-run keeps GITHUB_RUN_ID, so it replays the
  # seed it failed on instead of drawing a new one. The live tier is left out: it
  # boots the API and the workers after this tier, and its suites still depend on
  # their order (DEF-81).
  integration-randomized:
    name: Services tier in random order, run ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4, 5]

    # The application role's login password, deterministic and non-production, as in
    # the Integration Tests job of ci.yml: `Enable app-role login` sets it on the role
    # and the steps below connect with it.
    env:
      OMNIPOST_APP_DB_PASSWORD: approle123

    services:
      postgres:
        # pgvector-enabled image — the glossary/style-guide migrations CREATE
        # EXTENSION vector, which plain postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password123
          POSTGRES_USER: postgres
          POSTGRES_DB: omnipostdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup test environment
        # The Integration Tests job's synthesis: everything that loads .env.test
        # connects as the non-bypassing `omnipost_app` role, and the harness builds
        # its fixtures through the owner channel (ADR-0022).
        run: |
          cp .env.example .env
          export DATABASE_URL="postgresql://omnipost_app:${OMNIPOST_APP_DB_PASSWORD}@localhost:5432/omnipostdb?schema=public"
          export MIGRATE_DATABASE_URL="postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Generate Prisma client
        run: pnpm --filter @infra/prisma exec prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
        run: pnpm --filter @infra/prisma run migrate

      - name: Enable app-role login
        env:
          # The owner channel: ALTER ROLE needs CREATEROLE or superuser.
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
        run: bash scripts/db/enable-app-role-login.sh

      - name: Seed roles + permissions
        # seed.ts requires PLATFORM_ENCRYPTION_KEY (32 bytes, base64): the same
        # deterministic test-only key ci-setup-test-env.sh writes to .env.test.
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
        run: |
          PLATFORM_ENCRYPTION_KEY="$(head -c 32 /dev/zero | tr '\0' 'c' | base64 | tr -d '\n')"
          export PLATFORM_ENCRYPTION_KEY
          pnpm --filter @infra/prisma run seed

      # Chosen before the tier runs, so a green run's seed is on its page as well as
      # a red one's. The alarm job finds a red run's replay command by this
      # annotation's title, so the two change together.
      - name: Choose the seed
        id: seed
        env:
          REPEAT: ${{ matrix.repeat }}
        run: |
          seed=$(( (GITHUB_RUN_ID * 10 + REPEAT) % 2147483647 ))
          replay="TIER=pr-integration TEST_ORDER=random TEST_SEED=$seed EXTRA_FLAGS=\"--test-randomize --test-random-seed=$seed\" pnpm --filter @apps/api run test:integration"
          echo "value=$seed" >> "$GITHUB_OUTPUT"
          echo "::notice title=Random-order seed::$replay"
          {
            echo "### Run $REPEAT: seed \`$seed\`"
            echo
            echo "Replay, with the test environment exported:"
            echo
            echo '```bash'
            echo "$replay"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run integration tests (services tier, random order)
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          TIER: pr-integration
          TEST_ORDER: random
          TEST_SEED: ${{ steps.seed.outputs.value }}
          EXTRA_FLAGS: --test-randomize --test-random-seed=${{ steps.seed.outputs.value }}
          # Explicit DB/Redis env because run-tests.sh reads no env file: with
          # DATABASE_URL empty it exits 2 before any suite starts. The application
          # channel, and the owner for fixtures, as in the Integration Tests job.
          NODE_ENV: test
          DATABASE_URL: postgresql://omnipost_app:${{ env.OMNIPOST_APP_DB_PASSWORD }}@localhost:5432/omnipostdb?schema=public
          MIGRATE_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
          REDIS_URL: redis://localhost:6379
        run: pnpm --filter @apps/api run test:integration

  # One issue tracks the nightly, whichever job turned it red: a red night comments
  # on the open issue or opens it, a green night closes it. A per-job, per-failure
  # issue would open one issue for every failing matrix entry, every night.
  alarm:
    name: Alarm
    needs: [full-suite, integration-randomized]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # issues: find, comment on, open and close the issue. actions and checks, read
    # only: name the failing jobs and read the seed each randomized run printed.
    permissions:
      actions: read
      checks: read
      issues: write

    steps:
      - name: Report to the nightly-failure issue
        uses: actions/github-script@v9
        env:
          FULL_SUITE_RESULT: ${{ needs.full-suite.result }}
          RANDOMIZED_RESULT: ${{ needs.integration-randomized.result }}
        with:
          script: |
            // The issue this job owns carries MARKER in its body, so an older issue
            // that only shares the label is never adopted.
            const MARKER = "<!-- nightly-alarm -->";
            const LABEL = "nightly-failure";
            // The annotation title a randomized run prints its replay command under.
            const SEED_TITLE = "Random-order seed";
            const FAILED = new Set(["failure", "cancelled", "timed_out"]);
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const results = {
              "full-suite": process.env.FULL_SUITE_RESULT,
              "integration-randomized": process.env.RANDOMIZED_RESULT,
            };
            const verdict = Object.entries(results)
              .map(([job, result]) => `${job} ${result}`)
              .join(", ");
            // Anything but success is red, cancelled and skipped included: a night
            // that did not run its suites proved nothing.
            const red = Object.values(results).some((result) => result !== "success");

            const labelled = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: LABEL,
              per_page: 100,
            });
            const open = labelled.filter(
              (issue) => !issue.pull_request && (issue.body ?? "").includes(MARKER)
            );

            if (!red) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Green in ${runUrl}; closing.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              core.info(`Nightly green (${verdict}); closed ${open.length} alarm issue(s).`);
              return;
            }

            // "latest" reads each job's most recent attempt, so a re-run reports
            // what it re-ran.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: context.runId,
              filter: "latest",
              per_page: 100,
            });
            const lines = [];
            for (const job of jobs) {
              if (!FAILED.has(job.conclusion)) continue;
              const annotations = await github.paginate(github.rest.checks.listAnnotations, {
                owner,
                repo,
                check_run_id: Number(job.check_run_url.split("/").pop()),
                per_page: 100,
              });
              const seed = annotations.find((annotation) => annotation.title === SEED_TITLE);
              // A randomized run that stopped before its tier printed no seed.
              const replay = seed ? `; replay: \`${seed.message}\`` : "";
              lines.push(`- [${job.name}](${job.html_url}): ${job.conclusion}${replay}`);
            }
            const report = [
              `Red in ${runUrl} (${new Date().toISOString().slice(0, 10)}): ${verdict}.`,
              "",
              ...(lines.length > 0
                ? lines
                : ["No job of this run reports a failing conclusion; read the run."]),
            ].join("\n");

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: open[0].number,
                body: report,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: "Nightly test suite failing",
                body: `${MARKER}\n${report}`,
                labels: ["bug", LABEL],
              });
            }
            core.setFailed(`The nightly is red: ${verdict}.`);
