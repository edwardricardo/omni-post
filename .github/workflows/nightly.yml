name: Nightly Full Test Suite

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: Full test suite (cache bypassed)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Least privilege, and both entries are load-bearing: declaring this block
    # replaces the default token scopes wholesale, so `contents: read` must be
    # restated for checkout. Without `issues: write` the "Notify on failure"
    # step below died with "Resource not accessible by integration", which is
    # why no nightly failure has ever produced an issue.
    permissions:
      contents: read
      issues: write

    services:
      postgres:
        # pgvector-enabled image — the glossary/style-guide migrations CREATE
        # EXTENSION vector, which plain postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password123
          POSTGRES_USER: postgres
          POSTGRES_DB: omnipostdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: "24"

      - name: Setup test environment
        # Per-app env files were consolidated into the repo root, so the
        # apps/api/.env.example this step used to copy no longer exists and the
        # job died at its first command. Same synthesis as every other job:
        # env.ts loads `.env.test` when NODE_ENV=test, the tracked file was
        # removed for credential hygiene, and DB/Redis are passed in rather than
        # hardcoded in the script.
        run: |
          cp .env.example .env
          export DATABASE_URL="postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Generate Prisma client
        run: pnpm --filter @infra/prisma exec prisma generate

      - name: Run database migrations
        # `migrate` is the script defined on @infra/prisma (`prisma migrate
        # deploy`); the `db:migrate` alias only exists in the ROOT package, so
        # `--filter @infra/prisma db:migrate` matches no script and pnpm exits 0
        # WITHOUT applying anything — the schema never lands, and the run reports
        # a migration it did not perform. Explicit DB env so prisma.config.ts
        # targets the postgres service on the `public` schema.
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password123@localhost:5432/omnipostdb_shadow?schema=public
        run: pnpm --filter @infra/prisma run migrate

      - name: Build (cache bypassed)
        run: pnpm turbo run build --force

      - name: Run full test suite (cache bypassed)
        run: pnpm turbo run test --force

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            // await, not fire-and-forget: github-script awaits what the body
            // returns, so an unawaited promise can leave the action exiting
            // before the issue is created — and a rejection would be swallowed
            // as an unhandled rejection instead of failing this step.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly test suite failed — ${new Date().toISOString().split('T')[0]}`,
              body: `The nightly full test suite failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'nightly-failure']
            })
