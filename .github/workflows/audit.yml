name: Pre-merge Audit Toolkit

# 7-tool audit pipeline executed on every push + PR. Each tool runs in its
# own job (parallel) so a slow/failing tool doesn't block the others. SARIF
# output where supported uploads to GitHub Code Scanning UI for inline PR
# annotations.
#
# Strategy: hard gates for tools where we're at zero baseline; informational
# for tools with pre-existing findings (ratchet down over time).
#
# Tools wired (canon: ~/.claude/.../canon_research_index.md §Pre-merge audit toolkit):
#   - dependency-cruiser  (hexagonal layer enforcement, ERROR-level fail)
#   - Semgrep CE          (TS/Node SAST, ERROR-level fail)
#   - OSV-Scanner         (dep vulnerabilities, report-only baseline)
#   - gitleaks            (secret scanning, hard fail on NEW secrets)
#   - Squawk              (DB migration safety, hard fail on ANY finding in
#                          changed migrations, one file per invocation. It also
#                          hard-fails on a diff that EDITS an already-applied
#                          migration, which no lint result can make safe.
#                          Per-file/per-rule waivers live ONLY inline in the
#                          lint step, each pinned to the file's sha256 with its
#                          adjudication, a trigger and a remove-when)
#   - size-limit          (bundle regression, fail on threshold breach)
#   - TruffleHog          (verified secrets, NIGHTLY schedule)

on:
  push:
    # PR branches validate via the pull_request trigger; listing them here too
    # fired a redundant second run per push.
    branches: [main, omni-post-cc]
  pull_request:
    branches: [main, omni-post-cc]
  schedule:
    # Daily 03:00 UTC for heavier scans (TruffleHog full history verification)
    - cron: "0 3 * * *"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions baseline; OSV-Scanner upload-sarif needs write.
permissions:
  contents: read
  security-events: write

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. dependency-cruiser — hexagonal layer enforcement (graph-level rules)
  # ──────────────────────────────────────────────────────────────────────
  dependency-cruiser:
    if: github.event_name != 'schedule'
    name: dependency-cruiser (hexagonal)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Prisma's postinstall config loader requires DATABASE_URL to be defined.
    # We never connect — depcruise scans source files — so a dummy URL is fine.
    env:
      DATABASE_URL: "postgresql://audit:audit@localhost:5432/audit"
      SHADOW_DATABASE_URL: "postgresql://audit:audit@localhost:5432/audit_shadow"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm-cache
      - name: Cruise apps/api + @core + @shared
        run: pnpm exec depcruise apps/api/src packages/core packages/shared --config .dependency-cruiser.cjs --output-type err

  # ──────────────────────────────────────────────────────────────────────
  # 2. Semgrep CE — TS/Node SAST (taint, security rules, OWASP)
  # ──────────────────────────────────────────────────────────────────────
  semgrep:
    if: github.event_name != 'schedule'
    name: Semgrep CE (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        # `semgrep ci` is for the AppSec Platform; we have no platform login.
        # `semgrep scan` accepts --error / --severity and exits non-zero
        # on findings at the requested severity (canonical OSS-rules CI flow).
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/javascript \
            --metrics off \
            --error \
            --severity ERROR \
            apps/api/src apps/admin/app apps/client/app packages

  # ──────────────────────────────────────────────────────────────────────
  # 3. OSV-Scanner — dependency vulnerabilities (report-only baseline)
  # ──────────────────────────────────────────────────────────────────────
  osv-scanner:
    if: github.event_name != 'schedule'
    name: OSV-Scanner (deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install OSV-Scanner
        run: |
          curl -sSL "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Scan pnpm-lock.yaml (report only — baseline has 90 vulns)
        run: |
          set +e
          osv-scanner --lockfile=pnpm-lock.yaml --format=sarif --output-file=osv.sarif
          CODE=$?
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 1 ]; then
            echo "::error::OSV-Scanner failed unexpectedly (exit $CODE)"
            exit "$CODE"
          fi
          echo "::notice::OSV-Scanner completed; see SARIF upload below for findings (currently informational)"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  # ──────────────────────────────────────────────────────────────────────
  # 4. gitleaks — secret scanning (HARD FAIL on new secrets)
  # ──────────────────────────────────────────────────────────────────────
  gitleaks:
    if: github.event_name != 'schedule'
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan PR diff (block new secrets)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks protect \
            --config .gitleaks.toml \
            --staged \
            --no-banner \
            --redact \
            --verbose
      - name: Scan repository (informational — baseline has historical hits)
        if: github.event_name == 'push'
        run: |
          set +e
          gitleaks detect --config .gitleaks.toml --no-banner --redact > /dev/null
          CODE=$?
          if [ "$CODE" -gt 0 ]; then
            echo "::warning::gitleaks detect found historical secrets in git history (baseline: 56 hits — see PR-39 backlog for BFG plan)"
          fi

  # ──────────────────────────────────────────────────────────────────────
  # 4b. secretlint — defense-in-depth secret scan (rule-based, complements gitleaks regex)
  # ──────────────────────────────────────────────────────────────────────
  secretlint:
    if: github.event_name != 'schedule'
    name: secretlint (rule-based secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `pnpm install` triggers `infra/prisma postinstall` which runs
    # `prisma generate` and resolves env via Prisma's config loader. Without
    # DATABASE_URL the loader throws PrismaConfigEnvError and install exits 1
    # before secretlint can run. Dummy URL — no database connection is made
    # by `prisma generate`. Same pattern as the size-limit job below.
    env:
      DATABASE_URL: "postgresql://audit:audit@localhost:5432/audit"
      SHADOW_DATABASE_URL: "postgresql://audit:audit@localhost:5432/audit_shadow"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm-cache
      - name: Run secretlint
        run: pnpm secret:scan

  # ──────────────────────────────────────────────────────────────────────
  # 5. Squawk — Postgres migration safety (only when migrations changed)
  # ──────────────────────────────────────────────────────────────────────
  squawk:
    if: github.event_name != 'schedule'
    name: Squawk (Prisma migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect changed migrations
        id: changed
        run: |
          set -uo pipefail
          LIST="$RUNNER_TEMP/changed-migrations.lst"
          : > "$LIST"
          # The changed set is collected ONCE, here, and handed to the lint step
          # as a NUL-delimited file — the old shape recomputed it with a second,
          # slightly different expression and called that a "re-check".
          #
          # Fail closed on a missing base: without HEAD~1 there is no changed set
          # to compute, and reporting "no migration changes" for that is a gate
          # that saw nothing and said everything was fine.
          if ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "::error title=Squawk has no base commit::HEAD~1 does not resolve, so the changed-migration set cannot be computed. The checkout needs fetch-depth >= 2."
            exit 1
          fi
          # Three properties this collection must hold, each of which the previous
          # expression got wrong:
          #
          #  - `--diff-filter=d` EXCLUDES deletions. A deleted path is not a
          #    migration to lint, and squawk answers a path that no longer exists
          #    with `Failed to find files for provided patterns` and exit 1 —
          #    which the old step reported as `Squawk found migration-safety
          #    violations`, a violation that does not exist. Measured against
          #    squawk 2.49.0: the false red needs an ALL-DELETIONS changed set;
          #    a canonical squash (two deletions plus one baseline) still linted
          #    the surviving file and exited 0. The filter is correct either way,
          #    and an all-deletions set now skips the lint instead of failing it.
          #  - `-z` plus `read -d ''` keeps every path whole. `git diff
          #    --name-only` prints a path containing a space UNQUOTED, and the old
          #    `echo "$FILES" | xargs` split it on that space.
          #  - The match is ANCHORED at both ends (`case` patterns match the WHOLE
          #    string). The old unanchored `grep "infra/prisma/migrations/.*\.sql"`
          #    accepted any path merely CONTAINING that text and — combined with
          #    the xargs split above — every extra token it admitted reached squawk
          #    as an ARGUMENT. An empty file committed alongside a real migration
          #    as `.../migration.sql --exclude=<rule>,<rule>` therefore turned
          #    those rules off for the whole invocation, and a `DROP TABLE`
          #    migration linted clean under a gate that is required to merge.
          #    Anchoring rejects that name (it does not end in `.sql`); the `--`
          #    in the lint step is the second, independent guard. A legitimate
          #    path that happens to contain a space is still matched and still
          #    linted — the shape of the path is the discriminator, not whitespace.
          while IFS= read -r -d '' f; do
            case "$f" in
              infra/prisma/migrations/*/*.sql) printf '%s\0' "$f" >> "$LIST" ;;
            esac
          done < <(git diff -z --name-only --diff-filter=d HEAD~1 HEAD)
          if [ -s "$LIST" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Migration files changed — running Squawk lint"
            tr '\0' '\n' < "$LIST"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No migration changes detected — skipping Squawk"
          fi
      - name: Install Squawk
        if: steps.changed.outputs.has_changes == 'true'
        env:
          # Pinned version AND pinned artifact. This binary decides whether a
          # migration may merge, and it used to arrive over `curl -sSL` with no
          # `--fail`, no checksum and no retry: a 404 or an outage writes the
          # error page to the binary path and the step dies with "cannot execute
          # binary file", while a substituted artifact silently changes what the
          # gate enforces. `--fail` turns an HTTP error into a non-zero exit, the
          # digest below is the sha256 of the pinned release asset, and `set -e`
          # makes a mismatch fail the step.
          SQUAWK_VERSION: v2.49.0
          SQUAWK_SHA256: bd17dddfe22ca3db7705ab5d990a85563dda53864bfacb0c9d5c0bc104c1da88
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/sbdchd/squawk/releases/download/${SQUAWK_VERSION}/squawk-linux-x64" \
            -o /usr/local/bin/squawk
          echo "${SQUAWK_SHA256}  /usr/local/bin/squawk" | sha256sum -c -
          chmod +x /usr/local/bin/squawk
          squawk --version
      - name: Lint changed migrations
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          set -uo pipefail
          LIST="$RUNNER_TEMP/changed-migrations.lst"

          # An APPLIED migration must never change. Prisma records each applied
          # migration's checksum in `_prisma_migrations`, so a byte change makes
          # every database that already ran it report `The following migrations
          # have been modified since they were applied` (Prisma ORM docs,
          # "Migration histories — do not edit or delete migrations that have been
          # applied"). The sanctioned fix for a schema change is a NEW migration,
          # never an edit of an old one.
          #
          # This lane used to be the opposite: it WAIVED `require-timeout-settings`
          # on the migration below, arguing the file is applied and checksum-pinned
          # and therefore cannot change. Taken seriously, that argument says the
          # lane is only ever reached by a change that must not happen — so the
          # waiver was dormant in the case it described and live in the case it did
          # not cover: a PR APPENDING DDL to that file got the rule waived for the
          # NEW statements too, under a comment stating the findings had been
          # adjudicated as historical.
          #
          # Inverted: the file appearing in the changed set at all IS the failure,
          # and the author gets the correct diagnosis instead of a stale-finding
          # lint report.
          # TRIGGER: `git diff --diff-filter=d HEAD~1 HEAD` lists the path below as
          # added or modified (a deletion is filtered out one step earlier, because
          # removing old migrations is exactly what a sanctioned baseline squash
          # does).
          # REMOVE-WHEN: a baseline squash removes this migration from the tree —
          # from then on the path can only appear in a diff as a deletion and this
          # branch is dead code, so delete it in that same change.
          # SCOPE, honestly: this guards ONE named file, not every applied
          # migration, because the diff base is HEAD~1 — a PR that adds a migration
          # in one commit and amends it in the next shows that new file as MODIFIED,
          # and a blanket rule would red on a legitimate in-branch fixup.
          RLS_MIGRATION="infra/prisma/migrations/20260527000000_add_rls_tenant_isolation/migration.sql"

          # ── Per-file, per-rule exceptions ────────────────────────────────
          # Sanctioned path (2) in the error message at the bottom of this step:
          # a finding that genuinely cannot be fixed gets an exception HERE,
          # scoped to ONE file and ONE rule, with a written adjudication, a
          # trigger statement and a remove-when.
          #
          # Every entry is pinned to the file's sha256, not just its path. The
          # block above this one documents why: a PR that APPENDED DDL to a
          # path-waived file got the waiver for its new statements too, under a
          # comment claiming the findings had been adjudicated. A content pin
          # makes that impossible — change one byte and the waiver stops
          # applying, the step fails, and the author must re-adjudicate. Both
          # pinned files are applied migrations that must never change anyway,
          # so the pin costs nothing and catches the edit that must not happen.
          #
          # GOTCHA, measured against squawk 2.49.0: `--exclude` on the CLI
          # REPLACES `excluded_rules` from .squawk.toml — it does NOT merge.
          # Verified both ways: a file whose only finding is
          # `adding-required-field` (excluded by the config) lints clean under
          # the config alone, and fires again the moment ANY unrelated
          # `--exclude` is passed. So each exception invocation below re-states
          # the config baseline, and the drift guard that follows fails the step
          # if .squawk.toml's list ever stops matching that baseline. Without
          # the guard the two silently diverge and an exception quietly changes
          # which rules the gate enforces for the file it exempts.
          CONFIG_BASELINE_EXCLUDES="adding-required-field"
          ACTUAL_CONFIG_EXCLUDES=$(
            sed -n '/^excluded_rules = \[/,/^]/p' .squawk.toml \
              | grep -oE '"[a-z0-9-]+"' | tr -d '"' | sort -u | paste -sd, -
          )
          EXPECTED_CONFIG_EXCLUDES=$(
            printf '%s' "$CONFIG_BASELINE_EXCLUDES" | tr ',' '\n' | sort -u | paste -sd, -
          )
          if [ "$ACTUAL_CONFIG_EXCLUDES" != "$EXPECTED_CONFIG_EXCLUDES" ]; then
            echo "::error title=Squawk config drifted from this step's baseline::.squawk.toml excluded_rules is now '${ACTUAL_CONFIG_EXCLUDES}' but this step re-states '${EXPECTED_CONFIG_EXCLUDES}' on every exception invocation, because CLI --exclude REPLACES the config list instead of merging with it. Reconcile CONFIG_BASELINE_EXCLUDES with .squawk.toml in the same change, or the exempted files stop being linted for the rules the config means to exclude."
            exit 1
          fi

          # ADJUDICATION 1 — ban-drop-not-null x10.
          # This migration is APPLIED and checksum-pinned, so it cannot be fixed,
          # only adjudicated. Its 10 `DROP NOT NULL` statements ARE the change:
          # each column is an FK whose action became ON DELETE SET NULL, and
          # PostgreSQL rejects SET NULL on a NOT NULL column, so the drop is a
          # precondition of the convention this migration exists to establish.
          # The rule's stated concern is "may break existing clients". Measured
          # against schema.prisma: all 10 columns are declared optional
          # (AdminRoleHistory.userId, ApprovalRequest.submitterId,
          # ApprovalReview.reviewerId, Task.createdById, PostComment.authorId,
          # ConversationNote.authorId, SocialOutboundReply.authorId,
          # CustomReport.createdById, Invoice.accountId, Referral.referralCodeId
          # are each `String?`), so the generated client already types them
          # nullable and every reader narrows at compile time. There is no
          # client that can be surprised by a null it is not typed to handle.
          # TRIGGER: squawk reports ban-drop-not-null for this exact file content.
          # REMOVE-WHEN: a baseline squash removes this migration from the tree;
          # delete this entry in that same change.
          ALIGNMENT_MIGRATION="infra/prisma/migrations/20260830220417_ondelete_convention_alignment/migration.sql"
          ALIGNMENT_DIGEST="d19d56452c5658b0b24637c5956bfd8800df3ad8931e17d1e37e8ce8572a6a8b"

          # ADJUDICATION 2 — five rules on the retention/partial-unique migration.
          # A sixth finding, constraint-missing-not-valid, was NOT adjudicated:
          # it was FIXED. The CHECK is now added NOT VALID and validated by the
          # companion migration 20260901120100, which lints clean. The five that
          # remain:
          #
          #  - require-concurrent-index-creation (x3) and
          #    require-concurrent-index-deletion (x2): UNSATISFIABLE here, not
          #    unfixed. `CREATE INDEX CONCURRENTLY` / `DROP INDEX CONCURRENTLY`
          #    cannot run inside a transaction block, and Prisma wraps every
          #    migration in one — which is why .squawk.toml pins
          #    assume_in_transaction = true. Measured both directions against
          #    squawk 2.49.0 with this config: the non-concurrent statements fire
          #    these two rules, and rewriting them with CONCURRENTLY fires
          #    ban-concurrent-index-creation-in-transaction instead. There is no
          #    formulation of these statements that this config accepts, so the
          #    rule cannot be satisfied without leaving Prisma's migration engine
          #    for a hand-run runbook. The lock analysis in the migration header
          #    argues why that runbook is not worth it at these table sizes.
          #  - ban-drop-not-null (DeletionRecord.name): the drop is the feature.
          #    Stage 2 of the retention lifecycle replaces the plaintext name
          #    with a keyed HMAC and nulls the column, which a NOT NULL column
          #    forbids. schema.prisma declares `name String?`, so the client is
          #    typed for the null.
          #  - adding-not-nullable-field (retainUntil SET NOT NULL): the rule's
          #    concern is that the scan blocks reads. DeletionRecord is a
          #    tombstone table whose row count is bounded by hard deletions
          #    performed, so the scan is trivially short, and the statement
          #    timeout declared at the top of the migration aborts the whole
          #    transaction cleanly if that ever stops being true. NOT NULL is
          #    also not optional: schema.prisma declares `retainUntil DateTime`
          #    (required), so a nullable column would leave the migration and
          #    the schema permanently divergent.
          #  - prefer-bigint-over-int (nameDigestKeyVersion): the rule's concern
          #    is exhausting int4's 2147483647. This column is an HMAC key
          #    GENERATION counter, incremented once per key rotation — not per
          #    row, not per write. Exhausting it requires 2.1 billion key
          #    rotations. The concern does not apply.
          # TRIGGER: squawk reports any of those five for this exact file content.
          # REMOVE-WHEN: per rule — the two concurrency rules when these
          # statements no longer run under Prisma's per-migration transaction;
          # ban-drop-not-null and adding-not-nullable-field when a baseline
          # squash folds this migration away; prefer-bigint-over-int if
          # nameDigestKeyVersion ever becomes a per-row value rather than a
          # rotation counter, at which point it needs BIGINT and a schema change,
          # not an exception.
          RETENTION_MIGRATION="infra/prisma/migrations/20260901120000_deletion_record_retention_and_partial_uniques/migration.sql"
          RETENTION_DIGEST="6c90d4f2c42c751b582065be825ece47f85cca352b48182b8dbe054ac820adea"

          # ADJUDICATION 3 — two rules on the post-trio NOT NULL/uniques migration.
          # This migration is APPLIED and checksum-pinned; its own header already
          # characterizes every lock Squawk warns about ("LOCKS, CHARACTERIZED
          # HONESTLY") and names the live-path variants as runbook work, so this
          # entry records that adjudication where the gate reads it.
          #  - adding-not-nullable-field (x3, the SET NOT NULLs): the rule's
          #    concern is the ACCESS EXCLUSIVE verification scan. Step 2's
          #    backfill (20260909000100) aborts its own transaction unless every
          #    row resolved, so the scan verifies and cannot fail, and the
          #    statement_timeout declared at the file's top bounds it. NOT NULL
          #    is also load-bearing, not stylistic: a composite FK is MATCH
          #    SIMPLE and SKIPS its check whenever ANY referencing column is
          #    NULL, so a nullable accountId would disable the tenant guarantee
          #    for exactly the rows that omit it.
          #  - require-concurrent-index-creation (x3): UNSATISFIABLE here for
          #    the reason ADJUDICATION 2 measured — CONCURRENTLY cannot run
          #    inside a transaction block, Prisma wraps every migration in one
          #    (.squawk.toml pins assume_in_transaction = true), and the
          #    CONCURRENTLY spelling fires
          #    ban-concurrent-index-creation-in-transaction instead. The
          #    migration header's lock analysis argues why the hand-run runbook
          #    is not worth it for today's single deployable (dev and CI, no
          #    production traffic).
          # TRIGGER: squawk reports either rule for this exact file content.
          # REMOVE-WHEN: require-concurrent-index-creation when these statements
          # no longer run under Prisma's per-migration transaction (the
          # live-path runbook the header names, mandatory before production
          # traffic); adding-not-nullable-field when a baseline squash folds
          # this migration away — delete the entry in that same change.
          POST_TRIO_MIGRATION="infra/prisma/migrations/20260909000200_post_trio_tenant_not_null_and_uniques/migration.sql"
          POST_TRIO_DIGEST="d0d109427c2fc423ffb66581be197a59f31ea00ac4784cb4e7fc8ae79af51f4d"

          # ADJUDICATION 4 — two concurrency rules on the Post feed-index winner.
          # This migration REPLACES the account-led read index on "Post": it
          # drops ("accountId", "projectId") and builds
          # ("accountId", "projectId", "createdAt"), both partial on
          # "deletedAt" IS NULL. Two statements, two rules, one cause.
          #  - require-concurrent-index-deletion (x1, the DROP INDEX) and
          #    require-concurrent-index-creation (x1, the CREATE INDEX):
          #    UNSATISFIABLE here, not unfixed — the same finding ADJUDICATION
          #    2 measured and ADJUDICATION 3 inherited. `CREATE INDEX
          #    CONCURRENTLY` / `DROP INDEX CONCURRENTLY` cannot run inside a
          #    transaction block, and Prisma wraps every migration in one, which
          #    is why .squawk.toml pins assume_in_transaction = true. Rewriting
          #    either statement with CONCURRENTLY fires
          #    ban-concurrent-index-creation-in-transaction instead. There is no
          #    formulation of these two statements that this config accepts
          #    without leaving Prisma's migration engine for a hand-run runbook,
          #    and the migration header names that runbook explicitly (build the
          #    new index CONCURRENTLY first, verify indisvalid, then drop the old
          #    one — the reverse of the file's in-transaction order, because a
          #    live path must never leave "Post" without an accountId-led index).
          #    The header's lock analysis argues why it is not worth it for
          #    today's single deployable: dev and CI, no production traffic.
          # WHY THIS FILE EXISTS AT ALL, so the waiver is not read as a waiver of
          # the change: the shape was chosen by a four-arm measurement, not by
          # argument, and DROP was one of the four arms and lost on evidence
          # (docs/reports/TENANT_RLS_AB_MEASUREMENT.md, section "Reading the
          # index shortlist run"). The two rules above are the only findings; the
          # timeout settings squawk also requires are present at the top of the
          # file. Nothing about the index's correctness is being waived here —
          # only the CONCURRENTLY spelling, which this engine cannot emit.
          # TRIGGER: squawk reports either rule for this exact file content.
          # REMOVE-WHEN: both rules together, when these statements no longer run
          # under Prisma's per-migration transaction — i.e. when the live-path
          # CONCURRENTLY runbook named in the migration header is adopted, which
          # is mandatory before this schema carries production traffic. Also
          # delete the entry outright if a baseline squash folds this migration
          # away, in that same change.
          IX1_MIGRATION="infra/prisma/migrations/20260910000100_post_feed_index_winner/migration.sql"
          IX1_DIGEST="e7789b995f83f3fc4127807f4d605fdbe75f750a6cedd3889af81a94d2babc42"

          # ADJUDICATION 5 — the same two concurrency rules on that migration's
          # OPERATOR-RUN down.sql. The rollback mirrors the swap in reverse
          # (drop the three-column index, rebuild the two-column one, both
          # partial on "deletedAt" IS NULL), so the same two statements fire the
          # same two rules for the same cause, and ADJUDICATION 4's measured
          # unsatisfiability applies unchanged: .squawk.toml pins
          # assume_in_transaction = true, so rewriting either statement with
          # CONCURRENTLY fires ban-concurrent-index-creation-in-transaction
          # instead. down.sql is never applied by Prisma — it is the operator
          # rollback the migration header documents — but it is linted to the
          # same standard deliberately, because a rollback linted more leniently
          # than the change it reverses is a second, unreviewed migration.
          # Nothing about the rollback's correctness is waived — only the
          # CONCURRENTLY spelling, exactly as for the forward file.
          # RED, observed LIVE rather than planted: PR #237's Squawk lane fired
          # exactly these two rules on exactly this file (run 34536890517) while
          # the forward file linted clean under ADJUDICATION 4 — the
          # unadjudicated-sibling red this entry closes.
          # TRIGGER: squawk reports either rule for this exact file content.
          # REMOVE-WHEN: together with ADJUDICATION 4 — the two files adjudicate
          # and retire as a pair (the live-path CONCURRENTLY runbook adoption
          # that is mandatory before production traffic, or a baseline squash
          # deleting the migration folder, in that same change).
          IX1_DOWN="infra/prisma/migrations/20260910000100_post_feed_index_winner/down.sql"
          IX1_DOWN_DIGEST="59d787d3aca0a21cbc5531f130749a48ff79085a75b21db3dee058f42921d2c9"

          exception_rules_for() {
            case "$1" in
              "$ALIGNMENT_MIGRATION") echo "ban-drop-not-null" ;;
              "$RETENTION_MIGRATION") echo "adding-not-nullable-field,ban-drop-not-null,prefer-bigint-over-int,require-concurrent-index-creation,require-concurrent-index-deletion" ;;
              "$POST_TRIO_MIGRATION") echo "adding-not-nullable-field,require-concurrent-index-creation" ;;
              "$IX1_MIGRATION") echo "require-concurrent-index-creation,require-concurrent-index-deletion" ;;
              "$IX1_DOWN") echo "require-concurrent-index-creation,require-concurrent-index-deletion" ;;
              *) echo "" ;;
            esac
          }
          exception_digest_for() {
            case "$1" in
              "$ALIGNMENT_MIGRATION") echo "$ALIGNMENT_DIGEST" ;;
              "$RETENTION_MIGRATION") echo "$RETENTION_DIGEST" ;;
              "$POST_TRIO_MIGRATION") echo "$POST_TRIO_DIGEST" ;;
              "$IX1_MIGRATION") echo "$IX1_DIGEST" ;;
              "$IX1_DOWN") echo "$IX1_DOWN_DIGEST" ;;
              *) echo "" ;;
            esac
          }

          # A waiver naming a file that no longer exists is a slot a future file
          # could be recreated under and inherit unlinted — the same stale-name
          # failure the fitness suite fails closed on. Checked on every run, not
          # only when the file is in the changed set.
          # Every adjudicated path, without exception: the two arms of the case
          # statements above are the list this loop must mirror, and it silently
          # stopped mirroring them when POST_TRIO landed. Adding a name here is
          # part of adding an adjudication, not a follow-up to it.
          for p in "$ALIGNMENT_MIGRATION" "$RETENTION_MIGRATION" "$POST_TRIO_MIGRATION" "$IX1_MIGRATION" "$IX1_DOWN"; do
            if [ ! -f "$p" ]; then
              echo "::error title=Squawk exception names a file that no longer exists::$p is adjudicated in this step but is not in the tree. Delete the entry, or a migration recreated under that path inherits the waiver without ever being adjudicated."
              exit 1
            fi
          done

          FAIL=0
          OFFENDERS=""
          RULES_FILE="$RUNNER_TEMP/squawk-rules.txt"
          : > "$RULES_FILE"
          while IFS= read -r -d '' f; do
            if [ "$f" = "$RLS_MIGRATION" ]; then
              echo "::error title=Applied migration changed::$f is applied on every existing database and Prisma pins its checksum in _prisma_migrations — editing it makes each of those databases report the migration as modified. Revert this file and express the schema change as a NEW migration."
              FAIL=1
              continue
            fi
            OUT="$RUNNER_TEMP/squawk-out.txt"
            # `--` ends option parsing, so nothing after it can be read as a flag
            # no matter what the file is named. One file per invocation, so the
            # captured status is SQUAWK's: the old `echo ... | xargs squawk`
            # captured xargs' own 123 and reported it as squawk's exit code, which
            # told the author nothing about what squawk actually found.
            EXC_RULES=$(exception_rules_for "$f")
            CODE=0
            if [ -n "$EXC_RULES" ]; then
              GOT_DIGEST=$(sha256sum "$f" | cut -d' ' -f1)
              WANT_DIGEST=$(exception_digest_for "$f")
              if [ "$GOT_DIGEST" != "$WANT_DIGEST" ]; then
                echo "::error title=Adjudicated migration changed::$f carries a per-rule Squawk exception pinned to sha256 ${WANT_DIGEST}, but its content now hashes to ${GOT_DIGEST}. The waiver deliberately does NOT follow the file across an edit: statements added since the adjudication have not been adjudicated. Both pinned files are applied migrations that must not change at all, so this is very likely the edit itself being the defect — revert it and express the change as a NEW migration. If the edit is genuinely intended, re-run the adjudication and update the pinned digest in the same change."
                FAIL=1
                continue
              fi
              # The baseline is re-stated because CLI --exclude REPLACES the
              # config's excluded_rules rather than merging (see the gotcha
              # above); the drift guard keeps the two in sync.
              squawk --config .squawk.toml --exclude "${CONFIG_BASELINE_EXCLUDES},${EXC_RULES}" -- "$f" > "$OUT" 2>&1 || CODE=$?
              echo "::notice::$f linted with adjudicated exceptions: ${EXC_RULES}"
            else
              squawk --config .squawk.toml -- "$f" > "$OUT" 2>&1 || CODE=$?
            fi
            cat "$OUT"
            if [ "$CODE" -ne 0 ]; then
              FAIL=1
              OFFENDERS="$OFFENDERS $f"
              grep -oE '(warning|error)\[[a-z0-9-]+\]' "$OUT" \
                | sed 's/^[a-z]*\[//; s/\]$//' >> "$RULES_FILE" || true
            fi
          done < "$LIST"

          if [ "$FAIL" -ne 0 ]; then
            RULES=$(sort -u "$RULES_FILE" | paste -sd, - || true)
            if [ -n "$OFFENDERS" ]; then
              echo "::error title=Squawk migration-safety violations::Rule(s) ${RULES:-see the squawk output above} fired in:${OFFENDERS}. Two sanctioned paths, both inside the NEW migration: (1) fix the SQL — for require-timeout-settings that means prepending 'set lock_timeout = ...;' and 'set statement_timeout = ...;' to the migration, which Prisma never emits, so it is a hand edit on every new migration that touches an existing table; (2) if the finding genuinely cannot be fixed, add a per-file/per-rule exception in this step with its written adjudication, a trigger statement and a remove-when."
            fi
            exit 1
          fi
          echo "::notice::Squawk lint passed for all changed migrations"

  # ──────────────────────────────────────────────────────────────────────
  # 6. size-limit — Next.js bundle regression
  # ──────────────────────────────────────────────────────────────────────
  size-limit:
    if: github.event_name != 'schedule'
    name: size-limit (bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DATABASE_URL needed at install (Prisma config loader) and at build
    # (Next.js builds @infra/prisma). Dummy URL — no connection attempted.
    env:
      DATABASE_URL: "postgresql://audit:audit@localhost:5432/audit"
      SHADOW_DATABASE_URL: "postgresql://audit:audit@localhost:5432/audit_shadow"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm-cache
      # Use `turbo run build` (not `pnpm --filter`) so the build task's
      # dependsOn:["^build"] expands @shared/types#build BEFORE the Next apps —
      # admin/client consume @shared/types from its prebuilt dist (Option B,
      # ADR-0017 §4b), so the dist must exist before `next build`. Fitness #27(b)
      # guards against regressing to a bare `pnpm --filter @apps ... build` here.
      - name: Build apps
        run: pnpm exec turbo run build --filter=@apps/admin --filter=@apps/client
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Run size-limit (fail on threshold exceed)
        run: pnpm exec size-limit
      - name: Capture size-limit JSON for artifact
        if: always()
        run: pnpm exec size-limit --json > size-limit.json || true
      - name: Upload size-limit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-limit-results
          path: size-limit.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 7. lychee — markdown link check (broken internal docs refs)
  # ──────────────────────────────────────────────────────────────────────
  lychee-link-check:
    if: github.event_name != 'schedule'
    name: lychee (markdown link check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run lychee on docs + repo markdown
        uses: lycheeverse/lychee-action@v2
        with:
          # Config lives in `.lychee.toml` at repo root. Decouples regex
          # escaping from YAML quoting (which broke an inline `--exclude`
          # flag earlier — multi-line `>-` collapsed quotes incorrectly).
          args: --config .lychee.toml './**/*.md'
          fail: true

  # ──────────────────────────────────────────────────────────────────────
  # 8. TruffleHog — verified secrets (NIGHTLY only)
  # ──────────────────────────────────────────────────────────────────────
  trufflehog-nightly:
    if: github.event_name == 'schedule'
    name: TruffleHog (nightly verification)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install TruffleHog
        run: |
          curl -sSL "https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.2/trufflehog_3.95.2_linux_amd64.tar.gz" -o /tmp/th.tgz
          tar -xzf /tmp/th.tgz -C /usr/local/bin trufflehog
          chmod +x /usr/local/bin/trufflehog
          trufflehog --version
      - name: Verified secret scan
        run: |
          set +e
          trufflehog git file://. --only-verified --json > trufflehog.json
          CODE=$?
          if [ "$CODE" -gt 0 ]; then
            echo "::error::TruffleHog found VERIFIED LIVE credentials in git history. Rotate immediately."
            cat trufflehog.json
            exit 1
          fi
          echo "::notice::TruffleHog scan complete — no verified live credentials found"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trufflehog-results
          path: trufflehog.json
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────────────────────────────
  audit-summary:
    if: always() && github.event_name != 'schedule'
    name: Audit Summary
    runs-on: ubuntu-latest
    needs:
      - dependency-cruiser
      - semgrep
      - osv-scanner
      - gitleaks
      - secretlint
      - squawk
      - size-limit
      - lychee-link-check
    steps:
      - name: Render summary
        run: |
          echo "## Pre-merge Audit Toolkit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| dependency-cruiser | ${{ needs.dependency-cruiser.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep CE         | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OSV-Scanner        | ${{ needs.osv-scanner.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gitleaks           | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| secretlint         | ${{ needs.secretlint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Squawk             | ${{ needs.squawk.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| size-limit         | ${{ needs.size-limit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lychee             | ${{ needs.lychee-link-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reference: docs/architecture/audit-toolkit.md" >> $GITHUB_STEP_SUMMARY
