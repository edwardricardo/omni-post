name: Security Testing

# Three jobs survived the 3-questions filter (origin / purpose / duplication):
#
#   - sast-codeql           — second SAST engine, complementary to Semgrep CE
#                             in audit.yml. CodeQL queries are deeper (taint,
#                             dataflow) but slower; suited for SAT + nightly.
#   - custom-security-tests — runs `test:auth/rbac/security/mfa/ratelimit`
#                             scripts that exist in apps/api/package.json.
#                             No equivalent elsewhere — these are the project's
#                             own focused security suites.
#   - dast-owasp-zap        — DAST against a spun-up API. Schedule + manual
#                             only (45-min runs); the only DAST capability in
#                             the repo. Stays gated behind workflow_dispatch
#                             until a staging URL exists for `--target-url`.
#
# Removed (covered by 3-questions audit, see commit message): SonarQube
# (covered by Semgrep CE + CodeQL), Snyk (covered by OSV-Scanner), Anchore
# container scan (covered by Trivy in production-ci.yml), compliance-checks
# (covered by fitness.yml architectural greps), security-reporting Slack
# notify (covered by GitHub native PR check status + email).

on:
  push:
    # PR branches validate via the pull_request trigger; listing them here too
    # fired a redundant second run per push.
    branches: [main, omni-post-cc]
  pull_request:
    branches: [main, omni-post-cc]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. CodeQL — native GitHub SAST (TypeScript + JavaScript matrix)
  # ──────────────────────────────────────────────────────────────────────
  sast-codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, javascript]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ──────────────────────────────────────────────────────────────────────
  # 2. Custom security tests — project-specific suites
  # ──────────────────────────────────────────────────────────────────────
  custom-security-tests:
    name: Custom Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnipost_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/omnipost_test?schema=public"
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/omnipost_test_shadow?schema=public"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup test environment (.env.test)
        # env.ts loads `.env.test` when NODE_ENV=test; the tracked file was
        # removed for credential hygiene. DATABASE_URL / REDIS_URL come from
        # the job `env:` block above; the script synthesizes deterministic
        # non-production secrets.
        run: bash scripts/ci-setup-test-env.sh

      - name: Apply Prisma migrations
        run: pnpm --filter @infra/prisma exec prisma migrate deploy

      - name: Seed roles + permissions
        # Tests call AuthService.registerAdmin(_, _, _, "ADMIN") which looks up
        # the role record in DB. A fresh migration leaves the Role table empty,
        # so registration returns VALIDATION_ERROR. Seed populates the system
        # roles + permissions before the auth suites run.
        run: pnpm --filter @infra/prisma run seed

      # `if: always()` on each suite so a failure in one doesn't short-circuit
      # the others — every push surfaces every broken suite at once instead
      # of revealing them incrementally across runs.

      - name: Run authentication suite
        if: always()
        run: pnpm --filter @apps/api test:auth

      - name: Run RBAC suite
        if: always()
        run: pnpm --filter @apps/api test:rbac

      - name: Run input validation suite
        if: always()
        run: pnpm --filter @apps/api test:security

      - name: Run MFA suite
        if: always()
        run: pnpm --filter @apps/api test:mfa

      - name: Run rate-limit suite
        if: always()
        run: pnpm --filter @apps/api test:ratelimit

  # ──────────────────────────────────────────────────────────────────────
  # 3. OWASP ZAP DAST — runtime scan against the spun-up API.
  #    Gated to schedule + manual dispatch only (45-min runs are too heavy
  #    for every push). Once a staging URL is available the target should
  #    move from local API spin-up to that URL.
  # ──────────────────────────────────────────────────────────────────────
  dast-owasp-zap:
    name: OWASP ZAP DAST
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnipost_dast
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/omnipost_dast?schema=public"
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/omnipost_dast_shadow?schema=public"
      REDIS_URL: "redis://localhost:6379"
      PORT: "3000"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup test environment (.env.test)
        # env.ts loads `.env.test` when NODE_ENV=test; the tracked file was
        # removed for credential hygiene. DATABASE_URL / REDIS_URL come from
        # the job `env:` block above; the script synthesizes deterministic
        # non-production secrets.
        run: bash scripts/ci-setup-test-env.sh

      - name: Apply Prisma migrations
        run: pnpm --filter @infra/prisma exec prisma migrate deploy

      - name: Seed roles + permissions
        run: pnpm --filter @infra/prisma run seed

      - name: Start API in background
        run: |
          pnpm --filter @apps/api dev:test &
          echo "API_PID=$!" >> $GITHUB_ENV
          timeout 90s bash -c 'until curl -fsS http://localhost:3000/health >/dev/null; do sleep 2; done'

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:3000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          fail_action: false

      - name: Stop API
        if: always()
        run: kill "$API_PID" 2>/dev/null || true
