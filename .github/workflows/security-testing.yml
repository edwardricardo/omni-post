name: Security Testing

# Two jobs survived the 3-questions filter (origin / purpose / duplication):
#
#   - sast-codeql           — second SAST engine, complementary to Semgrep CE
#                             in audit.yml. CodeQL queries are deeper (taint,
#                             dataflow) but slower; suited for SAT + nightly.
#   - dast-owasp-zap        — DAST against a spun-up API. Schedule + manual
#                             only (45-min runs); the only DAST capability in
#                             the repo. Stays gated behind workflow_dispatch
#                             until a staging URL exists for `--target-url`.
#
# Removed (covered by 3-questions audit, see commit message): SonarQube
# (covered by Semgrep CE + CodeQL), Snyk (covered by OSV-Scanner), Anchore
# container scan (covered by Trivy in production-ci.yml), compliance-checks
# (covered by fitness.yml architectural greps), security-reporting Slack
# notify (covered by GitHub native PR check status + email).
#
# Also removed: custom-security-tests, a second collector for files that
# already run elsewhere. Its auth, rbac and mfa suites run in the services
# tier of apps/api/scripts/run-tests.sh and its security suite in the live
# tier (the Integration Tests job of ci.yml, TIER=full-integration, with a
# live API), connected as the app role — the omnipost_app login that
# row-level security applies to — and with rate limiting on. Its per-suite
# guards live on there: under TIER each file gets its own verdict and fails
# on any skipped or cancelled case and on zero tests. Its two ratelimit
# suites live under apps/api/tests/unit and run in the vitest shards.

on:
  push:
    # PR branches validate via the pull_request trigger; listing them here too
    # fired a redundant second run per push.
    branches: [main, omni-post-cc]
  pull_request:
    # Chained pull requests target a feature tracker or a sibling workstream branch, not main;
    # without these patterns a child PR ran no checks at all until it merged into the tracker.
    branches: [main, omni-post-cc, "feature/**", "workstream/**"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. CodeQL — native GitHub SAST (TypeScript + JavaScript matrix)
  # ──────────────────────────────────────────────────────────────────────
  sast-codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, javascript]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # ──────────────────────────────────────────────────────────────────────
  # 2. OWASP ZAP DAST — runtime scan against the spun-up API.
  #    Gated to schedule + manual dispatch only (45-min runs are too heavy
  #    for every push). Once a staging URL is available the target should
  #    move from local API spin-up to that URL.
  # ──────────────────────────────────────────────────────────────────────
  dast-owasp-zap:
    name: OWASP ZAP DAST
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnipost_dast
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/omnipost_dast?schema=public"
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/omnipost_dast_shadow?schema=public"
      REDIS_URL: "redis://localhost:6379"
      PORT: "3000"

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm-cache

      - name: Setup test environment (.env.test)
        # env.ts loads `.env.test` when NODE_ENV=test; the tracked file was
        # removed for credential hygiene. DATABASE_URL / REDIS_URL come from
        # the job `env:` block above; the script synthesizes deterministic
        # non-production secrets.
        run: bash scripts/ci-setup-test-env.sh

      - name: Apply Prisma migrations
        run: pnpm --filter @infra/prisma exec prisma migrate deploy

      - name: Seed roles + permissions
        run: pnpm --filter @infra/prisma run seed

      - name: Start API in background
        run: |
          pnpm --filter @apps/api dev:test > "$RUNNER_TEMP/api.log" 2>&1 &
          API_PID=$!
          echo "API_PID=$API_PID" >> "$GITHUB_ENV"
          # Same liveness term and log capture as the custom-security-tests boot:
          # a scan target that died during boot must be named as "exited", not
          # reported as a 90-second readiness timeout.
          gate=0
          timeout 90s bash -c '
            until curl -fsS http://localhost:3000/health >/dev/null; do
              kill -0 "$1" 2>/dev/null || exit 1
              sleep 2
            done' _ "$API_PID" || gate=$?
          if [ "$gate" -ne 0 ]; then
            if [ "$gate" -eq 124 ]; then
              echo "::error title=API never became ready::/health on :3000 did not answer within 90s — see the api.log group at the end of this job"
            else
              echo "::error title=API exited during boot::the process is gone — see the api.log group at the end of this job"
            fi
            exit 1
          fi

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-a"
          # A scan that cannot fail the job is a scan nobody has to read. The
          # findings this turns red are the work list; they are answered by
          # fixing the finding, never by adding a suppression file that hides
          # it before anyone has looked at it.
          fail_action: true

      - name: Dump API log and stop the API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api.log" ]; then
            echo "::group::api.log"
            cat "$RUNNER_TEMP/api.log"
            echo "::endgroup::"
          fi
          liveness=0
          if [ -n "${API_PID:-}" ] && ! kill -0 "$API_PID" 2>/dev/null; then
            echo "::error title=the API is no longer running::the scan that just ran was talking to a dead server"
            liveness=1
          fi
          kill "${API_PID:-}" 2>/dev/null || true
          # ZAP reports no findings against a target that stopped answering, and
          # an annotation would leave that empty result green. The liveness
          # verdict is the step's exit status. Teardown still runs first.
          exit "$liveness"
