# Production CI/CD Pipeline with Security Gates
name: Production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security and Quality Gates
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  # Code Quality and Testing
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    # 30m: once .env.test is synthesized, apps/api's full suite actually runs
    # (it previously fail-fasted on env validation), so test + build legitimately
    # exceed the old 15m budget. Tests pass; this is wall-clock, not a failure.
    timeout-minutes: 30
    needs: security-audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so `turbo run test --filter='[HEAD^1]'` can resolve
          # HEAD^1 (= main's tip on a PR merge commit = "changed vs main").
          fetch-depth: 0

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Type checking
        run: pnpm run typecheck

      - name: Linting
        run: pnpm run lint

      - name: Format checking
        run: pnpm run format:check

      - name: Setup test environment
        run: |
          cp .env.example .env
          # Mirror the ci.yml Test Suite job: apps/api/src/config/env.ts loads
          # `.env.test` when NODE_ENV=test. The tracked file was removed for
          # credential hygiene, so CI synthesizes it with deterministic
          # non-production secrets. DB/Redis match this job's service containers.
          export DATABASE_URL="postgresql://test_user:test_pass@localhost:5432/test_db"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: pnpm run test

      - name: Build all services
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
          retention-days: 7

  # Container Build and Security Scan
  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-and-build
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        service: [api, workers, admin, client]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

      - name: Container image analysis
        run: |
          IMAGE_TAG="${{ steps.meta.outputs.tags }}"
          IMAGE_SIZE=$(docker image inspect ${IMAGE_TAG} --format='{{.Size}}' | numfmt --to=iec)

          echo "## Container Analysis: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Size**: $IMAGE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**Security Scan**: ✅ Passed" >> $GITHUB_STEP_SUMMARY

          # Ensure image size is reasonable
          SIZE_BYTES=$(docker image inspect ${IMAGE_TAG} --format='{{.Size}}')
          if [ $SIZE_BYTES -gt 1073741824 ]; then  # 1GB
            echo "⚠️ Image size exceeds 1GB limit" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Push container image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: container-security
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Using containers from registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Here you would typically:
          # 1. Update Kubernetes manifests with new image tags
          # 2. Apply configuration to staging cluster
          # 3. Wait for deployment to complete
          # 4. Run smoke tests

          echo "✅ Staging deployment completed"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests against staging..."

          # Wait for services to be ready
          sleep 30

          # Basic health checks
          echo "Checking API health..."
          # curl -f https://staging-api.example.com/health || exit 1

          echo "Checking admin dashboard..."
          # curl -f https://staging-admin.example.com/api/health || exit 1

          echo "Checking client dashboard..."
          # curl -f https://staging-client.example.com/api/health || exit 1

          echo "✅ All smoke tests passed"

  # Performance Testing
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1

      - name: Run performance tests
        run: |
          echo "🚀 Running performance tests..."

          # Basic load test
          ./k6 run --duration=2m --vus=50 - <<EOF
          import http from 'k6/http';
          import { check } from 'k6';

          export let options = {
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.01'],
            },
          };

          export default function() {
            // Test API endpoints
            let response = http.get('https://staging-api.example.com/health');
            check(response, {
              'status is 200': (r) => r.status === 200,
              'response time < 200ms': (r) => r.timings.duration < 200,
            });
          }
          EOF

  # Production Deployment (Manual Approval)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [container-security, performance-test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Container images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          # Production deployment would happen here
          # This typically involves:
          # 1. Blue-green deployment strategy
          # 2. Database migrations
          # 3. Configuration updates
          # 4. Health checks
          # 5. Traffic switching

          echo "✅ Production deployment completed"

      - name: Post-deployment verification
        run: |
          echo "🔍 Running post-deployment verification..."

          # Health checks
          sleep 30

          echo "✅ Production deployment verified"

  # Notification and Cleanup
  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Notify team
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "✅ Pipeline completed successfully"
            echo "🚀 Production deployment completed at $(date)"
          else
            echo "❌ Pipeline failed"
            echo "🔍 Check the logs for details"
          fi
