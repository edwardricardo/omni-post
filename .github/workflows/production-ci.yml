# Production CI/CD Pipeline with Security Gates
name: Production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs on force-push; never cancel main runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security and Quality Gates
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit dependencies
        run: |
          # Mirrors ci.yml "Run security audit" — same classification, same
          # rationale (see the comment there): a required gate must distinguish
          # "measured and found advisories" from "could not measure", failing
          # closed in both cases but SAYING which one happened. Keep the two
          # copies in lockstep when editing either.
          set -uo pipefail
          ATTEMPTS=4
          BASE_SLEEP="${AUDIT_RETRY_BASE_SLEEP:-30}"
          NET_SIG='error \(23\)|error \(5[0-9][0-9]\)|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN|aborted due to timeout|TimeoutError'
          for i in $(seq 1 "$ATTEMPTS"); do
            set +e
            OUT=$(pnpm audit --audit-level moderate 2>&1)
            CODE=$?
            set -e
            if [ "$CODE" -eq 0 ]; then
              printf '%s\n' "$OUT" | tail -12
              echo "Security audit measured CLEAN on attempt $i/$ATTEMPTS."
              exit 0
            fi
            if ! printf '%s' "$OUT" | grep -qE "$NET_SIG"; then
              printf '%s\n' "$OUT"
              echo "::error title=Security audit: vulnerabilities found::pnpm audit MEASURED the tree (attempt $i/$ATTEMPTS) and found advisories at moderate or above. Raise the CVE floors per docs/security/SECURITY_CANON.md §Audited audit-ignores — never ignore a reachable, un-mitigated advisory."
              exit 1
            fi
            echo "attempt $i/$ATTEMPTS: advisory endpoint unreachable (network signature matched), retrying in $((i * BASE_SLEEP))s"
            printf '%s\n' "$OUT" | tail -4
            [ "$i" -lt "$ATTEMPTS" ] && sleep $((i * BASE_SLEEP))
          done
          echo "::error title=Security audit COULD NOT MEASURE::npm's bulk advisory endpoint was unreachable on all $ATTEMPTS attempts. This is NOT a clean result and NOT a vulnerability finding — nothing was measured, so a required security gate fails closed rather than passing on silence. Re-run when the endpoint recovers."
          exit 1

  # Code Quality and Testing
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    # 30m: once .env.test is synthesized, apps/api's full suite actually runs
    # (it previously fail-fasted on env validation), so test + build legitimately
    # exceed the old 15m budget. Tests pass; this is wall-clock, not a failure.
    timeout-minutes: 30
    needs: security-audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so `turbo run test --filter='[HEAD^1]'` can resolve
          # HEAD^1 (= main's tip on a PR merge commit = "changed vs main").
          fetch-depth: 0

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      # PR path is build-only: ci.yml owns PR validation (full turbo typecheck
      # in Lint and Format, sharded coverage suite, Package Tests, integration
      # tier). Main-push re-validates everything as the final safety net.
      - name: Type checking
        if: github.event_name == 'push'
        run: pnpm run typecheck

      - name: Linting
        if: github.event_name == 'push'
        run: pnpm run lint

      - name: Format checking
        if: github.event_name == 'push'
        run: pnpm run format:check

      - name: Setup test environment
        run: |
          cp .env.example .env
          # Mirror the ci.yml Test Suite job: apps/api/src/config/env.ts loads
          # `.env.test` when NODE_ENV=test. The tracked file was removed for
          # credential hygiene, so CI synthesizes it with deterministic
          # non-production secrets. DB/Redis match this job's service containers.
          export DATABASE_URL="postgresql://test_user:test_pass@localhost:5432/test_db"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Run tests
        if: github.event_name == 'push'
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: pnpm run test

      - name: Build all services
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
          retention-days: 7

  # Container Build and Security Scan
  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on PRs and main-push alike. The Dockerfiles build cleanly now, so the
    # matrix produces real signal on PRs and can gate merges as a required check.
    needs: test-and-build
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        service: [api, workers, admin, client]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build container image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            local/${{ matrix.service }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Placed BEFORE the scanner on purpose: a broken image should say so even on
      # a run where Trivy is red for an unrelated advisory. Until this step
      # existed, CI built four images, scanned them, pushed them on main, and
      # never once RAN one — so nothing stood behind the Dockerfile header's own
      # word for the glibc match, "BLOCKING".
      - name: Smoke — the built image runs, and its native ABI resolves
        run: |
          # -e is not decoration here. Without it the liveness probe could fail
          # and the `echo` after it would still return 0 — and for the three
          # services whose branch ENDS in an echo, the step's exit status would
          # be that echo's. A gate whose last command cannot fail is a gate that
          # cannot go red, which is the exact defect this step was added to stop
          # shipping. Caught in review, after being written into the fix for it.
          set -euo pipefail
          IMAGE="local/${{ matrix.service }}:scan"

          # 1. Node executes at all on this base. Catches an architecture or
          #    loader break, which is the cheapest way a base swap goes wrong.
          docker run --rm --entrypoint /nodejs/bin/node "$IMAGE" -e 'process.exit(0)'
          echo "  node executes in $IMAGE"

          # 2. The native ABI, exercised where there IS a native module. `argon2`
          #    ships prebuilds for many platforms and `node-gyp-build` selects one
          #    at require time, so requiring the PACKAGE is the honest test —
          #    walking for *.node and loading each would try the musl and
          #    foreign-arch prebuilds and fail on files nothing was ever going to
          #    open. A hash plus its verify, because loading the binding proves
          #    less than using it.
          if [ "${{ matrix.service }}" = "api" ]; then
            docker run --rm --entrypoint /nodejs/bin/node --workdir /app/apps/api "$IMAGE" -e '
              const argon2 = require("argon2");
              argon2
                .hash("ci-smoke", { type: argon2.argon2id })
                .then((h) => argon2.verify(h, "ci-smoke"))
                .then((ok) => {
                  if (!ok) { console.error("argon2 verify returned false"); process.exit(1); }
                  console.log("argon2 loaded and round-tripped");
                })
                .catch((e) => { console.error("argon2 FAILED: " + e.message); process.exit(1); });
            '
          else
            # Said out loud rather than left as a silent pass: these three carry no
            # native module of their own, so step 1 is the whole of their coverage.
            echo "  ${{ matrix.service }}: no native module of its own; liveness only"
          fi

      # THE GATE, and it is `table` on purpose. With `format: sarif` the action
      # documents that it "enforces output of all vulnerabilities regardless of
      # configured severities" unless `limit-severities-for-sarif` is set — so
      # `severity: CRITICAL,HIGH` was silently not applied and `exit-code: 1`
      # fired on MEDIUM and LOW findings. That is why these four jobs were red
      # even when no CRITICAL or HIGH existed. Measured in one run: this same
      # scan in table form reported 0 while the sarif one exited 1.
      #
      # `table` respects `severity`, and it prints what it caught — so the gate
      # explains itself instead of failing silently into a file.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          # Explicit path required: the action runs Trivy in its own container,
          # so the repo-root .trivyignore is not auto-discovered.
          trivyignores: .trivyignore

      # The SARIF is for the Security tab, NOT for gating, so it keeps the
      # action's default breadth on purpose: every severity, so MEDIUM and LOW
      # stay visible there. `exit-code: 0` because the gate above already
      # decided.
      #
      # Conditioned on the BUILD, not on `always()`: a build failure leaves no
      # image, so `always()` would run this against a tag that does not exist,
      # Trivy would error, `continue-on-error` would swallow it, no file would be
      # written, and the upload below would then look for a SARIF that was never
      # produced — three silent no-ops in a row.
      #
      # `!cancelled()` is load-bearing, not noise. GitHub Actions wraps any `if:`
      # that names no status function in an implicit `success()`, so
      # `steps.build.outcome == 'success'` ALONE would also require every earlier
      # step to have passed — including the gate — and the report would vanish in
      # exactly the case it exists for. Naming a status function disables that
      # implicit wrap; `!cancelled()` is the one that keeps a cancelled run from
      # still scanning.
      - name: Trivy SARIF for code scanning (never gates)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          exit-code: "0"
          trivyignores: .trivyignore

      # Same reasoning as the step above, `!cancelled()` included: without a
      # status function the implicit `success()` would skip this whenever the
      # gate went red, which is when the report is most worth uploading.
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

      - name: Container image analysis
        run: |
          IMAGE_TAG="local/${{ matrix.service }}:scan"
          IMAGE_SIZE=$(docker image inspect ${IMAGE_TAG} --format='{{.Size}}' | numfmt --to=iec)

          echo "## Container Analysis: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Size**: $IMAGE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**Security Scan**: ✅ Passed" >> $GITHUB_STEP_SUMMARY

          # Ensure image size is reasonable
          SIZE_BYTES=$(docker image inspect ${IMAGE_TAG} --format='{{.Size}}')
          if [ $SIZE_BYTES -gt 1073741824 ]; then  # 1GB
            echo "⚠️ Image size exceeds 1GB limit" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Push container image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
