# Production CI/CD Pipeline with Security Gates
name: Production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs on force-push; never cancel main runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security and Quality Gates
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit dependencies
        run: |
          # Mirrors ci.yml "Run security audit" — same classification, same
          # rationale (see the comment there): a required gate must distinguish
          # "measured and found advisories" from "could not measure", failing
          # closed in both cases but SAYING which one happened. Keep the two
          # copies in lockstep when editing either.
          set -uo pipefail
          ATTEMPTS=4
          BASE_SLEEP="${AUDIT_RETRY_BASE_SLEEP:-30}"
          NET_SIG='error \(23\)|error \(5[0-9][0-9]\)|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN|aborted due to timeout|TimeoutError'
          for i in $(seq 1 "$ATTEMPTS"); do
            set +e
            OUT=$(pnpm audit --audit-level moderate 2>&1)
            CODE=$?
            set -e
            if [ "$CODE" -eq 0 ]; then
              printf '%s\n' "$OUT" | tail -12
              echo "Security audit measured CLEAN on attempt $i/$ATTEMPTS."
              exit 0
            fi
            if ! printf '%s' "$OUT" | grep -qE "$NET_SIG"; then
              printf '%s\n' "$OUT"
              echo "::error title=Security audit: vulnerabilities found::pnpm audit MEASURED the tree (attempt $i/$ATTEMPTS) and found advisories at moderate or above. Raise the CVE floors per docs/security/SECURITY_CANON.md §Audited audit-ignores — never ignore a reachable, un-mitigated advisory."
              exit 1
            fi
            echo "attempt $i/$ATTEMPTS: advisory endpoint unreachable (network signature matched), retrying in $((i * BASE_SLEEP))s"
            printf '%s\n' "$OUT" | tail -4
            [ "$i" -lt "$ATTEMPTS" ] && sleep $((i * BASE_SLEEP))
          done
          echo "::error title=Security audit COULD NOT MEASURE::npm's bulk advisory endpoint was unreachable on all $ATTEMPTS attempts. This is NOT a clean result and NOT a vulnerability finding — nothing was measured, so a required security gate fails closed rather than passing on silence. Re-run when the endpoint recovers."
          exit 1

  # Code Quality and Testing
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    # 30m: once .env.test is synthesized, apps/api's full suite actually runs
    # (it previously fail-fasted on env validation), so test + build legitimately
    # exceed the old 15m budget. Tests pass; this is wall-clock, not a failure.
    timeout-minutes: 30
    needs: security-audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so `turbo run test --filter='[HEAD^1]'` can resolve
          # HEAD^1 (= main's tip on a PR merge commit = "changed vs main").
          fetch-depth: 0

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache
        with:
          node-version: ${{ env.NODE_VERSION }}

      # PR path is build-only: ci.yml owns PR validation (full turbo typecheck
      # in Lint and Format, sharded coverage suite, Package Tests, integration
      # tier). Main-push re-validates everything as the final safety net.
      - name: Type checking
        if: github.event_name == 'push'
        run: pnpm run typecheck

      - name: Linting
        if: github.event_name == 'push'
        run: pnpm run lint

      - name: Format checking
        if: github.event_name == 'push'
        run: pnpm run format:check

      - name: Setup test environment
        run: |
          cp .env.example .env
          # Mirror the ci.yml Test Suite job: apps/api/src/config/env.ts loads
          # `.env.test` when NODE_ENV=test. The tracked file was removed for
          # credential hygiene, so CI synthesizes it with deterministic
          # non-production secrets. DB/Redis match this job's service containers.
          export DATABASE_URL="postgresql://test_user:test_pass@localhost:5432/test_db"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Run tests
        if: github.event_name == 'push'
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: pnpm run test

      - name: Build all services
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
          retention-days: 7

  # Container Build and Security Scan
  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on PRs and main-push alike. The Dockerfiles build cleanly now, so the
    # matrix produces real signal on PRs and can gate merges as a required check.
    needs: test-and-build
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        service: [api, workers, admin, client]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            local/${{ matrix.service }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

      - name: Container image analysis
        run: |
          IMAGE_TAG="local/${{ matrix.service }}:scan"
          IMAGE_SIZE=$(docker image inspect ${IMAGE_TAG} --format='{{.Size}}' | numfmt --to=iec)

          echo "## Container Analysis: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Size**: $IMAGE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**Security Scan**: ✅ Passed" >> $GITHUB_STEP_SUMMARY

          # Ensure image size is reasonable
          SIZE_BYTES=$(docker image inspect ${IMAGE_TAG} --format='{{.Size}}')
          if [ $SIZE_BYTES -gt 1073741824 ]; then  # 1GB
            echo "⚠️ Image size exceeds 1GB limit" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Push container image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
