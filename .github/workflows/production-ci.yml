# Production CI/CD Pipeline with Security Gates
name: Production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    # A stacked PR targets its parent branch and its retarget to main starts no run here,
    # so without these patterns the PR lacks Test and Build, which main requires to merge.
    branches: [main, omni-post-cc, "feature/**", "workstream/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs on force-push; never cancel main runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security and Quality Gates
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # The same budget as ci.yml's `security` job, for the same reasons (see the comment there): a
    # pnpm self-installer stall of 304 s that held the setup step for 326 s, measured here on
    # 2026-10-22 (run 39712476313, both attempts), plus the audit step's bounded worst case of 7
    # minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Audit dependencies
        run: |
          # This body is byte-identical in ci.yml (job `security`, step "Run security
          # audit") and production-ci.yml (job `security-audit`, step "Audit
          # dependencies"). Edit both together.
          #
          # A required gate has two ways to lie: failing as if it FOUND something
          # after measuring nothing (npm's bulk advisory endpoint answered error 23,
          # then 503, for hours on 2026-09-04), and passing after measuring nothing.
          # Passing unmeasured (`|| true`) stays forbidden; this step keeps the first
          # lie out by reading the verdict from the audit report, never from pnpm's
          # prose.
          # `pnpm audit --json` prints the report on stdout, and only a document that
          # parses as the report (an object with an `advisories` map and
          # `metadata.vulnerabilities`) counts as a measurement:
          #   - CLEAN: exit 0 and an empty `advisories` map. The step passes.
          #   - FOUND: a report whose `advisories` map is not empty. The step fails
          #     and names them. The map holds the advisories at or above
          #     --audit-level that auditConfig.ignoreGhsas does not ignore;
          #     `metadata.vulnerabilities` counts every advisory, the ignored and
          #     below-level ones too, so it is printed but never decides.
          #   - COULD NOT MEASURE: anything else. No JSON on stdout (a request error
          #     such as ERR_PNPM_AUDIT_BAD_RESPONSE goes to stderr), JSON that is not
          #     the report, a non-zero exit whose report names no advisory, or an
          #     attempt the per-attempt timeout killed. It is retried with backoff,
          #     and after the last attempt the step fails under its own title.
          # On 2026-10-22 an attempt hung 250 s and ended in pnpm's "operation timed
          # out", which the previous classifier, a text match on network error
          # signatures, read as a finding; the per-attempt timeout bounds that hang.
          # AUDIT_RETRY_BASE_SLEEP and AUDIT_ATTEMPT_TIMEOUT exist so the red-path
          # harness can run the loop in seconds; CI uses the defaults.
          set -uo pipefail
          ATTEMPTS=4
          BASE_SLEEP="${AUDIT_RETRY_BASE_SLEEP:-30}"
          ATTEMPT_TIMEOUT="${AUDIT_ATTEMPT_TIMEOUT:-60}"
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          cat > "$WORK/classify.cjs" <<'NODE'
          const fs = require("node:fs");
          const isObject = (value) => typeof value === "object" && value !== null && !Array.isArray(value);
          const say = (lines) => process.stdout.write(`${lines.join("\n")}\n`);
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch (error) {
            say(["UNMEASURED", `stdout is not JSON (${error instanceof Error ? error.message : String(error)})`]);
            process.exit(0);
          }
          if (!isObject(report) || !isObject(report.advisories) || !isObject(report.metadata) || !isObject(report.metadata.vulnerabilities)) {
            say(["UNMEASURED", "stdout is JSON but not an audit report: no advisories map and metadata.vulnerabilities"]);
            process.exit(0);
          }
          const counts = `metadata.vulnerabilities ${JSON.stringify(report.metadata.vulnerabilities)}, ignored and below-level advisories included`;
          const found = Object.values(report.advisories);
          if (found.length === 0) {
            say(["CLEAN", counts]);
            process.exit(0);
          }
          say([
            "FOUND",
            `${found.length} advisories: ${found.map((a) => `${a.module_name} ${a.github_advisory_id} (${a.severity})`).join(", ")}`,
            counts,
            ...found.map((a) => `${a.severity} ${a.module_name} ${a.github_advisory_id}, vulnerable ${a.vulnerable_versions}, patched ${a.patched_versions}: ${a.title}`),
          ]);
          NODE
          for i in $(seq 1 "$ATTEMPTS"); do
            set +e
            timeout "$ATTEMPT_TIMEOUT" pnpm audit --audit-level moderate --json >"$WORK/report.json" 2>"$WORK/stderr.txt"
            CODE=$?
            VERDICT=$(node "$WORK/classify.cjs" "$WORK/report.json")
            NODE_CODE=$?
            set -e
            KIND=$(printf '%s\n' "$VERDICT" | head -n 1)
            SUMMARY=$(printf '%s\n' "$VERDICT" | sed -n '2p')
            if [ "$NODE_CODE" -ne 0 ]; then
              KIND=UNMEASURED
              SUMMARY="the report classifier exited $NODE_CODE"
            elif [ "$KIND" = CLEAN ] && [ "$CODE" -ne 0 ]; then
              KIND=UNMEASURED
              SUMMARY="pnpm exited $CODE with a report that names no advisory"
            fi
            if [ "$KIND" = CLEAN ]; then
              printf '%s\n' "$SUMMARY"
              echo "Security audit measured CLEAN on attempt $i/$ATTEMPTS."
              exit 0
            fi
            if [ "$KIND" = FOUND ]; then
              printf '%s\n' "$VERDICT" | tail -n +3
              echo "::error title=Security audit: vulnerabilities found::pnpm audit MEASURED the tree (attempt $i/$ATTEMPTS) and found $SUMMARY. Raise the CVE floors per docs/security/DEPENDENCY_AUDIT_RECORD.md §Audited audit-ignores — never ignore a reachable, un-mitigated advisory."
              exit 1
            fi
            if [ "$CODE" -eq 124 ]; then
              SUMMARY="the attempt ran past ${ATTEMPT_TIMEOUT}s and was killed"
            fi
            echo "attempt $i/$ATTEMPTS: COULD NOT MEASURE (pnpm exit $CODE): $SUMMARY"
            tail -n 6 "$WORK/stderr.txt"
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "retrying in $((i * BASE_SLEEP))s"
              sleep $((i * BASE_SLEEP))
            fi
          done
          echo "::error title=Security audit COULD NOT MEASURE::pnpm audit produced no measurement on any of $ATTEMPTS attempts (the last: $SUMMARY). This is NOT a clean result and NOT a vulnerability finding — nothing was measured, so a required security gate fails closed rather than passing on silence. Re-run when the advisory endpoint recovers."
          exit 1

  # Code Quality and Testing
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    # 45m: when a change touches apps/api, the test step replays nothing from the cache and runs
    # the API's whole suite in one piece. Measured on main at 27 to 30 minutes, where a limit of
    # 30 cancelled a run whose every step was green; with the cache the job takes about 6 minutes.
    timeout-minutes: 45
    needs: security-audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so `turbo run test --filter='[HEAD^1]'` can resolve
          # HEAD^1 (= main's tip on a PR merge commit = "changed vs main").
          fetch-depth: 0

      - name: Setup Node.js with pnpm and cache
        uses: ./.github/actions/setup-node-pnpm-cache

      # PR path is build-only: ci.yml owns PR validation (full turbo typecheck
      # in Lint and Format, sharded coverage suite, Package Tests, integration
      # tier). Main-push re-validates everything as the final safety net.
      - name: Type checking
        if: github.event_name == 'push'
        run: pnpm run typecheck

      - name: Linting
        if: github.event_name == 'push'
        run: pnpm run lint

      - name: Format checking
        if: github.event_name == 'push'
        run: pnpm run format:check

      - name: Setup test environment
        run: |
          cp .env.example .env
          # Mirror the ci.yml Test Suite job: apps/api/src/config/env.ts loads
          # `.env.test` when NODE_ENV=test. The tracked file was removed for
          # credential hygiene, so CI synthesizes it with deterministic
          # non-production secrets. DB/Redis match this job's service containers.
          export DATABASE_URL="postgresql://test_user:test_pass@localhost:5432/test_db"
          export REDIS_URL="redis://localhost:6379"
          bash scripts/ci-setup-test-env.sh

      - name: Run tests
        if: github.event_name == 'push'
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: pnpm run test

      - name: Build all services
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
          retention-days: 7

  # Container Build and Security Scan
  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on PRs and main-push alike. The Dockerfiles build cleanly now, so the
    # matrix produces real signal on PRs and can gate merges as a required check.
    needs: test-and-build
    permissions:
      contents: read
      packages: write
      security-events: write

    # Each leg reports its image's Node version under its own service's key, for the
    # `node-runtime-advisory` job below. GitHub combines a matrix's outputs across its legs, and
    # the last leg to set a name wins, so one shared key would keep a single image's version; an
    # empty value is not set, so the three legs that leave a key empty do not erase the fourth's.
    outputs:
      node-version-api: ${{ steps.node-version.outputs.api }}
      node-version-workers: ${{ steps.node-version.outputs.workers }}
      node-version-admin: ${{ steps.node-version.outputs.admin }}
      node-version-client: ${{ steps.node-version.outputs.client }}

    strategy:
      matrix:
        service: [api, workers, admin, client]
      fail-fast: false

    env:
      # The portals inline their browser Sentry DSN at `next build` (DEF-86). Each
      # portal reads its own repository variable, ADMIN_NEXT_PUBLIC_SENTRY_DSN or
      # CLIENT_NEXT_PUBLIC_SENTRY_DSN, so the two portals report to two Sentry
      # projects; either is a public DSN, not a secret. Both reach the image under
      # the one name the portals read, NEXT_PUBLIC_SENTRY_DSN. Only the two portal
      # Dockerfiles declare the ARG, so the api and workers builds receive none (an
      # unconsumed build-arg would only warn, but a warning nobody reads is noise).
      # Unset, the ARG default "" keeps the browser SDK disabled. The server DSN
      # stays a runtime variable. Computed once here so the scanned build and the
      # push below pass the same argument.
      SENTRY_DSN_BUILD_ARG: ${{ matrix.service == 'admin' && format('NEXT_PUBLIC_SENTRY_DSN={0}', vars.ADMIN_NEXT_PUBLIC_SENTRY_DSN) || matrix.service == 'client' && format('NEXT_PUBLIC_SENTRY_DSN={0}', vars.CLIENT_NEXT_PUBLIC_SENTRY_DSN) || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Every merge requires this job. For what BuildKit pulls from Docker Hub (the Node base
          # image and the Dockerfile frontend), it asks Google's pull-through cache first and
          # Docker Hub when the cache cannot answer, so a rate limit there does not fail the build.
          # The images another job or Compose pulls (the Postgres and Redis services) do not pass
          # through BuildKit and still come straight from Docker Hub.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            local/${{ matrix.service }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ env.SENTRY_DSN_BUILD_ARG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # The Node runtime advisory is judged by the `node-runtime-advisory` job below, which is
      # not a required check: a Node security release the base has not shipped yet, or a
      # nodejs.org that does not answer, must not stop this job's smoke, scan or push. This leg
      # only reports the version its image's own executable prints. Read right after the build,
      # so the version reaches that job even when the smoke or the scan then fails.
      # `continue-on-error`, because nothing here may fail on the advisory's account. When this
      # step fails, its own log says why, its image reaches the advisory job with no version, and
      # that job names the image as not checked rather than passing it. A Node that cannot run at
      # all also fails step 1 of the smoke below, so this leg goes red as well; any other failure
      # of this step, such as its write to `$GITHUB_OUTPUT`, leaves this leg green, and the
      # advisory job's "not checked" is then the only red that shows it.
      - name: Node version — reported to the Node Runtime Advisory job
        id: node-version
        continue-on-error: true
        run: |
          set -euo pipefail
          IMAGE="local/${{ matrix.service }}:scan"
          NODE_VERSION="$(docker run --rm --entrypoint /nodejs/bin/node "$IMAGE" --version)"
          echo "  $IMAGE runs Node $NODE_VERSION"
          echo "${{ matrix.service }}=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      # Placed BEFORE the scanner on purpose: a broken image should say so even on
      # a run where Trivy is red for an unrelated advisory. Until this step
      # existed, CI built four images, scanned them, pushed them on main, and
      # never once RAN one — so nothing stood behind the Dockerfile header's own
      # word for the glibc match, "BLOCKING".
      #
      # It grew twice, each time because a review named what it did NOT cover:
      # first the native ABI, then the image's own CMD and the portals' ability
      # to actually serve. Each numbered block below says what it proves and,
      # where it matters, what it deliberately does not.
      - name: Smoke — the image runs, its ABI resolves, its CMD resolves, and the portals serve
        run: |
          # -e is not decoration here. Without it the liveness probe could fail
          # and the `echo` after it would still return 0 — and for the three
          # services whose branch ENDS in an echo, the step's exit status would
          # be that echo's. A gate whose last command cannot fail is a gate that
          # cannot go red, which is the exact defect this step was added to stop
          # shipping. Caught in review, after being written into the fix for it.
          set -euo pipefail
          IMAGE="local/${{ matrix.service }}:scan"

          # 1. Node executes at all on this base. Catches an architecture or
          #    loader break, which is the cheapest way a base swap goes wrong.
          docker run --rm --entrypoint /nodejs/bin/node "$IMAGE" -e 'process.exit(0)'
          echo "  node executes in $IMAGE"

          # 2. The native ABI, exercised where there IS a native module. `argon2`
          #    ships prebuilds for many platforms and `node-gyp-build` selects one
          #    at require time, so requiring the PACKAGE is the honest test —
          #    walking for *.node and loading each would try the musl and
          #    foreign-arch prebuilds and fail on files nothing was ever going to
          #    open. A hash plus its verify, because loading the binding proves
          #    less than using it.
          if [ "${{ matrix.service }}" = "api" ]; then
            docker run --rm --entrypoint /nodejs/bin/node --workdir /app/apps/api "$IMAGE" -e '
              const argon2 = require("argon2");
              argon2
                .hash("ci-smoke", { type: argon2.argon2id })
                .then((h) => argon2.verify(h, "ci-smoke"))
                .then((ok) => {
                  if (!ok) { console.error("argon2 verify returned false"); process.exit(1); }
                  console.log("argon2 loaded and round-tripped");
                })
                .catch((e) => { console.error("argon2 FAILED: " + e.message); process.exit(1); });
            '
          else
            # Said out loud rather than left as a silent pass: these three carry no
            # native module of their own. Steps 3 and 4 cover the rest for them.
            echo "  ${{ matrix.service }}: no native module of its own"
          fi

          # 3. The image's OWN CMD entry resolves, for the two node runtimes.
          #
          #    The path is READ FROM THE IMAGE, never written here: a hardcoded
          #    copy could agree with this file while disagreeing with the image,
          #    which is the drift being tested for.
          #
          #    IMPORTING it rather than stat-ing it is the point. A stat proves a
          #    file exists; an import proves the whole module graph that entry
          #    pulls resolves inside this image — exactly what `pnpm deploy` put
          #    at risk. These two cannot COMPLETE a boot here (no database, no
          #    Redis), so a RESOLUTION failure is told apart from a CONNECTION
          #    failure by its error code: the resolver codes fail the gate, and
          #    anything else means the graph loaded and only infrastructure was
          #    missing.
          if [ "${{ matrix.service }}" = "api" ] || [ "${{ matrix.service }}" = "workers" ]; then
            CMD_ENTRY="$(docker inspect -f '{{index .Config.Cmd 0}}' "$IMAGE")"
            echo "  CMD entry declared by the image: $CMD_ENTRY"
            docker run --rm --entrypoint /nodejs/bin/node \
              --env "SMOKE_ENTRY=$CMD_ENTRY" "$IMAGE" --input-type=module -e '
                const entry = process.env.SMOKE_ENTRY;
                const unresolved = new Set([
                  "ERR_MODULE_NOT_FOUND",
                  "MODULE_NOT_FOUND",
                  "ERR_PACKAGE_PATH_NOT_EXPORTED",
                  "ERR_UNSUPPORTED_DIR_IMPORT",
                ]);
                import("./" + entry).then(
                  () => console.log("  CMD entry imported cleanly: " + entry),
                  (e) => {
                    const code = (e && e.code) || "";
                    if (unresolved.has(code)) {
                      console.error("  CMD entry does NOT resolve (" + code + "): " + e.message);
                      process.exit(1);
                    }
                    console.log("  CMD entry resolved; boot stopped at " + (code || "a runtime error") + ", which needs services this step has none of");
                  }
                );
              '
          fi

          # 4. The portals BOOT by their CMD and SERVE, which a liveness probe
          #    alone cannot establish. Both images dropped the prod node_modules,
          #    the packages/ tree and infra/ in favour of Next's own traced
          #    standalone output, and a missed transitive presents as a container
          #    that starts and 500s on the one route that touches it. So this
          #    asks for two things: the liveness route (whose absence is the
          #    defect that made every portal container report unhealthy for its
          #    whole life) and a server-rendered page, which is where a missing
          #    trace would actually surface.
          if [ "${{ matrix.service }}" = "admin" ] || [ "${{ matrix.service }}" = "client" ]; then
            # Count the exposed ports before using one. That range template
            # CONCATENATES every key, so a second EXPOSE would silently yield a
            # joined string like "3100/tcp3300/tcp", `docker run -p` would refuse
            # it, and the smoke would be defeated by a change that has nothing to
            # do with what it tests. Named by a review before it could happen.
            PORT_COUNT="$(docker inspect -f '{{len .Config.ExposedPorts}}' "$IMAGE")"
            if [ "$PORT_COUNT" != "1" ]; then
              echo "::error::${{ matrix.service }} exposes $PORT_COUNT port(s); this smoke maps exactly one and cannot choose between them. Name the app port explicitly here, in the same change that adds the second EXPOSE."
              exit 1
            fi
            PORT="$(docker inspect -f '{{range $p, $_ := .Config.ExposedPorts}}{{$p}}{{end}}' "$IMAGE" | cut -d/ -f1)"
            docker run -d --name "smoke-${{ matrix.service }}" \
              -p "127.0.0.1:$PORT:$PORT" -e "HOSTNAME=0.0.0.0" "$IMAGE" >/dev/null

            health=""
            for _ in $(seq 1 60); do
              health="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:$PORT/api/health" || true)"
              [ "$health" = "200" ] && break
              sleep 1
            done

            page="$(curl -sL -o /tmp/smoke-page.html -w '%{http_code}' --max-time 20 "http://127.0.0.1:$PORT/" || true)"
            bytes="$(wc -c < /tmp/smoke-page.html | tr -d ' ')"

            echo "  liveness /api/health -> $health"
            echo "  server-rendered /    -> $page ($bytes bytes)"
            docker logs "smoke-${{ matrix.service }}" 2>&1 | tail -40
            docker rm -f "smoke-${{ matrix.service }}" >/dev/null

            # Each condition names its own failure, because they need opposite
            # repairs: a missing liveness route is a routing defect, a 500 on the
            # page is a traced-dependency defect, and a body too small to be a
            # rendered page is a redirect loop or an error shell.
            [ "$health" = "200" ] || { echo "::error::${{ matrix.service }} liveness did not reach 200 (got '${health:-no response}') — the HEALTHCHECK this image declares would never pass"; exit 1; }
            [ "$page" = "200" ] || { echo "::error::${{ matrix.service }} served $page for / — the container is up but not rendering, which is the shape a missed traced dependency takes"; exit 1; }
            [ "$bytes" -gt 2000 ] || { echo "::error::${{ matrix.service }} rendered only $bytes bytes for / — too small to be a page, so this is an error shell or a redirect loop, not a render"; exit 1; }
          fi

      # THE GATE, and it is `table` on purpose. With `format: sarif` the action
      # documents that it "enforces output of all vulnerabilities regardless of
      # configured severities" unless `limit-severities-for-sarif` is set — so
      # `severity: CRITICAL,HIGH` was silently not applied and `exit-code: 1`
      # fired on MEDIUM and LOW findings. That is why these four jobs were red
      # even when no CRITICAL or HIGH existed. Measured in one run: this same
      # scan in table form reported 0 while the sarif one exited 1.
      #
      # `table` respects `severity`, and it prints what it caught — so the gate
      # explains itself instead of failing silently into a file.
      - name: Run Trivy vulnerability scanner
        id: gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          # Explicit path required: the action runs Trivy in its own container,
          # so the repo-root .trivyignore is not auto-discovered.
          trivyignores: .trivyignore

      # The SARIF is for the Security tab, NOT for gating, so it keeps the
      # action's default breadth on purpose: every severity, so MEDIUM and LOW
      # stay visible there. `exit-code: 0` because the gate above already
      # decided.
      #
      # Conditioned on the BUILD, not on `always()`: a build failure leaves no
      # image, so `always()` would run this against a tag that does not exist,
      # Trivy would error, `continue-on-error` would swallow it, no file would be
      # written, and the upload below would then look for a SARIF that was never
      # produced — three silent no-ops in a row.
      #
      # `!cancelled()` is load-bearing, not noise. GitHub Actions wraps any `if:`
      # that names no status function in an implicit `success()`, so
      # `steps.build.outcome == 'success'` ALONE would also require every earlier
      # step to have passed — including the gate — and the report would vanish in
      # exactly the case it exists for. Naming a status function disables that
      # implicit wrap; `!cancelled()` is the one that keeps a cancelled run from
      # still scanning.
      - name: Trivy SARIF for code scanning (never gates)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          exit-code: "0"
          trivyignores: .trivyignore

      # Same reasoning as the step above, `!cancelled()` included: without a
      # status function the implicit `success()` would skip this whenever the
      # gate went red, which is when the report is most worth uploading.
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

      # This step used to write its numbers ONLY to $GITHUB_STEP_SUMMARY and then
      # `exit 1`, so a run that failed on size printed neither the size nor the
      # limit in the log — the same defect the Trivy gate had, and it cost the
      # same thing: a red nobody could act on. Everything it measures now goes to
      # the log as well.
      #
      # It also asserted "Security Scan: ✅ Passed" as a hardcoded string rather
      # than deriving it. Reading `steps.gate.outcome` is only an improvement
      # WITH the guard below: without it this step inherits the implicit
      # `success()`, so it runs only when the gate passed and the derived value
      # can never be anything but `success` — the same hardcoded claim wearing an
      # expression. Guarded on the BUILD instead, the size is measured and
      # reported whether the scan was clean or not, which is when a size figure
      # is most worth having.
      - name: Container image analysis
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          IMAGE_TAG="local/${{ matrix.service }}:scan"
          SIZE_BYTES=$(docker image inspect "${IMAGE_TAG}" --format='{{.Size}}')
          SIZE_IEC=$(printf '%s' "$SIZE_BYTES" | numfmt --to=iec)
          LIMIT_BYTES=1073741824
          LIMIT_IEC=$(printf '%s' "$LIMIT_BYTES" | numfmt --to=iec)
          # Rendered, not raw: `success`/`failure` are Actions' tokens, and the
          # summary is read by people.
          case "${{ steps.gate.outcome }}" in
            success) SCAN_OUTCOME="✅ passed" ;;
            failure) SCAN_OUTCOME="❌ FAILED — see the gate step" ;;
            *)       SCAN_OUTCOME="${{ steps.gate.outcome }}" ;;
          esac

          echo "image:  ${IMAGE_TAG}"
          echo "size:   ${SIZE_IEC} (${SIZE_BYTES} bytes)"
          echo "limit:  ${LIMIT_IEC} (${LIMIT_BYTES} bytes)"
          echo "scan:   ${SCAN_OUTCOME}"

          {
            echo "## Container Analysis: ${{ matrix.service }}"
            echo "**Image Size**: ${SIZE_IEC} (limit ${LIMIT_IEC})"
            echo "**Security Scan**: ${SCAN_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error title=Image over size limit::${{ matrix.service }} is ${SIZE_IEC}, over the ${LIMIT_IEC} limit."
            echo "⚠️ Image size ${SIZE_IEC} exceeds the ${LIMIT_IEC} limit" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Push container image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same build-args as the scanned build above, so the pushed image
          # is the one that was scanned and measured (and hits the same cache).
          build-args: ${{ env.SENTRY_DSN_BUILD_ARG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The image scanner reads an image's OS packages and its module manifests, never the `node`
  # executable a distroless base ships without a package record, so this job holds that executable
  # to Node's own release index. It is a job of its own, not a required check, and nothing needs
  # it, because the two cases it exists for are outside the team's repair: a Node security release
  # the images' base has not shipped yet, and an index nodejs.org does not serve. Its other red
  # cases are failures the team repairs, each named by its annotation: an image not checked, whose
  # leg's `Node version` step or an earlier step of that leg says why no version came; the gate's
  # code 2, a printed version that is not a stable vX.Y.Z, which points at the image's Node base;
  # the gate's code 4, a failure of the gate itself, whose lines carry the error and point at the
  # gate's script; and a code the gate does not define, which points at the gate's own output.
  # None of them blocks a merge, a scan or a push. Its verdict is the gate's on this run's images
  # alone, so the first run after the cause is repaired, or after the index answers again, is green.
  node-runtime-advisory:
    name: Node Runtime Advisory
    runs-on: ubuntu-latest
    # Each image's gate makes at most three attempts of 30 s with pauses of 5 s and 10 s, so the
    # four take at most seven minutes.
    timeout-minutes: 10
    needs: container-security
    # Skipped when Container Security was skipped, because a job above it did not succeed: no
    # image was built, nothing could be validated, and a red here would not be about Node. A leg
    # that ran and failed does not skip it: the job runs and names each image whose leg reported
    # no version as not checked. `!cancelled()` keeps a cancelled run from starting it, and naming
    # it drops the implicit `success()`, which would skip the job whenever any leg failed.
    if: ${{ !cancelled() && needs.container-security.result != 'skipped' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The gate imports Node's own modules only, so it runs on the runner's Node, with nothing
      # installed and no Node set up. The versions reach the script through env rather than being
      # written into it, because they are text an image printed.
      - name: Node runtime advisory — no later security release of each image's Node line
        env:
          CONTAINER_SECURITY_RESULT: ${{ needs.container-security.result }}
          NODE_VERSION_API: ${{ needs.container-security.outputs.node-version-api }}
          NODE_VERSION_WORKERS: ${{ needs.container-security.outputs.node-version-workers }}
          NODE_VERSION_ADMIN: ${{ needs.container-security.outputs.node-version-admin }}
          NODE_VERSION_CLIENT: ${{ needs.container-security.outputs.node-version-client }}
        run: |
          set -euo pipefail
          # Every image is judged even after one fails, so the step fails once, at the end, with
          # each image's reason already written.
          FAILED=0
          for SERVICE in api workers admin client; do
            VERSION_VAR="NODE_VERSION_${SERVICE^^}"
            NODE_VERSION="${!VERSION_VAR:-}"
            if [ -z "$NODE_VERSION" ]; then
              echo "::error title=Node runtime advisory: $SERVICE not checked::Container Security ($SERVICE) reported no Node version, and Container Security ended $CONTAINER_SECURITY_RESULT, so the $SERVICE image was not judged. That leg's log says why: a step before its Node version step did not complete, or that step failed itself; this job is red because the image went unchecked, not for an advisory."
              FAILED=1
              continue
            fi
            echo "$SERVICE image runs Node $NODE_VERSION"
            CODE=0
            node scripts/testing/node-runtime-advisory-gate.mjs --version "$NODE_VERSION" || CODE=$?
            case "$CODE" in
              0) continue ;;
              # Each reason names a "code", so fitness #34, which reads this step line by line,
              # pairs the annotations with the one real failure at the end and with no text.
              1) REASON="code 1, the gate's verdict that a later release of the image's Node line is a security release; its lines above name each one and the floor to raise the Node bases to" ;;
              2) REASON="code 2, a usage error: the version the image printed is not a stable vX.Y.Z the gate can judge" ;;
              3) REASON="code 3, Node's release index could not be read in full, so nothing was judged; re-run this job once nodejs.org answers" ;;
              4) REASON="code 4, the gate itself failed, so nothing was judged; its lines above carry the error and its trace, and the repair is in the gate's script, not in the image" ;;
              *) REASON="code $CODE, which the gate does not define; its output above is the only account of it" ;;
            esac
            echo "::error title=Node runtime advisory: $SERVICE::$SERVICE runs Node $NODE_VERSION, and the gate failed it with $REASON."
            FAILED=1
          done
          exit "$FAILED"
