name: "Setup Node.js with pnpm and dependency cache"
description: "Complete Node.js, pnpm, and dependency installation with caching - eliminates 350+ lines of duplication across 14 workflows"
branding:
  icon: "package"
  color: "blue"

inputs:
  node-version:
    description: "Node.js version to install; empty (the default) reads it from .nvmrc, the major the engines gate holds every manifest to"
    required: false
    default: ""
  frozen-lockfile:
    description: "Use --frozen-lockfile for pnpm install"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js ${{ inputs.node-version || '(.nvmrc)' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        # Passed only when node-version is empty: setup-node warns when it gets both.
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}

    - name: Setup pnpm (from package.json packageManager)
      uses: pnpm/action-setup@v4

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install
        fi
