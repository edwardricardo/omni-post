name: "Print the Postgres and Redis logs"
description: >-
  Prints the log of each container .github/actions/start-service-containers runs, each in a group
  of its own. A job that starts them ends with this action under `if: failure()`.

# A container a job starts from a step is the job's own: the runner prints nothing of it when the
# job ends. When a job fails, the database's or the cache's own log often holds the reason, so
# the job prints both. The names are the ones the start action gives its containers.
runs:
  using: "composite"
  steps:
    - name: Print the Postgres and Redis logs
      shell: bash
      run: |
        set -euo pipefail
        for name in postgres redis; do
          echo "::group::docker logs $name"
          docker logs "$name" 2>&1 || echo "the $name container has no log: it was never started"
          echo "::endgroup::"
        done
