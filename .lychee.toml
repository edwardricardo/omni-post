############################################################################
# lychee — markdown link checker config
#
# Loaded by `audit.yml > lychee-link-check` job. Local equivalent:
#   ~/.local/bin/lychee --config .lychee.toml './**/*.md'
#
# Strategy: --offline so the check is deterministic (no rate-limit flakes),
# and code-file refs (.ts/.tsx/.json/etc) are excluded because those are
# workspace-relative paths the IDE resolves, not filesystem paths lychee
# can follow without a --root-dir convention.
############################################################################

# Run in offline mode — only check filesystem-resolvable refs.
offline = true

# Check the `#section` anchor of every local link against the headings of the
# file it points to. Without it a link whose target file exists passes whatever
# its fragment says, so a translated or renamed heading breaks every inbound
# anchored link with nothing reporting it. `anchor-only` leaves text fragments
# (`#:~:text=`) unchecked; no tracked document uses one (2026-10-28). This is
# the config form of `--include-fragments=anchor-only`, which lychee 0.24.2
# reads; 0.24.2 is the default `lycheeVersion` of `lycheeverse/lychee-action@v2`.
include_fragments = "anchor-only"

no_progress = true

# Exclude common build/cache dirs from path traversal. lychee reads each entry
# as an unanchored regex, so each one names a whole path segment followed by a
# slash: a bare `coverage` skipped every file whose name holds the word, and a
# bare `.next` every path holding "next" after any character.
exclude_path = [
  '(^|/)node_modules/',
  '(^|/)\.next/',
  '(^|/)dist/',
  '(^|/)coverage/',
  '(^|/)storybook-static/',
]

# Skip URLs matching this regex. Source-code paths are workspace-relative
# (resolved by IDE), not filesystem-relative (which lychee would follow).
# Regex is unanchored so anchor fragments like `.ts#L42` still match.
exclude = [
  '\.(ts|tsx|js|jsx|cjs|mjs|json|sql|yaml|yml|css|scss|html|sh|toml|prisma)',
]
