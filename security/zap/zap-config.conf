# OWASP ZAP Configuration for Social Media CMS Security Testing
# Comprehensive DAST configuration for API and web application security

# ==== PROXY SETTINGS ====
proxy.ip=127.0.0.1
proxy.port=8080

# ==== SPIDER CONFIGURATION ====
spider.maxDepth=5
spider.maxChildren=10
spider.maxDuration=10
spider.threadCount=5
spider.acceptCookies=true
spider.handleParameters=true
spider.parseComments=true
spider.parseRobotsTxt=true
spider.parseSitemapXml=true
spider.parseSVNEntries=true
spider.parseGit=true
spider.postForm=true
spider.processForm=true

# ==== ACTIVE SCANNER SETTINGS ====
scanner.level=MEDIUM
scanner.strength=MEDIUM
scanner.attackOnStart=false
scanner.promptInAttackMode=false
scanner.promptToContinue=false
scanner.maxResultsToList=1000
scanner.maxRuleDurationInMins=10
scanner.maxScanDurationInMins=30
scanner.delayInMs=200
scanner.threadsPerHost=5

# ==== AUTHENTICATION SETTINGS ====
authentication.method=scriptBasedAuthentication
authentication.scriptName=Social Media CMS Authentication
authentication.loginUrl=http://localhost:3000/api/auth/login
authentication.logoutUrl=http://localhost:3000/api/auth/logout
authentication.usernameParameter=email
authentication.passwordParameter=password
authentication.loginRequestData={"email":"%username%","password":"%password%"}
authentication.loggedInRegex=\Q"token"\E
authentication.loggedOutRegex=\Q"error"\E

# ==== SESSION MANAGEMENT ====
session.tokenLocation=COOKIE
session.sessionTokenName=auth-token

# ==== SCAN POLICY CONFIGURATION ====

# SQL Injection
scanner.policy.40018.level=MEDIUM
scanner.policy.40018.strength=MEDIUM

# Cross Site Scripting (Reflected)
scanner.policy.40012.level=MEDIUM
scanner.policy.40012.strength=MEDIUM

# Cross Site Scripting (Persistent)
scanner.policy.40014.level=MEDIUM
scanner.policy.40014.strength=MEDIUM

# Path Traversal
scanner.policy.6.level=MEDIUM
scanner.policy.6.strength=MEDIUM

# Remote File Inclusion
scanner.policy.7.level=MEDIUM
scanner.policy.7.strength=MEDIUM

# Command Injection
scanner.policy.90020.level=MEDIUM
scanner.policy.90020.strength=MEDIUM

# NoSQL Injection
scanner.policy.40033.level=MEDIUM
scanner.policy.40033.strength=MEDIUM

# JSON Injection
scanner.policy.90021.level=MEDIUM
scanner.policy.90021.strength=MEDIUM

# XML External Entity Attack
scanner.policy.90023.level=MEDIUM
scanner.policy.90023.strength=MEDIUM

# LDAP Injection
scanner.policy.40015.level=MEDIUM
scanner.policy.40015.strength=MEDIUM

# Server Side Request Forgery
scanner.policy.40009.level=MEDIUM
scanner.policy.40009.strength=MEDIUM

# Buffer Overflow
scanner.policy.40024.level=MEDIUM
scanner.policy.40024.strength=MEDIUM

# Format String Error
scanner.policy.40022.level=MEDIUM
scanner.policy.40022.strength=MEDIUM

# Parameter Tampering
scanner.policy.40008.level=MEDIUM
scanner.policy.40008.strength=MEDIUM

# ==== CUSTOM PAYLOADS ====

# Social Media Specific Payloads
customPayloads.socialMedia.usernames=["admin","test","demo","api","system","service"]
customPayloads.socialMedia.providers=["facebook","twitter","instagram","linkedin","tiktok","youtube"]
customPayloads.socialMedia.postContent=["<script>alert('xss')</script>","'; DROP TABLE posts; --","../../../etc/passwd"]

# ==== REPORTING CONFIGURATION ====
report.template.risk.high=true
report.template.risk.medium=true
report.template.risk.low=false
report.template.risk.info=false
report.template.details.description=true
report.template.details.otherinfo=true
report.template.details.solution=true
report.template.details.reference=true
report.template.details.cweid=true
report.template.details.wascid=true
report.template.details.sourceid=true

# ==== CONTEXT CONFIGURATION ====
context.socialMediaCMS.name=Social Media CMS API
context.socialMediaCMS.includeInContext=http://localhost:3000/api.*
context.socialMediaCMS.excludeFromContext=http://localhost:3000/api/health.*
context.socialMediaCMS.excludeFromContext=http://localhost:3000/api/metrics.*
context.socialMediaCMS.excludeFromContext=http://localhost:3000/api/docs.*

# Include API endpoints
context.socialMediaCMS.includeInContext=http://localhost:3000/api/auth.*
context.socialMediaCMS.includeInContext=http://localhost:3000/api/posts.*
context.socialMediaCMS.includeInContext=http://localhost:3000/api/channels.*
context.socialMediaCMS.includeInContext=http://localhost:3000/api/analytics.*
context.socialMediaCMS.includeInContext=http://localhost:3000/api/admin.*

# ==== BREAK POINTS ====
break.file=false
break.request=false
break.response=false

# ==== API SPECIFIC SETTINGS ====
api.key=
api.format.openapi=true
api.format.soap=false
api.format.graphql=false

# ==== CUSTOM SCAN RULES ====

# Social Media Specific Security Checks
customRules.socialMedia.checkProviderCredentials=true
customRules.socialMedia.checkPostContent=true
customRules.socialMedia.checkChannelAccess=true
customRules.socialMedia.checkProjectIsolation=true
customRules.socialMedia.checkRateLimiting=true

# ==== OUTPUT CONFIGURATION ====
output.format.html=true
output.format.json=true
output.format.xml=true
output.format.md=true

# ==== LOGGING ====
log.level=INFO
log.file=zap-security-scan.log